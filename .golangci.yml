# The quality baseline this repo keeps: no dead code, no unused writes, and the vet/staticcheck
# defaults. `golangci-lint run` must be clean — a finding here is either a fix or an exclusion
# argued for below, never a warning somebody learns to scroll past.
version: "2"

# KNOWN GAP, and it is the toolchain's, not this config's: golangci-lint refuses to run when its
# own build targets an older Go than go.mod does, and no release targets 1.27 until 1.27 is final.
# Forcing `run.go: "1.26"` past the refusal does not work either — its bundled go/types then
# crashes loading encoding/json/v2 from the 1.27 stdlib source. So until a golangci-lint built
# with 1.27 ships, `go vet ./...` is the gate that actually runs. Nothing to change here.
linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused

  exclusions:
    rules:
      # A deferred Close on a read is the idiomatic spelling; there is nothing a caller could do
      # with the error, and naming it would only move the noise into every reader.
      - linters: [errcheck]
        source: '^\s*defer .*\.Close\(\)$'
      # A test's own HTTP stub writing its fixture body cannot fail in a way the test cares about.
      - linters: [errcheck]
        path: _test\.go
        source: 'io\.(WriteString|Copy)\('
      # De Morgan on a character-class check reads worse than the explicit ranges.
      - linters: [staticcheck]
        text: 'QF1001'

formatters:
  enable:
    - gofmt
