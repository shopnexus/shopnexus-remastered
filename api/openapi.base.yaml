openapi: 3.0.3
info:
  title: ShopNexus Gateway API
  version: 0.1.0
  description: >
    Public REST surface of the ShopNexus C2C marketplace gateway. This file is
    the base document (info, servers, security, shared parameters and
    responses). Paths and schemas live in one fragment per aggregate,
    internal/module/<module>/api/openapi/<aggregate>.yaml, and are merged into
    api/openapi.gen.yaml by `go generate ./...` (cmd/specgen). Edit the
    fragments, not the generated file.

    Only `paths` and `components.schemas` are merged from a fragment, so
    everything reusable across modules — parameters, responses, security
    schemes — has to be defined here.
servers:
  # Must equal api.BasePath (contract test enforces it). Fragment paths stay unprefixed.
  - url: /api/v1
    description: Gateway (relative to host)

tags:
  - name: account
  - name: catalog
  - name: order
  - name: finance
  - name: chat
  - name: trust
  - name: common
  - name: admin
    description: Moderator and admin console surface. Separate from the user-facing
      routes because the same URL must never return two different populations
      depending on the caller's role.

paths: {}

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    # Which registry a request is about. Shared because three operations take it and one of them is
    # a PATCH, where it is not the path but still decides which module holds the row.
    OptionCategory:
      name: category
      in: query
      required: true
      schema: { $ref: '#/components/schemas/OptionCategoryName' }
      description: The kind of pluggable choice.

    # Two pagination styles. Which one a collection uses follows from the collection,
    # not from taste.
    #
    # Page + limit is the default, for anything browsed: the client draws a pager,
    # jumps to page four and says how many matches there are. It is also the only
    # option for a ranked result — the sort key of a relevance or vector search is a
    # score computed per query, not a stored column, so there is nothing to seek into.
    #
    # Cursor + limit is for the append-only streams: conversation and message, order,
    # order item, offer, refund, dispute, report, notification, payment session,
    # transaction, review, feedback. Their list indexes are all shaped
    # (owner_id, created_at DESC) so a keyset seek is exact and never drifts when rows
    # arrive at the head mid-page, and chat.message is a hypertable whose chunk
    # exclusion needs a time bound in the query. None of them is ever ranked.
    Page:
      name: page
      in: query
      required: false
      description: 1-based page number.
      schema: { type: integer, minimum: 1, default: 1 }
    Cursor:
      name: cursor
      in: query
      required: false
      description: Opaque cursor from the previous page's `next_cursor`. Omit for the first page.
      schema: { type: string }
    Limit:
      name: limit
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }

  responses:
    BadRequest:
      description: Validation or malformed request
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Unauthorized:
      description: Missing or invalid credentials
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Forbidden:
      description: Authenticated but not allowed to act on this resource
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    NotFound:
      description: Resource not found
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Conflict:
      description: Conflicts with the current state (already exists, already done, wrong state)
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    UnprocessableEntity:
      description: Well-formed but rejected by a business rule
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

  schemas:
    # ------------------------------------------------------------- envelope ----
    # Every JSON body has the same three possible root keys and nothing else:
    # "data" carries the payload, "meta" carries facts about the response rather than
    # about the thing, "error" replaces both when the request failed. Exactly one of
    # "data" and "error" is ever present.
    #
    # The root is reserved that way because a payload at the root is ambiguous with the
    # response's own fields, and not hypothetically: a Transaction has an "error"
    # (the rail's failure text, which is null on a success), an Order and a
    # CheckoutResult have "items", an Option has "data". Returned at the root, a leg
    # that failed at the gateway and one that came back 201 with an error string are the
    # same JSON to a client that checks for "error" — and a middleware that does exactly
    # that is the most common client-side pattern there is. Nesting under "data" makes
    # the collision impossible instead of unlikely.
    PageMeta:
      type: object
      description: Where this page sits in the collection, for a page-paginated read.
      properties:
        page: { type: integer, minimum: 1, example: 1, description: The 1-based page this is. }
        limit: { type: integer, minimum: 1, maximum: 100, example: 20 }
        total_count:
          type: integer
          format: int64
          minimum: 0
          example: 137
          nullable: true
          description: >
            Rows matching the filter, so a client can draw a pager. Explicitly null — not
            absent — when the result is a ranked top-K: an approximate nearest-neighbour
            search never visits the rows it did not return, so there is no total to report,
            and a client has to render "more results" rather than "page 3 of 12".


            Named `total_count` rather than `total` because `total` is already a money
            field in this document (an offer's proposed total), and a generated client
            would end up with two `total`s meaning different things.
      required: [page, limit, total_count]

    CursorMeta:
      type: object
      description: How to continue a cursor-paginated read.
      properties:
        next_cursor:
          type: string
          nullable: true
          description: >
            Pass as `cursor` to get the next page. Null on the last one. Always present so
            "no more pages" is a value rather than a missing key.
      required: [next_cursor]

    Error:
      type: object
      description: >
        The only failure shape in this API, at every status. `data` is absent whenever this
        is present.
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              description: >
                Stable machine-readable code — switch on this, never on `message`. The
                cross-cutting ones live in `shared/errx`; the rest belong to the module
                that raised them.
              example: validation
            message:
              type: string
              description: Human-readable, for a developer or a log. Not a UI string.
              example: price must be greater than 0
            request_id:
              type: string
              description: >
                The id of this request, the same value as the `X-Request-Id` response
                header and the one on every log line for it. Present so a user reporting
                a failure hands over something that can be grepped, instead of a sentence.
              example: dkav6vyqeqm3
            fields:
              type: array
              items: { $ref: '#/components/schemas/ErrorField' }
              description: >
                Per-field detail, present when the request failed validation and absent
                otherwise. Without it a form with twelve inputs and three problems gets one
                sentence and cannot mark a single box red.
          required: [code, message, request_id]
      required: [error]

    ErrorField:
      type: object
      description: One field that failed validation.
      properties:
        field:
          type: string
          description: >
            Dotted path from the request body's root, so a nested or repeated field is
            addressable by the same client code that rendered it.
          example: skus[0].price
        rule:
          type: string
          description: >
            Which constraint failed, as the validate tag that raised it. Machine-readable,
            so a client can localise the message instead of showing this one.
          example: required
        message: { type: string }
      required: [field, rule, message]

    # One schema per entity kind in internal/shared/id/kinds.go. They live here
    # rather than in the fragments because an id is a cross-cutting primitive owned
    # by shared/id, not by a module: half of these are referenced by three or four
    # fragments, and cmd/specgen merges all fragments into one flat schema
    # namespace, so a per-module copy would have to be prefixed
    # (OrderAccountID, FinanceAccountID, ...) and the copies would drift.
    #
    # A prefix is permanent — it is mixed into the cipher tweak, so changing one
    # invalidates every id of that kind already issued. Keep this list in step with
    # kinds.go; adding an entity touches both.
    AccountID: { type: string, pattern: '^acc_[0-9a-hjkmnp-tv-z]{13}$', example: acc_62mxefynht57b }
    ContactID: { type: string, pattern: '^ctc_[0-9a-hjkmnp-tv-z]{13}$', example: ctc_kvq1wd6ptz3n8 }
    DeviceID: { type: string, pattern: '^dvc_[0-9a-hjkmnp-tv-z]{13}$', example: dvc_ynht57b62mxef }
    IdentityDocumentID: { type: string, pattern: '^idd_[0-9a-hjkmnp-tv-z]{13}$', example: idd_57b62mxefynht }
    CategoryID: { type: string, pattern: '^cat_[0-9a-hjkmnp-tv-z]{13}$', example: cat_7v2p41ryaj811 }
    ListingID: { type: string, pattern: '^lst_[0-9a-hjkmnp-tv-z]{13}$', example: lst_5y5w68r4918v8 }
    VariantID: { type: string, pattern: '^vrn_[0-9a-hjkmnp-tv-z]{13}$', example: vrn_vq1wd6ptz3n8k }
    CartItemID: { type: string, pattern: '^crt_[0-9a-hjkmnp-tv-z]{13}$', example: crt_3n8kvq1wd6ptz }
    DraftOrderID: { type: string, pattern: '^drf_[0-9a-hjkmnp-tv-z]{13}$', example: drf_8kvq1wd6ptz3n }
    OrderID: { type: string, pattern: '^ord_[0-9a-hjkmnp-tv-z]{13}$', example: ord_fv2cpg50vkrfp }
    OrderItemID: { type: string, pattern: '^itm_[0-9a-hjkmnp-tv-z]{13}$', example: itm_q1wd6ptz3n8kv }
    TransportID: { type: string, pattern: '^trp_[0-9a-hjkmnp-tv-z]{13}$', example: trp_d6ptz3n8kvq1w }
    OfferID: { type: string, pattern: '^ofr_[0-9a-hjkmnp-tv-z]{13}$', example: ofr_ptz3n8kvq1wd6 }
    RefundID: { type: string, pattern: '^rfd_[0-9a-hjkmnp-tv-z]{13}$', example: rfd_z3n8kvq1wd6pt }
    PaymentSessionID: { type: string, pattern: '^pay_[0-9a-hjkmnp-tv-z]{13}$', example: pay_7bq2xn4tw9yef }
    TransactionID: { type: string, pattern: '^txn_[0-9a-hjkmnp-tv-z]{13}$', example: txn_5wtc4mx8jd2qr }
    BankAccountID: { type: string, pattern: '^bnk_[0-9a-hjkmnp-tv-z]{13}$', example: bnk_2qr5wtc4mx8jd }
    FeedbackID: { type: string, pattern: '^fbk_[0-9a-hjkmnp-tv-z]{13}$', example: fbk_2h9qk4mfx7bd3 }
    ReviewID: { type: string, pattern: '^rvw_[0-9a-hjkmnp-tv-z]{13}$', example: rvw_qk4mfx7bd32h9 }
    ReviewReplyID: { type: string, pattern: '^rpl_[0-9a-hjkmnp-tv-z]{13}$', example: rpl_mfx7bd32h9qk4 }
    TicketID: { type: string, pattern: '^tkt_[0-9a-hjkmnp-tv-z]{13}$', example: tkt_9c4vt6bkn1pzs }
    ConversationID: { type: string, pattern: '^cnv_[0-9a-hjkmnp-tv-z]{13}$', example: cnv_6ptz3n8kvq1wd }
    MessageID: { type: string, pattern: '^msg_[0-9a-hjkmnp-tv-z]{13}$', example: msg_agnc1pe4pjb4k }
    ResourceID: { type: string, pattern: '^res_[0-9a-hjkmnp-tv-z]{13}$', example: res_4mx8jd2qr5wtc }

    # An attachment, as every module hands one out: a listing image, an avatar, a review photo
    # and a KYC scan are the same fact. The table is shared DDL applied into each module's
    # schema, so a resource id only resolves inside the module that stored it — which is why
    # every DTO carrying one carries the resolved resource rather than just the id.
    Resource:
      type: object
      properties:
        id: { $ref: '#/components/schemas/ResourceID' }
        provider:
          type: string
          example: minio
          description: Storage backend, kebab-case — `s3`, `minio`, `local`.
        object_key:
          type: string
          example: listings/2026/07/9f86d081.jpg
          description: Provider-specific path to the bytes.
        mime: { type: string, example: image/jpeg }
        size:
          type: integer
          format: int64
          minimum: 0
          example: 248132
          description: Bytes, as read back from storage rather than as declared.
        checksum:
          type: string
          example: 9f86d081884c7d659a2feaa0c55ad015a3bf4f1b2b0b822cd15d6c15b0f00a08
          description: Content hash, read back from storage at completion.
        url:
          type: string
          format: uri
          example: https://cdn.shopnexus.test/o/9f86d081?expires=1785000000
          description: >
            Short-lived URL to fetch the bytes. Absent until a module can presign one, so a
            consumer that needs the bytes has to treat it as "not available yet" rather than as
            an empty object. Not a stable address: store the id, not this.
        url_expires_at: { type: string, format: date-time }
      required: [id, provider, object_key, mime, size]

    CurrencyCode:
      type: string
      minLength: 3
      maxLength: 3
      pattern: '^[A-Z]{3}$'
      description: >
        ISO 4217. Never inferred from the account's country — one currency spans
        many countries, and a seller may want a balance in a foreign one.
      example: VND
