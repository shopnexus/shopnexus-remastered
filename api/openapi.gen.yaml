                "404":
                    $ref: '#/components/responses/NotFound'
                "409":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: Already submitted for this direction
                "422":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
