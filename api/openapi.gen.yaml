                "403":
                    $ref: '#/components/responses/Forbidden'
                "404":
                    $ref: '#/components/responses/NotFound'
            security:
                - bearerAuth: []
            summary: List the legs of a payment session
            tags:
                - finance
    /refunds:
        get:
            description: '`role=seller` resolves through the order''s seller; a refund row itself only records the buyer.'
            parameters:
                - in: query
                  name: role
                  required: true
                  schema:
                    enum:
                        - buyer
                        - seller
                    type: string
                - in: query
                  name: status
                  schema:
                    $ref: '#/components/schemas/RefundStatus'
                - $ref: '#/components/parameters/Cursor'
                - $ref: '#/components/parameters/Limit'
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/RefundPage'
                    description: OK
                "400":
                    $ref: '#/components/responses/BadRequest'
                "401":
                    $ref: '#/components/responses/Unauthorized'
            security:
                - bearerAuth: []
            summary: List refunds, as buyer or as seller
            tags:
                - order
    /refunds/{id}:
        delete:
            description: Only while the seller has not decided. Once anything has moved — a decision, a moderator, a parcel — the case is closed by ruling, not by walking away from it.
            responses:
                "204":
                    description: Withdrawn
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "403":
                    $ref: '#/components/responses/Forbidden'
                "404":
                    $ref: '#/components/responses/NotFound'
                "409":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: The seller has already decided, or the case has moved on
            security:
                - bearerAuth: []
            summary: Withdraw a refund request (buyer)
            tags:
                - order
        get:
            description: |
                The whole case in one object: `deadline_at` for whoever is on the clock, the return shipment once one exists, and `dispute` with every round a moderator has seen. A dispute has no read of its own — it is not a thing that happens apart from the refund it is about.
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Refund'
                    description: OK
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "403":
                    $ref: '#/components/responses/Forbidden'
                "404":
                    $ref: '#/components/responses/NotFound'
            security:
                - bearerAuth: []
            summary: Read a refund and its case
            tags:
                - order
        parameters:
            - in: path
              name: id
              required: true
              schema:
                $ref: '#/components/schemas/RefundID'
    /refunds/{id}/acceptance:
        parameters:
            - in: path
              name: id
              required: true
              schema:
                $ref: '#/components/schemas/RefundID'
        post:
            description: |
                Grants it without a moderator. The goods have to come back first, so this creates the return shipment and moves the refund to `returning`; the money is released once the return is delivered and the seller has not appealed it.
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/AcceptRefundRequest'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Refund'
                    description: Accepted; the return shipment is booked
                "400":
                    $ref: '#/components/responses/BadRequest'
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: Caller is not the seller of this order
                "404":
                    $ref: '#/components/responses/NotFound'
                "409":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: Refund is not awaiting seller review
            security:
                - bearerAuth: []
            summary: Accept a refund (seller)
            tags:
                - order
    /refunds/{id}/attachments:
        parameters:
            - in: path
              name: id
              required: true
              schema:
                $ref: '#/components/schemas/RefundID'
        post:
            description: |
                Either party, up to the moderator's ruling. Which side the caller is on decides where the evidence lands — the buyer's on the refund, the seller's on the dispute round they opened — so a moderator can always tell who submitted what. One endpoint because "add my evidence to this case" is one intent.
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/AddAttachmentsRequest'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Refund'
                    description: OK
                "400":
                    $ref: '#/components/responses/BadRequest'
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "403":
                    $ref: '#/components/responses/Forbidden'
                "404":
                    $ref: '#/components/responses/NotFound'
                "409":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: The case is closed, or the caller has no open round to attach to
            security:
                - bearerAuth: []
            summary: Add evidence to a refund case
            tags:
                - order
    /refunds/{id}/dispute:
        parameters:
            - in: path
              name: id
              required: true
              schema:
                $ref: '#/components/schemas/RefundID'
        post:
            description: |
                Both escalations are this one call, because both are the same act — asking a moderator to decide — and which round it opens follows from who the caller is and where the refund stands.

                The **buyer** may escalate once the seller has rejected the request or has let the review window pass. That is round 1: ruling for the buyer grants the refund and books the return, ruling for the seller ends it.

                The **seller** may escalate what came back, while the refund is `returned` and the inspection window is open — a counterfeit, the wrong item, an empty box. That is round 2 on the same case: upholding the appeal ends the refund and pays the seller out, denying it releases the money to the buyer.
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/OpenDisputeRequest'
                required: true
            responses:
                "201":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Refund'
                    description: A round was opened
                "400":
                    $ref: '#/components/responses/BadRequest'
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: Caller is not a party to this order, or not the party whose move it is
                "404":
                    $ref: '#/components/responses/NotFound'
                "409":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: Not escalatable from this state, a round is already open, or the window has closed
            security:
                - bearerAuth: []
            summary: Escalate the case to a moderator
            tags:
                - order
    /refunds/{id}/rejection:
        parameters:
            - in: path
              name: id
              required: true
              schema:
                $ref: '#/components/schemas/RefundID'
        post:
            description: |
                Refusing costs a reason, and it does not close the case: the next move is the buyer's, who may escalate to a moderator until the refund lapses. A seller who simply lets the review window pass ends up in the same place without one.
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/RejectRefundRequest'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Refund'
                    description: Rejected; the buyer may now escalate
                "400":
                    $ref: '#/components/responses/BadRequest'
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: Caller is not the seller of this order
                "404":
                    $ref: '#/components/responses/NotFound'
                "409":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: Refund is not awaiting seller review
            security:
                - bearerAuth: []
            summary: Reject a refund (seller)
            tags:
                - order
    /register:
        post:
            description: |
                At least one of email, phone or username is required — an account nobody can be addressed by cannot sign in. The display profile is created in the same transaction, so an account without a name is never a reachable state.

                Always creates a plain user. Moderators come from `POST /admin/moderators`.
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/RegisterRequest'
                required: true
            responses:
                "201":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/AuthResult'
                    description: Created
                "400":
                    $ref: '#/components/responses/BadRequest'
                "409":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: Email or phone or username already taken
                "422":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: No identifier supplied
            summary: Create an account
            tags:
                - account
    /reports:
        get:
            description: A reporter sees the status of their own reports but not who else reported the same target.
            parameters:
                - in: query
                  name: status
                  schema:
                    $ref: '#/components/schemas/ReportStatus'
                - $ref: '#/components/parameters/Cursor'
                - $ref: '#/components/parameters/Limit'
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ReportPage'
                    description: OK
                "400":
                    $ref: '#/components/responses/BadRequest'
                "401":
                    $ref: '#/components/responses/Unauthorized'
            security:
                - bearerAuth: []
            summary: Reports the caller filed
            tags:
                - trust
        post:
            description: |
                A listing, an account, a message, a review or a reply. `ref_id` is the opaque id of that thing and its prefix has to agree with `ref_type`.

                One open report per target per reporter, so re-reporting while the first is still being looked at is a conflict rather than a second row. Enough distinct reports against one listing move it into the moderation queue on their own.
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/SubmitReportRequest'
                required: true
            responses:
                "201":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Report'
                    description: Filed
                "400":
                    $ref: '#/components/responses/BadRequest'
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "404":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: The reported thing does not exist
                "409":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: You already have an open report against this target
                "422":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: The id does not match the declared target type
            security:
                - bearerAuth: []
            summary: Report something
            tags:
                - trust
    /resources:
        post:
            description: |
                Returns the resource row together with a presigned URL to PUT the bytes to. The resource stays incomplete — and unusable as an attachment — until `POST /resources/{id}/completion` confirms it.

                Pass `checksum` when it is known up front: if the same bytes are already stored, the existing resource comes back with no `upload_url` and there is nothing to upload. Several sellers listing the same photo then share one object.
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/CreateUploadRequest'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/UploadTicket'
                    description: These bytes are already stored so nothing needs uploading
                "201":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/UploadTicket'
                    description: Slot reserved
                "400":
                    $ref: '#/components/responses/BadRequest'
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "422":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: MIME type or declared size outside what this account may upload
            security:
                - bearerAuth: []
            summary: Reserve an upload slot
            tags:
                - common
    /resources/{id}:
        delete:
            description: Soft delete. The row is kept until a reaper has removed the object from the storage backend, because the row holds the only handle on it.
            responses:
                "204":
                    description: Marked for deletion
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "403":
                    $ref: '#/components/responses/Forbidden'
                "404":
                    $ref: '#/components/responses/NotFound'
            security:
                - bearerAuth: []
            summary: Delete a resource
            tags:
                - common
        get:
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Resource'
                    description: OK
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "404":
                    $ref: '#/components/responses/NotFound'
            security:
                - bearerAuth: []
            summary: Read a resource and get a URL to fetch it
            tags:
                - common
        parameters:
            - in: path
              name: id
              required: true
              schema:
                $ref: '#/components/schemas/ResourceID'
    /resources/{id}/completion:
        post:
            description: |
                The server reads the object back from storage and records the size, MIME type and checksum it actually has, rather than what the client said it would be. Until this succeeds the resource cannot be attached to anything.
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    $ref: '#/components/schemas/ResourceID'
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Resource'
                    description: Confirmed
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "403":
                    $ref: '#/components/responses/Forbidden'
                "404":
                    $ref: '#/components/responses/NotFound'
                "409":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: Already confirmed
                "422":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: No object at the reserved key or it does not match what was reserved
            security:
                - bearerAuth: []
            summary: Confirm an upload finished
            tags:
                - common
    /review-replies/{id}:
        delete:
            description: The author, or a moderator acting on an upheld report.
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    $ref: '#/components/schemas/ReviewReplyID'
            responses:
                "204":
                    description: Deleted
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "403":
                    $ref: '#/components/responses/Forbidden'
                "404":
                    $ref: '#/components/responses/NotFound'
            security:
                - bearerAuth: []
            summary: Delete a reply
            tags:
                - trust
    /reviews/{id}:
        delete:
            description: |
                The author, or a moderator acting on an upheld report. Removal drops it from the seller's rating too, so the recomputed reputation follows.
            responses:
                "204":
                    description: Deleted
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "403":
                    $ref: '#/components/responses/Forbidden'
                "404":
                    $ref: '#/components/responses/NotFound'
            security:
                - bearerAuth: []
            summary: Delete a review
            tags:
                - trust
        get:
            description: Carries the whole reply thread, unlike the listing page, which caps it.
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Review'
                    description: OK
                "404":
                    $ref: '#/components/responses/NotFound'
            summary: Read a review
            tags:
                - trust
        parameters:
            - in: path
              name: id
              required: true
              schema:
                $ref: '#/components/schemas/ReviewID'
        patch:
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/UpdateReviewRequest'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Review'
                    description: OK
                "400":
                    $ref: '#/components/responses/BadRequest'
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "403":
                    $ref: '#/components/responses/Forbidden'
                "404":
                    $ref: '#/components/responses/NotFound'
            security:
                - bearerAuth: []
            summary: Edit your own review
            tags:
                - trust
    /reviews/{id}/replies:
        post:
            description: |
                Mainly the seller answering, though anyone may add to the thread. There is no per-thread limit — a conversation that stops after one reply each is not a conversation.
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    $ref: '#/components/schemas/ReviewID'
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/SubmitReviewReplyRequest'
                required: true
            responses:
                "201":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ReviewReply'
                    description: Created
                "400":
                    $ref: '#/components/responses/BadRequest'
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "404":
                    $ref: '#/components/responses/NotFound'
            security:
                - bearerAuth: []
            summary: Reply to a review
            tags:
                - trust
    /reviews/{id}/vote:
        delete:
            description: |
                Removes the row rather than storing a neutral one. A stored zero is a row that says nothing.
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ReviewVoteTally'
                    description: OK
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "404":
                    $ref: '#/components/responses/NotFound'
            security:
                - bearerAuth: []
            summary: Withdraw your vote
            tags:
                - trust
        parameters:
            - in: path
              name: id
              required: true
              schema:
                $ref: '#/components/schemas/ReviewID'
        put:
            description: One vote per account per review, replaced in place. Voting on your own review is refused.
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/VoteReviewRequest'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ReviewVoteTally'
                    description: OK
                "400":
                    $ref: '#/components/responses/BadRequest'
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "404":
                    $ref: '#/components/responses/NotFound'
                "422":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: An account cannot vote on its own review
            security:
                - bearerAuth: []
            summary: Vote a review helpful or not
            tags:
                - trust
    /skus/{id}:
        delete:
            description: |
                Soft delete for the same reason as a listing. Refused for the last remaining variant of a live listing.

                Answers with the listing rather than an empty body: deleting the featured variant clears the listing's `featured_sku_id`, and the seller has to see that.
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ListingDetail'
                    description: Deleted
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "403":
                    $ref: '#/components/responses/Forbidden'
                "404":
                    $ref: '#/components/responses/NotFound'
                "409":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: This is the only variant of a live listing
            security:
                - bearerAuth: []
            summary: Delete a variant
            tags:
                - catalog
        parameters:
            - in: path
              name: id
              required: true
              schema:
                $ref: '#/components/schemas/ProductSKUID'
        patch:
            description: |
                A price change does not reach a buyer who already opened a purchase session: that session froze the terms it was opened with.

                `stock` sets the total on hand. The reserved count is not settable — it is moved by checkout and by cancellation — and a total below what is already reserved is refused, because an oversold row must not be representable.
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/UpdateSkuRequest'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ListingDetail'
                    description: OK
                "400":
                    $ref: '#/components/responses/BadRequest'
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "403":
                    $ref: '#/components/responses/Forbidden'
                "404":
                    $ref: '#/components/responses/NotFound'
                "422":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: Stock below the quantity already reserved
            security:
                - bearerAuth: []
            summary: Edit a variant
            tags:
                - catalog
    /tags:
        get:
            description: |
                A tag id is its slug and a natural key, so it is readable on the wire rather than encoded.

                Paginated, unlike the category tree: categories are a curated tree that stays small, while tags grow with the catalog. `q` is a prefix match on the slug, which is what the tag picker types into.

                `near` is the other half of that picker: it ranks the dictionary by cosine distance over `tag_embedding` and returns a `score`, so picking `handmade` offers back the tags that sit next to it in the vector space. The seeds themselves are never in the result — they are already on the listing — and a tag the embedding cron has not reached yet cannot be suggested at all, because `tag` carries no text index to fall back to.

                `q` and `near` are mutually exclusive: one filters the dictionary by what was typed, the other reorders it by meaning, and combining them would rank a set the prefix already decided.
            parameters:
                - description: Prefix match on the slug.
                  in: query
                  name: q
                  schema:
                    maxLength: 100
                    type: string
                - description: Rank by closeness to these seeds. Excludes the seeds.
                  explode: false
                  in: query
                  name: near
                  schema:
                    items:
                        $ref: '#/components/schemas/SemanticSeed'
                    maxItems: 8
                    minItems: 1
                    type: array
                  style: form
                - $ref: '#/components/parameters/Page'
                - $ref: '#/components/parameters/Limit'
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/TagPage'
                    description: OK
                "400":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: '`q` and `near` together'
            summary: The tag dictionary
            tags:
                - catalog
    /tax-info:
        get:
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/TaxInfo'
                    description: OK
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "404":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: Nothing registered yet
            security:
                - bearerAuth: []
            summary: Read the caller's tax registration
            tags:
                - finance
        put:
            description: |
                One registration per account, so this is an upsert rather than a create. Replacing it resets verification to `pending`: the previous verdict was about the previous tax code. A code already verified under another account is rejected.
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/UpsertTaxInfoRequest'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/TaxInfo'
                    description: Registered
                "400":
                    $ref: '#/components/responses/BadRequest'
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "409":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: This tax code is already verified under another account
            security:
                - bearerAuth: []
            summary: Register or replace the caller's tax registration
            tags:
                - finance
    /token/refresh:
        post:
            description: The refresh token is a Redis key. One that has been revoked or has expired is indistinguishable from one that never existed.
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/RefreshRequest'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/AuthResult'
                    description: OK
                "400":
                    $ref: '#/components/responses/BadRequest'
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: Unknown or revoked refresh token
            summary: Exchange a refresh token for a new access token
            tags:
                - account
    /wallets:
        get:
            description: |
                One wallet per currency, so this is a list rather than a single object. It is short and unpaginated: a balance is opened by receiving money in that currency, not by browsing.
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/WalletList'
                    description: OK
                "401":
                    $ref: '#/components/responses/Unauthorized'
            security:
                - bearerAuth: []
            summary: List the caller's wallet balances
            tags:
                - finance
    /wallets/{currency}:
        get:
            parameters:
                - in: path
                  name: currency
                  required: true
                  schema:
                    $ref: '#/components/schemas/CurrencyCode'
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Wallet'
                    description: OK
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "404":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: No balance has been opened in this currency
            security:
                - bearerAuth: []
            summary: Read one currency balance
            tags:
                - finance
    /wallets/{currency}/transactions:
        get:
            description: |
                Every balance change with its before/after snapshot, newest first. Ordered by `seq`, not by time: two movements can share a timestamp, and a ledger that cannot be totally ordered cannot be replayed or shown to be complete. A gap in `seq` means a missing row.

                Legs of one logical movement share a `group_id` — a checkout is a debit plus an escrow hold plus a fee — which is what makes "does this add up" answerable.
            parameters:
                - in: path
                  name: currency
                  required: true
                  schema:
                    $ref: '#/components/schemas/CurrencyCode'
                - in: query
                  name: kind
                  schema:
                    $ref: '#/components/schemas/WalletTransactionKind'
                - $ref: '#/components/parameters/Cursor'
                - $ref: '#/components/parameters/Limit'
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/WalletTransactionPage'
                    description: OK
                "400":
                    $ref: '#/components/responses/BadRequest'
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "404":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: No balance has been opened in this currency
            security:
                - bearerAuth: []
            summary: Read one wallet's ledger
            tags:
                - finance
    /withdrawals:
        get:
            parameters:
                - in: query
                  name: status
                  schema:
                    $ref: '#/components/schemas/PaymentSessionStatus'
                - $ref: '#/components/parameters/Page'
                - $ref: '#/components/parameters/Limit'
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/WithdrawalPage'
                    description: OK
                "400":
                    $ref: '#/components/responses/BadRequest'
                "401":
                    $ref: '#/components/responses/Unauthorized'
            security:
                - bearerAuth: []
            summary: List the caller's withdrawals
            tags:
                - finance
        post:
            description: |
                Debits the available balance and opens a withdrawal for review; an admin resolves it before money leaves the platform. Only the available balance can be drawn — money still held in escrow is not the caller's yet.
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/CreateWithdrawalRequest'
                required: true
            responses:
                "201":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Withdrawal'
                    description: Created
                "400":
                    $ref: '#/components/responses/BadRequest'
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "404":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: Bank account or currency balance not found
                "422":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: Insufficient available balance, or the payee identity is unverified
            security:
                - bearerAuth: []
            summary: Request a cash-out to a bank account
            tags:
                - finance
    /withdrawals/{id}:
        delete:
            responses:
                "204":
                    description: Cancelled and the debit reversed
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "403":
                    $ref: '#/components/responses/Forbidden'
                "404":
                    $ref: '#/components/responses/NotFound'
                "409":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: Already resolved by an admin
            security:
                - bearerAuth: []
            summary: Withdraw the request and return the money to the balance
            tags:
                - finance
        get:
            description: A withdrawal is a payment session of kind `withdrawal`, so its id carries the session prefix.
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Withdrawal'
                    description: OK
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "403":
                    $ref: '#/components/responses/Forbidden'
                "404":
                    $ref: '#/components/responses/NotFound'
            security:
                - bearerAuth: []
            summary: Read a withdrawal
            tags:
                - finance
        parameters:
            - in: path
              name: id
              required: true
              schema:
                $ref: '#/components/schemas/PaymentSessionID'
servers:
    - description: Gateway (relative to host)
      url: /api/v1
tags:
    - name: account
    - name: catalog
    - name: order
    - name: finance
    - name: chat
    - name: trust
    - name: common
    - description: Moderator and admin console surface. Separate from the user-facing routes because the same URL must never return two different populations depending on the caller's role.
      name: admin
