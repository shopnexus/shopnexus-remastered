                    description: Session or payment option not found
                "409":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: Session is already settled, cancelled, or expired
                "422":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: Amount exceeds the session's outstanding balance
            security:
                - bearerAuth: []
            summary: Pay a session through one rail
            tags:
                - finance
    /payment-sessions/{id}/transactions:
        get:
            description: Append-only. A reversal is a new leg with a negative amount pointing at the leg it reverses, never an edit of the original.
            parameters:
