            tags:
                - order
    /items/{id}/cancellation:
        post:
            description: Either party may cancel while the item is not yet part of an order. The cancelling account is recorded.
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    $ref: '#/components/schemas/OrderItemID'
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/CancellationRequest'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/OrderItem'
