                    type: string
                resolution_note:
                    nullable: true
                    type: string
                resolved_at:
                    format: date-time
                    nullable: true
                    type: string
                resolved_by_id:
                    allOf:
                        - $ref: '#/components/schemas/AccountID'
                    description: The moderator who ruled.
                    nullable: true
                round:
                    description: 1 = the buyer escalating, 2 = the seller appealing the return.
                    enum:
                        - 1
                        - 2
                    type: integer
                status:
                    $ref: '#/components/schemas/DisputeStatus'
            required:
