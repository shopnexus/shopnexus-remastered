                "401":
                    $ref: '#/components/responses/Unauthorized'
            security:
                - bearerAuth: []
            summary: List refunds, as buyer or as seller
            tags:
                - order
    /refunds/{id}:
        delete:
            description: |
                Only while the seller has not decided. Once anything has moved — a decision, an escalation, a parcel — the case is closed by a verdict, not by walking away from it.

                The case ends as `cancelled`, which gives the escrow back up: the payout becomes the seller's again.
            responses:
                "204":
                    description: Withdrawn
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "403":
                    $ref: '#/components/responses/Forbidden'
                "404":
                    $ref: '#/components/responses/NotFound'
                "409":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: The seller has already decided, or the case has moved on
            security:
                - bearerAuth: []
            summary: Withdraw a refund request (buyer)
            tags:
                - order
        get:
            description: |
                The case: `deadline_at` for whoever is on the clock, and the facts each stage recorded. A party sees a staff verdict in the status the case ended up in.
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                properties:
                                    data:
                                        $ref: '#/components/schemas/Refund'
                                required:
                                    - data
                                type: object
                    description: OK
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "403":
                    $ref: '#/components/responses/Forbidden'
                "404":
                    $ref: '#/components/responses/NotFound'
            security:
                - bearerAuth: []
            summary: Read a refund and its case
            tags:
                - order
        parameters:
            - in: path
              name: id
              required: true
              schema:
                $ref: '#/components/schemas/RefundID'
    /refunds/{id}/acceptance:
        parameters:
            - in: path
              name: id
              required: true
              schema:
                $ref: '#/components/schemas/RefundID'
        post:
            description: |
                Grants it without staff. The goods have to come back first, so this books the return shipment on the same carrier as the outbound leg and moves the refund to `returning`; the money goes back once the seller has reported that leg delivered and has not escalated what arrived. No body — there is nothing left to choose.
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                properties:
                                    data:
                                        $ref: '#/components/schemas/Refund'
                                required:
                                    - data
                                type: object
                    description: Accepted; the return shipment is booked
                "400":
                    $ref: '#/components/responses/BadRequest'
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: Caller is not the seller of this order
                "404":
                    $ref: '#/components/responses/NotFound'
                "409":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: Refund is not awaiting seller review
            security:
                - bearerAuth: []
            summary: Accept a refund (seller)
            tags:
                - order
    /refunds/{id}/attachments:
        parameters:
            - in: path
              name: id
              required: true
              schema:
                $ref: '#/components/schemas/RefundID'
        post:
            description: Either party to the order, while the case is open. A closed one is the record a verdict was reached on, so nothing is added to it afterwards.
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/AddAttachmentsRequest'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                properties:
                                    data:
                                        $ref: '#/components/schemas/Refund'
                                required:
                                    - data
                                type: object
                    description: OK
                "400":
                    $ref: '#/components/responses/BadRequest'
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "403":
                    $ref: '#/components/responses/Forbidden'
                "404":
                    $ref: '#/components/responses/NotFound'
                "409":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: The case is closed
            security:
                - bearerAuth: []
            summary: Add evidence to a refund case
            tags:
                - order
    /refunds/{id}/return-transport/checkpoints:
        post:
            description: |
                The return leg exists only from the moment a refund is granted, and this is the only exit from `returning`. Either party to the order may report it, unlike the outbound leg: this one is never booked with a carrier, so no webhook can report it and requiring the seller alone would let one who simply never confirms strand the escrow with nobody on a clock.

                Who reports `delivered` is what decides where the case goes. From the **seller** it is an acknowledgement that the goods arrived, so the refund moves to `returned` and their inspection window opens — and letting that window pass settles for the buyer, which is their own silence costing them. From the **buyer** it is a claim about somebody else's warehouse, so the refund moves to `disputed` and staff decide: on the inspection window a buyer who posted nothing at all had only to report `delivered` and wait out an inattentive seller to keep both the money and the goods.

                Reporting a position short of `delivered` moves the leg and leaves the case in `returning` whoever sent it.
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    $ref: '#/components/schemas/RefundID'
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/TransportCheckpointRequest'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                properties:
                                    data:
                                        $ref: '#/components/schemas/Refund'
                                required:
                                    - data
                                type: object
                    description: Recorded; a delivery moves the refund to `returned` when the seller reported it and to `disputed` when the buyer did
                "400":
                    $ref: '#/components/responses/BadRequest'
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "403":
                    $ref: '#/components/responses/Forbidden'
                "404":
                    $ref: '#/components/responses/NotFound'
                "409":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: No return leg yet, the leg is already past that point, or the order is closed
                "422":
                    $ref: '#/components/responses/UnprocessableEntity'
            security:
                - bearerAuth: []
            summary: Report a checkpoint on the leg carrying the goods back
            tags:
                - order
    /register:
