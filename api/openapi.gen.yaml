    /categories:
        get:
            description: |
                Flat list with a parent reference on each row; a client assembles the tree. A category tree is small so this is unpaginated.

                `near` answers a different question: which categories does this thing belong in. It ranks by cosine distance over `category_embedding` and returns a shortlist with a `score` instead of the tree, which is what the category field of the listing form needs — a seller who has picked a few tags should not have to walk a tree to find where the item goes.
            parameters:
                - description: Rank by closeness to these seeds instead of returning the tree.
                  explode: false
                  in: query
                  name: near
                  schema:
                    items:
                        $ref: '#/components/schemas/SemanticSeed'
                    maxItems: 8
                    minItems: 1
                    type: array
                  style: form
                - description: Only honoured with `near`; the whole tree is never truncated.
                  in: query
                  name: limit
                  schema:
                    default: 10
                    maximum: 50
                    minimum: 1
                    type: integer
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/CategoryList'
                    description: OK
                "400":
                    $ref: '#/components/responses/BadRequest'
                "422":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: A `near` seed has no embedding yet
            summary: The category tree, or the categories nearest a set of seeds
            tags:
                - catalog
    /contacts:
        get:
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ContactList'
                    description: OK
                "401":
                    $ref: '#/components/responses/Unauthorized'
            security:
                - bearerAuth: []
            summary: List the caller's saved addresses
            tags:
                - account
        post:
            description: |
                The administrative codes are what a carrier is called with, so they are the routing source of truth and the names beside them are display snapshots. A coordinate is optional: geocoding may fail and the address still has to be saveable.
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/CreateContactRequest'
                required: true
            responses:
                "201":
                    content:
                        application/json:
                            schema:
                                properties:
                                    data:
                                        $ref: '#/components/schemas/Contact'
                                required:
                                    - data
                                type: object
                    description: Created
                "400":
                    $ref: '#/components/responses/BadRequest'
                "401":
                    $ref: '#/components/responses/Unauthorized'
            security:
                - bearerAuth: []
            summary: Save an address
            tags:
                - account
    /contacts/{id}:
        delete:
            responses:
                "204":
                    description: Removed
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "403":
                    $ref: '#/components/responses/Forbidden'
