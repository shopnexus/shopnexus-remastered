                "401":
                    $ref: '#/components/responses/Unauthorized'
                "403":
                    $ref: '#/components/responses/Forbidden'
                "404":
                    $ref: '#/components/responses/NotFound'
            security:
                - bearerAuth: []
            summary: Read a payment session
            tags:
                - finance
    /payment-sessions/{id}/cancellation:
        post:
            description: Only while nothing has settled. A session with a settled leg is closed by refunding, not by cancelling.
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    $ref: '#/components/schemas/PaymentSessionID'
            responses:
