                Freezes the listing terms so a price the seller edits afterwards cannot be charged. The server snapshots the SPU together with all of its SKUs — price and package_details live on the SKU, and those are exactly what must not move under the buyer — and sets `valid_until`.
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/CreateDraftRequest'
                required: true
            responses:
                "201":
                    content:
                        application/json:
