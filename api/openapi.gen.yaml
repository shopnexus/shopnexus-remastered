    /reviews/uploads:
        post:
            description: |
                The bytes never pass through this API. The answer is a short-lived signed URL to PUT to, and `POST /reviews/uploads/{id}/confirmation` makes the row real once the object is there — so a review can never render a photo whose bytes never arrived.

                `mime` and `size` are checked before a byte moves: a slot signed for anything is a slot for anything.
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/CreateUploadRequest'
                required: true
            responses:
                "201":
                    content:
                        application/json:
                            schema:
                                properties:
                                    data:
                                        $ref: '#/components/schemas/UploadSlot'
                                required:
                                    - data
                                type: object
                    description: Reserved
                "400":
                    $ref: '#/components/responses/BadRequest'
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "413":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: Larger than the limit for that type — 100 MB for video, 10 MB otherwise
                "422":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: That file type is not one the platform stores
            security:
                - bearerAuth: []
            summary: Reserve a slot to upload a review photo into
            tags:
                - trust
    /reviews/uploads/{id}/confirmation:
        post:
            description: |
                Until this lands the resource resolves to nothing, so a half-finished upload cannot be attached to a review. The recorded size is the store's, not the one declared when the slot was reserved.
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    $ref: '#/components/schemas/ResourceID'
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                properties:
                                    data:
                                        $ref: '#/components/schemas/Resource'
                                required:
                                    - data
                                type: object
                    description: Confirmed
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "404":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: No such reserved slot of the caller's
                "409":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: Nothing was uploaded to that slot
            security:
                - bearerAuth: []
            summary: Confirm the bytes are at the store
            tags:
                - trust
    /shipping-quotes:
        post:
            description: |
                One entry per enabled carrier that could price the parcel, so the buyer sees delivery before they pay for it. A carrier that declined is simply absent.

                Name exactly one source. `variant_id` is the listing page's question — what would this cost to send — answered before any draft exists, with `quantity` defaulting to one and the caller's default address used when `contact_id` is omitted. `draft_id` and `offer_id` are the two things that freeze a price, and the parcel is whichever of them is about to be checked out. The same list serves all three, because the buyer pays carriage on a fixed-price sale and a negotiated one alike.

                An estimate a client renders, not a price it can hold: the fee is quoted again at checkout, so a quote kept past the point it was true does not become the charge. Show it as its own line beside the price rather than folded into it — the total a buyer is charged is the checkout's, itemised.
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/ShippingQuotesRequest'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                properties:
                                    data:
                                        $ref: '#/components/schemas/ShippingQuotes'
                                required:
                                    - data
                                type: object
                    description: OK
                "400":
                    $ref: '#/components/responses/BadRequest'
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: Only the buyer prices delivery on agreed terms
                "404":
                    $ref: '#/components/responses/NotFound'
                "409":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: The draft or the agreed terms are no longer checkout-able
                "422":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: A variant that is not on this purchase, or a caller with no default delivery address
            security:
                - bearerAuth: []
            summary: What delivery would cost, per carrier
            tags:
                - order
    /tags:
        get:
            description: |
                A tag id is its slug and a natural key, so it is readable on the wire rather than encoded.

                Paginated, unlike the category tree: categories are a curated tree that stays small, while tags grow with the catalog. `q` is a prefix match on the slug, which is what the tag picker types into.

                `near` is the other half of that picker: it ranks the dictionary by cosine distance over `tag_embedding` and returns a `score`, so picking `handmade` offers back the tags that sit next to it in the vector space. The seeds themselves are never in the result — they are already on the listing — and a tag the embedding cron has not reached yet cannot be suggested at all, because `tag` carries no text index to fall back to.

                `q` and `near` are mutually exclusive: one filters the dictionary by what was typed, the other reorders it by meaning, and combining them would rank a set the prefix already decided.
            parameters:
                - description: Prefix match on the slug.
                  in: query
                  name: q
                  schema:
                    maxLength: 100
                    type: string
                - description: Rank by closeness to these seeds. Excludes the seeds.
                  explode: false
                  in: query
                  name: near
                  schema:
                    items:
                        $ref: '#/components/schemas/SemanticSeed'
                    maxItems: 8
                    minItems: 1
                    type: array
                  style: form
                - $ref: '#/components/parameters/Page'
                - $ref: '#/components/parameters/Limit'
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/TagPage'
                    description: OK
                "400":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: '`q` and `near` together, or a malformed seed'
                "422":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: A `near` seed has no embedding yet
            summary: The tag dictionary
            tags:
                - catalog
    /tax-info:
        get:
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                properties:
                                    data:
                                        $ref: '#/components/schemas/TaxInfo'
                                required:
                                    - data
                                type: object
                    description: OK
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "404":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: Nothing registered yet
            security:
                - bearerAuth: []
            summary: Read the caller's tax registration
            tags:
                - finance
        put:
            description: |
                One registration per account, so this is an upsert rather than a create. Replacing it resets verification to `pending`: the previous verdict was about the previous tax code. A code already verified under another account is rejected.
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/UpsertTaxInfoRequest'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                properties:
                                    data:
                                        $ref: '#/components/schemas/TaxInfo'
                                required:
                                    - data
                                type: object
                    description: Registered
                "400":
                    $ref: '#/components/responses/BadRequest'
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "409":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: This tax code is already verified under another account
            security:
                - bearerAuth: []
            summary: Register or replace the caller's tax registration
            tags:
                - finance
    /tickets:
        get:
            description: Their own, newest first. A requester never sees who else reported the same target, nor which moderator is working theirs.
            parameters:
                - in: query
                  name: status
                  schema:
                    $ref: '#/components/schemas/TicketStatus'
                - $ref: '#/components/parameters/Cursor'
                - $ref: '#/components/parameters/Limit'
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/TicketPage'
                    description: OK
                "400":
                    $ref: '#/components/responses/BadRequest'
                "401":
                    $ref: '#/components/responses/Unauthorized'
            security:
                - bearerAuth: []
            summary: Tickets the caller raised
            tags:
                - trust
        post:
            description: |
                `ref_id` is required exactly for the kinds that are about something — the report kinds, `refund-dispute`, `order-issue` — and its prefix has to agree with the kind. `reason` is required for the five `report-*` kinds and refused on every other one: it is what a report says is wrong. Both rules depend on `kind`, so neither can be a `required` in the schema — breaking either is 422.

                `body` and `attachments` open the thread: they are posted as the first message, and everything said afterwards is ordinary chat.

                One open ticket per target per requester, so raising the same complaint twice while the first is still open is a conflict rather than a second row. A `refund-dispute` also moves the refund into staff's hands first, so order's own guards — the right party, the right moment — are what answer 403 and 409 here.

                A `refund-dispute` names the **order**, not the refund: one live refund per sale is a database index, so which case it is stays order's to resolve, and every dispute about that sale then files against one target. That is what keeps a seller's complaint about what came back in the thread they were already using. It is also raised for a buyer automatically when the seller lets the 48-hour review window pass — silence is not a verdict, and the buyer is not asked to chase a case they already opened.
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/OpenTicketRequest'
                required: true
            responses:
                "201":
                    content:
                        application/json:
                            schema:
                                properties:
                                    data:
                                        $ref: '#/components/schemas/Ticket'
                                required:
                                    - data
                                type: object
                    description: Raised
                "400":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: The body is invalid, or `ref_id` does not decode as the kind requires
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: The refund being disputed is not the caller's
                "404":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: What the ticket is about does not exist
                "409":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: You already have an open ticket about this, or the refund cannot be escalated now
                "422":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: '`ref_id` or `reason` is not what this `kind` requires — missing where it is needed, or sent where it does not belong'
            security:
                - bearerAuth: []
            summary: Raise a ticket
            tags:
                - trust
    /tickets/{id}:
        get:
            description: |
                Somebody else's is 404 rather than 403: a ticket id is guessable, and confirming one exists already says something.

                This also repairs a missing `conversation_id`. The row and the thread live in different schemas, so one lands first — a ticket whose thread was never written is answerable on the next read rather than mute.
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    $ref: '#/components/schemas/TicketID'
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                properties:
                                    data:
                                        $ref: '#/components/schemas/Ticket'
                                required:
                                    - data
                                type: object
                    description: OK
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "404":
                    $ref: '#/components/responses/NotFound'
            security:
                - bearerAuth: []
            summary: Read a ticket the caller raised
            tags:
                - trust
    /token/refresh:
        post:
            description: The refresh token is a Redis key. One that has been revoked or has expired is indistinguishable from one that never existed.
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/RefreshRequest'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                properties:
                                    data:
                                        $ref: '#/components/schemas/AuthResult'
                                required:
                                    - data
                                type: object
                    description: OK
                "400":
                    $ref: '#/components/responses/BadRequest'
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: Unknown or revoked refresh token
            summary: Exchange a refresh token for a new access token
            tags:
                - account
    /variants/{id}:
        delete:
            description: |
                Soft delete for the same reason as a listing. Refused for the last remaining variant of a live listing.

                Answers with the listing rather than an empty body: deleting the featured variant moves the flag to a surviving one, and the seller has to see which.
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                properties:
                                    data:
                                        $ref: '#/components/schemas/ListingDetail'
                                required:
                                    - data
                                type: object
                    description: Deleted
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "403":
                    $ref: '#/components/responses/Forbidden'
                "404":
                    $ref: '#/components/responses/NotFound'
                "409":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: This is the only variant of a live listing
            security:
                - bearerAuth: []
            summary: Delete a variant
            tags:
                - catalog
        parameters:
            - in: path
              name: id
              required: true
              schema:
                $ref: '#/components/schemas/VariantID'
        patch:
            description: |
                A price change does not reach a buyer who already opened a purchase session: that session froze the terms it was opened with.

                `quantity` sets the total on hand. Neither `reserved` nor `sold` is settable — checkout and cancellation move the first, completing a purchase moves both — and a total below `reserved + sold` is refused, because an oversold row must not be representable.
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/UpdateVariantRequest'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                properties:
                                    data:
                                        $ref: '#/components/schemas/ListingDetail'
                                required:
                                    - data
                                type: object
                    description: OK
                "400":
                    $ref: '#/components/responses/BadRequest'
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "403":
                    $ref: '#/components/responses/Forbidden'
                "404":
                    $ref: '#/components/responses/NotFound'
                "409":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: Another live variant of this listing already has these attributes
                "422":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: Quantity below what is already reserved or sold
            security:
                - bearerAuth: []
            summary: Edit a variant
            tags:
                - catalog
    /wallets:
        get:
            description: |
                One wallet per currency, so this is a list rather than a single object. It is short and unpaginated: a balance is opened by receiving money in that currency, not by browsing.
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/WalletList'
                    description: OK
                "401":
                    $ref: '#/components/responses/Unauthorized'
            security:
                - bearerAuth: []
            summary: List the caller's wallet balances
            tags:
                - finance
    /wallets/{currency}:
        get:
            parameters:
                - in: path
                  name: currency
                  required: true
                  schema:
                    $ref: '#/components/schemas/CurrencyCode'
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                properties:
                                    data:
                                        $ref: '#/components/schemas/Wallet'
                                required:
                                    - data
                                type: object
                    description: OK
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "404":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: No balance has been opened in this currency
            security:
                - bearerAuth: []
            summary: Read one currency balance
            tags:
                - finance
    /wallets/{currency}/transactions:
        get:
            description: |
                Every balance change with its before/after snapshot, newest first. Ordered by `seq`, not by time: two movements can share a timestamp, and a ledger that cannot be totally ordered cannot be replayed or shown to be complete. A gap in `seq` means a missing row.

                Legs of one logical movement share a `group_id` — a checkout is a debit plus an escrow hold plus a fee — which is what makes "does this add up" answerable.
            parameters:
                - in: path
                  name: currency
                  required: true
                  schema:
                    $ref: '#/components/schemas/CurrencyCode'
                - in: query
                  name: kind
                  schema:
                    $ref: '#/components/schemas/WalletTransactionKind'
                - $ref: '#/components/parameters/Cursor'
                - $ref: '#/components/parameters/Limit'
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/WalletTransactionPage'
                    description: OK
                "400":
                    $ref: '#/components/responses/BadRequest'
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "404":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: No balance has been opened in this currency
            security:
                - bearerAuth: []
            summary: Read one wallet's ledger
            tags:
                - finance
    /withdrawals:
        get:
            parameters:
                - in: query
                  name: status
                  schema:
                    $ref: '#/components/schemas/PaymentSessionStatus'
                - $ref: '#/components/parameters/Page'
                - $ref: '#/components/parameters/Limit'
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/WithdrawalPage'
                    description: OK
                "400":
                    $ref: '#/components/responses/BadRequest'
                "401":
                    $ref: '#/components/responses/Unauthorized'
            security:
                - bearerAuth: []
            summary: List the caller's withdrawals
            tags:
                - finance
        post:
            description: |
                Debits the available balance and opens a withdrawal for review; an admin resolves it before money leaves the platform. Only the available balance can be drawn — money still held in escrow is not the caller's yet.
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/CreateWithdrawalRequest'
                required: true
            responses:
                "201":
                    content:
                        application/json:
                            schema:
                                properties:
                                    data:
                                        $ref: '#/components/schemas/Withdrawal'
                                required:
                                    - data
                                type: object
                    description: Created
                "400":
                    $ref: '#/components/responses/BadRequest'
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "404":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: Bank account or currency balance not found
                "422":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: Insufficient available balance, or the payee identity is unverified
            security:
                - bearerAuth: []
            summary: Request a cash-out to a bank account
            tags:
                - finance
    /withdrawals/{id}:
        delete:
            responses:
                "204":
                    description: Cancelled and the debit reversed
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "403":
                    $ref: '#/components/responses/Forbidden'
                "404":
                    $ref: '#/components/responses/NotFound'
                "409":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: Already resolved by an admin
            security:
                - bearerAuth: []
            summary: Withdraw the request and return the money to the balance
            tags:
                - finance
        get:
            description: A withdrawal is a payment session of kind `withdrawal`, so its id carries the session prefix.
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                properties:
                                    data:
                                        $ref: '#/components/schemas/Withdrawal'
                                required:
                                    - data
                                type: object
                    description: OK
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "403":
                    $ref: '#/components/responses/Forbidden'
                "404":
                    $ref: '#/components/responses/NotFound'
            security:
                - bearerAuth: []
            summary: Read a withdrawal
            tags:
                - finance
        parameters:
            - in: path
              name: id
              required: true
              schema:
                $ref: '#/components/schemas/PaymentSessionID'
    /ws/tickets:
        post:
            description: |
                Returns a single-use ticket for `GET /ws`. Valid for 30 seconds and destroyed
                on redemption, so every reconnect needs a fresh one.

                This exists because a browser cannot set an Authorization header on
                `new WebSocket()`. Putting the access token in the query string instead would
                write a live credential into proxy logs and browser history.

                The realtime surface itself is described in asyncapi.yaml.
            operationId: createWebSocketTicket
            responses:
                "201":
                    content:
                        application/json:
                            schema:
                                properties:
                                    data:
                                        $ref: '#/components/schemas/WebSocketTicket'
                                required:
                                    - data
                                type: object
                    description: Ticket issued
                "401":
                    $ref: '#/components/responses/Unauthorized'
            security:
                - bearerAuth: []
            summary: Mint a WebSocket handshake ticket
            tags:
                - account
servers:
    - description: Gateway (relative to host)
      url: /api/v1
tags:
    - name: account
    - name: catalog
    - name: order
    - name: finance
    - name: chat
    - name: trust
    - name: common
    - description: Moderator and admin console surface. Separate from the user-facing routes because the same URL must never return two different populations depending on the caller's role.
      name: admin
