                    type: string
                currency:
                    $ref: '#/components/schemas/CurrencyCode'
                expires_at:
                    format: date-time
                    type: string
                id:
                    $ref: '#/components/schemas/OfferID'
                quantity:
                    format: int64
                    type: integer
                reason:
                    description: Shown on the offer card beside the proposed price
