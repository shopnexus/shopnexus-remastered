                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: Too many requests for this number
            security:
                - bearerAuth: []
            summary: Send a verification code to a saved address's phone
            tags:
                - account
    /contacts/{id}/phone/verifications:
