                Unauthenticated, because an address form and the listing browse's area filter both need it before anybody has signed in. The list is served from the backend rather than from a public third-party API so that a seller's own address does not depend on somebody else's uptime, and so both clients spell a code the same way: it is the zero-padded string the columns store, and a client sends back exactly what it was given.
