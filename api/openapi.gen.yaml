            responses:
                "201":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Refund'
                    description: Created
                "400":
                    $ref: '#/components/responses/BadRequest'
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: Caller is not the buyer of this order
                "404":
                    $ref: '#/components/responses/NotFound'
                "409":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: A refund is already open on this order
                "422":
                    content:
                        application/json:
                            schema:
