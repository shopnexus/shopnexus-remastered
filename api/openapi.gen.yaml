        patch:
            description: |
                Setting a default clears the previous one. Delivery and pickup defaults are independent flags — the same address is usually both.

                An order already placed keeps its own snapshot of the address, so editing this row never rewrites where a shipment was going.
            requestBody:
                content:
                    application/json:
