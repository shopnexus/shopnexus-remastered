    /admin/wallets/{accountID}/adjustments:
        post:
            description: |
                The one way a balance changes without a business event behind it, so it is the most auditable: a reason is mandatory and an `idempotency_key` is required, because a retried correction that posts twice is money invented. Reusing a key returns the movement already recorded instead of making a second one.
            parameters:
                - in: path
                  name: accountID
                  required: true
                  schema:
                    $ref: '#/components/schemas/AccountID'
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/WalletAdjustmentRequest'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                properties:
                                    data:
                                        $ref: '#/components/schemas/Wallet'
                                required:
                                    - data
                                type: object
                    description: |
                        Adjusted, answering the balances as they now stand. The same response for a key that was already applied: a retried correction is the state the admin asked for, not a second credit.
                "400":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: Malformed, or both deltas are zero
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "403":
                    content:
                        application/json:
                            schema:
