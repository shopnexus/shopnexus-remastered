            required:
                - id
                - email_verified
                - role
                - status
                - has_password
                - identity_verified
                - profile
                - created_at
            type: object
        Message:
            properties:
                attachments:
                    description: Empty on a redacted message.
                    items:
                        $ref: '#/components/schemas/Resource'
                    type: array
                body:
                    description: Empty on a redacted message.
                    type: string
                card:
                    additionalProperties: true
                    description: |
                        The rendered payload of a system message, such as the terms of an accepted offer. Written only by the backend and rejected on a `user` message — otherwise anyone could send a card that looks like an offer the seller accepted.
                    nullable: true
                    type: object
                conversation_id:
                    $ref: '#/components/schemas/ConversationID'
                created_at:
                    format: date-time
                    type: string
                deleted_at:
                    description: Set on a redacted message. The row stays so a thread has no unexplained gaps.
                    format: date-time
                    nullable: true
                    type: string
                edited_at:
                    format: date-time
                    nullable: true
                    type: string
                id:
                    $ref: '#/components/schemas/MessageID'
                refs:
                    additionalProperties: true
                    description: |
                        What the sender pointed at — a listing, a variant, an order. Client-supplied and validated against the caller's own access to each id, so it can carry a reference but never assert anything about it.
                    type: object
                sender_id:
                    allOf:
                        - $ref: '#/components/schemas/AccountID'
