    /conversations:
        get:
            description: |
                Threads by latest activity. A participant sits on either side of the stored pair, so this is answered as two ordered index scans merged together rather than one scan that sorts.
            parameters:
                - $ref: '#/components/parameters/Cursor'
                - $ref: '#/components/parameters/Limit'
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ConversationPage'
                    description: OK
                "401":
                    $ref: '#/components/responses/Unauthorized'
            security:
                - bearerAuth: []
            summary: The caller's inbox
            tags:
                - chat
        post:
            description: |
                Idempotent by design: there is exactly one thread per pair, so this returns the existing one when it exists and creates it otherwise. A client does not have to track whether it has messaged someone before.
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/StartConversationRequest'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                properties:
                                    data:
                                        $ref: '#/components/schemas/Conversation'
                                required:
                                    - data
                                type: object
                    description: The thread already existed
                "201":
                    content:
                        application/json:
                            schema:
                                properties:
                                    data:
                                        $ref: '#/components/schemas/Conversation'
                                required:
                                    - data
                                type: object
                    description: Created
                "400":
                    $ref: '#/components/responses/BadRequest'
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "404":
                    $ref: '#/components/responses/NotFound'
                "422":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: An account cannot open a thread with itself
            security:
                - bearerAuth: []
            summary: Open the thread with another account
            tags:
                - chat
    /conversations/{id}:
        get:
            description: Carries the counterparty rather than both sides — the caller already knows who they are.
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    $ref: '#/components/schemas/ConversationID'
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                properties:
                                    data:
                                        $ref: '#/components/schemas/Conversation'
                                required:
                                    - data
                                type: object
                    description: OK
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "403":
                    $ref: '#/components/responses/Forbidden'
                "404":
                    $ref: '#/components/responses/NotFound'
            security:
                - bearerAuth: []
            summary: Read a thread
            tags:
                - chat
    /conversations/{id}/messages:
        get:
            description: |
                Newest first, cursor only. Offset paging would defeat the chunk exclusion the time partitioning exists for.

                A redacted message is still returned, with its body emptied and `deleted_at` set: a gap in a thread that a dispute may hinge on is worse than a visible removal.
            parameters:
                - $ref: '#/components/parameters/Cursor'
                - $ref: '#/components/parameters/Limit'
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/MessagePage'
                    description: OK
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "403":
                    $ref: '#/components/responses/Forbidden'
                "404":
                    $ref: '#/components/responses/NotFound'
            security:
                - bearerAuth: []
            summary: Read a thread's messages
            tags:
                - chat
        parameters:
            - in: path
              name: id
              required: true
              schema:
                $ref: '#/components/schemas/ConversationID'
        post:
            description: |
                Text, attachments or both. `refs` carries pointers to a listing or a variant or an order, which is how a product is referred to inside a thread that is not itself listing-scoped.
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/SendMessageRequest'
                required: true
            responses:
                "201":
                    content:
                        application/json:
                            schema:
                                properties:
                                    data:
                                        $ref: '#/components/schemas/Message'
                                required:
                                    - data
                                type: object
                    description: Sent
                "400":
                    $ref: '#/components/responses/BadRequest'
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "403":
                    $ref: '#/components/responses/Forbidden'
                "404":
                    $ref: '#/components/responses/NotFound'
                "422":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: A message needs a body or an attachment
            security:
                - bearerAuth: []
            summary: Send a message
            tags:
                - chat
    /conversations/{id}/read:
        post:
            description: |
                Moves the caller's read mark on the thread — one UPDATE of one row, whatever it covers. Omit `before` to mark the whole thread read. A mark never moves backwards: passing an earlier instant than the current one is a no-op, because un-reading is not a thing a client should be able to do to its own badge.

                Answers the updated thread rather than just the badge, so a client that marked it read can repaint the row from one response instead of a second GET.
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    $ref: '#/components/schemas/ConversationID'
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/MarkConversationReadRequest'
                required: false
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                properties:
                                    data:
                                        $ref: '#/components/schemas/Conversation'
                                required:
                                    - data
                                type: object
                    description: OK
                "400":
                    $ref: '#/components/responses/BadRequest'
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "403":
                    $ref: '#/components/responses/Forbidden'
                "404":
                    $ref: '#/components/responses/NotFound'
            security:
                - bearerAuth: []
            summary: Mark a thread read up to a point in time
            tags:
                - chat
    /conversations/unread-count:
        get:
            description: |
                One range scan per thread the caller has, each bounded below by that thread's read mark — so an old unread message costs no more than a recent one and chunk exclusion applies throughout, but the work is proportional to how many threads the caller has, not constant. Separate from the inbox because the badge is read far more often than the list.
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                properties:
                                    data:
                                        $ref: '#/components/schemas/ChatUnreadCount'
                                required:
                                    - data
                                type: object
                    description: OK
                "401":
                    $ref: '#/components/responses/Unauthorized'
            security:
                - bearerAuth: []
            summary: The unread badge across every thread
            tags:
                - chat
    /conversations/uploads:
        post:
            description: |
                The bytes never pass through this API. The answer is a short-lived signed URL to PUT to, and `POST /conversations/uploads/{id}/confirmation` makes the row real once the object is there — so a message can never render a photo whose bytes never arrived.

                `mime` and `size` are checked before a byte moves: a slot signed for anything is a slot for anything.
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/CreateUploadRequest'
                required: true
            responses:
                "201":
                    content:
                        application/json:
                            schema:
                                properties:
                                    data:
                                        $ref: '#/components/schemas/UploadSlot'
                                required:
                                    - data
                                type: object
                    description: Reserved
                "400":
                    $ref: '#/components/responses/BadRequest'
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "413":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: Larger than the limit for that type — 100 MB for video, 10 MB otherwise
                "422":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: That file type is not one the platform stores
            security:
                - bearerAuth: []
            summary: Reserve a slot to upload a message attachment into
            tags:
                - chat
    /conversations/uploads/{id}/confirmation:
        post:
            description: |
                Until this lands the resource resolves to nothing, so a half-finished upload cannot be attached to a message. The recorded size is the store's, not the one declared when the slot was reserved.
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    $ref: '#/components/schemas/ResourceID'
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                properties:
                                    data:
                                        $ref: '#/components/schemas/Resource'
                                required:
                                    - data
                                type: object
                    description: Confirmed
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "404":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: No such reserved slot of the caller's
                "409":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: Nothing was uploaded to that slot
            security:
                - bearerAuth: []
            summary: Confirm the bytes are at the store
            tags:
                - chat
    /devices:
        put:
            description: |
                An upsert on the push token, not a create. The token identifies an install and the platform reissues the same one when a different user signs in on that phone, so the row moves to the new account. Without that, the previous owner keeps receiving that phone's notifications.
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/RegisterDeviceRequest'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                properties:
                                    data:
                                        $ref: '#/components/schemas/Device'
                                required:
                                    - data
                                type: object
                    description: Registered or moved
                "400":
                    $ref: '#/components/responses/BadRequest'
                "401":
                    $ref: '#/components/responses/Unauthorized'
            security:
                - bearerAuth: []
            summary: Register or move a push device
            tags:
                - account
    /devices/{id}:
        delete:
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    $ref: '#/components/schemas/DeviceID'
            responses:
                "204":
                    description: Unregistered
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "403":
                    $ref: '#/components/responses/Forbidden'
                "404":
                    $ref: '#/components/responses/NotFound'
            security:
                - bearerAuth: []
            summary: Unregister a push device
            tags:
                - account
    /drafts:
        get:
            parameters:
                - $ref: '#/components/parameters/Cursor'
                - $ref: '#/components/parameters/Limit'
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/DraftOrderPage'
                    description: OK
                "401":
                    $ref: '#/components/responses/Unauthorized'
            security:
                - bearerAuth: []
            summary: List the caller's purchase sessions
            tags:
                - order
        post:
            description: |
                Freezes the listing terms so a price the seller edits afterwards cannot be charged. The server snapshots the listing together with every variant — price and package details live on the variant, and those are exactly what must not move under the buyer — and sets `valid_until`.

                Every listing has one, whichever way it is priced. A `negotiable` listing carries the seller's asking price like any other, and a buyer who does not want to haggle takes it: the listing page offers both, and this is the "buy now" half. Negotiating instead freezes the agreed terms in the offer, and `POST /offers/{id}/checkout` is the same checkout from there.
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/CreateDraftRequest'
                required: true
            responses:
                "201":
                    content:
                        application/json:
                            schema:
                                properties:
                                    data:
                                        $ref: '#/components/schemas/DraftOrder'
                                required:
                                    - data
                                type: object
                    description: Created
                "400":
                    $ref: '#/components/responses/BadRequest'
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "404":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: Listing not found, deleted, or not active
            security:
                - bearerAuth: []
            summary: Open a purchase session for one listing
            tags:
                - order
    /drafts/{id}:
        delete:
            description: Sets `cancelled_at`. A session that already produced paid items cannot be cancelled.
            responses:
                "204":
                    description: Cancelled
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "403":
                    $ref: '#/components/responses/Forbidden'
                "404":
                    $ref: '#/components/responses/NotFound'
                "409":
                    $ref: '#/components/responses/Conflict'
            security:
                - bearerAuth: []
            summary: Cancel a purchase session
            tags:
                - order
        get:
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                properties:
                                    data:
                                        $ref: '#/components/schemas/DraftOrder'
                                required:
                                    - data
                                type: object
                    description: OK
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "403":
                    $ref: '#/components/responses/Forbidden'
                "404":
                    $ref: '#/components/responses/NotFound'
            security:
                - bearerAuth: []
            summary: Read a purchase session and its frozen terms
            tags:
                - order
        parameters:
            - in: path
              name: id
              required: true
              schema:
                $ref: '#/components/schemas/DraftOrderID'
    /drafts/{id}/checkout:
        post:
            description: |
                Creates one `item` per line plus a single buyer-checkout payment session, and returns both. Line prices come from the session's frozen snapshot, never from the live catalog. `contact_id` is snapshotted into every line's delivery address: one session covers one SPU and therefore one seller, so a single address is correct.

                The session is spent before the money is asked for: the claim is what makes two concurrent checkouts of one draft impossible, and the loser is answered 409 rather than handed a second payment session for the same frozen price.

                This is the checkout for terms a draft froze — the seller's own price, whether the listing is `fixed` or `negotiable`. Terms that were *negotiated* are checked out at `POST /offers/{id}/checkout` instead, which is the same flow against the agreed price. The buyer pays delivery either way.
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    $ref: '#/components/schemas/DraftOrderID'
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/CheckoutRequest'
                required: true
            responses:
                "201":
                    content:
                        application/json:
                            schema:
                                properties:
                                    data:
                                        $ref: '#/components/schemas/CheckoutResult'
                                required:
                                    - data
                                type: object
                    description: Items created and a payment session opened
                "400":
                    $ref: '#/components/responses/BadRequest'
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "403":
                    $ref: '#/components/responses/Forbidden'
                "404":
                    $ref: '#/components/responses/NotFound'
                "409":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: Session expired, cancelled, or already checked out
                "422":
                    $ref: '#/components/responses/UnprocessableEntity'
            security:
                - bearerAuth: []
            summary: Check out a purchase session (pay-first)
            tags:
                - order
    /email/verification-requests:
        post:
            responses:
                "202":
                    description: Verification message sent
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "409":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: Already verified
                "422":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: No email on this account
            security:
                - bearerAuth: []
            summary: Send a verification link to the caller's email
            tags:
                - account
    /email/verifications:
        post:
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/EmailVerificationRequest'
                required: true
            responses:
                "204":
                    description: Verified
                "400":
                    $ref: '#/components/responses/BadRequest'
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: Token is unknown or already used or expired
            summary: Confirm an email address
            tags:
                - account
    /favorites/{listingID}:
        delete:
            description: |
                Idempotent, and deliberately so all the way: unsaving something that was never saved answers 204, and so does a `listingID` that names no listing at all. The post-condition — this listing is not on the caller's wishlist — holds either way, and a 404 here would only tell a stranger which ids exist.
            responses:
                "204":
                    description: Removed
                "401":
                    $ref: '#/components/responses/Unauthorized'
            security:
                - bearerAuth: []
            summary: Unsave a listing
            tags:
                - catalog
        parameters:
            - in: path
              name: listingID
              required: true
              schema:
                $ref: '#/components/schemas/ListingID'
        put:
            description: |
                Idempotent — the account and listing pair is the whole row, so saving twice is the same as saving once. Read the wishlist back through `GET /listings?favorited=true`.
            responses:
                "204":
                    description: Saved
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "404":
                    $ref: '#/components/responses/NotFound'
            security:
                - bearerAuth: []
            summary: Save a listing
            tags:
                - catalog
    /follows/{accountID}:
        delete:
            responses:
                "204":
                    description: Unfollowed
                "401":
                    $ref: '#/components/responses/Unauthorized'
            security:
                - bearerAuth: []
            summary: Unfollow a seller
            tags:
                - account
        parameters:
            - in: path
              name: accountID
              required: true
              schema:
                $ref: '#/components/schemas/AccountID'
        put:
            description: Idempotent. Following yourself is refused.
            responses:
                "204":
                    description: Following
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "404":
                    $ref: '#/components/responses/NotFound'
                "422":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: An account cannot follow itself
            security:
                - bearerAuth: []
            summary: Follow a seller
            tags:
                - account
    /identity-documents:
        post:
            description: |
                Hands the uploaded scans to the KYC vendor. Neither a document number nor a scan is stored here — only the vendor, its case reference and the verdict — so a leak of this data cannot impersonate anyone.

                The verdict may already be final in the response: a vendor that reads the images answers in the same call, so `status` can come back `verified` or `rejected` with no session URL. A vendor that runs its own web flow answers `pending` and returns `vendor_session_url` for the caller to finish in. A client has to read the status rather than assume one of the two.

                A rejected case leaves the account free to submit another one: the usual reason is glare on the card, and there is nothing to appeal.
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/StartIdentityVerificationRequest'
                required: true
            responses:
                "201":
                    content:
                        application/json:
                            schema:
                                properties:
                                    data:
                                        $ref: '#/components/schemas/IdentityVerificationTicket'
                                required:
                                    - data
                                type: object
                    description: Case opened
                "400":
                    $ref: '#/components/responses/BadRequest'
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "409":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: This account already holds a live verified document
                "422":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: A named scan is missing, unconfirmed, or cannot be fetched
            security:
                - bearerAuth: []
            summary: Start identity verification
            tags:
                - account
    /items:
        get:
            description: |
                `role=seller&pending=true` is the seller's retry list: lines the money has paid for that no order covers yet. Not an inbox — nobody confirms them. The order is written by the payment webhook, so a line sitting here for long is a settlement that has not succeeded yet rather than one waiting on a person.
            parameters:
                - in: query
                  name: role
                  schema:
                    default: buyer
                    enum:
                        - buyer
                        - seller
                    type: string
                - description: Only lines no order covers and nobody cancelled.
                  in: query
                  name: pending
                  schema:
                    default: false
                    type: boolean
                - $ref: '#/components/parameters/Cursor'
                - $ref: '#/components/parameters/Limit'
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/OrderItemPage'
                    description: OK
                "400":
                    $ref: '#/components/responses/BadRequest'
                "401":
                    $ref: '#/components/responses/Unauthorized'
            security:
                - bearerAuth: []
            summary: List checkout lines, as buyer or as seller
            tags:
                - order
    /items/{id}/cancellation:
        post:
            description: |
                Either party may drop a line while it is unpaid — the buyer changed their mind, or the seller cannot fulfil it — and the reserved units go back. The cancelling account is recorded.

                A paid line is 409, and that is checked against the payment session rather than against `order_id`: the order is written by the webhook, so a line that has been charged for has a null `order_id` for as long as that write keeps failing. From there the way back is a refund, which the seller gets to see.
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    $ref: '#/components/schemas/OrderItemID'
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                properties:
                                    data:
                                        $ref: '#/components/schemas/OrderItem'
                                required:
                                    - data
                                type: object
                    description: Cancelled
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "404":
                    $ref: '#/components/responses/NotFound'
                "409":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: The session is paid, or the line is already cancelled
            security:
                - bearerAuth: []
            summary: Cancel a line the money has not reached
            tags:
                - order
    /listings:
        get:
            description: |
                With no parameters, the newest live active listings. The parameters narrow that one query rather than selecting between separate endpoints.

                `q` makes it a search and moves the default sort to `relevance`. `lexical` matches the name by trigram and tolerates missing diacritics, `semantic` runs an approximate nearest-neighbour search over the dense embedding, and `hybrid` combines the dense vector with the sparse lexical one, which is what the embedding model is built for. Each hit then carries `score`, always so that higher is better. A listing whose embedding has not been computed yet can only be found lexically.

                `sort=recommended` is the personalised feed: nearest-neighbour search over listing embeddings from the caller's interest slots. It needs a token, and falls back to newest for an account with no interests computed yet.

                `mine=true` restricts the result to the caller's own listings, and is the only case in which `status` is honoured — a seller has to see what is not public, and nobody else may.

                `favorited=true` is the wishlist page. It is a filter here rather than its own endpoint because a wishlist wants exactly what a feed wants — cards, with prices and stock and every filter available — and a separate endpoint returning saved ids left the client resolving them one by one.

                `ids` resolves a known set, which is how a cart or an order list renders the listings behind its rows. It ignores every other filter and answers for hidden and soft-deleted listings too, because an order that references one still has to display it; `deleted_at` says which. Listings that were never public (`draft`, `pending`) stay out unless they are the caller's own.

                Location is a C2C buyer's first filter — collecting in person, or just trusting a seller two districts away over one across the country. It is the seller's pickup address as the listing snapshotted it when they published, so it is the same address a carrier collects from, and it never moves under a listing that has already sold. `province_code`/`district_code`/ `ward_code` filter on it; `lat`+`lon` or `near_contact_id` measure from where the buyer is, `radius_km` bounds the result and `sort=distance` orders by it.

                `price-asc` and `price-desc` are answered through the SKU price index rather than a value cached on the listing, so `price` is the cheapest matching variant's. `best-selling` is the one that cannot work that way — it orders by a sum over the variants, and a sum has no per-SKU index to scan in order — so it reads `cached_sold` on the listing, maintained with the sales it counts.
            parameters:
                - description: Resolve exactly these listings, ignoring the other filters.
                  explode: false
                  in: query
                  name: ids
                  schema:
                    items:
                        $ref: '#/components/schemas/ListingID'
                    maxItems: 100
                    type: array
                  style: form
                - description: Free-text query. Turns the request into a search.
                  in: query
                  name: q
                  schema:
                    maxLength: 200
                    minLength: 1
                    type: string
                - description: Search mode. Ignored without a query.
                  in: query
                  name: mode
                  schema:
                    default: hybrid
                    enum:
                        - lexical
                        - semantic
                        - hybrid
                    type: string
                - description: The caller's own listings, in every state.
                  in: query
                  name: mine
                  schema:
                    default: false
                    type: boolean
                - description: The caller's wishlist. This is the wishlist page.
                  in: query
                  name: favorited
                  schema:
                    default: false
                    type: boolean
                - description: Only honoured together with mine=true.
                  in: query
                  name: status
                  schema:
                    $ref: '#/components/schemas/ListingStatus'
                - in: query
                  name: category_id
                  schema:
                    $ref: '#/components/schemas/CategoryID'
                - in: query
                  name: tag
                  schema:
                    $ref: '#/components/schemas/TagSlug'
                - in: query
                  name: seller_id
                  schema:
                    $ref: '#/components/schemas/AccountID'
                - in: query
                  name: condition
                  schema:
                    $ref: '#/components/schemas/ListingCondition'
                - in: query
                  name: min_price
                  schema:
                    format: int64
                    minimum: 0
                    type: integer
                - in: query
                  name: max_price
                  schema:
                    format: int64
                    minimum: 0
                    type: integer
                - description: |
                    Where to look, matched against the listing's own snapshot of the seller's pickup address. Send the narrowest level you mean — a ward is already inside its province.
                  in: query
                  name: province_code
                  schema:
                    example: "79"
                    maxLength: 20
                    type: string
                - in: query
                  name: district_code
                  schema:
                    example: "760"
                    maxLength: 20
                    type: string
                - in: query
                  name: ward_code
                  schema:
                    example: "26734"
                    maxLength: 20
                    type: string
                - description: |
                    Where the buyer is, for a "near me" browse — from the device, and always together with `lon`. With a position every card carries `location.distance_km`.
                  in: query
                  name: lat
                  schema:
                    example: 10.7769
                    format: double
                    maximum: 90
                    minimum: -90
                    type: number
                - in: query
                  name: lon
                  schema:
                    example: 106.7009
                    format: double
                    maximum: 180
                    minimum: -180
                    type: number
                - description: |
                    One of the caller's own saved addresses, as an alternative to `lat`/`lon` — the usual case, since a buyer's address is already on file. 422 if it was never geocoded.
                  in: query
                  name: near_contact_id
                  schema:
                    $ref: '#/components/schemas/ContactID'
                - description: |
                    Bound the result to a circle around that position. Without it a position still ranks and reports distance, it just does not exclude anything.
                  in: query
                  name: radius_km
                  schema:
                    example: 5
                    exclusiveMinimum: 0
                    format: double
                    maximum: 500
                    type: number
                - description: |
                    Defaults to `relevance` when a query is given and `newest` otherwise. `distance` needs a position, like `radius_km` does.
                  in: query
                  name: sort
                  schema:
                    enum:
                        - newest
                        - rating
                        - price-asc
                        - price-desc
                        - best-selling
                        - relevance
                        - recommended
                        - distance
                    type: string
                - $ref: '#/components/parameters/Page'
                - $ref: '#/components/parameters/Limit'
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ListingPage'
                    description: OK
                "400":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: |
                        A combination that has no answer: `sort=relevance` without a query, `status` without `mine`, or `sort=recommended` together with `favorited` or `mine` — a personalised ranking of a set the caller already chose is not a ranking of anything. Combinations are refused rather than silently resolved by precedence, so a client never gets a different list than it asked for.
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: '`mine=true`, `favorited=true` or `sort=recommended` without a token'
            security:
                - {}
                - bearerAuth: []
            summary: Browse, search and resolve listings
            tags:
                - catalog
        post:
            description: |
                Creates the listing and its variants together. At least one variant is required because price and shipping weight live there.

                Starts as a draft and is not public until published.
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/CreateListingRequest'
                required: true
            responses:
                "201":
                    content:
                        application/json:
                            schema:
                                properties:
                                    data:
                                        $ref: '#/components/schemas/ListingDetail'
                                required:
                                    - data
                                type: object
                    description: Created
                "400":
                    $ref: '#/components/responses/BadRequest'
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "404":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: Category or tag or image not found
                "409":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: Slug already taken
                "422":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: Identity verification is required before selling
            security:
                - bearerAuth: []
            summary: Create a listing
            tags:
                - catalog
    /listings/{id}:
        delete:
            description: |
                Soft delete, and distinct from hiding it. Order history holds the listing and variant ids without a foreign key, so a past order has to stay resolvable after the seller removes the listing.
            parameters:
                - description: The opaque id. A write addresses the listing, never its public slug.
                  in: path
                  name: id
                  required: true
                  schema:
                    $ref: '#/components/schemas/ListingID'
            responses:
                "204":
                    description: Deleted
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "403":
                    $ref: '#/components/responses/Forbidden'
                "404":
                    $ref: '#/components/responses/NotFound'
                "409":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: An open order still covers this listing
            security:
                - bearerAuth: []
            summary: Delete a listing
            tags:
                - catalog
        get:
            description: |
                Carries the variants with their prices and stock and the seller summary.

                A listing that was never public — `draft` or `pending` — is readable only by its owner and by staff. One that is `hidden` or soft-deleted is readable by anyone, because a cart or an order that references it still has to render; `status` and `deleted_at` say that it cannot be bought.
            parameters:
                - description: |
                    The listing's opaque id or its slug. A slug is lowercase, hyphen-separated and never contains an underscore, so it cannot be mistaken for an id — but only the id is accepted today; resolving a slug needs a lookup this route does not have yet.
                  in: path
                  name: id
                  required: true
                  schema:
                    $ref: '#/components/schemas/ListingID'
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                properties:
                                    data:
                                        $ref: '#/components/schemas/ListingDetail'
                                required:
                                    - data
                                type: object
                    description: OK
                "404":
                    $ref: '#/components/responses/NotFound'
            security:
                - {}
                - bearerAuth: []
            summary: Read a listing
            tags:
                - catalog
        patch:
            description: |
                An edit to a draft applies immediately. An edit to a live listing that trips the prohibited-goods filter is held as a pending edit and applied only when a moderator approves it, so the version buyers see never changes into unreviewed content.

                The slug is fixed at creation. Renaming a listing leaves it alone: there is no redirect table, so a new slug would only turn every link already shared into a 404, and `GET /listings/{id}` takes the id as well.
            parameters:
                - description: The opaque id. A write addresses the listing, never its public slug.
                  in: path
                  name: id
                  required: true
                  schema:
                    $ref: '#/components/schemas/ListingID'
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/UpdateListingRequest'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                properties:
                                    data:
                                        $ref: '#/components/schemas/ListingDetail'
                                required:
                                    - data
                                type: object
                    description: Applied
                "202":
                    content:
                        application/json:
                            schema:
                                properties:
                                    data:
                                        $ref: '#/components/schemas/ListingDetail'
                                required:
                                    - data
                                type: object
                    description: Held as a pending edit awaiting moderation
                "400":
                    $ref: '#/components/responses/BadRequest'
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "403":
                    $ref: '#/components/responses/Forbidden'
                "404":
                    $ref: '#/components/responses/NotFound'
                "409":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: The listing changed while you were editing it
                "422":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: The result would break a rule — no variant left, more than ten tags
            security:
                - bearerAuth: []
            summary: Edit a listing
            tags:
                - catalog
    /listings/{id}/publication:
        delete:
            description: |
                Takes it out of every feed while leaving it alive — the seller is away, or the item is temporarily out of stock. Not the same as deleting it.
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                properties:
                                    data:
                                        $ref: '#/components/schemas/ListingDetail'
                                required:
                                    - data
                                type: object
                    description: Hidden
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "403":
                    $ref: '#/components/responses/Forbidden'
                "404":
                    $ref: '#/components/responses/NotFound'
                "409":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: Not live, so there is nothing to take down
            security:
                - bearerAuth: []
            summary: Hide a live listing
            tags:
                - catalog
        parameters:
            - in: path
              name: id
              required: true
              schema:
                $ref: '#/components/schemas/ListingID'
        post:
            description: |
                Publication always goes through moderation: this queues the listing and it stays invisible until a moderator clears it. There is no path that makes a listing live without a human, which is also why re-publishing something a moderator took down cannot undo the takedown.

                An automatic prohibited-goods scan still runs — it orders the queue and flags what to look at first, it does not clear anything.

                This is also where the listing gets its location: `pickup_contact_id` names which of the seller's own saved addresses a carrier collects from, and omitting it means their default pickup address. A seller with neither is refused with 422 rather than left with a live listing every checkout fails on — the address is both where a carrier goes and how buyers find the listing, so it is taken now and frozen onto the row.
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/PublishListingRequest'
                required: false
            responses:
                "202":
                    content:
                        application/json:
                            schema:
                                properties:
                                    data:
                                        $ref: '#/components/schemas/ListingDetail'
                                required:
                                    - data
                                type: object
                    description: Queued for moderation and not yet public
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "403":
                    $ref: '#/components/responses/Forbidden'
                "404":
                    $ref: '#/components/responses/NotFound'
                "409":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: Already live or already under moderation
                "422":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: A listing needs at least one variant with a price
            security:
                - bearerAuth: []
            summary: Submit a listing for publication
            tags:
                - catalog
    /listings/{id}/variants:
        post:
            description: |
                Answers with the listing. The new variant is the one in `variants` that was not there before — there is no separate id in the response, because a variant is not addressable on its own.
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    $ref: '#/components/schemas/ListingID'
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/CreateVariantRequest'
                required: true
            responses:
                "201":
                    content:
                        application/json:
                            schema:
                                properties:
                                    data:
                                        $ref: '#/components/schemas/ListingDetail'
                                required:
                                    - data
                                type: object
                    description: Created
                "400":
                    $ref: '#/components/responses/BadRequest'
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "403":
                    $ref: '#/components/responses/Forbidden'
                "404":
                    $ref: '#/components/responses/NotFound'
            security:
                - bearerAuth: []
            summary: Add a variant to a listing
            tags:
                - catalog
    /listings/{listingID}/reviews:
        get:
            description: |
                Public, with the first few replies and the vote tally on each one.

                A cursor belongs to the sort it was issued under: each ordering pages on its own key, so a cursor from `sort=helpful` is meaningless to `sort=newest` and a client that switches sorts starts the traversal again.

                `sort=helpful` orders by a counter that other people are changing while a client pages: a review that gains votes can move across a page boundary and be seen twice or not at all. Cursor paging is exact only over a key that does not move, and `newest` is that key. The drift is accepted rather than designed away — a review appearing twice in a list costs the reader nothing — but a caller that needs a stable traversal should page by `newest`.
            parameters:
                - description: Restrict to one star rating.
                  in: query
                  name: rating
                  schema:
                    maximum: 5
                    minimum: 1
                    type: integer
                - description: '`helpful` reads the stored tally; see the note above about paging it.'
                  in: query
                  name: sort
                  schema:
                    default: newest
                    enum:
                        - newest
                        - helpful
                    type: string
                - $ref: '#/components/parameters/Cursor'
                - $ref: '#/components/parameters/Limit'
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ReviewPage'
                    description: OK
                "400":
                    $ref: '#/components/responses/BadRequest'
                "404":
                    $ref: '#/components/responses/NotFound'
            summary: Reviews of a listing
            tags:
                - trust
        parameters:
            - in: path
              name: listingID
              required: true
              schema:
                $ref: '#/components/schemas/ListingID'
        post:
            description: |
                A completed order is required — no purchase, no review — and one review per listing per order, so buying twice earns a second review but one purchase does not earn two. An order that was cancelled or fully refunded earns none: there are no goods left to rate. Rating the counterparty of such a sale is what feedback is for.
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/SubmitReviewRequest'
                required: true
            responses:
                "201":
                    content:
                        application/json:
                            schema:
                                properties:
                                    data:
                                        $ref: '#/components/schemas/Review'
                                required:
                                    - data
                                type: object
                    description: Created
                "400":
                    $ref: '#/components/responses/BadRequest'
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: The order does not belong to the caller
                "404":
                    $ref: '#/components/responses/NotFound'
                "409":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: Already reviewed for this order
                "422":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: The order did not include this listing, or did not complete — a cancelled sale leaves no goods to review
            security:
                - bearerAuth: []
            summary: Review a listing you bought
            tags:
                - trust
    /listings/suggestions:
        post:
            description: |
                "Photo in, listing out": the seller snaps the item, says a sentence about it, and gets a filled-in form back. One synchronous call — the client shows the form as a skeleton and fills it from the answer.

                Nothing is stored. This route writes no listing and no draft: the answer is a *suggestion*, the seller corrects what they disagree with, and `POST /listings` is still how a listing comes into existence. That is deliberate — a route that posted for them would make a model the author of claims about somebody else's goods, its condition and its price, and there is no version of that a marketplace can stand behind. An abandoned attempt leaves nothing behind either.

                Send at least one of `attachments`, `note` or `voice_note`. Photos are ordinary confirmed uploads (`POST /listings/uploads`), so the client can be uploading them while the seller is still talking; the first three are what the model reads. The voice note travels inline rather than as an upload because it is input and not content — nothing keeps it. Every field of the answer is optional except `name`: one the model could not stand behind comes back empty, and a blank box the seller fills beats a wrong value they have to notice. `price` is only ever a number the seller said out loud, never an estimate.
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/SuggestListingRequest'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                properties:
                                    data:
                                        $ref: '#/components/schemas/ListingSuggestion'
                                required:
                                    - data
                                type: object
                    description: A form to review, not a listing
                "400":
                    $ref: '#/components/responses/BadRequest'
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "413":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: That voice note is longer than this route accepts
                "422":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: Nothing to look at, or the seller has no verified identity
                "502":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: The model did not return a usable suggestion
            security:
                - bearerAuth: []
            summary: Fill in a listing from photos and what the seller said
            tags:
                - catalog
    /listings/uploads:
        post:
            description: |
                The bytes never pass through this API. The answer is a short-lived signed URL to PUT to, and `POST /listings/uploads/{id}/confirmation` makes the row real once the object is there — so a listing can never render a photo whose bytes never arrived.

                `mime` and `size` are checked before a byte moves: a slot signed for anything is a slot for anything.
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/CreateUploadRequest'
                required: true
            responses:
                "201":
                    content:
                        application/json:
                            schema:
                                properties:
                                    data:
                                        $ref: '#/components/schemas/UploadSlot'
                                required:
                                    - data
                                type: object
                    description: Reserved
                "400":
                    $ref: '#/components/responses/BadRequest'
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "413":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: Larger than the limit for that type — 100 MB for video, 10 MB otherwise
                "422":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: That file type is not one the platform stores
            security:
                - bearerAuth: []
            summary: Reserve a slot to upload a listing photo into
            tags:
                - catalog
    /listings/uploads/{id}/confirmation:
        post:
            description: |
                Until this lands the resource resolves to nothing, so a half-finished upload cannot be attached to a listing. The recorded size is the store's, not the one declared when the slot was reserved.
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    $ref: '#/components/schemas/ResourceID'
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                properties:
                                    data:
                                        $ref: '#/components/schemas/Resource'
                                required:
                                    - data
                                type: object
                    description: Confirmed
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "404":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: No such reserved slot of the caller's
                "409":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: Nothing was uploaded to that slot
            security:
                - bearerAuth: []
            summary: Confirm the bytes are at the store
            tags:
                - catalog
    /login:
        post:
            description: The identifier is an email or a phone or a username. Which one it is does not change the answer and is not reported back.
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/LoginRequest'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                properties:
                                    data:
                                        $ref: '#/components/schemas/AuthResult'
                                required:
                                    - data
                                type: object
                    description: OK
                "400":
                    $ref: '#/components/responses/BadRequest'
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: Wrong credentials
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: Account suspended
            summary: Sign in with a password
            tags:
                - account
    /login/oauth:
        post:
            description: |
                Links to an existing account when the provider's subject id is already known, and otherwise creates one. A provider that returns no email — Apple with "hide my email" — gets a generated username, because the account still has to carry an identifier.
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/OAuthLoginRequest'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                properties:
                                    data:
                                        $ref: '#/components/schemas/AuthResult'
                                required:
                                    - data
                                type: object
                    description: Signed in to an existing account
                "201":
                    content:
                        application/json:
                            schema:
                                properties:
                                    data:
                                        $ref: '#/components/schemas/AuthResult'
                                required:
                                    - data
                                type: object
                    description: A new account was created
                "400":
                    $ref: '#/components/responses/BadRequest'
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: Provider rejected the credential
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: Account suspended
            summary: Sign in through a federated provider
            tags:
                - account
    /logout:
        post:
            description: Also unregisters the caller's push device when one is supplied so the phone stops receiving notifications for an account nobody is signed in to.
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/LogoutRequest'
                required: false
            responses:
                "204":
                    description: Session revoked
                "401":
                    $ref: '#/components/responses/Unauthorized'
            security:
                - bearerAuth: []
            summary: Revoke the current session
            tags:
                - account
    /me:
        get:
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                properties:
                                    data:
                                        $ref: '#/components/schemas/Me'
                                required:
                                    - data
                                type: object
                    description: OK
                "401":
                    $ref: '#/components/responses/Unauthorized'
            security:
                - bearerAuth: []
            summary: Read the caller's own account and profile
            tags:
                - account
        patch:
            description: |
                Changing the email clears `email_verified` and sends a fresh verification. The last remaining identifier cannot be removed.

                The phone here is an identifier — something to sign in and be reached by — and carries no verified flag. Verification belongs to a phone a carrier will actually call, which is the one on a `contact`: that is where `phone_verified` lives, and editing this one does not touch it.
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/UpdateAccountRequest'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                properties:
                                    data:
                                        $ref: '#/components/schemas/Me'
                                required:
                                    - data
                                type: object
                    description: OK
                "400":
                    $ref: '#/components/responses/BadRequest'
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "409":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: Email or phone or username already taken
                "422":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: That would leave the account with no identifier
            security:
                - bearerAuth: []
            summary: Change the caller's identifiers
            tags:
                - account
    /me/devices:
        get:
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/DeviceList'
                    description: OK
                "401":
                    $ref: '#/components/responses/Unauthorized'
            security:
                - bearerAuth: []
            summary: List the caller's push devices
