            security:
                - bearerAuth: []
            summary: Start identity verification
            tags:
                - account
    /items:
        get:
            description: '`role=seller&state=pending` is the seller''s confirmation inbox: paid items that no order covers yet.'
            parameters:
                - in: query
                  name: role
                  required: true
