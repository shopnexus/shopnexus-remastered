                - buyer_id
                - seller_id
                - author_id
                - status
                - quantity
                - total
                - currency
                - created_at
                - expires_at
            type: object
        OfferID:
            example: ofr_ptz3n8kvq1wd6
            pattern: ^ofr_[0-9a-hjkmnp-tv-z]{13}$
            type: string
        OfferPage:
            properties:
                items:
                    items:
                        $ref: '#/components/schemas/Offer'
