                Absent fields are left alone. The id, the category and the slug do not change: a settled payment and a shipped parcel hold the slug as plain text, so it is permanent, and moving a row between categories would change what those records mean.

                `provider` is checked against what this deployment actually has — one nobody registered is 422, because the first person to find out otherwise would be a buyer at a checkout. Switching a row off takes it out of `/options` without deleting it, which is what keeps every past order that names it resolvable.
            parameters:
                - description: The option slug.
                  in: path
                  name: id
                  required: true
                  schema:
                    example: ghn-express
                    maxLength: 100
