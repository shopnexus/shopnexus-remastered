            tags:
                - common
    /orders:
        get:
            parameters:
                - in: query
                  name: role
                  required: true
                  schema:
                    enum:
                        - buyer
                        - seller
                    type: string
                - in: query
                  name: state
                  schema:
                    $ref: '#/components/schemas/OrderState'
                - $ref: '#/components/parameters/Cursor'
                - $ref: '#/components/parameters/Limit'
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/OrderPage'
                    description: OK
                "400":
                    $ref: '#/components/responses/BadRequest'
                "401":
                    $ref: '#/components/responses/Unauthorized'
            security:
                - bearerAuth: []
            summary: List orders, as buyer or as seller
            tags:
                - order
        post:
            description: |
                The seller accepts the paid items of one purchase session. Creates the shipment, then the order, then links the items to it. One order per session is enforced by a unique constraint, so a retried confirmation cannot mint a second order. When the listing says the seller pays shipping, a seller-confirmation-fee payment session is opened too and returned in `shipping_fee_session`.
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/ConfirmOrderRequest'
                required: true
            responses:
                "201":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ConfirmOrderResult'
                    description: Created
                "400":
                    $ref: '#/components/responses/BadRequest'
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: Caller is not the seller of these items
                "404":
                    $ref: '#/components/responses/NotFound'
                "409":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: Session already confirmed, items unpaid, or items cancelled
                "422":
                    $ref: '#/components/responses/UnprocessableEntity'
            security:
                - bearerAuth: []
            summary: Confirm paid items into an order (seller)
            tags:
                - order
    /orders/{id}:
        get:
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    $ref: '#/components/schemas/OrderID'
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Order'
                    description: OK
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "403":
                    $ref: '#/components/responses/Forbidden'
                "404":
                    $ref: '#/components/responses/NotFound'
            security:
                - bearerAuth: []
            summary: Read an order
            tags:
                - order
    /orders/{id}/cancellation:
        post:
            description: Either party may cancel while the shipment has not left `pending`.
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    $ref: '#/components/schemas/OrderID'
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/CancellationRequest'
