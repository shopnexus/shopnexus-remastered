                                $ref: '#/components/schemas/CartItem'
                    description: OK
                "400":
                    $ref: '#/components/responses/BadRequest'
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "403":
                    $ref: '#/components/responses/Forbidden'
                "404":
                    $ref: '#/components/responses/NotFound'
            security:
                - bearerAuth: []
            summary: Change the quantity of a cart row
            tags:
                - order
    /categories:
        get:
            description: |
                Flat list with a parent reference on each row; a client assembles the tree. A category tree is small so this is unpaginated.

                `near` answers a different question: which categories does this thing belong in. It ranks by cosine distance over `category_embedding` and returns a shortlist with a `score` instead of the tree, which is what the category field of the listing form needs — a seller who has picked a few tags should not have to walk a tree to find where the item goes.
            parameters:
                - description: Rank by closeness to these seeds instead of returning the tree.
                  explode: false
                  in: query
                  name: near
                  schema:
                    items:
                        $ref: '#/components/schemas/SemanticSeed'
                    maxItems: 8
                    minItems: 1
                    type: array
                  style: form
                - description: Only honoured with `near`; the whole tree is never truncated.
                  in: query
                  name: limit
                  schema:
                    default: 10
                    maximum: 50
                    minimum: 1
                    type: integer
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/CategoryList'
                    description: OK
                "400":
                    $ref: '#/components/responses/BadRequest'
            summary: The category tree, or the categories nearest a set of seeds
            tags:
                - catalog
    /contacts:
        get:
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ContactList'
                    description: OK
                "401":
                    $ref: '#/components/responses/Unauthorized'
            security:
                - bearerAuth: []
            summary: List the caller's saved addresses
            tags:
                - account
        post:
            description: |
                The administrative codes are what a carrier is called with, so they are the routing source of truth and the names beside them are display snapshots. A coordinate is optional: geocoding may fail and the address still has to be saveable.
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/CreateContactRequest'
                required: true
            responses:
                "201":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Contact'
                    description: Created
                "400":
                    $ref: '#/components/responses/BadRequest'
                "401":
                    $ref: '#/components/responses/Unauthorized'
            security:
                - bearerAuth: []
            summary: Save an address
            tags:
                - account
    /contacts/{id}:
        delete:
            responses:
                "204":
                    description: Removed
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "403":
                    $ref: '#/components/responses/Forbidden'
                "404":
                    $ref: '#/components/responses/NotFound'
            security:
                - bearerAuth: []
            summary: Remove a saved address
            tags:
                - account
        parameters:
            - in: path
              name: id
              required: true
              schema:
                $ref: '#/components/schemas/ContactID'
        patch:
            description: |
                Setting a default clears the previous one. Delivery and pickup defaults are independent flags — the same address is usually both.

                An order already placed keeps its own snapshot of the address, so editing this row never rewrites where a shipment was going.
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/UpdateContactRequest'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Contact'
                    description: OK
                "400":
                    $ref: '#/components/responses/BadRequest'
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "403":
                    $ref: '#/components/responses/Forbidden'
                "404":
                    $ref: '#/components/responses/NotFound'
            security:
                - bearerAuth: []
            summary: Update a saved address
            tags:
                - account
    /contacts/{id}/phone/verification-requests:
        post:
            description: |
                The phone a carrier will actually call, which is why this one is verified and the account's sign-in phone is not. A courier who cannot reach the number is the most common way a delivery fails, so a seller shipping to an unverified number is worth flagging in the UI.

                Re-sending replaces the outstanding code rather than issuing a second valid one.
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    $ref: '#/components/schemas/ContactID'
            responses:
                "202":
                    description: Code sent
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "403":
                    $ref: '#/components/responses/Forbidden'
                "404":
                    $ref: '#/components/responses/NotFound'
                "409":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: Already verified
                "429":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: Too many requests for this number
            security:
                - bearerAuth: []
            summary: Send a verification code to a saved address's phone
            tags:
                - account
    /contacts/{id}/phone/verifications:
        post:
            description: |
                Editing the number clears the flag again — a verified flag on a number nobody checked is worse than no flag.
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    $ref: '#/components/schemas/ContactID'
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/VerifyContactPhoneRequest'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Contact'
                    description: Verified
                "400":
                    $ref: '#/components/responses/BadRequest'
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: Code is wrong, expired, or already used
                "403":
                    $ref: '#/components/responses/Forbidden'
                "404":
                    $ref: '#/components/responses/NotFound'
            security:
                - bearerAuth: []
            summary: Confirm a saved address's phone with the code
            tags:
                - account
    /conversations:
        get:
            description: |
                Threads by latest activity. A participant sits on either side of the stored pair, so this is answered as two ordered index scans merged together rather than one scan that sorts.
            parameters:
                - $ref: '#/components/parameters/Cursor'
                - $ref: '#/components/parameters/Limit'
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ConversationPage'
                    description: OK
                "401":
                    $ref: '#/components/responses/Unauthorized'
            security:
                - bearerAuth: []
            summary: The caller's inbox
            tags:
                - chat
        post:
            description: |
                Idempotent by design: there is exactly one thread per pair, so this returns the existing one when it exists and creates it otherwise. A client does not have to track whether it has messaged someone before.
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/StartConversationRequest'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Conversation'
                    description: The thread already existed
                "201":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Conversation'
                    description: Created
                "400":
                    $ref: '#/components/responses/BadRequest'
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "404":
                    $ref: '#/components/responses/NotFound'
                "422":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: An account cannot open a thread with itself
            security:
                - bearerAuth: []
            summary: Open the thread with another account
            tags:
                - chat
    /conversations/{id}:
        get:
            description: Carries the counterparty rather than both sides — the caller already knows who they are.
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    $ref: '#/components/schemas/ConversationID'
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Conversation'
                    description: OK
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "403":
                    $ref: '#/components/responses/Forbidden'
                "404":
                    $ref: '#/components/responses/NotFound'
            security:
                - bearerAuth: []
            summary: Read a thread
            tags:
                - chat
    /conversations/{id}/messages:
        get:
            description: |
                Newest first, cursor only. Offset paging would defeat the chunk exclusion the time partitioning exists for.

                A redacted message is still returned, with its body emptied and `deleted_at` set: a gap in a thread that a dispute may hinge on is worse than a visible removal.
            parameters:
                - $ref: '#/components/parameters/Cursor'
                - $ref: '#/components/parameters/Limit'
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/MessagePage'
                    description: OK
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "403":
                    $ref: '#/components/responses/Forbidden'
                "404":
                    $ref: '#/components/responses/NotFound'
            security:
                - bearerAuth: []
            summary: Read a thread's messages
            tags:
                - chat
        parameters:
            - in: path
              name: id
              required: true
              schema:
                $ref: '#/components/schemas/ConversationID'
        post:
            description: |
                Text, attachments or both. `refs` carries pointers to a listing or a variant or an order, which is how a product is referred to inside a thread that is not itself listing-scoped.
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/SendMessageRequest'
                required: true
            responses:
                "201":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Message'
                    description: Sent
                "400":
                    $ref: '#/components/responses/BadRequest'
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "403":
                    $ref: '#/components/responses/Forbidden'
                "404":
                    $ref: '#/components/responses/NotFound'
                "422":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: A message needs a body or an attachment
            security:
                - bearerAuth: []
            summary: Send a message
            tags:
                - chat
    /conversations/{id}/read:
        post:
            description: |
                Moves the caller's read mark on the thread — one UPDATE of one row, whatever it covers. Omit `before` to mark the whole thread read. A mark never moves backwards: passing an earlier instant than the current one is a no-op, because un-reading is not a thing a client should be able to do to its own badge.
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    $ref: '#/components/schemas/ConversationID'
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/MarkConversationReadRequest'
                required: false
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ChatUnreadCount'
                    description: OK
                "400":
                    $ref: '#/components/responses/BadRequest'
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "403":
                    $ref: '#/components/responses/Forbidden'
                "404":
                    $ref: '#/components/responses/NotFound'
            security:
                - bearerAuth: []
            summary: Mark a thread read up to a point in time
            tags:
                - chat
    /conversations/unread-count:
        get:
            description: |
                One bounded range scan per thread the caller has, each starting at that thread's read mark, so an old unread message costs nothing extra and chunk exclusion applies throughout. Separate from the inbox because the badge is read far more often than the list.
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ChatUnreadCount'
                    description: OK
                "401":
                    $ref: '#/components/responses/Unauthorized'
            security:
                - bearerAuth: []
            summary: The unread badge across every thread
            tags:
                - chat
    /devices:
        put:
            description: |
                An upsert on the push token, not a create. The token identifies an install and the platform reissues the same one when a different user signs in on that phone, so the row moves to the new account. Without that, the previous owner keeps receiving that phone's notifications.
            requestBody:
