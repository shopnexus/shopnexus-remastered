                        Mark everything sent at or before this instant read. Omit to mark the whole thread read.
                    format: date-time
                    type: string
            type: object
        MarkNotificationsReadRequest:
            properties:
                before:
                    description: |
                        Mark everything created at or before this instant read. Omit to mark the whole feed read.
                    format: date-time
                    type: string
            type: object
        Me:
            description: The caller's own view. Everything here is private to them.
            properties:
                created_at:
