            tags:
                - admin
    /bank-accounts:
        get:
            description: Account numbers come back masked. The full number is only ever used to move money, never to display it back.
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/BankAccountList'
                    description: OK
                "401":
                    $ref: '#/components/responses/Unauthorized'
            security:
                - bearerAuth: []
            summary: List the caller's payout destinations
            tags:
                - finance
        post:
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/CreateBankAccountRequest'
                required: true
            responses:
                "201":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/BankAccount'
                    description: Created
                "400":
                    $ref: '#/components/responses/BadRequest'
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "409":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: |
                        The caller already has this bank account registered. The same account number under a *different* platform account is not refused here — it is a mule signal, and answering it would confirm to a stranger that the number is already on the platform.
            security:
                - bearerAuth: []
            summary: Register a payout destination
            tags:
                - finance
    /bank-accounts/{id}:
        delete:
            description: Soft delete. A completed withdrawal names this row as the place real money went, so financial history cannot lose its payee.
            responses:
                "204":
                    description: Removed
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "403":
                    $ref: '#/components/responses/Forbidden'
                "404":
                    $ref: '#/components/responses/NotFound'
                "409":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: A withdrawal against it is still unresolved
            security:
                - bearerAuth: []
            summary: Remove a payout destination
            tags:
                - finance
        parameters:
            - in: path
              name: id
              required: true
              schema:
                $ref: '#/components/schemas/BankAccountID'
        patch:
            description: At most one default per account, so this clears the previous one. Bank details themselves are not editable — register another destination and remove this one, so a completed withdrawal never names a row whose details have since changed.
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/UpdateBankAccountRequest'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/BankAccount'
                    description: OK
                "400":
                    $ref: '#/components/responses/BadRequest'
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "403":
                    $ref: '#/components/responses/Forbidden'
                "404":
                    $ref: '#/components/responses/NotFound'
            security:
                - bearerAuth: []
            summary: Make this the default payout destination
            tags:
                - finance
    /cart-items:
