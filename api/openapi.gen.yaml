    /me/uploads:
        post:
            description: |
                The bytes never pass through this API. The answer is a short-lived signed URL to PUT to, and `POST /me/uploads/{id}/confirmation` makes the row real once the object is there. One store serves both `kind`s — an avatar is a public picture and an identity scan is not — because `kind` only narrows the key prefix; what keeps a scan from ever being world-readable is that it is only ever read back through a freshly presigned link, never a public URL.

                `mime` and `size` are checked before a byte moves: a slot signed for anything is a slot for anything.
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/AccountCreateUploadRequest'
                required: true
            responses:
                "201":
                    content:
                        application/json:
                            schema:
                                properties:
                                    data:
                                        $ref: '#/components/schemas/UploadSlot'
                                required:
                                    - data
                                type: object
                    description: Reserved
                "400":
                    $ref: '#/components/responses/BadRequest'
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "413":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: Larger than the limit for that type — 100 MB for video, 10 MB otherwise
                "422":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: That file type is not one the platform stores
            security:
                - bearerAuth: []
            summary: Reserve a slot to upload an avatar or an identity scan into
            tags:
                - account
    /me/uploads/{id}/confirmation:
        post:
            description: |
                Until this lands the resource resolves to nothing, so a half-finished upload cannot be set as an avatar or submitted as an identity scan. The recorded size is the store's, not the one declared when the slot was reserved.
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    $ref: '#/components/schemas/ResourceID'
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                properties:
                                    data:
                                        $ref: '#/components/schemas/Resource'
                                required:
                                    - data
                                type: object
                    description: Confirmed
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "404":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: No such reserved slot of the caller's
                "409":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: Nothing was uploaded to that slot
            security:
                - bearerAuth: []
            summary: Confirm the bytes are at the store
            tags:
                - account
    /messages/{id}:
        delete:
            description: |
                The sender unsending, or a moderator acting on an upheld report. The row survives with its body **and its attachments** cleared: a thread is evidence in a refund dispute, so removal is recorded rather than erased, but a redaction that leaves the picture up has not removed anything.
            responses:
                "204":
                    description: Redacted
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: Only the sender or a moderator may redact a message
                "404":
                    $ref: '#/components/responses/NotFound'
            security:
                - bearerAuth: []
            summary: Redact a message
            tags:
                - chat
        parameters:
            - in: path
              name: id
              required: true
              schema:
                $ref: '#/components/schemas/MessageID'
            - description: |
                The message's own `created_at`, passed straight back. Required, and not redundant: `message` is partitioned on it and its primary key is `(id, created_at)`, so without it the row has to be hunted through every chunk of the table. A client always has the message before editing or redacting it, so it always has this. Named after the field it comes from — anything else would have the client copying `created_at` into a differently-named parameter.
              in: query
              name: created_at
              required: true
              schema:
                format: date-time
                type: string
        patch:
            description: |
                Sender only, and it records that the message was edited — the counterparty has to be able to see that what they read has changed. A system message cannot be edited because it has no author.
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/UpdateMessageRequest'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                properties:
                                    data:
                                        $ref: '#/components/schemas/Message'
                                required:
                                    - data
                                type: object
                    description: OK
                "400":
                    $ref: '#/components/responses/BadRequest'
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: Only the sender may edit a message
                "404":
                    $ref: '#/components/responses/NotFound'
                "409":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: A system message cannot be edited
            security:
                - bearerAuth: []
            summary: Edit a message
            tags:
                - chat
    /notification-preferences:
        get:
            description: |
                Returns every category and channel pair with the value in force. Stored rows are sparse — one exists only where the account differs from the default — and the defaults live in the domain, so resolving them here keeps the client from having to know them.
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/NotificationPreferenceList'
                    description: OK
                "401":
                    $ref: '#/components/responses/Unauthorized'
            security:
                - bearerAuth: []
            summary: Read the effective notification settings
            tags:
                - account
        put:
            description: |
                Setting a pair back to its default deletes the row rather than storing the default again.
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/UpdateNotificationPreferencesRequest'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/NotificationPreferenceList'
                    description: OK
                "400":
                    $ref: '#/components/responses/BadRequest'
                "401":
                    $ref: '#/components/responses/Unauthorized'
            security:
                - bearerAuth: []
            summary: Change notification settings
            tags:
                - account
    /notifications:
        get:
            description: |
                Newest first, cursor only. The table is chunked by time, so a cursor is what lets the reader stop at a chunk boundary instead of touching every chunk.
            parameters:
                - in: query
                  name: category
                  schema:
                    $ref: '#/components/schemas/NotificationCategory'
                - description: Restrict to unread ones.
                  in: query
                  name: unread
                  schema:
                    type: boolean
                - $ref: '#/components/parameters/Cursor'
                - $ref: '#/components/parameters/Limit'
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/NotificationPage'
                    description: OK
                "400":
                    $ref: '#/components/responses/BadRequest'
                "401":
                    $ref: '#/components/responses/Unauthorized'
            security:
                - bearerAuth: []
            summary: The caller's notification feed
            tags:
                - account
    /notifications/read:
        post:
            description: |
                Takes a time bound rather than a list of ids. Marking individual rows by id would have to search every chunk of a time-partitioned table; a bound reads one range. Omit `before` to mark everything read.
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/MarkNotificationsReadRequest'
                required: false
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                properties:
                                    data:
                                        $ref: '#/components/schemas/UnreadCount'
                                required:
                                    - data
                                type: object
                    description: OK
                "400":
                    $ref: '#/components/responses/BadRequest'
                "401":
                    $ref: '#/components/responses/Unauthorized'
            security:
                - bearerAuth: []
            summary: Mark notifications read up to a point in time
            tags:
                - account
    /notifications/unread-count:
        get:
            description: A separate endpoint because it is read far more often than the feed and answers from one partial index.
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                properties:
                                    data:
                                        $ref: '#/components/schemas/UnreadCount'
                                required:
                                    - data
                                type: object
                    description: OK
                "401":
                    $ref: '#/components/responses/Unauthorized'
            security:
                - bearerAuth: []
            summary: The unread badge
            tags:
                - account
    /offers:
        get:
            parameters:
                - in: query
                  name: role
                  required: true
                  schema:
                    enum:
                        - buyer
                        - seller
                    type: string
                - in: query
                  name: status
                  schema:
                    $ref: '#/components/schemas/OfferStatus'
                - $ref: '#/components/parameters/Cursor'
                - $ref: '#/components/parameters/Limit'
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/OfferPage'
                    description: OK
                "400":
                    $ref: '#/components/responses/BadRequest'
                "401":
                    $ref: '#/components/responses/Unauthorized'
            security:
                - bearerAuth: []
            summary: List negotiations, as buyer or as seller
            tags:
                - order
        post:
            description: |
                The buyer opens it, from the listing page: a seller has nobody to propose to on their own listing, so they answer rather than start. One active negotiation per (buyer, variant); the terms are then revised in place rather than by stacking rows, and each revision posts a card into the pair's chat thread.
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/CreateOfferRequest'
                required: true
            responses:
                "201":
                    content:
                        application/json:
                            schema:
                                properties:
                                    data:
                                        $ref: '#/components/schemas/Offer'
                                required:
                                    - data
                                type: object
                    description: Created
                "400":
                    $ref: '#/components/responses/BadRequest'
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: A seller cannot open a negotiation on their own listing
                "404":
                    $ref: '#/components/responses/NotFound'
                "409":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: An active negotiation already exists for this (buyer, SKU)
            security:
                - bearerAuth: []
            summary: Open a price negotiation on a variant
            tags:
                - order
    /offers/{id}:
        delete:
            responses:
                "204":
                    description: Cancelled
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "403":
                    $ref: '#/components/responses/Forbidden'
                "404":
                    $ref: '#/components/responses/NotFound'
                "409":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: Negotiation is no longer active
            security:
                - bearerAuth: []
            summary: Cancel a negotiation
            tags:
                - order
        get:
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                properties:
                                    data:
                                        $ref: '#/components/schemas/Offer'
                                required:
                                    - data
                                type: object
                    description: OK
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "403":
                    $ref: '#/components/responses/Forbidden'
                "404":
                    $ref: '#/components/responses/NotFound'
            security:
                - bearerAuth: []
            summary: Read a negotiation
            tags:
                - order
        parameters:
            - in: path
              name: id
              required: true
              schema:
                $ref: '#/components/schemas/OfferID'
        patch:
            description: |
                Revises the current terms in place, moves authorship to the caller and posts the new card into the thread. Only the party that does not own the standing proposal may counter, so the two sides alternate.
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/UpdateOfferRequest'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                properties:
                                    data:
                                        $ref: '#/components/schemas/Offer'
                                required:
                                    - data
                                type: object
                    description: OK
                "400":
                    $ref: '#/components/responses/BadRequest'
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: Caller already owns the standing proposal, or is not a party
                "404":
                    $ref: '#/components/responses/NotFound'
                "409":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: Negotiation is no longer active
            security:
                - bearerAuth: []
            summary: Counter-offer
            tags:
                - order
    /offers/{id}/acceptance:
        post:
            description: |
                Whoever does *not* own the standing proposal — the two sides alternate, so the price in front of you is always the other party's, and either of them may be the one who says yes.

                Agreeing is not the sale, and nothing is charged. It freezes the price and starts a short window for the buyer to press "create order now" (`POST /offers/{id}/checkout`), where they choose delivery and pay — exactly as they would from a fixed-price listing. That separation is what makes a seller accepting a buyer's price safe: no order exists and no money moves until the buyer checks out.

                The window is short on purpose. An agreed price is a frozen price, and a buyer who lets it lapse negotiates again rather than holding yesterday's number open.
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    $ref: '#/components/schemas/OfferID'
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                properties:
                                    data:
                                        $ref: '#/components/schemas/Offer'
                                required:
                                    - data
                                type: object
                    description: Agreed; the price is frozen for a short window
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: These are your own terms — the other party answers them
                "404":
                    $ref: '#/components/responses/NotFound'
                "409":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: Negotiation is expired, cancelled, already agreed, or being paid for
            security:
                - bearerAuth: []
            summary: Agree to the terms on the table
            tags:
                - order
    /offers/{id}/checkout:
        post:
            description: |
                The buyer turning an agreed price into an order: they pick a carrier and an address here and pay, in exactly the checkout a fixed-price listing uses. Only the buyer, because only the buyer pays — and only once, so a double-clicked button opens one payment session.

                The negotiated total covers the goods. Delivery is quoted from the carrier on top of it and is also the buyer's, the same as on a fixed-price sale; `POST /shipping-quotes` is how the options and their fees are listed before choosing.

                The order follows when the session completes, with `offer_id` set to this negotiation and no draft.
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    $ref: '#/components/schemas/OfferID'
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/CheckoutOfferRequest'
                required: true
            responses:
                "201":
                    content:
                        application/json:
                            schema:
                                properties:
                                    data:
                                        $ref: '#/components/schemas/CheckoutResult'
                                required:
                                    - data
                                type: object
                    description: Item created and a payment session opened
                "400":
                    $ref: '#/components/responses/BadRequest'
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: Only the buyer checks out agreed terms
                "404":
                    $ref: '#/components/responses/NotFound'
                "409":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: Terms are not agreed, have lapsed, or are already checked out
                "422":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: A carrier nobody enabled, or a variant that is no longer sellable
                "502":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: No carrier could price the delivery
            security:
                - bearerAuth: []
            summary: Create the order now, on agreed terms (buyer)
            tags:
                - order
    /options:
        get:
            description: |
                Where a valid `payment_option` and `transport_option` come from. Operator configuration rather than the caller's data, so it is unpaginated and identical for everybody — but it is not constant: a row an operator disables leaves this list, and a client that hardcoded a slug gets 422 from the route that consumes it instead.

                Only the id, the name and the description are published. Which implementation serves a row, and which rows are switched off, is the operator's view — see `/admin/options`.

                A category outside the user-visible set answers 404, exactly as one nobody defined does: telling the two apart would let anyone enumerate the platform's operator surface.
            parameters:
                - $ref: '#/components/parameters/OptionCategory'
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                properties:
                                    data:
                                        $ref: '#/components/schemas/OptionList'
                                required:
                                    - data
                                type: object
                    description: OK
                "400":
                    $ref: '#/components/responses/BadRequest'
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "404":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: No such category, or not one this caller may see
            security:
                - bearerAuth: []
            summary: List what may be chosen in one category
            tags:
                - common
    /orders:
        get:
            parameters:
                - in: query
                  name: role
                  required: true
                  schema:
                    enum:
                        - buyer
                        - seller
                    type: string
                - in: query
                  name: state
                  schema:
                    $ref: '#/components/schemas/OrderState'
                - $ref: '#/components/parameters/Cursor'
                - $ref: '#/components/parameters/Limit'
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/OrderPage'
                    description: OK
                "400":
                    $ref: '#/components/responses/BadRequest'
                "401":
                    $ref: '#/components/responses/Unauthorized'
            security:
                - bearerAuth: []
            summary: List orders, as buyer or as seller
            tags:
                - order
    /orders/{id}:
        get:
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    $ref: '#/components/schemas/OrderID'
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                properties:
                                    data:
                                        $ref: '#/components/schemas/Order'
                                required:
                                    - data
                                type: object
                    description: OK
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "403":
                    $ref: '#/components/responses/Forbidden'
                "404":
                    $ref: '#/components/responses/NotFound'
            security:
                - bearerAuth: []
            summary: Read an order
            tags:
                - order
    /orders/{id}/cancellation:
        post:
            description: |
                Either party may cancel while the shipment has not left `pending`. The escrow goes back to the buyer and the sale is reversed in the catalog. No body: there is nowhere to record a reason, and a field a client fills in that reaches nobody is worse than none.
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    $ref: '#/components/schemas/OrderID'
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                properties:
                                    data:
                                        $ref: '#/components/schemas/Order'
                                required:
                                    - data
                                type: object
                    description: Cancelled
                "400":
                    $ref: '#/components/responses/BadRequest'
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "403":
                    $ref: '#/components/responses/Forbidden'
                "404":
                    $ref: '#/components/responses/NotFound'
                "409":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: Shipment already moved, or the order is closed
            security:
                - bearerAuth: []
            summary: Cancel an order
            tags:
                - order
    /orders/{id}/confirmation:
        parameters:
            - in: path
              name: id
              required: true
              schema:
                $ref: '#/components/schemas/OrderID'
        post:
            description: |
                The seller agreeing to the sale, and the only thing that hands the parcel to the carrier. Everything before it — the order row, the escrow, the frozen carrier and fee — is the buyer's side of the transaction and obliges the seller to post nothing. Not re-runnable: a second confirmation would book a second parcel for one sale.
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                properties:
                                    data:
                                        $ref: '#/components/schemas/Order'
                                required:
                                    - data
                                type: object
                    description: Accepted; the shipment is booked with the carrier
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: Caller is not the seller of this order
                "404":
                    $ref: '#/components/responses/NotFound'
                "409":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: Order is already accepted, or has reached an outcome
            security:
                - bearerAuth: []
            summary: Accept a paid order (seller)
            tags:
                - order
    /orders/{id}/decline:
        parameters:
            - in: path
              name: id
              required: true
              schema:
                $ref: '#/components/schemas/OrderID'
        post:
            description: |
                Out of stock, mispriced, whatever they say. The escrow goes back in full, delivery included, because the parcel never left. Same destination as letting the confirmation window pass, reached without making the buyer wait out a clock for an answer the seller already has — which is why the reason is required and kept.
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/DeclineOrderRequest'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                properties:
                                    data:
                                        $ref: '#/components/schemas/Order'
                                required:
                                    - data
                                type: object
                    description: Refused; the order is cancelled and the buyer refunded
                "400":
                    $ref: '#/components/responses/BadRequest'
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: Caller is not the seller of this order
                "404":
                    $ref: '#/components/responses/NotFound'
                "409":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: Order is already accepted, or has reached an outcome
            security:
                - bearerAuth: []
            summary: Refuse a paid order (seller)
            tags:
                - order
    /orders/{id}/receipt:
        post:
            description: |
                The buyer confirms delivery and attaches unboxing evidence — at least one photo or video is mandatory, because this evidence is what a later refund is judged on. Sets `received_at` and starts the 72-hour payout countdown in `payout_deadline_at`.

                Confirming twice is a conflict rather than a no-op: a retried upload must not be able to restart the clock and move the payout date.
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    $ref: '#/components/schemas/OrderID'
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/ConfirmReceiptRequest'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                properties:
                                    data:
                                        $ref: '#/components/schemas/Order'
                                required:
                                    - data
                                type: object
                    description: Receipt recorded
                "400":
                    $ref: '#/components/responses/BadRequest'
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: Caller is not the buyer of this order
                "404":
                    $ref: '#/components/responses/NotFound'
                "409":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: Already confirmed, or the order is cancelled
            security:
                - bearerAuth: []
            summary: Confirm receipt of the goods (buyer)
            tags:
                - order
    /orders/{id}/refunds:
        post:
            description: |
                Covers the whole order; there is no way to refund part of one, and one live refund per order. Evidence is optional here and can be added until the case closes.

                Nothing ships yet — the buyer keeps the goods until the refund is granted. The seller has until `deadline_at` to accept or reject, and letting that pass hands the next move to the buyer rather than settling anything.
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    $ref: '#/components/schemas/OrderID'
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/CreateRefundRequest'
                required: true
            responses:
                "201":
                    content:
                        application/json:
                            schema:
                                properties:
                                    data:
                                        $ref: '#/components/schemas/Refund'
                                required:
                                    - data
                                type: object
                    description: Created
                "400":
                    $ref: '#/components/responses/BadRequest'
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: Caller is not the buyer of this order
                "404":
                    $ref: '#/components/responses/NotFound'
                "409":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: A refund is already open on this order, or its escrow has already been paid out or returned
            security:
                - bearerAuth: []
            summary: Open a refund request (buyer)
            tags:
                - order
    /orders/{id}/transport:
        get:
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    $ref: '#/components/schemas/OrderID'
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                properties:
                                    data:
                                        $ref: '#/components/schemas/Transport'
                                required:
                                    - data
                                type: object
                    description: OK
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "403":
                    $ref: '#/components/responses/Forbidden'
                "404":
                    $ref: '#/components/responses/NotFound'
            security:
                - bearerAuth: []
            summary: Read the shipment
            tags:
                - order
    /orders/{id}/transport/checkpoints:
        post:
            description: |
                Staff only. The carrier reports this leg on its own webhook, and this route is for a courier that got it wrong or never reported at all — neither party to the order writes it. Whether the parcel has left is what decides whether the order can still be cancelled and the escrow taken back, so a seller saying so was one request against days of the buyer's: a seller who sees the status wrong raises an `order-issue` ticket instead.

                Forward-only. Carrier reports arrive out of order, and whether the parcel has left is what decides whether the order can still be cancelled and the escrow taken back, so it is not a fact a later report may undo: a checkpoint at or behind where the shipment already is, or one on a leg that has ended, is 409.
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    $ref: '#/components/schemas/OrderID'
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/TransportCheckpointRequest'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                properties:
                                    data:
                                        $ref: '#/components/schemas/Transport'
                                required:
                                    - data
                                type: object
                    description: Recorded
                "400":
                    $ref: '#/components/responses/BadRequest'
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: Caller is not staff — a shipment's position comes from the carrier, so neither the seller nor the buyer may write it
                "404":
                    $ref: '#/components/responses/NotFound'
                "409":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: The shipment is already at or past that point
                "422":
                    $ref: '#/components/responses/UnprocessableEntity'
            security:
                - bearerAuth: []
            summary: Correct a checkpoint on the outbound leg (moderator)
            tags:
                - order
    /orders/{orderID}/feedback:
        get:
            description: |
                Returns the caller's own submission always. The counterparty's arrives as `theirs` only once it is published; while it is still blind `theirs` is null and `theirs_submitted` says whether there is anything waiting, which is as much as can be told without breaking blindness.
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                properties:
                                    data:
                                        $ref: '#/components/schemas/OrderFeedback'
                                required:
                                    - data
                                type: object
                    description: OK
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "403":
                    $ref: '#/components/responses/Forbidden'
                "404":
                    $ref: '#/components/responses/NotFound'
            security:
                - bearerAuth: []
            summary: Read the feedback on one order
            tags:
                - trust
        parameters:
            - in: path
              name: orderID
              required: true
              schema:
                $ref: '#/components/schemas/OrderID'
        post:
            description: |
                One submission per direction per order, so this cannot be revised — a rating that could be edited after seeing the other side is not blind.

                The direction is derived from which side of the order the caller is on rather than sent, so nobody can file feedback as the other party.
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/SubmitFeedbackRequest'
                required: true
            responses:
                "201":
                    content:
                        application/json:
                            schema:
                                properties:
                                    data:
                                        $ref: '#/components/schemas/Feedback'
                                required:
                                    - data
                                type: object
                    description: Submitted
                "400":
                    $ref: '#/components/responses/BadRequest'
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: Caller is not a party to this order
                "404":
                    $ref: '#/components/responses/NotFound'
                "409":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: Already submitted for this direction
                "422":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: The order is not finished yet
            security:
                - bearerAuth: []
            summary: Rate the counterparty of a completed order
            tags:
                - trust
    /orders/summary:
        get:
            description: |
                What a seller's dashboard leads with. The window filters `created_at`, so the counts, the totals and the daily series all describe **one** set of orders — the ones placed in it, as they stand now. Mixing "placed in the window" with "completed in the window" would produce three numbers the reader cannot reconcile.

                `totals` counts the goods of completed orders only, and excludes a cancelled line and the delivery fee: the fee is the courier's money and never reaches the seller. It is a list per currency because a shop may price in more than one, and adding those together is a figure that means nothing — which is also why the daily series carries counts and no money.

                Absent bounds mean the last 30 days ending now; `to` is exclusive and the window may span at most a year, so the series is at most 366 buckets.
            parameters:
                - in: query
                  name: role
                  required: true
                  schema:
                    enum:
                        - buyer
                        - seller
                    type: string
                - in: query
                  name: from
                  schema:
                    format: date-time
                    type: string
                - description: Exclusive.
                  in: query
                  name: to
                  schema:
                    format: date-time
                    type: string
                - description: |
                    IANA zone the daily buckets are cut on. Defaults to UTC, which makes a Vietnamese seller's evening sales land on the next day.
                  in: query
                  name: tz
                  schema:
                    example: Asia/Ho_Chi_Minh
                    maxLength: 64
                    type: string
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                properties:
                                    data:
                                        $ref: '#/components/schemas/OrderSummary'
                                required:
                                    - data
                                type: object
                    description: OK
                "400":
                    $ref: '#/components/responses/BadRequest'
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "422":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: The window ends before it starts, spans more than a year, or names an unknown time zone
            security:
                - bearerAuth: []
            summary: The caller's own sales or purchases over a window
            tags:
                - order
    /orders/uploads:
        post:
            description: |
                The bytes never pass through this API. The answer is a short-lived signed URL to PUT to, and `POST /orders/uploads/{id}/confirmation` makes the row real once the object is there — so a receipt confirmation or a refund can never be judged on a photo whose bytes never arrived.

                `mime` and `size` are checked before a byte moves: a slot signed for anything is a slot for anything.
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/CreateUploadRequest'
                required: true
            responses:
                "201":
                    content:
                        application/json:
                            schema:
                                properties:
                                    data:
                                        $ref: '#/components/schemas/UploadSlot'
                                required:
                                    - data
                                type: object
                    description: Reserved
                "400":
                    $ref: '#/components/responses/BadRequest'
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "413":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: Larger than the limit for that type — 100 MB for video, 10 MB otherwise
                "422":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: That file type is not one the platform stores
            security:
                - bearerAuth: []
            summary: Reserve a slot to upload evidence into
            tags:
                - order
    /orders/uploads/{id}/confirmation:
        post:
            description: |
                Until this lands the resource resolves to nothing, so a half-finished upload cannot be named as evidence on a receipt confirmation or a refund. The recorded size is the store's, not the one declared when the slot was reserved.
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    $ref: '#/components/schemas/ResourceID'
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                properties:
                                    data:
                                        $ref: '#/components/schemas/Resource'
                                required:
                                    - data
                                type: object
                    description: Confirmed
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "404":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: No such reserved slot of the caller's
                "409":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: Nothing was uploaded to that slot
            security:
                - bearerAuth: []
            summary: Confirm the bytes are at the store
            tags:
                - order
    /password:
        put:
            description: Requires the current password even though the caller is already authenticated — a stolen access token must not be enough to take the account.
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/ChangePasswordRequest'
                required: true
            responses:
                "204":
                    description: Changed and every other session revoked
                "400":
                    $ref: '#/components/responses/BadRequest'
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: Current password is wrong
                "422":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: This account signs in through a provider and has no password
            security:
                - bearerAuth: []
            summary: Change the caller's password
            tags:
                - account
    /password/reset-requests:
        post:
            description: |
                Always answers 202, whether or not the identifier exists. Reporting that an address is unknown turns this endpoint into a way to enumerate accounts.
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/PasswordResetRequest'
                required: true
            responses:
                "202":
                    description: If the identifier exists a reset message was sent
                "400":
                    $ref: '#/components/responses/BadRequest'
                "429":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: Too many requests for this identifier
            summary: Ask for a password reset
            tags:
                - account
    /password/resets:
        post:
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/PasswordResetConfirmRequest'
                required: true
            responses:
                "204":
                    description: Password set and every session revoked
                "400":
                    $ref: '#/components/responses/BadRequest'
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: Token is unknown or already used or expired
            summary: Set a new password with a reset token
            tags:
                - account
    /payment-sessions:
        get:
            description: '`role=payer` is money owed or sent, `role=payee` is money received — seller payouts and refunds land on that side.'
            parameters:
                - description: Omit for both sides.
                  in: query
                  name: role
                  schema:
                    enum:
                        - payer
                        - payee
                    type: string
                - in: query
                  name: kind
                  schema:
                    $ref: '#/components/schemas/PaymentSessionKind'
                - in: query
                  name: status
                  schema:
                    $ref: '#/components/schemas/PaymentSessionStatus'
                - $ref: '#/components/parameters/Page'
                - $ref: '#/components/parameters/Limit'
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/PaymentSessionPage'
                    description: OK
                "400":
