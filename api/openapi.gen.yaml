                id:
                    $ref: '#/components/schemas/DraftOrderID'
                snapshot:
                    $ref: '#/components/schemas/DraftSPUSnapshot'
                spu_id:
                    $ref: '#/components/schemas/ProductSPUID'
                valid_until:
                    format: date-time
                    type: string
            required:
                - id
