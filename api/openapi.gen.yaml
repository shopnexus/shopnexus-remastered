components:
    parameters:
        Cursor:
            description: Opaque cursor from the previous page's `next_cursor`. Omit for the first page.
            in: query
            name: cursor
            required: false
            schema:
                type: string
        Limit:
            in: query
            name: limit
            required: false
            schema:
                default: 20
                maximum: 100
                minimum: 1
                type: integer
        OptionCategory:
            description: The kind of pluggable choice.
            in: query
            name: category
            required: true
            schema:
                $ref: '#/components/schemas/OptionCategoryName'
        Page:
            description: 1-based page number.
            in: query
            name: page
            required: false
            schema:
                default: 1
                minimum: 1
                type: integer
    responses:
        BadRequest:
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/Error'
            description: Validation or malformed request
        Conflict:
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/Error'
            description: Conflicts with the current state (already exists, already done, wrong state)
        Forbidden:
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/Error'
            description: Authenticated but not allowed to act on this resource
        NotFound:
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/Error'
            description: Resource not found
        Unauthorized:
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/Error'
            description: Missing or invalid credentials
        UnprocessableEntity:
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/Error'
            description: Well-formed but rejected by a business rule
    schemas:
        AccountCreateUploadRequest:
            description: |
                Like `CreateUploadRequest`, plus `kind`: the same store serves an avatar and an identity scan, so the service has to be told which it is presigning.
            properties:
                filename:
                    description: |
                        Kept only for its extension. The stored key is generated — a path a client chose is a directory traversal waiting for a backend that resolves one.
                    example: front.jpg
                    maxLength: 255
                    type: string
                kind:
                    enum:
                        - avatar
                        - identity
                    example: avatar
                    type: string
                mime:
                    description: |
                        One of the types this platform stores: `image/jpeg`, `image/png`, `image/webp`, `application/pdf`, `video/mp4`, `video/quicktime` (an iPhone's `.mov`), `video/webm`. Anything else is 422 whatever its size. The allowlist is the store's, so every upload route accepts the same set — which of them a client offers is its own choice.
                    example: image/jpeg
                    maxLength: 100
                    type: string
                size:
                    description: |
                        Declared up front and refused before a byte moves. The bound here is the video one: a `video/*` upload may reach 100 MB, everything else is held to 10 MB, and a limit that depends on the type cannot be written as one number. The confirmed row records the size the *store* measured, not this.
                    example: 204800
                    format: int64
                    maximum: 104857600
                    minimum: 1
                    type: integer
            required:
                - kind
                - filename
                - mime
                - size
            type: object
        AccountID:
            example: acc_62mxefynht57b
            pattern: ^acc_[0-9a-hjkmnp-tv-z]{13}$
            type: string
        AccountRole:
            description: |
                `user` self-registers and both buys and sells. `moderator` is granted by an admin. `admin` is configured, not created. `support` is the support desk's own row — the second side of every ticket thread, held by exactly one account and granted by no route.
            enum:
                - user
                - moderator
                - admin
                - support
            type: string
        AccountStatus:
            enum:
                - active
                - suspended
            type: string
        AccountSummary:
            description: The compact form used in follower and following lists.
            properties:
                avatar:
                    allOf:
                        - $ref: '#/components/schemas/Resource'
                    nullable: true
                id:
                    $ref: '#/components/schemas/AccountID'
                name:
                    example: Nguyễn Văn An
                    type: string
            required:
                - id
                - name
                - avatar
            type: object
        AccountSummaryPage:
            properties:
                data:
                    items:
                        $ref: '#/components/schemas/AccountSummary'
                    type: array
                meta:
                    $ref: '#/components/schemas/PageMeta'
            required:
                - data
                - meta
            type: object
        AddAttachmentsRequest:
            properties:
                attachments:
                    items:
                        $ref: '#/components/schemas/ResourceID'
                    maxItems: 10
                    minItems: 1
                    type: array
            required:
                - attachments
            type: object
        AddCartItemRequest:
            properties:
                quantity:
                    example: 2
                    format: int64
                    minimum: 1
                    type: integer
                variant_id:
                    $ref: '#/components/schemas/VariantID'
            required:
                - variant_id
                - quantity
            type: object
        AdminAccount:
            description: |
                The staff view of an account. Carries the identifiers and the suspension state that `PublicAccount` withholds.
            properties:
                created_at:
                    format: date-time
                    type: string
                email:
                    nullable: true
                    type: string
                email_verified:
                    type: boolean
                id:
                    $ref: '#/components/schemas/AccountID'
                identity_verified:
                    type: boolean
                name:
                    type: string
                phone:
                    nullable: true
                    type: string
                role:
                    $ref: '#/components/schemas/AccountRole'
                status:
                    $ref: '#/components/schemas/AccountStatus'
                suspended_until:
                    description: Null while suspended means the suspension is permanent.
                    format: date-time
                    nullable: true
                    type: string
                suspension_reason:
                    nullable: true
                    type: string
                username:
                    nullable: true
                    type: string
            required:
                - id
                - email
                - email_verified
                - phone
                - username
                - name
                - role
                - status
                - suspended_until
                - suspension_reason
                - identity_verified
                - created_at
            type: object
        AdminAccountPage:
            properties:
                data:
                    items:
                        $ref: '#/components/schemas/AdminAccount'
                    type: array
                meta:
                    $ref: '#/components/schemas/PageMeta'
            required:
                - data
                - meta
            type: object
        AdminIdentityDocument:
            description: A queue entry, which needs the subject alongside the document.
            properties:
                account:
                    $ref: '#/components/schemas/AccountSummary'
                document:
                    $ref: '#/components/schemas/IdentityDocument'
            required:
                - document
                - account
            type: object
        AdminTicket:
            description: A queue entry. A moderator needs the requester and the target beside the ticket itself.
            properties:
                assignee:
                    allOf:
                        - $ref: '#/components/schemas/AccountSummary'
                    description: The moderator working it. Staff-only, and null until it is claimed.
                    nullable: true
                open_tickets_against_target:
                    description: |
                        How many other unresolved tickets name the same target. A pattern is what a decision rests on rather than a single complaint.
                    format: int64
                    minimum: 0
                    type: integer
                requester:
                    $ref: '#/components/schemas/AccountSummary'
                resolved_by:
                    allOf:
                        - $ref: '#/components/schemas/AccountSummary'
                    nullable: true
                target:
                    additionalProperties: true
                    description: |
                        What the ticket is about, shaped by `ref_type`. Fetched from the module that owns it, and empty once that module no longer has it — a listing already taken down — as well as on a ticket about nothing in particular.
                    type: object
                ticket:
                    $ref: '#/components/schemas/Ticket'
            required:
                - ticket
                - requester
                - assignee
                - resolved_by
                - open_tickets_against_target
                - target
            type: object
        AdminTicketPage:
            properties:
                data:
                    items:
                        $ref: '#/components/schemas/AdminTicket'
                    type: array
                meta:
                    $ref: '#/components/schemas/CursorMeta'
            required:
                - data
                - meta
            type: object
        AdministrativeArea:
            properties:
                code:
                    description: What an address stores — two digits for a province, five for a ward.
                    example: "79"
                    type: string
                kind:
                    enum:
                        - province
                        - ward
                    type: string
                name:
                    example: Thành phố Hồ Chí Minh
                    type: string
            required:
                - code
                - name
                - kind
            type: object
        AdministrativeAreaList:
            properties:
                data:
                    items:
                        $ref: '#/components/schemas/AdministrativeArea'
                    type: array
            required:
                - data
            type: object
        AuthResult:
            properties:
                access_token:
                    type: string
                account:
                    $ref: '#/components/schemas/Me'
                expires_in:
                    description: Access token lifetime in seconds.
                    example: 900
                    minimum: 0
                    type: integer
                refresh_token:
                    type: string
            required:
                - access_token
                - refresh_token
                - expires_in
                - account
            type: object
        BankAccount:
            properties:
                account_holder:
                    type: string
                account_number_masked:
                    description: Only the last digits. The full number leaves the system solely to move money.
                    example: '****1234'
                    type: string
                bank_code:
                    description: Bank identifier, e.g. `vcb`
                    type: string
                created_at:
                    format: date-time
                    type: string
                id:
                    $ref: '#/components/schemas/BankAccountID'
                is_default:
                    type: boolean
            required:
                - id
                - bank_code
                - account_number_masked
                - account_holder
                - is_default
                - created_at
            type: object
        BankAccountID:
            example: bnk_2qr5wtc4mx8jd
            pattern: ^bnk_[0-9a-hjkmnp-tv-z]{13}$
            type: string
        BankAccountList:
            properties:
                data:
                    items:
                        $ref: '#/components/schemas/BankAccount'
                    type: array
            required:
                - data
            type: object
        CartItem:
            description: |
                Carries the listing id as well as the variant's, because a variant has no read of its own in the catalog: rendering the cart is one `GET /listings?ids=` over the `listing_id`s, and the row would otherwise be unresolvable.
            properties:
                created_at:
                    format: date-time
                    type: string
                id:
                    $ref: '#/components/schemas/CartItemID'
                listing_id:
                    $ref: '#/components/schemas/ListingID'
                quantity:
                    example: 2
                    format: int64
                    minimum: 1
                    type: integer
                variant_id:
                    $ref: '#/components/schemas/VariantID'
            required:
                - id
                - listing_id
                - variant_id
                - quantity
                - created_at
            type: object
        CartItemID:
            example: crt_3n8kvq1wd6ptz
            pattern: ^crt_[0-9a-hjkmnp-tv-z]{13}$
            type: string
        Category:
            properties:
                description:
                    example: Hand-thrown and slipcast pottery.
                    type: string
                id:
                    $ref: '#/components/schemas/CategoryID'
                name:
                    example: Ceramics
                    type: string
                parent_id:
                    allOf:
                        - $ref: '#/components/schemas/CategoryID'
                    description: Null for a root category.
                    nullable: true
                score:
                    allOf:
                        - $ref: '#/components/schemas/SimilarityScore'
                    nullable: true
            required:
                - id
                - parent_id
                - name
                - description
                - score
            type: object
        CategoryID:
            example: cat_7v2p41ryaj811
            pattern: ^cat_[0-9a-hjkmnp-tv-z]{13}$
            type: string
        CategoryList:
            properties:
                data:
                    items:
                        $ref: '#/components/schemas/Category'
                    type: array
            required:
                - data
            type: object
        ChangePasswordRequest:
            properties:
                current_password:
                    type: string
                new_password:
                    maxLength: 72
                    minLength: 8
                    type: string
            required:
                - current_password
                - new_password
            type: object
        ChatUnreadCount:
            properties:
                conversations:
                    description: How many threads have anything unread.
                    example: 2
                    format: int64
                    minimum: 0
                    type: integer
                unread:
                    example: 3
                    format: int64
                    minimum: 0
                    type: integer
            required:
                - unread
                - conversations
            type: object
        CheckoutLine:
            description: One variant and how many of it.
            properties:
                quantity:
                    example: 2
                    format: int64
                    minimum: 1
                    type: integer
                variant_id:
                    $ref: '#/components/schemas/VariantID'
            required:
                - variant_id
                - quantity
            type: object
        CheckoutOfferRequest:
            description: |
                The address and the carrier, exactly as a fixed-price checkout takes them. The negotiation settled price and quantity; only delivery is decided here, and the buyer pays it either way, so the carrier is their trade-off to make.
            properties:
                contact_id:
                    $ref: '#/components/schemas/ContactID'
                note:
                    maxLength: 500
                    type: string
                transport_option:
                    description: A carrier slug from `POST /shipping-quotes`; one nobody enabled is refused with 422.
                    example: standard-delivery
                    maxLength: 100
                    type: string
            required:
                - contact_id
                - transport_option
            type: object
        CheckoutRequest:
            description: |
                The carrier and the note are per checkout, not per line: one session covers one listing and therefore one seller and one parcel.
            properties:
                contact_id:
                    $ref: '#/components/schemas/ContactID'
                currency:
                    allOf:
                        - $ref: '#/components/schemas/CurrencyCode'
                    description: Must match the listing's currency.
                lines:
                    items:
                        $ref: '#/components/schemas/CheckoutLine'
                    minItems: 1
                    type: array
                note:
                    example: Please leave at reception
                    maxLength: 500
                    type: string
                transport_option:
                    description: |
                        An enabled transport option's slug. The buyer pays delivery, so the trade-off between price and speed is theirs.
                    example: ghn-express
                    maxLength: 100
                    type: string
            required:
                - lines
                - contact_id
                - transport_option
                - currency
            type: object
        CheckoutResult:
            description: |
                The lines and the single session that pays for them. Nothing is settled yet: the order appears when that session completes, and no seller confirms anything.
            properties:
                currency:
                    $ref: '#/components/schemas/CurrencyCode'
                goods_total:
                    description: The items alone, smallest currency unit.
                    example: 598000
                    format: int64
                    minimum: 0
                    type: integer
                items:
                    items:
                        $ref: '#/components/schemas/OrderItem'
                    type: array
                payment_session_id:
                    $ref: '#/components/schemas/PaymentSessionID'
                shipping_fee:
                    description: |
                        What the chosen carrier quoted for this parcel to this address. The buyer pays it on a fixed-price sale and a negotiated one alike, and it is quoted here rather than sent, so a client cannot decide what delivery costs.
                    example: 15000
                    format: int64
                    minimum: 0
                    type: integer
                total:
                    description: 'What the session asks for: goods plus delivery'
                    example: 613000
                    format: int64
                    minimum: 0
                    type: integer
            required:
                - items
                - payment_session_id
                - goods_total
                - shipping_fee
                - total
                - currency
            type: object
        ConfirmReceiptRequest:
            properties:
                attachments:
                    description: |
                        Unboxing photos or video. At least one is mandatory — a later refund is judged on this evidence.
                    items:
                        $ref: '#/components/schemas/ResourceID'
                    maxItems: 10
                    minItems: 1
                    type: array
            required:
                - attachments
            type: object
        Contact:
            properties:
                address:
                    description: Street or house-number line below ward level.
                    type: string
                address_detail:
                    description: Unit or floor or notes.
                    nullable: true
                    type: string
                address_type:
                    $ref: '#/components/schemas/ContactAddressType'
                country:
                    maxLength: 2
                    minLength: 2
                    type: string
                created_at:
                    format: date-time
                    type: string
                district_code:
                    description: |
                        Null where the country has no district tier. Vietnam dropped it in 2025 and now goes province to ward.
                    nullable: true
                    type: string
                district_name:
                    nullable: true
                    type: string
                full_name:
                    type: string
                id:
                    $ref: '#/components/schemas/ContactID'
                is_default_delivery:
                    type: boolean
                is_default_pickup:
                    type: boolean
                latitude:
                    example: 10.7769
                    format: double
                    maximum: 90
                    minimum: -90
                    nullable: true
                    type: number
                longitude:
                    example: 106.7009
                    format: double
                    maximum: 180
                    minimum: -180
                    nullable: true
                    type: number
                phone:
                    description: E.164.
                    type: string
                phone_verified:
                    type: boolean
                postal_code:
                    nullable: true
                    type: string
                provider_codes:
                    additionalProperties: true
                    description: |
                        Per-carrier territory ids. Carriers number territories their own way and some still require a district.
                    type: object
                province_code:
                    type: string
                province_name:
                    type: string
                ward_code:
                    type: string
                ward_name:
                    type: string
            required:
                - id
                - full_name
                - phone
                - phone_verified
                - address_type
                - is_default_delivery
                - is_default_pickup
                - country
                - province_code
                - province_name
                - district_code
                - district_name
                - ward_code
                - ward_name
                - postal_code
                - address
                - address_detail
                - latitude
                - longitude
                - provider_codes
                - created_at
            type: object
        ContactAddressType:
            enum:
                - home
                - work
            type: string
        ContactID:
            example: ctc_kvq1wd6ptz3n8
            pattern: ^ctc_[0-9a-hjkmnp-tv-z]{13}$
            type: string
        ContactList:
            properties:
                data:
                    items:
                        $ref: '#/components/schemas/Contact'
                    type: array
            required:
                - data
            type: object
        Conversation:
            properties:
                counterparty:
                    allOf:
                        - $ref: '#/components/schemas/AccountSummary'
                    description: |
                        The other side. On a ticket thread that is the support desk for the requester and the requester for staff — a moderator answering a ticket is not a side of the row, so every viewer-relative field here is computed as the desk for them.
                counterparty_read_at:
                    description: |
                        How far the other side has read. This is the read receipt: a message the caller sent is seen when this is at or past its `created_at`, which is why no message carries a delivery status of its own.
                    format: date-time
                    nullable: true
                    type: string
                created_at:
                    format: date-time
                    type: string
                id:
                    $ref: '#/components/schemas/ConversationID'
                last_message:
                    allOf:
                        - $ref: '#/components/schemas/Message'
                    nullable: true
                last_message_at:
                    description: |
                        Starts at the creation time so an empty thread still sorts predictably in the inbox.
                    format: date-time
                    type: string
                read_at:
                    description: The caller's own read mark. Null while they have read nothing.
                    format: date-time
                    nullable: true
                    type: string
                ticket_id:
                    allOf:
                        - $ref: '#/components/schemas/TicketID'
                    description: |
                        Set when this thread is a support ticket's, null on an ordinary one. A ticket is read in the support screen rather than the inbox, so a client tells them apart from the row.
                    nullable: true
                unread:
                    description: The counterparty's messages after the caller's read mark.
                    example: 3
                    format: int64
                    minimum: 0
                    type: integer
            required:
                - id
                - counterparty
                - ticket_id
                - last_message
                - last_message_at
                - unread
                - read_at
                - counterparty_read_at
                - created_at
            type: object
        ConversationID:
            example: cnv_6ptz3n8kvq1wd
            pattern: ^cnv_[0-9a-hjkmnp-tv-z]{13}$
            type: string
        ConversationPage:
            properties:
                data:
                    items:
                        $ref: '#/components/schemas/Conversation'
                    type: array
                meta:
                    $ref: '#/components/schemas/CursorMeta'
            required:
                - data
                - meta
            type: object
        ConversationReadMark:
            description: How far one participant has read a thread.
            properties:
                conversation_id:
                    example: cnv_7bd32h9qk4mfx
                    type: string
                read_at:
                    example: "2026-08-03T11:17:04Z"
                    format: date-time
                    type: string
                reader_id:
                    description: Who read it — always the other participant, never the recipient.
                    example: acc_4mfx7bd32h9qk
                    type: string
            required:
                - conversation_id
                - reader_id
                - read_at
            type: object
        CreateBankAccountRequest:
            properties:
                account_holder:
                    maxLength: 100
                    minLength: 1
                    type: string
                account_number:
                    maxLength: 50
                    minLength: 1
                    type: string
                bank_code:
                    maxLength: 20
                    minLength: 1
                    type: string
                is_default:
                    default: false
                    type: boolean
            required:
                - bank_code
                - account_number
                - account_holder
            type: object
        CreateCategoryRequest:
            properties:
                description:
                    example: Hand-thrown and slipcast pottery.
                    maxLength: 2000
                    type: string
                name:
                    example: Ceramics
                    maxLength: 100
                    minLength: 1
                    type: string
                parent_id:
                    $ref: '#/components/schemas/CategoryID'
            required:
                - name
            type: object
        CreateContactRequest:
            properties:
                address:
                    maxLength: 255
                    minLength: 1
                    type: string
                address_detail:
                    maxLength: 255
                    type: string
                address_type:
                    $ref: '#/components/schemas/ContactAddressType'
                country:
                    maxLength: 2
                    minLength: 2
                    pattern: ^[A-Z]{2}$
                    type: string
                district_code:
                    description: Send both district fields or neither.
                    maxLength: 20
                    type: string
                district_name:
                    maxLength: 100
                    type: string
                full_name:
                    maxLength: 100
                    minLength: 1
                    type: string
                is_default_delivery:
                    default: false
                    type: boolean
                is_default_pickup:
                    default: false
                    type: boolean
                latitude:
                    example: 10.7769
                    format: double
                    maximum: 90
                    minimum: -90
                    type: number
                longitude:
                    example: 106.7009
                    format: double
                    maximum: 180
                    minimum: -180
                    type: number
                phone:
                    pattern: ^\+[1-9][0-9]{7,14}$
                    type: string
                postal_code:
                    maxLength: 20
                    type: string
                province_code:
                    maxLength: 20
                    minLength: 1
                    type: string
                province_name:
                    maxLength: 100
                    minLength: 1
                    type: string
                ward_code:
                    maxLength: 20
                    minLength: 1
                    type: string
                ward_name:
                    maxLength: 100
                    minLength: 1
                    type: string
            required:
                - full_name
                - phone
                - address_type
                - country
                - province_code
                - province_name
                - ward_code
                - ward_name
                - address
            type: object
        CreateDraftRequest:
            properties:
                listing_id:
                    $ref: '#/components/schemas/ListingID'
            required:
                - listing_id
            type: object
        CreateListingRequest:
            properties:
                attachments:
                    description: Ordered. The first becomes the cover.
                    items:
                        $ref: '#/components/schemas/ResourceID'
                    type: array
                category_id:
                    $ref: '#/components/schemas/CategoryID'
                condition:
                    $ref: '#/components/schemas/ListingCondition'
                currency:
                    $ref: '#/components/schemas/CurrencyCode'
                description:
                    maxLength: 20000
                    type: string
                name:
                    maxLength: 200
                    minLength: 1
                    type: string
                price_mode:
                    $ref: '#/components/schemas/PriceMode'
                specifications:
                    additionalProperties: true
                    type: object
                tags:
                    items:
                        $ref: '#/components/schemas/TagSlug'
                    type: array
                variants:
                    description: At least one. Price and shipping weight live on the variant.
                    items:
                        $ref: '#/components/schemas/CreateVariantRequest'
                    minItems: 1
                    type: array
            required:
                - name
                - category_id
                - condition
                - price_mode
                - currency
                - variants
            type: object
        CreateModeratorRequest:
            properties:
                country:
                    maxLength: 2
                    minLength: 2
                    pattern: ^[A-Z]{2}$
                    type: string
                email:
                    format: email
                    maxLength: 255
                    type: string
                locale:
                    pattern: ^[a-z]{2}(-[A-Z]{2})?$
                    type: string
                name:
                    maxLength: 100
                    minLength: 1
                    type: string
                password:
                    maxLength: 72
                    minLength: 8
                    type: string
                timezone:
                    maxLength: 64
                    type: string
            required:
                - email
                - password
                - name
                - country
                - locale
                - timezone
            type: object
        CreateOfferRequest:
            properties:
                quantity:
                    example: 2
                    format: int64
                    minimum: 1
                    type: integer
                reason:
                    maxLength: 500
                    type: string
                total:
                    example: 598000
                    format: int64
                    minimum: 1
                    type: integer
                variant_id:
                    $ref: '#/components/schemas/VariantID'
            required:
                - variant_id
                - quantity
                - total
            type: object
        CreateRefundRequest:
            description: |
                No item selection and no amount: a refund is for the whole order. Nothing about shipping either — the goods stay with the buyer until the refund is granted, and a granted refund returns the goods' money, not the carriage: that parcel was carried. Delivery comes back only where it never happened, which is a cancellation before pickup rather than a refund. Who bears the return leg is the verdict's business.
            properties:
                attachments:
                    description: Evidence, and it can be topped up until the case closes.
                    items:
                        $ref: '#/components/schemas/ResourceID'
                    maxItems: 10
                    type: array
                reason:
                    example: Not as described
                    maxLength: 2000
                    minLength: 1
                    type: string
            required:
                - reason
            type: object
        CreateUploadRequest:
            properties:
                filename:
                    description: |
                        Kept only for its extension. The stored key is generated — a path a client chose is a directory traversal waiting for a backend that resolves one.
                    example: front.jpg
                    maxLength: 255
                    type: string
                mime:
                    description: |
                        One of the types this platform stores: `image/jpeg`, `image/png`, `image/webp`, `application/pdf`, `video/mp4`, `video/quicktime` (an iPhone's `.mov`), `video/webm`. Anything else is 422 whatever its size. The allowlist is the store's, so every upload route accepts the same set — which of them a client offers is its own choice.
                    example: image/jpeg
                    maxLength: 100
                    type: string
                size:
                    description: |
                        Declared up front and refused before a byte moves. The bound here is the video one: a `video/*` upload may reach 100 MB, everything else is held to 10 MB, and a limit that depends on the type cannot be written as one number. The confirmed row records the size the *store* measured, not this.
                    example: 204800
                    format: int64
                    maximum: 104857600
                    minimum: 1
                    type: integer
            required:
                - filename
                - mime
                - size
            type: object
        CreateVariantRequest:
            properties:
                attachments:
                    items:
                        $ref: '#/components/schemas/ResourceID'
                    type: array
                attributes:
                    additionalProperties: true
                    type: object
                package_details:
                    additionalProperties: true
                    type: object
                price:
                    example: 299000
                    format: int64
                    minimum: 1
                    type: integer
                quantity:
                    default: 0
                    description: Units on hand at creation.
                    format: int64
                    minimum: 0
                    type: integer
            required:
                - price
                - attributes
                - package_details
            type: object
        CreateWithdrawalRequest:
            properties:
                amount:
                    example: 500000
                    format: int64
                    minimum: 1
                    type: integer
                bank_account_id:
                    $ref: '#/components/schemas/BankAccountID'
                currency:
                    $ref: '#/components/schemas/CurrencyCode'
            required:
                - currency
                - amount
                - bank_account_id
            type: object
        CurrencyCode:
            description: |
                ISO 4217. Never inferred from the account's country — one currency spans many countries, and a seller may want a balance in a foreign one.
            example: VND
            maxLength: 3
            minLength: 3
            pattern: ^[A-Z]{3}$
            type: string
        CursorMeta:
            description: How to continue a cursor-paginated read.
            properties:
                next_cursor:
                    description: |
                        Pass as `cursor` to get the next page. Null on the last one. Always present so "no more pages" is a value rather than a missing key.
                    nullable: true
                    type: string
            required:
                - next_cursor
            type: object
        DeclineOrderRequest:
            description: |
                A reason is mandatory and it is kept on the order: reputation reads it, and a buyer whose sale was refused is owed the why.
            properties:
                reason:
                    example: Out of stock
                    maxLength: 500
                    minLength: 1
                    type: string
            required:
                - reason
            type: object
        DeletedMessageRef:
            description: |
                Enough to find and drop a message from a rendered thread. Not the whole
                Message: a deleted row's body is gone, and sending an emptied entity would
                read as an edit.
            properties:
                conversation_id:
                    example: cnv_7bd32h9qk4mfx
                    type: string
                created_at:
                    description: The message's own instant — the hypertable needs it to locate the row.
                    example: "2026-08-03T11:16:02Z"
                    format: date-time
                    type: string
                id:
                    description: Opaque message id.
                    example: msg_2h9qk4mfx7bd3
                    type: string
            required:
                - id
                - conversation_id
                - created_at
            type: object
        Device:
            properties:
                created_at:
                    format: date-time
                    type: string
                id:
                    $ref: '#/components/schemas/DeviceID'
                last_seen_at:
                    format: date-time
                    type: string
                platform:
                    $ref: '#/components/schemas/DevicePlatform'
                push_token_suffix:
                    description: |
                        The tail of the token, enough for a client to recognise its own install. The whole token is a delivery credential and is never returned.
                    type: string
            required:
                - id
                - platform
                - push_token_suffix
                - last_seen_at
                - created_at
            type: object
        DeviceID:
            example: dvc_ynht57b62mxef
            pattern: ^dvc_[0-9a-hjkmnp-tv-z]{13}$
            type: string
        DeviceList:
            properties:
                data:
                    items:
                        $ref: '#/components/schemas/Device'
                    type: array
            required:
                - data
            type: object
        DevicePlatform:
            enum:
                - ios
                - android
                - web
            type: string
        DraftOrder:
            description: |
                The frozen terms, flat rather than nested under a `snapshot`: what a buyer needs is the price they were shown, and the listing's own read answers everything else.
            properties:
                cancelled_at:
                    description: |
                        Set when the buyer closed it, the expiry did, or a checkout spent it — a session is claimed as it is checked out, so exactly one checkout can succeed.
                    format: date-time
                    nullable: true
                    type: string
                created_at:
                    format: date-time
                    type: string
                currency:
                    $ref: '#/components/schemas/CurrencyCode'
                id:
                    $ref: '#/components/schemas/DraftOrderID'
                listing_id:
                    $ref: '#/components/schemas/ListingID'
                name:
                    example: Ao thun cotton
                    type: string
                price_mode:
                    enum:
                        - fixed
                        - negotiable
                    example: fixed
                    type: string
                seller_id:
                    $ref: '#/components/schemas/AccountID'
                valid_until:
                    format: date-time
                    type: string
                variants:
                    items:
                        $ref: '#/components/schemas/DraftVariantSnapshot'
                    type: array
            required:
                - id
                - listing_id
                - seller_id
                - name
                - currency
                - price_mode
                - variants
                - created_at
                - valid_until
                - cancelled_at
            type: object
        DraftOrderID:
            example: drf_8kvq1wd6ptz3n
            pattern: ^drf_[0-9a-hjkmnp-tv-z]{13}$
            type: string
        DraftOrderPage:
            properties:
                data:
                    items:
                        $ref: '#/components/schemas/DraftOrder'
                    type: array
                meta:
                    $ref: '#/components/schemas/CursorMeta'
            required:
                - data
                - meta
            type: object
        DraftVariantSnapshot:
            description: |
                One purchasable variant at the price this session froze. Package details are held in the row but not published: they are what the shipping quote is computed from, not something a buyer picks.
            properties:
                attributes:
                    additionalProperties: true
                    type: object
                price:
                    description: Smallest currency unit
                    example: 299000
                    format: int64
                    minimum: 1
                    type: integer
                variant_id:
                    $ref: '#/components/schemas/VariantID'
            required:
                - variant_id
                - price
                - attributes
            type: object
        EmailVerificationRequest:
            properties:
                token:
                    type: string
            required:
                - token
            type: object
        Error:
            description: |
                The only failure shape in this API, at every status. `data` is absent whenever this is present.
            properties:
                error:
                    properties:
                        code:
                            description: |
                                Stable machine-readable code — switch on this, never on `message`. The cross-cutting ones live in `shared/errx`; the rest belong to the module that raised them.
                            example: validation
                            type: string
                        fields:
                            description: |
                                Per-field detail, present when the request failed validation and absent otherwise. Without it a form with twelve inputs and three problems gets one sentence and cannot mark a single box red.
                            items:
                                $ref: '#/components/schemas/ErrorField'
                            type: array
                        message:
                            description: Human-readable, for a developer or a log. Not a UI string.
                            example: price must be greater than 0
                            type: string
                        request_id:
                            description: |
                                The id of this request, the same value as the `X-Request-Id` response header and the one on every log line for it. Present so a user reporting a failure hands over something that can be grepped, instead of a sentence.
                            example: dkav6vyqeqm3
                            type: string
                    required:
                        - code
                        - message
                        - request_id
                    type: object
            required:
                - error
            type: object
        ErrorField:
            description: One field that failed validation.
            properties:
                field:
                    description: |
                        Dotted path from the request body's root, so a nested or repeated field is addressable by the same client code that rendered it.
                    example: skus[0].price
                    type: string
                message:
                    type: string
                rule:
                    description: |
                        Which constraint failed, as the validate tag that raised it. Machine-readable, so a client can localise the message instead of showing this one.
                    example: required
                    type: string
            required:
                - field
                - rule
                - message
            type: object
        Feedback:
            properties:
                comment:
                    type: string
                created_at:
                    format: date-time
                    type: string
                direction:
                    $ref: '#/components/schemas/FeedbackDirection'
                id:
                    $ref: '#/components/schemas/FeedbackID'
                order_id:
                    $ref: '#/components/schemas/OrderID'
                published_at:
                    description: |
                        Null while the rating is still blind. Only published feedback is visible to anyone but its author and counted towards reputation.
                    format: date-time
                    nullable: true
                    type: string
                ratee_id:
                    $ref: '#/components/schemas/AccountID'
                rater:
                    $ref: '#/components/schemas/AccountSummary'
                rating:
                    maximum: 5
                    minimum: 1
                    type: integer
            required:
                - id
                - order_id
                - rater
                - ratee_id
                - direction
                - rating
                - comment
                - published_at
                - created_at
            type: object
        FeedbackDirection:
            enum:
                - buyer-to-seller
                - seller-to-buyer
            type: string
        FeedbackID:
            example: fbk_2h9qk4mfx7bd3
            pattern: ^fbk_[0-9a-hjkmnp-tv-z]{13}$
            type: string
        FeedbackPage:
            properties:
                data:
                    items:
                        $ref: '#/components/schemas/Feedback'
                    type: array
                meta:
                    $ref: '#/components/schemas/CursorMeta'
            required:
                - data
                - meta
            type: object
        IdentityDocument:
            description: |
                A verification outcome. No document number and no scan: the vendor performs the check and only its verdict is kept.
            properties:
                created_at:
                    format: date-time
                    type: string
                doc_type:
                    $ref: '#/components/schemas/IdentityDocumentType'
                expires_at:
                    description: |
                        When the document itself runs out. A payout gate reads this as well as the status.
                    format: date-time
                    nullable: true
                    type: string
                id:
                    $ref: '#/components/schemas/IdentityDocumentID'
                provider:
                    description: KYC vendor, kebab-case.
                    type: string
                rejection_reason:
                    nullable: true
                    type: string
                status:
                    $ref: '#/components/schemas/IdentityStatus'
                verified_at:
                    format: date-time
                    nullable: true
                    type: string
            required:
                - id
                - doc_type
                - provider
                - status
                - rejection_reason
                - verified_at
                - expires_at
                - created_at
            type: object
        IdentityDocumentID:
            example: idd_57b62mxefynht
            pattern: ^idd_[0-9a-hjkmnp-tv-z]{13}$
            type: string
        IdentityDocumentList:
            properties:
                data:
                    items:
                        $ref: '#/components/schemas/IdentityDocument'
                    type: array
            required:
                - data
            type: object
        IdentityDocumentPage:
            properties:
                data:
                    items:
                        $ref: '#/components/schemas/AdminIdentityDocument'
                    type: array
                meta:
                    $ref: '#/components/schemas/PageMeta'
            required:
                - data
                - meta
            type: object
        IdentityDocumentType:
            enum:
                - national-id
                - passport
                - driver-license
            type: string
        IdentityStatus:
            enum:
                - pending
                - verified
                - rejected
            type: string
        IdentityVerdictRequest:
            properties:
                expires_at:
                    description: When the document runs out.
                    format: date-time
                    type: string
                rejection_reason:
                    description: Required when rejecting.
                    maxLength: 2000
                    type: string
                status:
                    description: A verdict so pending is not a choice.
                    enum:
                        - verified
                        - rejected
                    type: string
            required:
                - status
            type: object
        IdentityVerificationTicket:
            properties:
                document:
                    $ref: '#/components/schemas/IdentityDocument'
                vendor_session_expires_at:
                    format: date-time
                    nullable: true
                    type: string
                vendor_session_url:
                    description: Where the caller finishes the check with the vendor.
                    nullable: true
                    type: string
            required:
                - document
                - vendor_session_url
                - vendor_session_expires_at
            type: object
        Listing:
            description: The card shown in a feed. `GET /listings/{id}` returns the full form.
            properties:
                category_id:
                    $ref: '#/components/schemas/CategoryID'
                condition:
                    $ref: '#/components/schemas/ListingCondition'
                cover:
                    allOf:
                        - $ref: '#/components/schemas/Resource'
                    nullable: true
                created_at:
                    format: date-time
                    type: string
                currency:
                    $ref: '#/components/schemas/CurrencyCode'
                deleted_at:
                    description: |
                        Set on a listing the seller removed. Only an `ids` lookup returns one, so that an order or a cart referencing it can still be rendered.
                    format: date-time
                    nullable: true
                    type: string
                favorited:
                    description: |
                        Whether the caller has this on their wishlist. False for an anonymous request. A plain join, because the wishlist is a catalog table — the client never has to fetch its own saves to know which hearts to fill in.
                    type: boolean
                id:
                    $ref: '#/components/schemas/ListingID'
                location:
                    allOf:
                        - $ref: '#/components/schemas/ListingLocation'
                    description: |
                        Where the goods are. Null on a listing that was never published — the address is taken when the seller publishes, because that is when it becomes something a buyer can find.
                    nullable: true
                name:
                    example: Áo thun Uniqlo cổ tròn xanh navy
                    type: string
                price:
                    description: |
                        The featured variant's price, or the cheapest one when a price sort is in force. Not stored on the listing.
                    example: 299000
                    format: int64
                    minimum: 1
                    type: integer
                price_mode:
                    $ref: '#/components/schemas/PriceMode'
                rating:
                    description: |
                        Average review rating from 1 to 5, or 0 when there are none yet. Maintained from review events because reviews live in another schema and cannot be joined.
                    example: 4.6
                    format: double
                    maximum: 5
                    minimum: 0
                    type: number
                review_count:
                    description: |
                        How many reviews the rating averages. Beside it rather than derivable from it, because a 5.0 from one review and a 5.0 from two hundred are not the same claim.
                    example: 64
                    format: int64
                    minimum: 0
                    type: integer
                score:
                    allOf:
                        - $ref: '#/components/schemas/SimilarityScore'
                    nullable: true
                seller:
                    $ref: '#/components/schemas/AccountSummary'
                slug:
                    description: URL-friendly, globally unique and fixed at creation.
                    example: ao-thun-uniqlo-xanh
                    type: string
                sold:
                    description: |
                        Completed sales across the variants. An open checkout does not count and a cancelled one never did, so the number only goes up. Read from `cached_sold` on the listing rather than summed per request: a feed page would otherwise aggregate the stock rows of every card on it.
                    example: 128
                    format: int64
                    minimum: 0
                    type: integer
                status:
                    $ref: '#/components/schemas/ListingStatus'
                tags:
                    description: |
                        The listing's own tags, on the card so chips render without a request per row. Empty when it has none.
                    example:
                        - iphone
                        - apple
                    items:
                        $ref: '#/components/schemas/TagSlug'
                    type: array
                taken_down_at:
                    description: |
                        When staff removed this listing — which is the only thing that tells a takedown apart from the seller hiding their own, since both read `hidden`. Null otherwise. The reason is on the detail read, because it is a sentence rather than a badge.
                    format: date-time
                    nullable: true
                    type: string
            required:
                - id
                - slug
                - name
                - status
                - condition
                - price_mode
                - currency
                - price
                - sold
                - cover
                - rating
                - review_count
                - category_id
                - seller
                - favorited
                - score
                - tags
                - taken_down_at
                - location
                - deleted_at
                - created_at
            type: object
        ListingCondition:
            description: Item condition. This is a marketplace for used goods so it is listing-level and not optional.
            enum:
                - new
                - used
                - damaged
            type: string
        ListingDetail:
            properties:
                category:
                    $ref: '#/components/schemas/Category'
                condition:
                    $ref: '#/components/schemas/ListingCondition'
                created_at:
                    format: date-time
                    type: string
                currency:
                    $ref: '#/components/schemas/CurrencyCode'
                deleted_at:
                    description: Set on a listing the seller removed.
                    format: date-time
                    nullable: true
                    type: string
                description:
                    type: string
                favorite_count:
                    description: |
                        How many accounts saved it — social proof on the product page. Only here and not on the card: it is a count per listing, cheap for one row and N counts for a page of them.
                    example: 340
                    format: int64
                    minimum: 0
                    type: integer
                favorited:
                    description: Whether the caller has this saved. False for an anonymous request.
                    type: boolean
                featured_variant_id:
                    allOf:
                        - $ref: '#/components/schemas/VariantID'
                    nullable: true
                id:
                    $ref: '#/components/schemas/ListingID'
                images:
                    description: Ordered. The first is the cover.
                    items:
                        $ref: '#/components/schemas/Resource'
                    type: array
                location:
                    allOf:
                        - $ref: '#/components/schemas/ListingLocation'
                    description: |
                        Where the goods are. Null on a listing that was never published — the address is taken when the seller publishes, because that is when it becomes something a buyer can find.
                    nullable: true
                name:
                    example: Áo thun Uniqlo cổ tròn xanh navy
                    type: string
                pending_edit:
                    allOf:
                        - $ref: '#/components/schemas/PendingEdit'
                    description: |
                        An edit waiting on moderation, null when there is none. Visible to the owner and to staff only; buyers see the published version until it is approved.
                    nullable: true
                price_mode:
                    $ref: '#/components/schemas/PriceMode'
                rating:
                    example: 4.6
                    format: double
                    maximum: 5
                    minimum: 0
                    type: number
                review_count:
                    description: How many reviews the rating averages — see Listing.review_count.
                    example: 64
                    format: int64
                    minimum: 0
                    type: integer
                seller:
                    $ref: '#/components/schemas/AccountSummary'
                slug:
                    example: ao-thun-uniqlo-xanh
                    type: string
                sold:
                    description: Completed sales across the variants — see Listing.sold.
                    example: 128
                    format: int64
                    minimum: 0
                    type: integer
                specifications:
                    additionalProperties: true
                    description: Structured attributes specific to the product type.
                    type: object
                status:
                    $ref: '#/components/schemas/ListingStatus'
                tags:
                    items:
                        $ref: '#/components/schemas/TagSlug'
                    type: array
                takedown_reason:
                    description: |
                        What the moderator chose to tell the seller, and null when they chose not to (`notify_seller: false` on the takedown). The full reason is in the audit trail either way. Publishing again clears both fields, so they always describe why the listing is down *now* rather than why it once was.
                    example: Ảnh trùng với gian hàng chính hãng
                    nullable: true
                    type: string
                taken_down_at:
                    description: |
                        When staff removed the listing. Null when it is live, and null when the seller hid it themselves — the two used to be indistinguishable, which left a seller unable to tell that their listing had been removed at all.
                    format: date-time
                    nullable: true
                    type: string
                variants:
                    items:
                        $ref: '#/components/schemas/Variant'
                    type: array
            required:
                - location
                - id
                - slug
                - name
                - description
                - status
                - condition
                - price_mode
                - currency
                - specifications
                - images
                - category
                - tags
                - variants
                - featured_variant_id
                - sold
                - rating
                - review_count
                - seller
                - favorited
                - favorite_count
                - pending_edit
                - taken_down_at
                - takedown_reason
                - created_at
                - deleted_at
            type: object
        ListingID:
            example: lst_5y5w68r4918v8
            pattern: ^lst_[0-9a-hjkmnp-tv-z]{13}$
            type: string
        ListingLocation:
            description: |
                Where a listing's goods are: the seller's pickup address as the listing snapshotted it when it was published. A snapshot rather than a reference to the address — the address belongs to another module and a seller who moves does not move the listings they already sold.
            properties:
                distance_km:
                    description: |
                        How far the goods are from where the buyer said they are. Absent unless the browse sent a position, and absent for an address that was never geocoded.
                    example: 2.4
                    format: double
                    minimum: 0
                    nullable: true
                    type: number
                district_code:
                    description: Null where the country has no district tier. Code and name travel together.
                    example: "760"
                    nullable: true
                    type: string
                district_name:
                    example: District 1
                    nullable: true
                    type: string
                province_code:
                    example: "79"
                    type: string
                province_name:
                    example: Ho Chi Minh City
                    type: string
                ward_code:
                    example: "26734"
                    type: string
                ward_name:
                    example: Bến Nghé
                    type: string
            required:
                - province_code
                - province_name
                - district_code
                - district_name
                - ward_code
                - ward_name
                - distance_km
            type: object
        ListingPage:
            description: |
                One page shape for every listing query, ranked or not. Page-paginated, because a catalog is browsed with a pager and a relevance order has no stored column to seek into; `total` is null for a ranked query, where the top-K is all the search ever visited.
            properties:
                data:
                    items:
                        $ref: '#/components/schemas/Listing'
                    type: array
                meta:
                    $ref: '#/components/schemas/PageMeta'
            required:
                - data
                - meta
            type: object
        ListingStatus:
            description: |
                Lifecycle and moderation in one column. `hidden` is a live listing the seller took down for now; deletion is a separate flag entirely.
            enum:
                - draft
                - pending
                - active
                - hidden
            type: string
        ListingSuggestion:
            description: |
                A filled-in form. Every field is the model's proposal and the seller is expected to correct it; the optional ones are absent where it had nothing it could stand behind.
            properties:
                category_id:
                    allOf:
                        - $ref: '#/components/schemas/CategoryID'
                    description: |
                        Resolved against this marketplace's own tree, so it is always a category that exists. Null when nothing in the tree fits what it saw.
                    nullable: true
                condition:
                    description: Empty when it could not tell.
                    enum:
                        - new
                        - used
                        - damaged
                        - ""
                    example: used
                    type: string
                description:
                    example: Máy đã qua sử dụng, pin 89%. Có vết xước nhỏ ở viền dưới.
                    type: string
                name:
                    example: iPhone 12 64GB xanh
                    type: string
                price:
                    description: |
                        Only what the seller said out loud, in the smallest currency unit. Null when they did not say — this never estimates a price.
                    example: 5000000
                    format: int64
                    minimum: 1
                    nullable: true
                    type: integer
                specifications:
                    additionalProperties: true
                    description: Attributes it could read off the photos, as plain strings.
                    type: object
                tags:
                    description: Already slugified, at most four. Empty rather than guessed.
                    items:
                        $ref: '#/components/schemas/TagSlug'
                    type: array
                transcript:
                    description: |
                        What the voice note was heard as, echoed so the seller can see why a field is wrong rather than guess. Empty when they sent no recording.
                    example: bán iphone 12 64gb pin 89 phần trăm, năm triệu
                    type: string
                weight_g:
                    description: Estimated parcel weight, which is what a shipping quote needs.
                    example: 350
                    format: int64
                    minimum: 1
                    nullable: true
                    type: integer
            required:
                - name
                - description
                - category_id
                - condition
                - tags
                - price
                - weight_g
                - specifications
                - transcript
            type: object
        LoginRequest:
            properties:
                identifier:
                    description: An email or a phone or a username.
                    type: string
                password:
                    type: string
            required:
                - identifier
                - password
            type: object
        LogoutRequest:
            properties:
                device_id:
                    $ref: '#/components/schemas/DeviceID'
            type: object
        MarkConversationReadRequest:
            properties:
                before:
                    description: |
                        Mark everything sent at or before this instant read. Omit to mark the whole thread read.
                    format: date-time
                    type: string
            type: object
        MarkNotificationsReadRequest:
            properties:
                before:
                    description: |
                        Mark everything created at or before this instant read. Omit to mark the whole feed read.
                    format: date-time
                    type: string
            type: object
        Me:
            description: The caller's own view. Everything here is private to them.
            properties:
                created_at:
                    format: date-time
                    type: string
                email:
                    format: email
                    nullable: true
                    type: string
                email_verified:
                    type: boolean
                has_password:
                    description: False on a provider-only account. Unlinking the last provider is refused when this is false.
                    type: boolean
                id:
                    $ref: '#/components/schemas/AccountID'
                identity_verified:
                    description: Whether a live verified identity document exists. The payout gate reads this.
                    type: boolean
                phone:
                    nullable: true
                    type: string
                profile:
                    $ref: '#/components/schemas/Profile'
                role:
                    $ref: '#/components/schemas/AccountRole'
                status:
                    $ref: '#/components/schemas/AccountStatus'
                username:
                    nullable: true
                    type: string
            required:
                - id
                - email
                - email_verified
                - phone
                - username
                - role
                - status
                - has_password
                - identity_verified
                - profile
                - created_at
            type: object
        Message:
            properties:
                attachments:
                    description: Empty on a redacted message.
                    items:
                        $ref: '#/components/schemas/Resource'
                    type: array
                body:
                    description: Empty on a redacted message.
                    type: string
                card:
                    additionalProperties: true
                    description: |
                        Empty on an ordinary message, so a client reads "no card" as an empty object rather than a missing key.
                        What a system message renders, and for a price negotiation that is `{"offer_id": "ofr_…"}` and nothing else — the terms are read from the offer, so a counter-offer cannot leave an old price on screen. Written only by the backend and rejected on a `user` message, otherwise anyone could send a card that looks like an offer the seller accepted.
                    type: object
                conversation_id:
                    $ref: '#/components/schemas/ConversationID'
                created_at:
                    format: date-time
                    type: string
                deleted_at:
                    description: Set on a redacted message. The row stays so a thread has no unexplained gaps.
                    format: date-time
                    nullable: true
                    type: string
                edited_at:
                    format: date-time
                    nullable: true
                    type: string
                from_support:
                    description: |
                        True on a reply the support desk wrote, in the requester's own view of their ticket thread. Support answers as the platform, so the requester is told that much and no more; staff reading the same thread see the real sender and never this flag, because a colleague's name is what makes a thread reviewable.
                    type: boolean
                id:
                    $ref: '#/components/schemas/MessageID'
                refs:
                    additionalProperties: true
                    description: |
                        What the sender pointed at — a listing, a variant, an order. Client-supplied and validated against the caller's own access to each id, so it can carry a reference but never assert anything about it.
                    type: object
                sender_id:
                    allOf:
                        - $ref: '#/components/schemas/AccountID'
                    description: |
                        Null on a system message, and null on a support reply seen by the requester — see `from_support`, which is how the two are told apart.
                    nullable: true
                type:
                    $ref: '#/components/schemas/MessageType'
            required:
                - id
                - conversation_id
                - sender_id
                - from_support
                - type
                - body
                - attachments
                - refs
                - card
                - created_at
                - edited_at
                - deleted_at
            type: object
        MessageID:
            example: msg_agnc1pe4pjb4k
            pattern: ^msg_[0-9a-hjkmnp-tv-z]{13}$
            type: string
        MessagePage:
            properties:
                data:
                    items:
                        $ref: '#/components/schemas/Message'
                    type: array
                meta:
                    $ref: '#/components/schemas/CursorMeta'
            required:
                - data
                - meta
            type: object
        MessageType:
            description: |
                A `system` message is produced by the backend — an offer was accepted, an order shipped — and belongs to no participant, which is why it has no sender.
            enum:
                - user
                - system
            type: string
        ModerationNoteRequest:
            properties:
                note:
                    maxLength: 2000
                    type: string
            type: object
        MoneyByCurrency:
            description: One currency's worth of a total. Minor units, like every amount in this API.
            properties:
                amount:
                    example: 1250000
                    format: int64
                    minimum: 0
                    type: integer
                currency:
                    $ref: '#/components/schemas/CurrencyCode'
            required:
                - currency
                - amount
            type: object
        Notification:
            properties:
                category:
                    $ref: '#/components/schemas/NotificationCategory'
                created_at:
                    description: |
                        Identifies the row together with the feed order, and it is what `POST /notifications/read` is given a bound against.
                    format: date-time
                    type: string
                payload:
                    additionalProperties: true
                    description: Structured content such as deep links and images.
                    type: object
                read_at:
                    format: date-time
                    nullable: true
                    type: string
                title:
                    type: string
            required:
                - category
                - title
                - payload
                - read_at
                - created_at
            type: object
        NotificationCategory:
            description: Also the preference key, which is why it is an enum — a typo would read as no preference and quietly send anyway.
            enum:
                - order
                - promotion
                - system
                - chat
                - social
            type: string
        NotificationChannel:
            enum:
                - in-app
                - push
                - email
                - sms
            type: string
        NotificationPage:
            properties:
                data:
                    items:
                        $ref: '#/components/schemas/Notification'
                    type: array
                meta:
                    $ref: '#/components/schemas/CursorMeta'
            required:
                - data
                - meta
            type: object
        NotificationPreference:
            properties:
                category:
                    $ref: '#/components/schemas/NotificationCategory'
                channel:
                    $ref: '#/components/schemas/NotificationChannel'
                is_default:
                    description: |
                        True when no stored row exists and this is the domain default. Shown so a client can tell an explicit choice from an inherited one.
                    type: boolean
                is_enabled:
                    type: boolean
            required:
                - category
                - channel
                - is_enabled
                - is_default
            type: object
        NotificationPreferenceList:
            properties:
                data:
                    items:
                        $ref: '#/components/schemas/NotificationPreference'
                    type: array
            required:
                - data
            type: object
        OAuthIdentity:
            properties:
                created_at:
                    format: date-time
                    type: string
                provider:
                    $ref: '#/components/schemas/OAuthProvider'
            required:
                - provider
                - created_at
            type: object
        OAuthIdentityList:
            properties:
                data:
                    items:
                        $ref: '#/components/schemas/OAuthIdentity'
                    type: array
            required:
                - data
            type: object
        OAuthLoginRequest:
            properties:
                country:
                    maxLength: 2
                    minLength: 2
                    pattern: ^[A-Z]{2}$
                    type: string
                credential:
                    description: The provider's authorization code or id token.
                    type: string
                locale:
                    pattern: ^[a-z]{2}(-[A-Z]{2})?$
                    type: string
                provider:
                    $ref: '#/components/schemas/OAuthProvider'
                timezone:
                    maxLength: 64
                    type: string
            required:
                - provider
                - credential
            type: object
        OAuthProvider:
            example: google
            pattern: ^[a-z0-9]+(-[a-z0-9]+)*$
            type: string
        Offer:
            properties:
                author_id:
                    $ref: '#/components/schemas/AccountID'
                buyer_id:
                    $ref: '#/components/schemas/AccountID'
                created_at:
                    format: date-time
                    type: string
                currency:
                    $ref: '#/components/schemas/CurrencyCode'
                expires_at:
                    format: date-time
                    type: string
                id:
                    $ref: '#/components/schemas/OfferID'
                listing_id:
                    allOf:
                        - $ref: '#/components/schemas/ListingID'
                    description: The listing whose card the offer is shown on.
                quantity:
                    example: 2
                    format: int64
                    minimum: 1
                    type: integer
                reason:
                    description: Shown on the offer card beside the proposed price
                    type: string
                seller_id:
                    $ref: '#/components/schemas/AccountID'
                status:
                    $ref: '#/components/schemas/OfferStatus'
                total:
                    description: Currently proposed total, smallest currency unit
                    example: 598000
                    format: int64
                    minimum: 1
                    type: integer
                variant_id:
                    $ref: '#/components/schemas/VariantID'
            required:
                - id
                - listing_id
                - variant_id
                - buyer_id
                - seller_id
                - author_id
                - status
                - quantity
                - total
                - currency
                - reason
                - created_at
                - expires_at
            type: object
        OfferID:
            example: ofr_ptz3n8kvq1wd6
            pattern: ^ofr_[0-9a-hjkmnp-tv-z]{13}$
            type: string
        OfferPage:
            properties:
                data:
                    items:
                        $ref: '#/components/schemas/Offer'
                    type: array
                meta:
                    $ref: '#/components/schemas/CursorMeta'
            required:
                - data
                - meta
            type: object
        OfferStatus:
            description: |
                `active` — a proposal waiting for the other side. `accepted` — agreed, the price frozen for a short window while the buyer creates the order. `checked-out` — the buyer's payment session is open, so these terms are off the table. `cancelled` — withdrawn or lapsed.
            enum:
                - active
                - accepted
                - checked-out
                - cancelled
            example: accepted
            type: string
        OpenTicketRequest:
            properties:
                attachments:
                    description: Confirmed uploads, posted as the opening message's images.
                    items:
                        $ref: '#/components/schemas/ResourceID'
                    maxItems: 10
                    type: array
                body:
                    description: The first message of the thread, not a column on the ticket.
                    example: ảnh mở hộp đây, sản phẩm bị xước
                    maxLength: 4000
                    type: string
                kind:
                    $ref: '#/components/schemas/TicketKind'
                reason:
                    allOf:
                        - $ref: '#/components/schemas/TicketReason'
                    description: |
                        Required for the five `report-*` kinds, refused for every other one — 422 either way. It depends on `kind`, so it cannot be listed in `required`.
                ref_id:
                    description: Required for the kinds that are about something, refused for the others.
                    example: lst_1ryaj8117v2p4
                    pattern: ^[a-z]{3}_[0-9a-hjkmnp-tv-z]{13}$
                    type: string
                subject:
                    example: Hàng không đúng mô tả
                    maxLength: 200
                    minLength: 1
                    type: string
            required:
                - kind
                - subject
            type: object
        Option:
            description: One selectable entry. The last three fields are the operator's view and are absent for anyone else.
            properties:
                description:
                    description: A line of explanation. May be empty.
                    example: Settles immediately, no redirect and no webhook. The happy path.
                    maxLength: 1000
                    type: string
                id:
                    description: What to send as `payment_option` or `transport_option`. Permanent — a settled payment and a shipped parcel hold it.
                    example: mock-success
                    maxLength: 100
                    pattern: ^[a-z0-9]+(-[a-z0-9]+)*$
                    type: string
                is_enabled:
                    description: Staff only. A row switched off is not offered, but stays resolvable for the records naming it.
                    example: true
                    nullable: true
                    type: boolean
                name:
                    description: What to show the chooser.
                    example: 'Mock: pay now (succeeds)'
                    maxLength: 200
                    type: string
                priority:
                    description: Staff only. Display order, highest first.
                    example: 90
                    maximum: 1000
                    minimum: 0
                    nullable: true
                    type: integer
                provider:
                    description: Staff only. The implementation serving this row — what an admin changes to move it to another vendor.
                    example: mock
                    maxLength: 100
                    type: string
            required:
                - id
                - name
                - description
                - provider
                - is_enabled
                - priority
            type: object
        OptionCategoryName:
            description: |
                The kind of choice. `payment` is the rails a payment session may be tendered on, `transport` the carriers a parcel may be sent with. Both are user-visible; a category added later may be staff-only, and answers 404 to anyone else.
            enum:
                - payment
                - transport
            example: payment
            type: string
        OptionList:
            description: A whole category. One resource rather than a collection, and deliberately unpaginated — a deployment offers a handful per category.
            properties:
                options:
                    items:
                        $ref: '#/components/schemas/Option'
                    type: array
                providers:
                    description: Staff only. What a row's `provider` may be set to in this deployment, so a switch is a choice from a list rather than a guess.
                    example:
                        - mock
                    items:
                        maxLength: 100
                        type: string
                    type: array
            required:
                - options
                - providers
            type: object
        Order:
            properties:
                address:
                    $ref: '#/components/schemas/OrderAddressSnapshot'
                buyer:
                    $ref: '#/components/schemas/AccountSummary'
                cancelled_at:
                    format: date-time
                    nullable: true
                    type: string
                completed_at:
                    description: Set when the payout is claimed
                    format: date-time
                    nullable: true
                    type: string
                confirmation_deadline_at:
                    description: |
                        `created_at` + 48h, computed rather than stored. Staff are asked to chase the seller past this point; the sale is not voided, because neither the money nor the goods are the platform's to dispose of. Null once the seller has accepted.
                    format: date-time
                    nullable: true
                    type: string
                confirmed_at:
                    description: |
                        When the seller accepted the sale. Null means the parcel has not been booked and will not be — a buyer reading this knows what they are waiting on.
                    format: date-time
                    nullable: true
                    type: string
                created_at:
                    format: date-time
                    type: string
                currency:
                    $ref: '#/components/schemas/CurrencyCode'
                decline_reason:
                    description: |
                        Why the seller refused, set only on an order they refused outright. A refusal is a cancellation that says who ended the sale, where `cancelled_at` alone says only that it did not happen.
                    nullable: true
                    type: string
                draft_id:
                    allOf:
                        - $ref: '#/components/schemas/DraftOrderID'
                    description: |
                        The checkout this came from. Exactly one of `draft_id` and `offer_id` is set: a fixed-price sale is checked out from a draft, a negotiated one from the offer both sides accepted.
                    nullable: true
                id:
                    $ref: '#/components/schemas/OrderID'
                items:
                    items:
                        $ref: '#/components/schemas/OrderItem'
                    type: array
                offer_id:
                    allOf:
                        - $ref: '#/components/schemas/OfferID'
                    description: The accepted negotiation this came from. Null on a fixed-price sale.
                    nullable: true
                payout_deadline_at:
                    description: |
                        `received_at` + 72h, computed rather than stored. The seller is paid out at this point unless a refund still has a claim on the escrow.
                    format: date-time
                    nullable: true
                    type: string
                payout_released_at:
                    description: |
                        When the escrow reached the seller. Null on a completed order means the release has not landed yet — the platform owes the seller and knows it, and a retry pass keeps trying until it does.
                    format: date-time
                    nullable: true
                    type: string
                pickup_address:
                    $ref: '#/components/schemas/OrderAddressSnapshot'
                receipt_attachments:
                    description: |
                        Unboxing evidence, captured with the receipt confirmation and never added to afterwards — a refund is judged on what the buyer showed at the moment of unboxing.
                    items:
                        $ref: '#/components/schemas/Resource'
                    type: array
                received_at:
                    description: When the buyer confirmed receipt. Null means the payout clock has not started.
                    format: date-time
                    nullable: true
                    type: string
                seller:
                    $ref: '#/components/schemas/AccountSummary'
                state:
                    $ref: '#/components/schemas/OrderState'
                total:
                    description: |
                        Summed from the live lines rather than stored: the lines are the record of what was paid, and a column would be a second answer to the same question.
                    example: 598000
                    format: int64
                    minimum: 0
                    type: integer
                transport:
                    allOf:
                        - $ref: '#/components/schemas/Transport'
                    description: |
                        The shipment, carried in full rather than as an id: it has no read of its own outside the order it belongs to.
                    nullable: true
            required:
                - id
                - draft_id
                - offer_id
                - buyer
                - seller
                - address
                - pickup_address
                - items
                - state
                - total
                - currency
                - transport
                - confirmed_at
                - confirmation_deadline_at
                - decline_reason
                - received_at
                - receipt_attachments
                - payout_deadline_at
                - payout_released_at
                - created_at
                - completed_at
                - cancelled_at
            type: object
        OrderAddressSnapshot:
            description: |
                A contact copied into the row, not a pointer to one. The administrative codes are what a carrier is called with, and the saved contact may have changed since the order was placed.
            properties:
                address_detail:
                    description: The street line and anything below it
                    example: Apt 4B, 12 Nguyen Hue
                    nullable: true
                    type: string
                country:
                    description: ISO 3166-1 alpha-2
                    example: VN
                    maxLength: 2
                    minLength: 2
                    type: string
                district_code:
                    description: Null where the country has no district tier
                    example: "760"
                    nullable: true
                    type: string
                full_name:
                    example: Nguyen Van A
                    type: string
                phone:
                    description: E.164
                    example: "+84900000001"
                    type: string
                province_code:
                    example: "79"
                    type: string
                ward_code:
                    example: "26743"
                    type: string
            required:
                - full_name
                - phone
                - country
                - province_code
                - district_code
                - ward_code
                - address_detail
            type: object
        OrderFeedback:
            description: |
                Both directions on one order, as far as the caller is allowed to see them.
            properties:
                mine:
                    allOf:
                        - $ref: '#/components/schemas/Feedback'
                    nullable: true
                reveal_at:
                    description: |
                        When the blind window closes and whatever has been submitted becomes visible, whether or not both sides rated. Null once both are published. Exposed for the same reason the order module exposes its deadlines: a client that cannot count down has to guess.
                    format: date-time
                    nullable: true
                    type: string
                theirs:
                    allOf:
                        - $ref: '#/components/schemas/Feedback'
                    description: Present only once published.
                    nullable: true
                theirs_submitted:
                    description: |
                        Whether the counterparty has rated at all. Shown while their rating is still blind so the caller knows a reveal is coming.
                    type: boolean
            required:
                - mine
                - theirs
                - theirs_submitted
                - reveal_at
            type: object
        OrderID:
            example: ord_fv2cpg50vkrfp
            pattern: ^ord_[0-9a-hjkmnp-tv-z]{13}$
            type: string
        OrderItem:
            description: |
                One purchased line. It exists from checkout, before the money lands: that window is the whole of what a null `order_id` means.
            properties:
                cancelled_at:
                    format: date-time
                    nullable: true
                    type: string
                created_at:
                    format: date-time
                    type: string
                currency:
                    $ref: '#/components/schemas/CurrencyCode'
                id:
                    $ref: '#/components/schemas/OrderItemID'
                listing_id:
                    allOf:
                        - $ref: '#/components/schemas/ListingID'
                    description: |
                        The listing the variant belongs to, denormalized the same way `seller_id` is, so order history can resolve it through `GET /listings?ids=` — which answers for a listing the seller has since hidden or deleted.
                note:
                    description: Buyer note, per checkout
                    example: Please leave at reception
                    type: string
                order_id:
                    allOf:
                        - $ref: '#/components/schemas/OrderID'
                    description: |
                        Null until the payment session completes and the webhook writes the order. Nobody confirms it — a seller can refuse a price, never a sale.
                    nullable: true
                payment_session_id:
                    allOf:
                        - $ref: '#/components/schemas/PaymentSessionID'
                    description: The single session covering every line of this checkout.
                quantity:
                    example: 2
                    format: int64
                    minimum: 1
                    type: integer
                seller_id:
                    $ref: '#/components/schemas/AccountID'
                total_amount:
                    description: Paid amount in the smallest unit of `currency`
                    example: 598000
                    format: int64
                    minimum: 0
                    type: integer
                transport_option:
                    description: An enabled transport option's slug
                    example: ghn-express
                    type: string
                variant_id:
                    $ref: '#/components/schemas/VariantID'
            required:
                - id
                - order_id
                - listing_id
                - variant_id
                - seller_id
                - quantity
                - currency
                - total_amount
                - transport_option
                - payment_session_id
                - note
                - cancelled_at
                - created_at
            type: object
        OrderItemID:
            example: itm_q1wd6ptz3n8kv
            pattern: ^itm_[0-9a-hjkmnp-tv-z]{13}$
            type: string
        OrderItemPage:
            properties:
                data:
                    items:
                        $ref: '#/components/schemas/OrderItem'
                    type: array
                meta:
                    $ref: '#/components/schemas/CursorMeta'
            required:
                - data
                - meta
            type: object
        OrderPage:
            properties:
                data:
                    items:
                        $ref: '#/components/schemas/Order'
                    type: array
                meta:
                    $ref: '#/components/schemas/CursorMeta'
            required:
                - data
                - meta
            type: object
        OrderRef:
            description: |
                An order's id alone, as carried by a realtime event: the two sides of a sale see different projections of an order, so pushing the entity would mean choosing whose view to send — each client re-reads its own over REST.
            properties:
                id:
                    $ref: '#/components/schemas/OrderID'
            required:
                - id
            type: object
        OrderState:
            description: |
                Derived from the timestamps rather than stored. `awaiting-confirmation` is a paid order the seller has not accepted: nothing has been handed to a carrier, and it is where every sale starts. `open` is accepted and in flight. The last two are the outcomes, and they are the predicate of the partial indexes behind this filter.
            enum:
                - awaiting-confirmation
                - open
                - completed
                - cancelled
            type: string
        OrderSummary:
            properties:
                cancelled:
                    example: 4
                    format: int64
                    minimum: 0
                    type: integer
                completed:
                    example: 128
                    format: int64
                    minimum: 0
                    type: integer
                daily:
                    description: Only the days that had an order; a client fills the gaps it wants to draw.
                    items:
                        $ref: '#/components/schemas/OrderSummaryDay'
                    type: array
                from:
                    format: date-time
                    type: string
                open:
                    example: 3
                    format: int64
                    minimum: 0
                    type: integer
                to:
                    description: Exclusive.
                    format: date-time
                    type: string
                totals:
                    description: Empty for a window with no completed order. One entry per currency sold in.
                    items:
                        $ref: '#/components/schemas/MoneyByCurrency'
                    type: array
            required:
                - from
                - to
                - open
                - completed
                - cancelled
                - totals
                - daily
            type: object
        OrderSummaryDay:
            description: One day's bucket of the series behind a chart.
            properties:
                completed:
                    example: 9
                    format: int64
                    minimum: 0
                    type: integer
                date:
                    description: |
                        A local date in the requested zone, not a timestamp — a bucket is a day, and a midnight instant would invite a reader to convert it into a different one.
                    example: "2026-08-05"
                    type: string
                placed:
                    example: 12
                    format: int64
                    minimum: 0
                    type: integer
            required:
                - date
                - placed
                - completed
            type: object
        PageMeta:
            description: Where this page sits in the collection, for a page-paginated read.
            properties:
                limit:
                    example: 20
                    maximum: 100
                    minimum: 1
                    type: integer
                page:
                    description: The 1-based page this is.
                    example: 1
                    minimum: 1
                    type: integer
                total_count:
                    description: |
                        Rows matching the filter, so a client can draw a pager. Explicitly null — not absent — when the result is a ranked top-K: an approximate nearest-neighbour search never visits the rows it did not return, so there is no total to report, and a client has to render "more results" rather than "page 3 of 12".

                        Named `total_count` rather than `total` because `total` is already a money field in this document (an offer's proposed total), and a generated client would end up with two `total`s meaning different things.
                    example: 137
                    format: int64
                    minimum: 0
                    nullable: true
                    type: integer
            required:
                - page
                - limit
                - total_count
            type: object
        PasswordResetConfirmRequest:
            properties:
                new_password:
                    maxLength: 72
                    minLength: 8
                    type: string
                token:
                    type: string
            required:
                - token
                - new_password
            type: object
        PasswordResetRequest:
            properties:
                identifier:
                    description: An email or a phone.
                    type: string
            required:
                - identifier
            type: object
        PaymentSession:
            properties:
                created_at:
                    format: date-time
                    type: string
                currency:
                    $ref: '#/components/schemas/CurrencyCode'
                expired_at:
                    description: A session still unsettled past this point is voided by a job.
                    format: date-time
                    type: string
                from_id:
                    allOf:
                        - $ref: '#/components/schemas/AccountID'
                    description: The payer. Null means the platform itself.
                    nullable: true
                id:
                    $ref: '#/components/schemas/PaymentSessionID'
                kind:
                    $ref: '#/components/schemas/PaymentSessionKind'
                note:
                    type: string
                outstanding:
                    description: |
                        The total less what has already settled on a rail: what a further payment may still tender. Computed, because a stored copy would be a second fact to keep in step with every leg.
                    example: 299000
                    format: int64
                    minimum: 0
                    type: integer
                paid_at:
                    format: date-time
                    nullable: true
                    type: string
                status:
                    $ref: '#/components/schemas/PaymentSessionStatus'
                to_id:
                    allOf:
                        - $ref: '#/components/schemas/AccountID'
                    description: The payee. Null means the platform itself.
                    nullable: true
                total_amount:
                    description: Amount owed, smallest unit of `currency`
