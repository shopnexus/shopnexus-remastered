    /admin/wallets/{accountID}/adjustments:
        post:
            description: |
                The one way a balance changes without a business event behind it, so it is the most auditable: a reason is mandatory and an `idempotency_key` is required, because a retried correction that posts twice is money invented. Reusing a key returns the movement already recorded instead of making a second one.
            parameters:
                - in: path
                  name: accountID
                  required: true
                  schema:
                    $ref: '#/components/schemas/AccountID'
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/WalletAdjustmentRequest'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/WalletTransaction'
                    description: This idempotency key was already applied; the existing movement is returned
                "201":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/WalletTransaction'
                    description: Adjusted
                "400":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: Malformed, or both deltas are zero
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: Admin role required
                "404":
                    $ref: '#/components/responses/NotFound'
                "422":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: The adjustment would drive a balance negative
            security:
                - bearerAuth: []
            summary: Correct a balance by hand
            tags:
                - admin
    /admin/withdrawals:
        get:
            parameters:
                - description: Defaults to pending
                  in: query
