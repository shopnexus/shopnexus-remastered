                "403":
                    $ref: '#/components/responses/Forbidden'
                "404":
                    $ref: '#/components/responses/NotFound'
            security:
                - bearerAuth: []
            summary: Read a purchase session and its frozen terms
            tags:
                - order
        parameters:
            - in: path
              name: id
              required: true
              schema:
                $ref: '#/components/schemas/DraftOrderID'
    /drafts/{id}/checkout:
        post:
            description: |
                Creates one `item` per line plus a single buyer-checkout payment session, and returns both. Line prices come from the session's frozen snapshot, never from the live catalog. `contact_id` is snapshotted into every line's delivery address: one session covers one SPU and therefore one seller, so a single address is correct.

                A SKU whose listing is priced `negotiable` is rejected with 422 unless the caller has an accepted offer for it — a negotiated listing must go through the offer flow.
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    $ref: '#/components/schemas/DraftOrderID'
            requestBody:
                content:
