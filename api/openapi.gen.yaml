    /contacts/{id}/phone/verification-requests:
        post:
            description: |
                The phone a carrier will actually call, which is why this one is verified and the account's sign-in phone is not. A courier who cannot reach the number is the most common way a delivery fails, so a seller shipping to an unverified number is worth flagging in the UI.

                Re-sending replaces the outstanding code rather than issuing a second valid one.
            parameters:
                - in: path
                  name: id
                  required: true
