              required: true
              schema:
                $ref: '#/components/schemas/OrderID'
        post:
            description: |
                One submission per direction per order, so this cannot be revised — a rating that could be edited after seeing the other side is not blind.

                The direction is derived from which side of the order the caller is on rather than sent, so nobody can file feedback as the other party.
            requestBody:
