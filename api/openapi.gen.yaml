                    $ref: '#/components/schemas/DisputeOutcome'
            required:
                - outcome
                - note
            type: object
        DisputeStatus:
            description: |
                The winner of one round, or `open` while it is still with a moderator. What winning does depends on the round — see the ruling endpoint.
            enum:
                - open
                - seller-wins
                - buyer-wins
            type: string
        DraftOrder:
