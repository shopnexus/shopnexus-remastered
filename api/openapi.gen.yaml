    /orders/{orderID}/feedback:
        get:
            description: |
                Returns the caller's own submission always. The counterparty's arrives as `theirs` only once it is published; while it is still blind `theirs` is null and `theirs_submitted` says whether there is anything waiting, which is as much as can be told without breaking blindness.
            responses:
                "200":
                    content:
                        application/json:
