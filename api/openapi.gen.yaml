    /admin/wallets/{accountID}:
        get:
            parameters:
                - in: path
                  name: accountID
                  required: true
                  schema:
                    $ref: '#/components/schemas/AccountID'
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/WalletList'
                    description: OK
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "403":
                    content:
                        application/json:
