                    description: |
                        Non-secret configuration only — endpoints, supported currencies, feature flags.
                    type: object
                description:
                    type: string
                id:
                    $ref: '#/components/schemas/OptionSlug'
                is_enabled:
                    type: boolean
                logo:
                    allOf:
                        - $ref: '#/components/schemas/Resource'
                    nullable: true
                name:
                    type: string
                owner_id:
                    allOf:
                        - $ref: '#/components/schemas/AccountID'
                    description: The seller who configured it. Null means system-provided.
                    nullable: true
                priority:
                    description: Display order; ties are broken by `id`.
                    type: integer
                provider:
                    description: Sub-grouping key, kebab-case — `vnpay`, `ghn`.
                    type: string
                type:
                    $ref: '#/components/schemas/OptionType'
            required:
                - id
                - type
                - provider
                - name
                - description
                - priority
                - is_enabled
                - data
                - created_at
            type: object
        OptionList:
            description: |
                Unpaginated. A marketplace has a handful of rails and carriers, and the checkout screen wants all of them at once.
            properties:
                items:
                    items:
                        $ref: '#/components/schemas/Option'
                    type: array
            required:
                - items
            type: object
        OptionSlug:
            description: |
                Stable kebab-case identifier, marketplace-wide. A natural key, not an encoded one: other modules store it as a plain string, so it is readable on the wire by design.
            example: ghn-express
            maxLength: 100
            pattern: ^[a-z0-9]+(-[a-z0-9]+)*$
            type: string
        OptionType:
            description: |
                High-level grouping key. Open-ended rather than an enum — adding an integration category must not need a migration and a spec change.
            example: transport
            maxLength: 100
            pattern: ^[a-z0-9]+(-[a-z0-9]+)*$
            type: string
        Order:
            properties:
                address:
                    $ref: '#/components/schemas/OrderAddressSnapshot'
                buyer_id:
                    $ref: '#/components/schemas/AccountID'
                cancelled_at:
                    format: date-time
                    nullable: true
                    type: string
                completed_at:
                    description: Set by the payout job
                    format: date-time
                    nullable: true
                    type: string
                created_at:
                    format: date-time
                    type: string
                draft_id:
                    $ref: '#/components/schemas/DraftOrderID'
                id:
                    $ref: '#/components/schemas/OrderID'
                items:
                    items:
                        $ref: '#/components/schemas/OrderItem'
                    type: array
                note:
                    description: Seller note
                    nullable: true
                    type: string
                payout_deadline_at:
                    description: |
                        `received_at` + 72h, computed rather than stored. A job pays the seller out at this point unless a refund is live on the order.
                    format: date-time
                    nullable: true
                    type: string
                payout_session_id:
                    allOf:
                        - $ref: '#/components/schemas/PaymentSessionID'
                    description: The escrow release to the seller. Set once the payout job has run.
                    nullable: true
                pickup_address:
                    $ref: '#/components/schemas/OrderAddressSnapshot'
                receipt_attachments:
                    description: |
                        Unboxing evidence, captured with the receipt confirmation and never added to afterwards — a refund is judged on what the buyer showed at the moment of unboxing.
                    items:
                        $ref: '#/components/schemas/ResourceID'
                    type: array
                received_at:
                    description: When the buyer confirmed receipt. Null means the payout clock has not started.
                    format: date-time
                    nullable: true
                    type: string
                seller_id:
                    $ref: '#/components/schemas/AccountID'
                state:
                    $ref: '#/components/schemas/OrderState'
                transport_id:
                    $ref: '#/components/schemas/TransportID'
            required:
                - id
                - draft_id
                - buyer_id
                - seller_id
                - transport_id
                - address
                - pickup_address
                - state
                - receipt_attachments
                - created_at
            type: object
        OrderAddressSnapshot:
            description: |
                A contact copied into the row, not a pointer to one. The administrative codes are what a carrier is called with, and the saved contact may have changed since the order was placed.
            properties:
                address:
                    description: Street or house-number line, below ward level
                    type: string
                address_detail:
                    description: Unit, floor, notes
                    nullable: true
                    type: string
                country:
                    description: ISO 3166-1 alpha-2
                    maxLength: 2
                    minLength: 2
                    type: string
                district_code:
                    description: Null where the country has no district tier
                    nullable: true
                    type: string
                district_name:
                    nullable: true
                    type: string
                full_name:
                    type: string
                phone:
                    description: E.164
                    type: string
                postal_code:
                    nullable: true
                    type: string
                provider_codes:
                    additionalProperties: true
                    description: 'Per-carrier territory ids, e.g. {"ghn": {"province_id": 201}}'
                    type: object
                province_code:
                    type: string
                province_name:
                    type: string
                ward_code:
                    type: string
                ward_name:
                    type: string
            required:
                - full_name
                - phone
                - country
                - province_code
                - ward_code
                - address
            type: object
        OrderFeedback:
            description: |
                Both directions on one order, as far as the caller is allowed to see them.
            properties:
                mine:
                    allOf:
                        - $ref: '#/components/schemas/Feedback'
                    nullable: true
                reveal_at:
                    description: |
                        When the blind window closes and whatever has been submitted becomes visible, whether or not both sides rated. Null once both are published. Exposed for the same reason the order module exposes its deadlines: a client that cannot count down has to guess.
                    format: date-time
                    nullable: true
                    type: string
                theirs:
                    allOf:
                        - $ref: '#/components/schemas/Feedback'
                    description: Present only once published.
                    nullable: true
                theirs_submitted:
                    description: |
                        Whether the counterparty has rated at all. Shown while their rating is still blind so the caller knows a reveal is coming.
                    type: boolean
            required:
                - theirs_submitted
            type: object
        OrderID:
            example: ord_fv2cpg50vkrfp
            pattern: ^ord_[0-9a-hjkmnp-tv-z]{13}$
            type: string
        OrderItem:
            properties:
                address:
                    $ref: '#/components/schemas/OrderAddressSnapshot'
                buyer_id:
                    $ref: '#/components/schemas/AccountID'
                cancelled_at:
                    format: date-time
                    nullable: true
                    type: string
                cancelled_by_id:
                    allOf:
                        - $ref: '#/components/schemas/AccountID'
