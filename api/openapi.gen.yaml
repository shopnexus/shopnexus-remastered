components:
    parameters:
        Cursor:
            description: Opaque cursor from the previous page's `next_cursor`. Omit for the first page.
            in: query
            name: cursor
            required: false
            schema:
                type: string
        Limit:
            in: query
            name: limit
            required: false
            schema:
                default: 20
                maximum: 100
                minimum: 1
                type: integer
        Page:
            description: 1-based page number.
            in: query
            name: page
            required: false
            schema:
                default: 1
                minimum: 1
                type: integer
    responses:
        BadRequest:
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/Error'
            description: Validation or malformed request
        Conflict:
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/Error'
            description: Conflicts with the current state (already exists, already done, wrong state)
        Forbidden:
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/Error'
            description: Authenticated but not allowed to act on this resource
        NotFound:
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/Error'
            description: Resource not found
        Unauthorized:
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/Error'
            description: Missing or invalid credentials
        UnprocessableEntity:
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/Error'
            description: Well-formed but rejected by a business rule
    schemas:
        AcceptOfferRequest:
            description: Acceptance still needs a delivery address and a carrier — the negotiation only settled price and quantity.
            properties:
                contact_id:
                    $ref: '#/components/schemas/ContactID'
                note:
                    maxLength: 500
                    type: string
                transport_option:
                    maxLength: 100
                    pattern: ^[a-z0-9]+(-[a-z0-9]+)*$
                    type: string
            required:
                - contact_id
                - transport_option
            type: object
        AcceptRefundRequest:
            description: |
                Accepting books the return, so the seller says here where it goes and by which carrier. `pickup_contact_id` defaults to the seller's default pickup address.
            properties:
                note:
                    maxLength: 2000
                    type: string
                pickup_contact_id:
                    allOf:
                        - $ref: '#/components/schemas/ContactID'
                    description: Where the return is delivered. Defaults to the seller's pickup address.
                transport_option:
                    description: A transport option slug owned by the common module.
                    maxLength: 100
                    pattern: ^[a-z0-9]+(-[a-z0-9]+)*$
                    type: string
            required:
                - transport_option
            type: object
        AccountID:
            example: acc_62mxefynht57b
            pattern: ^acc_[0-9a-hjkmnp-tv-z]{13}$
            type: string
        AccountRole:
            description: |
                `user` self-registers and both buys and sells. `moderator` is granted by an admin. `admin` is configured, not created.
            enum:
                - user
                - moderator
                - admin
            type: string
        AccountStatus:
            enum:
                - active
                - suspended
            type: string
        AccountSummary:
            description: The compact form used in follower and following lists.
            properties:
                avatar:
                    allOf:
                        - $ref: '#/components/schemas/Resource'
                    nullable: true
                id:
                    $ref: '#/components/schemas/AccountID'
                name:
                    type: string
            required:
                - id
                - name
            type: object
        AccountSummaryPage:
            properties:
                items:
                    items:
                        $ref: '#/components/schemas/AccountSummary'
                    type: array
                total:
                    $ref: '#/components/schemas/TotalCount'
            required:
                - items
            type: object
        AddAttachmentsRequest:
            properties:
                attachments:
                    items:
                        $ref: '#/components/schemas/ResourceID'
                    minItems: 1
                    type: array
            required:
                - attachments
            type: object
        AddCartItemRequest:
            properties:
                quantity:
                    format: int64
                    minimum: 1
                    type: integer
                sku_id:
                    $ref: '#/components/schemas/ProductSKUID'
            required:
                - sku_id
                - quantity
            type: object
        AdminAccount:
            description: |
                The staff view of an account. Carries the identifiers and the suspension state that `PublicAccount` withholds.
            properties:
                created_at:
                    format: date-time
                    type: string
                email:
                    nullable: true
                    type: string
                email_verified:
                    type: boolean
                id:
                    $ref: '#/components/schemas/AccountID'
                identity_verified:
                    type: boolean
                name:
                    type: string
                phone:
                    nullable: true
                    type: string
                role:
                    $ref: '#/components/schemas/AccountRole'
                status:
                    $ref: '#/components/schemas/AccountStatus'
                suspended_until:
                    description: Null while suspended means the suspension is permanent.
                    format: date-time
                    nullable: true
                    type: string
                suspension_reason:
                    nullable: true
                    type: string
                username:
                    nullable: true
                    type: string
            required:
                - id
                - email_verified
                - name
                - role
                - status
                - identity_verified
                - created_at
            type: object
        AdminAccountPage:
            properties:
                items:
                    items:
                        $ref: '#/components/schemas/AdminAccount'
                    type: array
                total:
                    $ref: '#/components/schemas/TotalCount'
            required:
                - items
            type: object
        AdminDisputeQueueEntry:
            description: |
                A queue row is the open round plus the refund it belongs to, since a moderator decides on the case and not on the round in isolation.
            properties:
                refund:
                    $ref: '#/components/schemas/Refund'
                round:
                    $ref: '#/components/schemas/DisputeRound'
            required:
                - round
                - refund
            type: object
        AdminIdentityDocument:
            description: A queue entry, which needs the subject alongside the document.
            properties:
                account:
                    $ref: '#/components/schemas/AccountSummary'
                document:
                    $ref: '#/components/schemas/IdentityDocument'
            required:
                - document
                - account
            type: object
        AdminReport:
            description: A queue entry. A moderator needs the reporter and the target beside the report itself.
            properties:
                open_reports_against_target:
                    description: |
                        How many other unresolved reports name the same target. A pattern is what a decision rests on rather than a single complaint.
                    format: int64
                    type: integer
                report:
                    $ref: '#/components/schemas/Report'
                reporter:
                    $ref: '#/components/schemas/AccountSummary'
                resolved_by:
                    allOf:
                        - $ref: '#/components/schemas/AccountSummary'
                    nullable: true
                target:
                    additionalProperties: true
                    description: |
                        The reported content, shaped by `ref_type`. Fetched from the module that owns it.
                    type: object
            required:
                - report
                - reporter
                - open_reports_against_target
            type: object
        AdminReportPage:
            properties:
                items:
                    items:
                        $ref: '#/components/schemas/AdminReport'
                    type: array
                next_cursor:
                    nullable: true
                    type: string
            required:
                - items
            type: object
        AuthResult:
            properties:
                access_token:
                    type: string
                account:
                    $ref: '#/components/schemas/Me'
                expires_in:
                    description: Access token lifetime in seconds.
                    type: integer
                refresh_token:
                    type: string
            required:
                - access_token
                - refresh_token
                - expires_in
                - account
            type: object
        BankAccount:
            properties:
                account_holder:
                    type: string
                account_number_masked:
                    description: Only the last digits. The full number leaves the system solely to move money.
                    example: '****1234'
                    type: string
                bank_code:
                    description: Bank identifier, e.g. `vcb`
                    type: string
                created_at:
                    format: date-time
                    type: string
                id:
                    $ref: '#/components/schemas/BankAccountID'
                is_default:
                    type: boolean
            required:
                - id
                - bank_code
                - account_number_masked
                - account_holder
                - is_default
                - created_at
            type: object
        BankAccountID:
            example: bnk_2qr5wtc4mx8jd
            pattern: ^bnk_[0-9a-hjkmnp-tv-z]{13}$
            type: string
        BankAccountList:
            properties:
                items:
                    items:
                        $ref: '#/components/schemas/BankAccount'
                    type: array
            required:
                - items
            type: object
        CancellationRequest:
            properties:
                reason:
                    maxLength: 2000
                    type: string
            required:
                - reason
            type: object
        CartItem:
            description: |
                Carries the listing id as well as the variant's, because a variant has no read of its own in the catalog: rendering the cart is one `GET /listings?ids=` over the `spu_id`s, and the row would otherwise be unresolvable.
            properties:
                created_at:
                    format: date-time
                    type: string
                id:
                    $ref: '#/components/schemas/CartItemID'
                quantity:
                    format: int64
                    type: integer
                sku_id:
                    $ref: '#/components/schemas/ProductSKUID'
                spu_id:
                    $ref: '#/components/schemas/ProductSPUID'
            required:
                - id
                - spu_id
                - sku_id
                - quantity
                - created_at
            type: object
        CartItemID:
            example: crt_3n8kvq1wd6ptz
            pattern: ^crt_[0-9a-hjkmnp-tv-z]{13}$
            type: string
        CartItemPage:
            properties:
                items:
                    items:
                        $ref: '#/components/schemas/CartItem'
                    type: array
                total:
                    $ref: '#/components/schemas/TotalCount'
            required:
                - items
            type: object
        Category:
            properties:
                description:
                    type: string
                id:
                    $ref: '#/components/schemas/CategoryID'
                name:
                    type: string
                parent_id:
                    allOf:
                        - $ref: '#/components/schemas/CategoryID'
                    description: Null for a root category.
                    nullable: true
                score:
                    $ref: '#/components/schemas/SimilarityScore'
            required:
                - id
                - name
                - description
            type: object
        CategoryID:
            example: cat_7v2p41ryaj811
            pattern: ^cat_[0-9a-hjkmnp-tv-z]{13}$
            type: string
        CategoryList:
            properties:
                items:
                    items:
                        $ref: '#/components/schemas/Category'
                    type: array
            required:
                - items
            type: object
        ChangePasswordRequest:
            properties:
                current_password:
                    type: string
                new_password:
                    maxLength: 72
                    minLength: 8
                    type: string
            required:
                - current_password
                - new_password
            type: object
        ChatUnreadCount:
            properties:
                conversations:
                    description: How many threads have anything unread.
                    format: int64
                    type: integer
                unread:
                    format: int64
                    type: integer
            required:
                - unread
                - conversations
            type: object
        CheckoutLine:
            properties:
                note:
                    maxLength: 500
                    type: string
                quantity:
                    format: int64
                    minimum: 1
                    type: integer
                sku_id:
                    $ref: '#/components/schemas/ProductSKUID'
                transport_option:
                    maxLength: 100
                    pattern: ^[a-z0-9]+(-[a-z0-9]+)*$
                    type: string
            required:
                - sku_id
                - quantity
                - transport_option
            type: object
        CheckoutRequest:
            properties:
                contact_id:
                    $ref: '#/components/schemas/ContactID'
                currency:
                    allOf:
                        - $ref: '#/components/schemas/CurrencyCode'
                    description: Must match the listing's currency.
                lines:
                    items:
                        $ref: '#/components/schemas/CheckoutLine'
                    minItems: 1
                    type: array
            required:
                - lines
                - contact_id
                - currency
            type: object
        CheckoutResult:
            description: |
                The items and the single session that pays for them. Nothing is settled until the session succeeds, and no order exists until the seller confirms.
            properties:
                items:
                    items:
                        $ref: '#/components/schemas/OrderItem'
                    type: array
                payment_session:
                    $ref: '#/components/schemas/PaymentSession'
            required:
                - items
                - payment_session
            type: object
        ConfirmOrderRequest:
            properties:
                draft_id:
                    $ref: '#/components/schemas/DraftOrderID'
                note:
                    maxLength: 500
                    type: string
                pickup_contact_id:
                    $ref: '#/components/schemas/ContactID'
                transport_option:
                    maxLength: 100
                    pattern: ^[a-z0-9]+(-[a-z0-9]+)*$
                    type: string
            required:
                - draft_id
                - transport_option
                - pickup_contact_id
            type: object
        ConfirmOrderResult:
            properties:
                order:
                    $ref: '#/components/schemas/Order'
                shipping_fee_session:
                    allOf:
                        - $ref: '#/components/schemas/PaymentSession'
                    description: Present only when the listing says the seller pays shipping.
                    nullable: true
            required:
                - order
            type: object
        ConfirmReceiptRequest:
            properties:
                attachments:
                    description: |
                        Unboxing photos or video. At least one is mandatory — a later refund or dispute is judged on this evidence.
                    items:
                        $ref: '#/components/schemas/ResourceID'
                    minItems: 1
                    type: array
                note:
                    maxLength: 2000
                    type: string
            required:
                - attachments
            type: object
        Contact:
            properties:
                address:
                    description: Street or house-number line below ward level.
                    type: string
                address_detail:
                    description: Unit or floor or notes.
                    nullable: true
                    type: string
                address_type:
                    $ref: '#/components/schemas/ContactAddressType'
                country:
                    maxLength: 2
                    minLength: 2
                    type: string
                created_at:
                    format: date-time
                    type: string
                district_code:
                    description: |
                        Null where the country has no district tier. Vietnam dropped it in 2025 and now goes province to ward.
                    nullable: true
                    type: string
                district_name:
                    nullable: true
                    type: string
                full_name:
                    type: string
                id:
                    $ref: '#/components/schemas/ContactID'
                is_default_delivery:
                    type: boolean
                is_default_pickup:
                    type: boolean
                latitude:
                    format: double
                    nullable: true
                    type: number
                longitude:
                    format: double
                    nullable: true
                    type: number
                phone:
                    description: E.164.
                    type: string
                phone_verified:
                    type: boolean
                postal_code:
                    nullable: true
                    type: string
                provider_codes:
                    additionalProperties: true
                    description: |
                        Per-carrier territory ids. Carriers number territories their own way and some still require a district.
                    type: object
                province_code:
                    type: string
                province_name:
                    type: string
                ward_code:
                    type: string
                ward_name:
                    type: string
            required:
                - id
                - full_name
                - phone
                - phone_verified
                - address_type
                - is_default_delivery
                - is_default_pickup
                - country
                - province_code
                - province_name
                - ward_code
                - ward_name
                - address
                - created_at
            type: object
        ContactAddressType:
            enum:
                - home
                - work
            type: string
        ContactID:
            example: ctc_kvq1wd6ptz3n8
            pattern: ^ctc_[0-9a-hjkmnp-tv-z]{13}$
            type: string
        ContactList:
            properties:
                items:
                    items:
                        $ref: '#/components/schemas/Contact'
                    type: array
            required:
                - items
            type: object
        Conversation:
            properties:
                counterparty:
                    $ref: '#/components/schemas/AccountSummary'
                counterparty_read_at:
                    description: |
                        How far the other side has read. This is the read receipt: a message the caller sent is seen when this is at or past its `created_at`, which is why no message carries a delivery status of its own.
                    format: date-time
                    nullable: true
                    type: string
                created_at:
                    format: date-time
                    type: string
                id:
                    $ref: '#/components/schemas/ConversationID'
                last_message:
                    allOf:
                        - $ref: '#/components/schemas/Message'
                    nullable: true
                last_message_at:
                    description: |
                        Starts at the creation time so an empty thread still sorts predictably in the inbox.
                    format: date-time
                    type: string
                read_at:
                    description: The caller's own read mark. Null while they have read nothing.
                    format: date-time
                    nullable: true
                    type: string
                unread:
                    description: The counterparty's messages after the caller's read mark.
                    format: int64
                    type: integer
            required:
                - id
                - counterparty
                - last_message_at
                - unread
                - created_at
            type: object
        ConversationID:
            example: cnv_6ptz3n8kvq1wd
            pattern: ^cnv_[0-9a-hjkmnp-tv-z]{13}$
            type: string
        ConversationPage:
            properties:
                items:
                    items:
                        $ref: '#/components/schemas/Conversation'
                    type: array
                next_cursor:
                    nullable: true
                    type: string
            required:
                - items
            type: object
        CreateBankAccountRequest:
            properties:
                account_holder:
                    maxLength: 100
                    minLength: 1
                    type: string
                account_number:
                    maxLength: 50
                    minLength: 1
                    type: string
                bank_code:
                    maxLength: 20
                    minLength: 1
                    type: string
                is_default:
                    default: false
                    type: boolean
            required:
                - bank_code
                - account_number
                - account_holder
            type: object
        CreateCategoryRequest:
            properties:
                description:
                    maxLength: 2000
                    type: string
                name:
                    maxLength: 100
                    minLength: 1
                    type: string
                parent_id:
                    $ref: '#/components/schemas/CategoryID'
            required:
                - name
                - description
            type: object
        CreateContactRequest:
            properties:
                address:
                    maxLength: 255
                    minLength: 1
                    type: string
                address_detail:
                    maxLength: 255
                    type: string
                address_type:
                    $ref: '#/components/schemas/ContactAddressType'
                country:
                    maxLength: 2
                    minLength: 2
                    pattern: ^[A-Z]{2}$
                    type: string
                district_code:
                    description: Send both district fields or neither.
                    maxLength: 20
                    type: string
                district_name:
                    maxLength: 100
                    type: string
                full_name:
                    maxLength: 100
                    minLength: 1
                    type: string
                is_default_delivery:
                    default: false
                    type: boolean
                is_default_pickup:
                    default: false
                    type: boolean
                latitude:
                    format: double
                    type: number
                longitude:
                    format: double
                    type: number
                phone:
                    pattern: ^\+[1-9][0-9]{7,14}$
                    type: string
                postal_code:
                    maxLength: 20
                    type: string
                province_code:
                    maxLength: 20
                    minLength: 1
                    type: string
                province_name:
                    maxLength: 100
                    minLength: 1
                    type: string
                ward_code:
                    maxLength: 20
                    minLength: 1
                    type: string
                ward_name:
                    maxLength: 100
                    minLength: 1
                    type: string
            required:
                - full_name
                - phone
                - address_type
                - country
                - province_code
                - province_name
                - ward_code
                - ward_name
                - address
            type: object
        CreateDraftRequest:
            properties:
                spu_id:
                    $ref: '#/components/schemas/ProductSPUID'
            required:
                - spu_id
            type: object
        CreateListingRequest:
            properties:
                attachments:
                    description: Ordered. The first becomes the cover.
                    items:
                        $ref: '#/components/schemas/ResourceID'
                    type: array
                category_id:
                    $ref: '#/components/schemas/CategoryID'
                condition:
                    $ref: '#/components/schemas/ListingCondition'
                currency:
                    $ref: '#/components/schemas/CurrencyCode'
                description:
                    maxLength: 20000
                    type: string
                name:
                    maxLength: 200
                    minLength: 1
                    type: string
                price_mode:
                    $ref: '#/components/schemas/PriceMode'
                shipping_paid_by:
                    $ref: '#/components/schemas/ShippingPaidBy'
                skus:
                    description: At least one. Price and shipping weight live on the variant.
                    items:
                        $ref: '#/components/schemas/CreateSkuRequest'
                    minItems: 1
                    type: array
                specifications:
                    additionalProperties: true
                    type: object
                tags:
                    items:
                        $ref: '#/components/schemas/TagSlug'
                    type: array
            required:
                - name
                - description
                - category_id
                - condition
                - price_mode
                - shipping_paid_by
                - currency
                - skus
            type: object
        CreateModeratorRequest:
            properties:
                country:
                    maxLength: 2
                    minLength: 2
                    pattern: ^[A-Z]{2}$
                    type: string
                email:
                    format: email
                    maxLength: 255
                    type: string
                locale:
                    pattern: ^[a-z]{2}(-[A-Z]{2})?$
                    type: string
                name:
                    maxLength: 100
                    minLength: 1
                    type: string
                password:
                    maxLength: 72
                    minLength: 8
                    type: string
                timezone:
                    maxLength: 64
                    type: string
            required:
                - email
                - password
                - name
                - country
                - locale
                - timezone
            type: object
        CreateOfferRequest:
            properties:
                quantity:
                    format: int64
                    minimum: 1
                    type: integer
                reason:
                    maxLength: 500
                    type: string
                sku_id:
                    $ref: '#/components/schemas/ProductSKUID'
                total:
                    format: int64
                    minimum: 1
                    type: integer
            required:
                - sku_id
                - quantity
                - total
            type: object
        CreateOptionRequest:
            properties:
                data:
                    additionalProperties: true
                    type: object
                description:
                    maxLength: 2000
                    type: string
                id:
                    $ref: '#/components/schemas/OptionSlug'
                is_enabled:
                    default: true
                    type: boolean
                logo_resource_id:
                    $ref: '#/components/schemas/ResourceID'
                name:
                    maxLength: 200
                    minLength: 1
                    type: string
                priority:
                    default: 0
                    type: integer
                provider:
                    maxLength: 100
                    pattern: ^[a-z0-9]+(-[a-z0-9]+)*$
                    type: string
                type:
                    $ref: '#/components/schemas/OptionType'
            required:
                - id
                - type
                - provider
                - name
            type: object
        CreateRefundRequest:
            description: |
                No item selection and no amount: a refund is for the whole order. Nothing about shipping either — the goods stay with the buyer until the refund is granted.
            properties:
                attachments:
                    description: Evidence is mandatory.
                    items:
                        $ref: '#/components/schemas/ResourceID'
                    minItems: 1
                    type: array
                reason:
                    maxLength: 2000
                    type: string
            required:
                - reason
                - attachments
            type: object
        CreateSkuRequest:
            properties:
                attachments:
                    items:
                        $ref: '#/components/schemas/ResourceID'
                    type: array
                attributes:
                    additionalProperties: true
                    type: object
                package_details:
                    additionalProperties: true
                    type: object
                price:
                    format: int64
                    minimum: 0
                    type: integer
                stock:
                    default: 0
                    format: int64
                    minimum: 0
                    type: integer
            required:
                - price
                - attributes
                - package_details
            type: object
        CreateUploadRequest:
            properties:
                checksum:
                    description: |
                        Content hash if known. A match returns the stored resource and skips the upload entirely.
                    maxLength: 128
                    type: string
                mime:
                    maxLength: 100
                    minLength: 1
                    type: string
                size:
                    description: |
                        Expected byte count, used to bound the presigned PUT. The recorded size is what storage reports at completion, not this.
                    format: int64
                    minimum: 1
                    type: integer
            required:
                - mime
                - size
            type: object
        CreateWithdrawalRequest:
            properties:
                amount:
                    format: int64
                    minimum: 1
                    type: integer
                bank_account_id:
                    $ref: '#/components/schemas/BankAccountID'
                currency:
                    $ref: '#/components/schemas/CurrencyCode'
            required:
                - currency
                - amount
                - bank_account_id
            type: object
        CurrencyCode:
            description: |
                ISO 4217. Never inferred from the account's country — one currency spans many countries, and a seller may want a balance in a foreign one.
            example: VND
            maxLength: 3
            minLength: 3
            pattern: ^[A-Z]{3}$
            type: string
        Device:
            properties:
                created_at:
                    format: date-time
                    type: string
                id:
                    $ref: '#/components/schemas/DeviceID'
                last_seen_at:
                    format: date-time
                    type: string
                platform:
                    $ref: '#/components/schemas/DevicePlatform'
                push_token_suffix:
                    description: |
                        The tail of the token, enough for a client to recognise its own install. The whole token is a delivery credential and is never returned.
                    type: string
            required:
                - id
                - platform
                - push_token_suffix
                - last_seen_at
                - created_at
