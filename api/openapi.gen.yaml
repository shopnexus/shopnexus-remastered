                    nullable: true
                created_at:
                    format: date-time
                    type: string
                currency:
                    $ref: '#/components/schemas/CurrencyCode'
                draft_id:
                    $ref: '#/components/schemas/DraftOrderID'
                id:
                    $ref: '#/components/schemas/OrderItemID'
                note:
                    description: Buyer note
                    nullable: true
                    type: string
                order_id:
                    allOf:
                        - $ref: '#/components/schemas/OrderID'
                    description: Null until the seller confirms.
                    nullable: true
                payment_status:
                    $ref: '#/components/schemas/OrderPaymentStatus'
                quantity:
                    format: int64
                    type: integer
                seller_id:
                    $ref: '#/components/schemas/AccountID'
                sku_id:
                    $ref: '#/components/schemas/ProductSKUID'
                spu_id:
                    allOf:
                        - $ref: '#/components/schemas/ProductSPUID'
                    description: |
                        The listing the variant belongs to, denormalized the same way `seller_id` is, so order history can resolve it through `GET /listings?ids=` — which answers for a listing the seller has since hidden or deleted.
                state:
                    $ref: '#/components/schemas/OrderItemState'
                total_amount:
                    description: Paid amount in the smallest unit of `currency`
                    format: int64
                    type: integer
                transport_option:
                    description: A transport option slug owned by the common module
                    type: string
            required:
                - id
                - draft_id
                - buyer_id
                - seller_id
                - spu_id
                - sku_id
                - quantity
                - currency
                - total_amount
                - transport_option
                - address
                - state
                - payment_status
                - created_at
            type: object
        OrderItemID:
            example: itm_q1wd6ptz3n8kv
            pattern: ^itm_[0-9a-hjkmnp-tv-z]{13}$
            type: string
        OrderItemPage:
            properties:
                items:
                    items:
                        $ref: '#/components/schemas/OrderItem'
                    type: array
                next_cursor:
                    nullable: true
                    type: string
            required:
                - items
            type: object
        OrderItemState:
            description: |
                Derived, not stored. `pending` = paid but no order covers it yet, `confirmed` = linked to an order, `cancelled` = withdrawn by either party.
            enum:
                - pending
                - confirmed
                - cancelled
            type: string
        OrderPage:
            properties:
                items:
                    items:
                        $ref: '#/components/schemas/Order'
                    type: array
                next_cursor:
                    nullable: true
                    type: string
            required:
                - items
            type: object
        OrderPaymentStatus:
            description: Status of the payment session covering the item; owned by finance.
            enum:
                - pending
                - processing
                - success
                - cancelled
                - failed
            type: string
        OrderShippingPaidBy:
            description: |
                Chosen by the seller when the listing is created. `buyer` adds the fee to the checkout invoice; `seller` deducts it from the payout.
            enum:
                - buyer
                - seller
            type: string
        OrderState:
            description: |
                Derived from the two outcome timestamps: `open` means neither is set, which is also the predicate of the partial indexes behind this filter.
            enum:
                - open
                - completed
                - cancelled
            type: string
        PasswordResetConfirmRequest:
            properties:
                new_password:
                    maxLength: 72
                    minLength: 8
                    type: string
                token:
                    type: string
            required:
                - token
                - new_password
            type: object
        PasswordResetRequest:
            properties:
                identifier:
                    description: An email or a phone.
                    type: string
            required:
                - identifier
            type: object
        PaymentSession:
            properties:
                amount_paid:
                    description: Sum of the settled legs, so a partly-tendered session is distinguishable from an unpaid one.
                    format: int64
                    type: integer
                created_at:
                    format: date-time
                    type: string
                currency:
                    $ref: '#/components/schemas/CurrencyCode'
                expired_at:
                    description: A session still unsettled past this point is voided by a job.
                    format: date-time
                    type: string
                from_id:
                    allOf:
                        - $ref: '#/components/schemas/AccountID'
                    description: The payer. Null means the platform itself.
                    nullable: true
                id:
                    $ref: '#/components/schemas/PaymentSessionID'
                kind:
                    $ref: '#/components/schemas/PaymentSessionKind'
                note:
                    type: string
                paid_at:
                    format: date-time
                    nullable: true
                    type: string
                status:
                    $ref: '#/components/schemas/PaymentSessionStatus'
                to_id:
                    allOf:
                        - $ref: '#/components/schemas/AccountID'
                    description: The payee. Null means the platform itself.
                    nullable: true
                total_amount:
                    description: Amount owed, smallest unit of `currency`
                    format: int64
                    type: integer
            required:
                - id
                - kind
                - status
                - currency
                - total_amount
                - amount_paid
                - note
                - created_at
                - expired_at
            type: object
        PaymentSessionID:
            example: pay_7bq2xn4tw9yef
            pattern: ^pay_[0-9a-hjkmnp-tv-z]{13}$
            type: string
        PaymentSessionKind:
            description: |
                What the money is for; it is what routes the flow. A client cannot pick this — the module that owes the money does.
            enum:
                - buyer-checkout
                - seller-confirmation-fee
                - seller-payout
                - withdrawal
            type: string
        PaymentSessionPage:
            properties:
                items:
                    items:
                        $ref: '#/components/schemas/PaymentSession'
                    type: array
                next_cursor:
                    nullable: true
                    type: string
            required:
                - items
            type: object
        PaymentSessionStatus:
            enum:
                - pending
                - processing
                - success
                - cancelled
                - failed
            type: string
        PriceMode:
            description: |
                `fixed` can be bought straight from the listing page. `negotiable` has to go through an offer first and cannot be checked out directly.
            enum:
                - fixed
                - negotiable
            type: string
        ProductSKUID:
            example: sku_vq1wd6ptz3n8k
            pattern: ^sku_[0-9a-hjkmnp-tv-z]{13}$
            type: string
        ProductSPUID:
            example: spu_1ryaj8117v2p4
            pattern: ^spu_[0-9a-hjkmnp-tv-z]{13}$
            type: string
        Profile:
            properties:
                avatar:
                    allOf:
                        - $ref: '#/components/schemas/Resource'
                    nullable: true
                country:
                    maxLength: 2
                    minLength: 2
                    type: string
                created_at:
                    format: date-time
                    type: string
                date_of_birth:
                    format: date
                    nullable: true
                    type: string
                description:
                    nullable: true
                    type: string
                gender:
                    allOf:
                        - $ref: '#/components/schemas/ProfileGender'
                    nullable: true
                locale:
                    example: vi-VN
                    type: string
                name:
                    type: string
                timezone:
                    example: Asia/Ho_Chi_Minh
                    type: string
            required:
                - name
                - country
                - locale
                - timezone
                - created_at
            type: object
        ProfileGender:
            enum:
                - male
                - female
                - other
            type: string
        PublicAccount:
            description: |
                What anyone may see about an account. The seller page: no email, no phone, no birth date, no addresses.
            properties:
                avatar:
                    allOf:
                        - $ref: '#/components/schemas/Resource'
                    nullable: true
                created_at:
                    description: Member since.
                    format: date-time
                    type: string
                description:
                    nullable: true
                    type: string
                follower_count:
                    format: int64
                    type: integer
                id:
                    $ref: '#/components/schemas/AccountID'
                identity_verified:
                    description: Shown as a trust signal.
                    type: boolean
                name:
                    type: string
            required:
                - id
                - name
                - identity_verified
                - follower_count
                - created_at
            type: object
        PutTagRequest:
            description: The slug is in the path, so this carries only what can change.
            properties:
                description:
                    maxLength: 255
                    type: string
            type: object
        RefreshRequest:
            properties:
                refresh_token:
                    type: string
            required:
                - refresh_token
            type: object
        Refund:
            description: |
                The whole case. Always for one entire order, so it carries no amount of its own — what is owed is the order's checkout total.
            properties:
                attachments:
                    description: The buyer's evidence. Each dispute round holds its opener's.
                    items:
                        $ref: '#/components/schemas/ResourceID'
                    type: array
                buyer_id:
                    $ref: '#/components/schemas/AccountID'
                created_at:
                    format: date-time
                    type: string
                deadline_at:
                    description: |
                        When the party named by `status` runs out of time, and missing it is itself a move. Null while the case waits on a moderator or a carrier, and in the terminal states.
                    format: date-time
                    nullable: true
                    type: string
                dispute:
                    allOf:
                        - $ref: '#/components/schemas/RefundDispute'
                    description: |
                        The moderation case, with every round it has been through. Null until somebody escalates.
                    nullable: true
                id:
                    $ref: '#/components/schemas/RefundID'
                order_id:
                    $ref: '#/components/schemas/OrderID'
                reason:
                    type: string
                rejection_reason:
                    description: |
                        The seller's grounds for refusing. Null in `awaiting-buyer-action` when the seller never answered at all, which is how the two paths into that state are told apart.
                    nullable: true
                    type: string
                return_transport:
                    allOf:
                        - $ref: '#/components/schemas/Transport'
                    description: |
                        The leg carrying the goods back, booked when the refund is granted and not before. Carried in full rather than as an id: the buyer was told to send this parcel, so they have to be able to track it, and a shipment has no read of its own outside the thing it belongs to.
                    nullable: true
                returned_at:
                    description: When the return reached the seller and the inspection window opened.
                    format: date-time
                    nullable: true
                    type: string
                seller_decided_at:
                    format: date-time
                    nullable: true
                    type: string
                status:
                    $ref: '#/components/schemas/RefundStatus'
            required:
                - id
                - order_id
                - buyer_id
                - status
                - reason
                - attachments
                - created_at
            type: object
        RefundDispute:
            description: |
                One moderation case on one refund, as the rounds it has been through. Read inside the refund; there is no separate dispute resource, because a dispute never exists apart from the refund it is about.
            properties:
                buyer_id:
                    $ref: '#/components/schemas/AccountID'
                order_id:
                    $ref: '#/components/schemas/OrderID'
                refund_id:
                    $ref: '#/components/schemas/RefundID'
                rounds:
                    description: |
                        Oldest first. Round 1 is the buyer's escalation, round 2 the seller's appeal on what came back. Both are kept: ruling for the buyer and then for the seller is two decisions, not one that changed its mind.
                    items:
                        $ref: '#/components/schemas/DisputeRound'
                    maxItems: 2
                    minItems: 1
                    type: array
                seller_id:
                    $ref: '#/components/schemas/AccountID'
            required:
                - refund_id
                - order_id
                - buyer_id
                - seller_id
                - rounds
            type: object
        RefundDisputeID:
            example: dsp_n8kvq1wd6ptz3
            pattern: ^dsp_[0-9a-hjkmnp-tv-z]{13}$
            type: string
        RefundDisputePage:
            properties:
                items:
                    items:
                        $ref: '#/components/schemas/AdminDisputeQueueEntry'
                    type: array
                next_cursor:
                    nullable: true
                    type: string
            required:
                - items
            type: object
        RefundID:
            example: rfd_z3n8kvq1wd6pt
            pattern: ^rfd_[0-9a-hjkmnp-tv-z]{13}$
            type: string
        RefundPage:
            properties:
                items:
                    items:
                        $ref: '#/components/schemas/Refund'
                    type: array
                next_cursor:
                    nullable: true
                    type: string
            required:
                - items
            type: object
        RefundStatus:
            description: |
                Every live value names the party whose move the refund is waiting on, and each of those carries a `deadline_at` that the party can miss:

                `awaiting-seller-review` — the seller accepts or rejects. Missing it hands the case to the buyer. `awaiting-buyer-action` — the buyer escalates to a moderator or lets the refund lapse; `rejection_reason` says whether the seller refused or just went quiet. `disputed` — a moderator has an open round. `returning` — the goods are on their way back; only a granted refund ever reaches here. `returned` — the seller inspects and may appeal until the window closes.

                Then three terminals: `accepted` is money back to the buyer, `rejected` is no refund and the payout stands, `cancelled` is the buyer withdrawing before the seller decided.
            enum:
                - awaiting-seller-review
                - awaiting-buyer-action
                - disputed
                - returning
                - returned
                - accepted
                - rejected
                - cancelled
            type: string
        RegisterDeviceRequest:
            properties:
                platform:
                    $ref: '#/components/schemas/DevicePlatform'
                push_token:
                    maxLength: 4096
                    minLength: 1
                    type: string
            required:
                - platform
                - push_token
            type: object
        RegisterRequest:
            description: |
                At least one of email, phone or username is required. The profile fields are part of the same request because the account and its profile are created together.
            properties:
                country:
                    maxLength: 2
                    minLength: 2
                    pattern: ^[A-Z]{2}$
                    type: string
                email:
                    format: email
                    maxLength: 255
                    type: string
                locale:
                    example: vi-VN
                    pattern: ^[a-z]{2}(-[A-Z]{2})?$
                    type: string
                name:
                    description: Display name.
                    maxLength: 100
                    minLength: 1
                    type: string
                password:
                    maxLength: 72
                    minLength: 8
                    type: string
                phone:
                    description: E.164.
                    pattern: ^\+[1-9][0-9]{7,14}$
                    type: string
                timezone:
                    example: Asia/Ho_Chi_Minh
                    maxLength: 64
                    type: string
                username:
                    maxLength: 100
                    minLength: 3
                    pattern: ^[a-z0-9._-]+$
                    type: string
            required:
                - password
                - name
                - country
                - locale
                - timezone
            type: object
        RejectRefundRequest:
            description: |
                A reason is mandatory: it is what the buyer decides whether to escalate on. Counter-evidence is not required here, because a rejection is not yet a case — the seller supplies it if the buyer escalates.
            properties:
                reason:
                    maxLength: 2000
                    minLength: 1
                    type: string
            required:
                - reason
            type: object
        Report:
            properties:
                action_taken:
                    allOf:
                        - $ref: '#/components/schemas/ReportAction'
                    description: Null until the report is resolved.
                    nullable: true
                created_at:
                    format: date-time
                    type: string
                detail:
                    type: string
                id:
                    $ref: '#/components/schemas/ReportID'
                reason:
                    $ref: '#/components/schemas/ReportReason'
                ref_id:
                    description: |
                        Opaque id of the reported thing. Which prefix is valid follows from `ref_type`, which is why the two are validated together.
                    example: spu_1ryaj8117v2p4
                    pattern: ^[a-z]{3}_[0-9a-hjkmnp-tv-z]{13}$
                    type: string
                ref_type:
                    $ref: '#/components/schemas/ReportRefType'
                resolution_note:
                    nullable: true
                    type: string
                resolved_at:
                    format: date-time
                    nullable: true
                    type: string
                status:
                    $ref: '#/components/schemas/ReportStatus'
            required:
                - id
                - ref_type
                - ref_id
                - reason
                - detail
                - status
                - created_at
            type: object
        ReportAction:
            description: What a moderator did about an upheld report. `none` goes with a dismissal.
            enum:
                - none
                - listing-removed
                - message-removed
                - account-suspended
                - warning
            type: string
        ReportID:
            example: rpt_9c4vt6bkn1pzs
            pattern: ^rpt_[0-9a-hjkmnp-tv-z]{13}$
            type: string
        ReportPage:
            properties:
                items:
                    items:
                        $ref: '#/components/schemas/Report'
                    type: array
                next_cursor:
                    nullable: true
                    type: string
            required:
                - items
            type: object
        ReportReason:
            enum:
                - scam
                - counterfeit
                - prohibited
                - harassment
                - spam
                - inappropriate
                - other
            type: string
        ReportRefType:
            enum:
                - listing
                - account
                - message
                - review
                - review-reply
            type: string
        ReportStatus:
            enum:
                - open
                - reviewing
                - actioned
                - dismissed
            type: string
        Reputation:
            description: |
                Recomputed, never written directly. Transaction ratings and product-review ratings stay apart: one order can produce both and summing them would count it twice.
            properties:
                account_id:
                    $ref: '#/components/schemas/AccountID'
                cancelled_orders:
                    format: int64
                    type: integer
                completed_orders:
                    format: int64
                    type: integer
                rating_average:
                    description: Average transaction feedback from 1 to 5. Zero when there is none.
                    format: double
                    type: number
                rating_count:
                    format: int64
                    type: integer
                review_rating_average:
                    description: Average product-review rating. Always zero for the buyer role.
                    format: double
                    type: number
                review_rating_count:
                    format: int64
                    type: integer
                role:
                    $ref: '#/components/schemas/ReputationRole'
                updated_at:
                    description: When it was last recomputed.
                    format: date-time
                    type: string
            required:
                - account_id
                - role
                - rating_average
                - rating_count
                - review_rating_average
                - review_rating_count
                - completed_orders
                - cancelled_orders
                - updated_at
            type: object
        ReputationRole:
            enum:
                - seller
                - buyer
            type: string
        ResolveReportRequest:
            properties:
                action_taken:
                    allOf:
                        - $ref: '#/components/schemas/ReportAction'
                    description: |
                        Required. `none` goes with a dismissal; upholding the report names what was done.
                note:
                    maxLength: 2000
                    type: string
                status:
                    description: A verdict so open and reviewing are not choices.
                    enum:
                        - actioned
                        - dismissed
                    type: string
            required:
                - status
                - action_taken
            type: object
        Resource:
            properties:
                checksum:
                    description: Content hash, used to share one stored object between identical uploads.
                    nullable: true
                    type: string
                completed_at:
                    description: |
                        Null until the upload was confirmed. An unconfirmed resource cannot be attached to anything.
                    format: date-time
                    nullable: true
                    type: string
                created_at:
                    format: date-time
                    type: string
                id:
                    $ref: '#/components/schemas/ResourceID'
                metadata:
                    additionalProperties: true
                    description: Backend-specific extras — dimensions, duration, CDN path.
                    type: object
                mime:
                    example: image/jpeg
                    type: string
                provider:
                    description: Storage backend, kebab-case — `s3`, `minio`, `local`.
                    type: string
                size:
                    description: Bytes, as read back from storage rather than as declared.
                    format: int64
                    type: integer
                url:
                    description: |
                        Short-lived URL to fetch the bytes. Null while the upload is unconfirmed. Not a stable address: store the id, not this.
                    nullable: true
                    type: string
                url_expires_at:
                    format: date-time
                    nullable: true
                    type: string
            required:
                - id
                - provider
                - mime
                - size
                - metadata
                - created_at
            type: object
        ResourceID:
            example: res_4mx8jd2qr5wtc
            pattern: ^res_[0-9a-hjkmnp-tv-z]{13}$
            type: string
        Review:
            properties:
                attachments:
                    items:
                        $ref: '#/components/schemas/Resource'
                    type: array
                author:
                    $ref: '#/components/schemas/AccountSummary'
                body:
                    type: string
                created_at:
                    format: date-time
                    type: string
                id:
                    $ref: '#/components/schemas/ReviewID'
                rating:
                    maximum: 5
                    minimum: 1
                    type: integer
                replies:
                    description: |
                        The first few, oldest first. Replies are unlimited, so a page of reviews cannot carry all of them — `reply_count` says how many there are and `GET /reviews/{id}` returns the rest.
                    items:
                        $ref: '#/components/schemas/ReviewReply'
                    maxItems: 3
                    type: array
                reply_count:
                    format: int64
                    type: integer
                spu_id:
                    $ref: '#/components/schemas/ProductSPUID'
                votes:
                    $ref: '#/components/schemas/ReviewVoteTally'
            required:
                - id
                - spu_id
                - author
                - rating
                - body
                - attachments
                - replies
                - reply_count
                - votes
                - created_at
            type: object
        ReviewID:
            example: rvw_qk4mfx7bd32h9
            pattern: ^rvw_[0-9a-hjkmnp-tv-z]{13}$
            type: string
        ReviewPage:
            properties:
                items:
                    items:
                        $ref: '#/components/schemas/Review'
                    type: array
                next_cursor:
                    nullable: true
                    type: string
            required:
                - items
            type: object
        ReviewReply:
            properties:
                author:
                    $ref: '#/components/schemas/AccountSummary'
                body:
                    type: string
                created_at:
                    format: date-time
                    type: string
                id:
                    $ref: '#/components/schemas/ReviewReplyID'
                is_seller:
                    description: Whether the author owns the listing.
                    type: boolean
            required:
                - id
                - author
                - is_seller
                - body
                - created_at
            type: object
        ReviewReplyID:
            example: rpl_mfx7bd32h9qk4
            pattern: ^rpl_[0-9a-hjkmnp-tv-z]{13}$
            type: string
        ReviewVoteTally:
            properties:
                helpful:
                    format: int64
                    type: integer
                my_vote:
                    description: The caller's own vote. Null when they have not voted.
                    enum:
                        - -1
                        - 1
                    nullable: true
                    type: integer
                not_helpful:
                    format: int64
                    type: integer
            required:
                - helpful
                - not_helpful
            type: object
        SemanticSeed:
            description: |
                A tag slug or a category id, told apart the same way a listing ref is: an opaque id always carries an underscore after its prefix and a slug never does.

                Both are legal seeds for the same query because every embedding column in this schema is `vector(1024)` indexed with `vector_cosine_ops` — one BGE-M3 space — so the distance between a category and a tag means the same thing as the distance between two tags. A seed whose vector the cron has not computed yet is rejected rather than silently ignored, since dropping it would answer a different question than the one asked.
            oneOf:
                - $ref: '#/components/schemas/TagSlug'
                - $ref: '#/components/schemas/CategoryID'
        SendMessageRequest:
            description: A body or at least one attachment is required.
            properties:
                attachments:
                    items:
                        $ref: '#/components/schemas/ResourceID'
                    type: array
                body:
                    maxLength: 4000
                    type: string
                refs:
                    additionalProperties: true
                    description: |
                        References to point at, each checked against the caller's access to it. There is no way to set `card` from here: a system payload is the backend's to write.
                    type: object
            type: object
        ShippingPaidBy:
            description: |
                Chosen by the seller when the listing is created. `buyer` adds the fee to the checkout invoice. `seller` deducts it from the payout.
            enum:
                - buyer
                - seller
            type: string
        SimilarityScore:
            description: |
                Relevance, always oriented so that higher is closer — for a vector ranking that is `1 - (a <=> b)`, the cosine similarity, because the operator itself returns a distance. Null unless the request asked for a ranking.
            format: double
            nullable: true
            type: number
        Sku:
            description: A purchasable variant. Price and package details live here rather than on the listing.
            properties:
                attributes:
                    additionalProperties: true
                    description: Variant attributes such as size and colour.
                    type: object
                created_at:
                    format: date-time
                    type: string
                id:
                    $ref: '#/components/schemas/ProductSKUID'
                images:
                    description: Empty means fall back to the listing gallery.
                    items:
                        $ref: '#/components/schemas/Resource'
                    type: array
                package_details:
                    additionalProperties: true
                    description: Weight and dimensions. A shipping quote is computed from these.
                    type: object
                price:
                    description: Smallest unit of the listing's currency.
                    format: int64
                    type: integer
                stock:
                    $ref: '#/components/schemas/Stock'
            required:
                - id
                - price
                - attributes
                - package_details
                - images
                - stock
                - created_at
            type: object
        StartConversationRequest:
            properties:
                account_id:
                    $ref: '#/components/schemas/AccountID'
            required:
                - account_id
            type: object
        StartIdentityVerificationRequest:
            properties:
                doc_type:
                    $ref: '#/components/schemas/IdentityDocumentType'
            required:
                - doc_type
            type: object
        StartPaymentRequest:
            properties:
                amount:
                    description: Omit to tender the whole outstanding balance. Pass it to split the session across rails.
                    format: int64
                    minimum: 1
                    type: integer
                payment_option:
                    description: A payment option slug from the common module.
                    maxLength: 100
                    pattern: ^[a-z0-9]+(-[a-z0-9]+)*$
                    type: string
                return_url:
                    description: |
                        Where the gateway sends the payer back. Checked against the platform's own allowlist of hosts and rejected otherwise — a URL that reaches a redirect unvalidated is an open redirect wearing a payment flow.
                    maxLength: 2048
                    type: string
            required:
                - payment_option
            type: object
        Stock:
            description: |
                Always read inside its own variant, so it does not repeat the sku id.
            properties:
                available:
                    description: Total minus reserved.
                    format: int64
                    type: integer
                reserved:
                    description: Held by paid but unconfirmed items. Moved by checkout and by cancellation and never set directly.
                    format: int64
                    type: integer
                stock:
                    description: Total on hand.
                    format: int64
                    type: integer
            required:
                - stock
                - reserved
                - available
            type: object
        SubmitFeedbackRequest:
            description: |
                The direction and the ratee both follow from the order, so neither is sent.
            properties:
                comment:
                    maxLength: 2000
                    type: string
                rating:
                    maximum: 5
                    minimum: 1
                    type: integer
            required:
                - rating
            type: object
        SubmitReportRequest:
            properties:
                detail:
                    maxLength: 2000
                    type: string
                reason:
                    $ref: '#/components/schemas/ReportReason'
                ref_id:
                    pattern: ^[a-z]{3}_[0-9a-hjkmnp-tv-z]{13}$
                    type: string
                ref_type:
                    $ref: '#/components/schemas/ReportRefType'
            required:
                - ref_type
                - ref_id
                - reason
            type: object
        SubmitReviewReplyRequest:
            properties:
                body:
                    maxLength: 2000
                    minLength: 1
                    type: string
            required:
                - body
            type: object
        SubmitReviewRequest:
            properties:
                attachments:
                    items:
                        $ref: '#/components/schemas/ResourceID'
                    type: array
                body:
                    maxLength: 2000
                    type: string
                order_id:
                    $ref: '#/components/schemas/OrderID'
                rating:
                    maximum: 5
                    minimum: 1
                    type: integer
            required:
                - order_id
                - rating
            type: object
        SuspendAccountRequest:
            properties:
                reason:
                    maxLength: 2000
                    minLength: 1
                    type: string
                until:
                    description: Omit for a permanent suspension.
                    format: date-time
                    type: string
            required:
                - reason
            type: object
        Tag:
            properties:
                description:
                    nullable: true
                    type: string
                score:
                    $ref: '#/components/schemas/SimilarityScore'
                slug:
                    $ref: '#/components/schemas/TagSlug'
            required:
                - slug
            type: object
        TagPage:
            properties:
                items:
                    items:
                        $ref: '#/components/schemas/Tag'
                    type: array
                total:
                    $ref: '#/components/schemas/TotalCount'
            required:
                - items
            type: object
        TagSlug:
            description: A tag's id is its slug. A natural key, so it is never encoded.
            example: handmade
            maxLength: 100
            pattern: ^[a-z0-9]+(-[a-z0-9]+)*$
            type: string
        TakedownRequest:
            properties:
                notify_seller:
                    default: true
                    type: boolean
                reason:
                    maxLength: 2000
                    minLength: 1
                    type: string
            required:
                - reason
            type: object
        TaxCodeType:
            enum:
                - individual
                - business
                - household
            type: string
        TaxInfo:
            properties:
                created_at:
                    format: date-time
                    type: string
                legal_name:
                    type: string
                tax_code:
                    example: "0123456789"
                    type: string
                tax_code_type:
                    $ref: '#/components/schemas/TaxCodeType'
                verification_status:
                    $ref: '#/components/schemas/TaxVerificationStatus'
                verified_at:
                    format: date-time
                    nullable: true
                    type: string
            required:
                - tax_code
                - tax_code_type
                - legal_name
                - verification_status
                - created_at
            type: object
        TaxVerificationRequest:
            properties:
                note:
                    maxLength: 2000
                    type: string
                source:
                    description: What the verdict was based on
                    maxLength: 200
                    type: string
                status:
                    description: A verdict, so `pending` is not a choice
                    enum:
                        - verified
                        - rejected
                    type: string
            required:
                - status
                - source
            type: object
        TaxVerificationStatus:
            enum:
                - pending
                - verified
                - rejected
            type: string
        TotalCount:
            description: |
                Rows matching the filter, so a page-paginated client can draw a pager. Null when the result is a ranked top-K: an approximate nearest-neighbour search never visits the rows it did not return, so there is no total to report.
            format: int64
            nullable: true
            type: integer
        Transaction:
            description: One movement on an external rail. Append-only.
            properties:
                amount:
                    description: Signed — positive is a charge, negative is a reversal.
                    format: int64
                    type: integer
                checkout_url:
                    description: Where to send the payer for this leg. Null once the rail no longer needs it, or for rails that have none.
                    nullable: true
                    type: string
                created_at:
                    format: date-time
                    type: string
                currency:
                    allOf:
                        - $ref: '#/components/schemas/CurrencyCode'
                    description: What the rail actually debits, which split tender may make differ from the session's currency.
                error:
                    nullable: true
                    type: string
                expired_at:
                    description: Gateway URL expiry
                    format: date-time
                    nullable: true
                    type: string
                id:
                    $ref: '#/components/schemas/TransactionID'
                note:
                    type: string
                payment_option:
                    description: A payment option slug owned by the common module
                    type: string
                reverses_id:
                    allOf:
                        - $ref: '#/components/schemas/TransactionID'
                    description: The leg this one reverses. Set on reversals, null on originals.
                    nullable: true
                session_id:
                    $ref: '#/components/schemas/PaymentSessionID'
                settled_at:
                    format: date-time
                    nullable: true
                    type: string
                status:
                    $ref: '#/components/schemas/TransactionStatus'
            required:
                - id
                - session_id
                - status
                - payment_option
                - amount
                - currency
                - note
                - created_at
            type: object
        TransactionID:
            example: txn_5wtc4mx8jd2qr
            pattern: ^txn_[0-9a-hjkmnp-tv-z]{13}$
            type: string
        TransactionList:
            description: Unpaginated — a session has as many legs as rails it was split across, which is a handful.
            properties:
                items:
                    items:
                        $ref: '#/components/schemas/Transaction'
                    type: array
            required:
                - items
            type: object
        TransactionStatus:
            description: A leg goes pending → success or failed, and success is terminal. Deliberately narrower than a session's status.
            enum:
                - pending
                - success
                - failed
            type: string
        Transport:
            properties:
                created_at:
                    format: date-time
                    type: string
                events:
                    items:
                        $ref: '#/components/schemas/TransportEvent'
                    type: array
                id:
                    $ref: '#/components/schemas/TransportID'
                label_url:
                    nullable: true
                    type: string
                option:
                    description: A transport option slug owned by the common module
                    type: string
                status:
                    $ref: '#/components/schemas/TransportStatus'
                tracking_number:
                    nullable: true
                    type: string
            required:
                - id
                - option
                - status
                - events
                - created_at
            type: object
        TransportEvent:
            description: One carrier-reported checkpoint.
            properties:
                note:
                    type: string
                occurred_at:
                    format: date-time
                    type: string
                status:
                    $ref: '#/components/schemas/TransportStatus'
            required:
                - status
                - occurred_at
            type: object
        TransportID:
            example: trp_d6ptz3n8kvq1w
            pattern: ^trp_[0-9a-hjkmnp-tv-z]{13}$
            type: string
        TransportStatus:
            description: Shipment lifecycle as the carrier reports it.
            enum:
                - pending
                - picked-up
                - in-transit
                - delivered
                - returned
                - failed
                - cancelled
            type: string
        UnreadCount:
            properties:
                unread:
                    format: int64
                    type: integer
            required:
                - unread
            type: object
        UpdateAccountRequest:
            description: Every field optional. Setting one to null removes it, which is refused when it is the last identifier.
            properties:
                email:
                    format: email
                    maxLength: 255
                    nullable: true
                    type: string
                phone:
                    nullable: true
                    pattern: ^\+[1-9][0-9]{7,14}$
                    type: string
                username:
                    maxLength: 100
                    minLength: 3
                    nullable: true
                    pattern: ^[a-z0-9._-]+$
                    type: string
            type: object
        UpdateBankAccountRequest:
            properties:
                is_default:
                    description: The only mutable field
                    enum:
                        - true
                    type: boolean
            required:
                - is_default
            type: object
        UpdateCartItemRequest:
            properties:
                quantity:
                    format: int64
                    minimum: 1
                    type: integer
            required:
                - quantity
            type: object
        UpdateCategoryRequest:
            description: Every field optional. Setting the parent to null makes it a root.
            properties:
                description:
                    maxLength: 2000
                    type: string
                name:
                    maxLength: 100
                    minLength: 1
                    type: string
                parent_id:
                    allOf:
                        - $ref: '#/components/schemas/CategoryID'
                    nullable: true
            type: object
        UpdateContactRequest:
            description: Every field optional. Changing `phone` clears `phone_verified`.
            properties:
                address:
                    maxLength: 255
                    type: string
                address_detail:
                    maxLength: 255
                    nullable: true
                    type: string
                address_type:
                    $ref: '#/components/schemas/ContactAddressType'
                district_code:
                    maxLength: 20
                    nullable: true
                    type: string
                district_name:
                    maxLength: 100
                    nullable: true
                    type: string
                full_name:
                    maxLength: 100
                    minLength: 1
                    type: string
                is_default_delivery:
                    type: boolean
                is_default_pickup:
                    type: boolean
                latitude:
                    format: double
                    nullable: true
                    type: number
                longitude:
                    format: double
                    nullable: true
                    type: number
                phone:
                    pattern: ^\+[1-9][0-9]{7,14}$
                    type: string
                postal_code:
                    maxLength: 20
                    nullable: true
                    type: string
                province_code:
                    maxLength: 20
                    type: string
                province_name:
                    maxLength: 100
                    type: string
                ward_code:
                    maxLength: 20
                    type: string
                ward_name:
                    maxLength: 100
                    type: string
            type: object
        UpdateListingRequest:
            description: Every field optional. Variants are edited through their own endpoints.
            properties:
                attachments:
                    items:
                        $ref: '#/components/schemas/ResourceID'
                    type: array
                category_id:
                    $ref: '#/components/schemas/CategoryID'
                condition:
                    $ref: '#/components/schemas/ListingCondition'
                description:
                    maxLength: 20000
                    type: string
                featured_sku_id:
                    $ref: '#/components/schemas/ProductSKUID'
                name:
                    maxLength: 200
                    minLength: 1
                    type: string
                price_mode:
                    $ref: '#/components/schemas/PriceMode'
                shipping_paid_by:
                    $ref: '#/components/schemas/ShippingPaidBy'
                specifications:
                    additionalProperties: true
                    type: object
                tags:
                    items:
                        $ref: '#/components/schemas/TagSlug'
                    type: array
            type: object
        UpdateMessageRequest:
            properties:
                body:
                    maxLength: 4000
                    minLength: 1
                    type: string
            required:
                - body
            type: object
        UpdateNotificationPreferencesRequest:
            properties:
                items:
                    items:
                        properties:
                            category:
                                $ref: '#/components/schemas/NotificationCategory'
                            channel:
                                $ref: '#/components/schemas/NotificationChannel'
                            is_enabled:
                                type: boolean
                        required:
                            - category
                            - channel
                            - is_enabled
                        type: object
                    minItems: 1
                    type: array
            required:
                - items
            type: object
        UpdateOfferRequest:
            properties:
                quantity:
                    format: int64
                    minimum: 1
                    type: integer
                reason:
                    maxLength: 500
                    type: string
                total:
                    format: int64
                    minimum: 1
                    type: integer
            required:
                - quantity
                - total
            type: object
        UpdateOptionRequest:
            description: |
                Every field optional; the slug, type and provider are fixed at creation.
            properties:
                data:
                    additionalProperties: true
                    type: object
                description:
                    maxLength: 2000
                    type: string
                is_enabled:
                    type: boolean
                logo_resource_id:
                    allOf:
                        - $ref: '#/components/schemas/ResourceID'
                    nullable: true
                name:
                    maxLength: 200
                    minLength: 1
                    type: string
                priority:
                    type: integer
            type: object
        UpdateProfileRequest:
            description: Every field optional.
            properties:
                avatar_resource_id:
                    allOf:
                        - $ref: '#/components/schemas/ResourceID'
                    nullable: true
                country:
                    maxLength: 2
                    minLength: 2
                    pattern: ^[A-Z]{2}$
                    type: string
                date_of_birth:
                    format: date
                    nullable: true
                    type: string
                description:
                    maxLength: 2000
                    nullable: true
                    type: string
                gender:
                    allOf:
                        - $ref: '#/components/schemas/ProfileGender'
                    nullable: true
                locale:
                    pattern: ^[a-z]{2}(-[A-Z]{2})?$
                    type: string
                name:
                    maxLength: 100
                    minLength: 1
                    type: string
                timezone:
                    maxLength: 64
                    type: string
            type: object
        UpdateReviewRequest:
            description: Every field optional.
            properties:
                attachments:
                    items:
                        $ref: '#/components/schemas/ResourceID'
                    type: array
                body:
                    maxLength: 2000
                    type: string
                rating:
                    maximum: 5
                    minimum: 1
                    type: integer
            type: object
        UpdateSkuRequest:
            description: Every field optional.
            properties:
                attachments:
                    items:
                        $ref: '#/components/schemas/ResourceID'
                    type: array
                attributes:
                    additionalProperties: true
                    type: object
                package_details:
                    additionalProperties: true
                    type: object
                price:
                    format: int64
                    minimum: 0
                    type: integer
                stock:
                    description: The new total on hand. Refused below what is already reserved.
                    format: int64
                    minimum: 0
                    type: integer
            type: object
        UploadTicket:
            properties:
                resource:
                    $ref: '#/components/schemas/Resource'
                upload_expires_at:
                    format: date-time
                    nullable: true
                    type: string
                upload_url:
                    description: |
                        PUT the bytes here, then confirm. Null when a checksum match meant there was nothing to upload.
                    nullable: true
                    type: string
            required:
                - resource
            type: object
        UpsertTaxInfoRequest:
            properties:
                legal_name:
                    maxLength: 200
                    minLength: 1
                    type: string
                tax_code:
                    description: Vietnamese MST — ten digits, or ten plus a three-digit branch.
                    pattern: ^\d{10}(-\d{3})?$
                    type: string
                tax_code_type:
                    $ref: '#/components/schemas/TaxCodeType'
            required:
                - tax_code
                - tax_code_type
                - legal_name
            type: object
        VerifyContactPhoneRequest:
            properties:
                code:
                    maxLength: 10
                    minLength: 4
                    type: string
            required:
                - code
            type: object
        VoteReviewRequest:
            properties:
                vote:
                    description: |
                        Helpful or not. There is no neutral value — withdrawing a vote is a delete.
                    enum:
                        - -1
                        - 1
                    type: integer
            required:
                - vote
            type: object
        Wallet:
            properties:
                account_id:
                    $ref: '#/components/schemas/AccountID'
                available_balance:
                    description: Spendable and withdrawable
                    format: int64
                    type: integer
                created_at:
                    format: date-time
                    type: string
                currency:
                    $ref: '#/components/schemas/CurrencyCode'
                held_balance:
                    description: Locked in escrow; not the owner's to draw yet
                    format: int64
                    type: integer
            required:
                - account_id
                - currency
                - available_balance
                - held_balance
                - created_at
            type: object
        WalletAdjustmentRequest:
            description: |
                At least one delta must be non-zero. A movement that moves nothing is refused rather than recorded: the ledger rejects it at the database, and a row that says nothing is worse than an error.
            properties:
                available_delta:
                    default: 0
                    format: int64
                    type: integer
                currency:
                    $ref: '#/components/schemas/CurrencyCode'
                held_delta:
                    default: 0
                    format: int64
                    type: integer
                idempotency_key:
                    description: Required. A retried correction that posts twice is money invented.
                    maxLength: 200
                    minLength: 1
                    type: string
                reason:
                    maxLength: 2000
                    minLength: 1
                    type: string
            required:
                - currency
                - reason
                - idempotency_key
            type: object
        WalletList:
            properties:
                items:
                    items:
                        $ref: '#/components/schemas/Wallet'
                    type: array
            required:
                - items
            type: object
        WalletTransaction:
            description: One balance change with its before/after snapshot. Append-only, and the only record of a movement that stays inside a wallet.
            properties:
                available_after:
                    format: int64
                    type: integer
                available_delta:
                    description: Signed change to the available balance
                    format: int64
                    type: integer
                created_at:
                    format: date-time
                    type: string
                currency:
                    $ref: '#/components/schemas/CurrencyCode'
                group_id:
                    description: |
                        Shared by every leg of one logical movement — a checkout is a debit plus an escrow hold plus a fee. An opaque token for grouping rows in a response, not an address: nothing accepts it as input and no endpoint resolves it.
                    nullable: true
                    type: string
                held_after:
                    format: int64
                    type: integer
                held_delta:
                    description: Signed change to the held balance
                    format: int64
                    type: integer
                kind:
                    $ref: '#/components/schemas/WalletTransactionKind'
                note:
                    type: string
                ref_id:
                    description: Opaque id of the referenced entity, its prefix given by `ref_type`.
                    nullable: true
                    type: string
                ref_type:
                    description: What this movement was for. Null on an adjustment.
                    enum:
                        - order
                        - payment-session
                    nullable: true
                    type: string
                seq:
                    description: |
                        Position in this wallet's ledger, from 1. Identifies the row and orders it; a gap means a missing movement. Per wallet, so each currency counts from 1 again.
                    format: int64
                    type: integer
            required:
                - seq
                - currency
                - kind
                - available_delta
                - held_delta
                - available_after
                - held_after
                - note
                - created_at
            type: object
        WalletTransactionKind:
            enum:
                - topup
                - escrow-hold
                - escrow-release
                - payout
                - refund
                - withdrawal
                - fee
                - adjustment
            type: string
        WalletTransactionPage:
            properties:
                items:
                    items:
                        $ref: '#/components/schemas/WalletTransaction'
                    type: array
                next_cursor:
                    nullable: true
                    type: string
            required:
                - items
            type: object
        Withdrawal:
            description: A payment session of kind `withdrawal`, projected with its destination and the admin's resolution.
            properties:
                amount:
                    format: int64
                    type: integer
                bank_account:
                    $ref: '#/components/schemas/BankAccount'
                created_at:
                    format: date-time
                    type: string
                currency:
                    $ref: '#/components/schemas/CurrencyCode'
                id:
                    $ref: '#/components/schemas/PaymentSessionID'
                resolution_note:
                    nullable: true
                    type: string
                resolved_at:
                    format: date-time
                    nullable: true
                    type: string
                resolved_by_id:
                    allOf:
                        - $ref: '#/components/schemas/AccountID'
                    description: |
                        The admin who decided. This is also what separates the two ways a withdrawal ends up not-successful: set means an admin rejected it, null on a closed withdrawal means the owner cancelled it themselves.
                    nullable: true
                status:
                    $ref: '#/components/schemas/PaymentSessionStatus'
            required:
                - id
                - status
                - currency
                - amount
                - bank_account
                - created_at
            type: object
        WithdrawalApprovalRequest:
            properties:
                note:
                    maxLength: 2000
                    type: string
                provider_ref:
                    description: The bank's or gateway's reference for the outbound transfer
                    maxLength: 200
                    type: string
            required:
                - note
            type: object
        WithdrawalPage:
            properties:
                items:
                    items:
                        $ref: '#/components/schemas/Withdrawal'
                    type: array
                total:
                    $ref: '#/components/schemas/TotalCount'
            required:
                - items
            type: object
        WithdrawalRejectionRequest:
            properties:
                reason:
                    maxLength: 2000
                    minLength: 1
                    type: string
            required:
                - reason
            type: object
    securitySchemes:
        bearerAuth:
            bearerFormat: JWT
            scheme: bearer
            type: http
info:
    description: |
        Public REST surface of the ShopNexus C2C marketplace gateway. This file is the base document (info, servers, security, shared parameters and responses). Per-module paths and schemas live in internal/module/<module>/api/openapi.yaml and are merged into api/openapi.gen.yaml by `go generate ./...` (cmd/specgen). Edit the fragments, not the generated file.
        Only `paths` and `components.schemas` are merged from a fragment, so everything reusable across modules — parameters, responses, security schemes — has to be defined here.
    title: ShopNexus Gateway API
    version: 0.1.0
openapi: 3.0.3
paths:
    /accounts/{accountID}/feedback:
        get:
            description: Published rows only. A blind submission is not visible to anyone but its author until the window closes.
            parameters:
                - in: path
                  name: accountID
                  required: true
                  schema:
                    $ref: '#/components/schemas/AccountID'
                - description: Which side the account was on.
                  in: query
                  name: role
                  schema:
                    $ref: '#/components/schemas/ReputationRole'
                - $ref: '#/components/parameters/Cursor'
                - $ref: '#/components/parameters/Limit'
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/FeedbackPage'
                    description: OK
                "400":
                    $ref: '#/components/responses/BadRequest'
                "404":
                    $ref: '#/components/responses/NotFound'
            summary: Published feedback received by an account
            tags:
                - trust
    /accounts/{accountID}/reputation:
        get:
            description: |
                Transaction ratings and product-review ratings are reported separately rather than merged. Only a seller can have review ratings.
            parameters:
                - in: path
                  name: accountID
                  required: true
                  schema:
                    $ref: '#/components/schemas/AccountID'
                - description: Defaults to seller.
                  in: query
                  name: role
                  schema:
                    $ref: '#/components/schemas/ReputationRole'
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Reputation'
                    description: OK
                "400":
                    $ref: '#/components/responses/BadRequest'
                "404":
                    $ref: '#/components/responses/NotFound'
            summary: Read an account's reputation for one role
            tags:
                - trust
    /accounts/{id}:
        get:
            description: |
                The seller page. Deliberately narrow: a display name, an avatar, a blurb and a join date. Email, phone, birth date and saved addresses are never part of it.
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    $ref: '#/components/schemas/AccountID'
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/PublicAccount'
                    description: OK
                "404":
                    $ref: '#/components/responses/NotFound'
            summary: Read another account's public profile
            tags:
                - account
    /accounts/{id}/followers:
        get:
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    $ref: '#/components/schemas/AccountID'
                - $ref: '#/components/parameters/Page'
                - $ref: '#/components/parameters/Limit'
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/AccountSummaryPage'
                    description: OK
                "404":
                    $ref: '#/components/responses/NotFound'
            summary: Who follows this seller
            tags:
                - account
    /admin/accounts:
        get:
            description: |
                `q` is an **exact** match on email, phone or username — each is unique, so that is a key lookup and is how a moderator arrives here from a report — or a **fragment** match on the display name, which is answered by a trigram index. Whichever it is, it is one query; the caller does not choose.
            parameters:
                - description: An exact identifier, or part of a display name.
                  in: query
                  name: q
                  schema:
                    maxLength: 255
                    type: string
                - in: query
                  name: status
                  schema:
                    $ref: '#/components/schemas/AccountStatus'
                - in: query
                  name: role
                  schema:
                    $ref: '#/components/schemas/AccountRole'
                - $ref: '#/components/parameters/Page'
                - $ref: '#/components/parameters/Limit'
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/AdminAccountPage'
                    description: OK
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: Moderator role required
            security:
                - bearerAuth: []
            summary: Search accounts
            tags:
                - admin
    /admin/accounts/{id}/suspension:
        delete:
            description: Clears the reason and the deadline with it. Past suspensions stay in the audit log rather than on the row.
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/AdminAccount'
                    description: Reinstated
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: Moderator role required
                "404":
                    $ref: '#/components/responses/NotFound'
            security:
                - bearerAuth: []
            summary: Lift a suspension
            tags:
                - admin
        parameters:
            - in: path
              name: id
              required: true
              schema:
                $ref: '#/components/schemas/AccountID'
        post:
            description: |
                The outcome of upholding a report against a seller. Omit `until` for a permanent suspension.

                Suspending also drops the account's sessions. A suspended row does not stop an access token that is already in circulation, so the two have to happen together.
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/SuspendAccountRequest'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/AdminAccount'
                    description: Suspended
                "400":
                    $ref: '#/components/responses/BadRequest'
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: Moderator role required
                "404":
                    $ref: '#/components/responses/NotFound'
            security:
                - bearerAuth: []
            summary: Suspend an account
            tags:
                - admin
    /admin/categories:
        post:
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/CreateCategoryRequest'
                required: true
            responses:
                "201":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Category'
                    description: Created
                "400":
                    $ref: '#/components/responses/BadRequest'
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: Admin role required
                "409":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: Name already taken
            security:
                - bearerAuth: []
            summary: Create a category
            tags:
                - admin
    /admin/categories/{id}:
        delete:
            description: |
                Children are promoted to roots rather than deleted with it, so a branch is never lost by accident. A category still holding listings cannot be deleted at all — move them first.
            responses:
                "204":
                    description: Deleted
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: Admin role required
                "404":
                    $ref: '#/components/responses/NotFound'
                "409":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: Listings still reference this category
            security:
                - bearerAuth: []
            summary: Delete a category
            tags:
                - admin
        parameters:
            - in: path
              name: id
              required: true
              schema:
                $ref: '#/components/schemas/CategoryID'
        patch:
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/UpdateCategoryRequest'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Category'
                    description: OK
                "400":
                    $ref: '#/components/responses/BadRequest'
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: Admin role required
                "404":
                    $ref: '#/components/responses/NotFound'
            security:
                - bearerAuth: []
            summary: Update a category
            tags:
                - admin
    /admin/disputes:
        get:
            description: |
                Open rounds, oldest first, which is the order they should be worked. Round 2 entries are appeals on a refund a moderator has already ruled on once, so the previous verdict comes with them.
            parameters:
                - description: Defaults to open.
                  in: query
                  name: status
                  schema:
                    $ref: '#/components/schemas/DisputeStatus'
                - in: query
                  name: round
                  schema:
                    enum:
                        - 1
                        - 2
                    type: integer
                - $ref: '#/components/parameters/Cursor'
                - $ref: '#/components/parameters/Limit'
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/RefundDisputePage'
                    description: OK
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: Moderator role required
            security:
                - bearerAuth: []
            summary: The moderator's dispute queue
            tags:
                - admin
    /admin/disputes/{id}/ruling:
        post:
            description: |
                Decided on whose evidence is more convincing. What a verdict does depends on the round, and the round is a property of the case rather than something the moderator picks:

                Round 1 — `buyer-wins` grants the refund and books the return shipment, so the money is not released yet; `seller-wins` ends the refund and lets the payout stand.

                Round 2, the seller's appeal on what arrived — `seller-wins` upholds it, ends the refund and pays the seller out; `buyer-wins` denies it and releases the money to the buyer.

                There is no third round. Round 2 is where an appeal already lives, so a ruling on it is final.
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    $ref: '#/components/schemas/RefundDisputeID'
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/DisputeRulingRequest'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Refund'
                    description: Ruled
                "400":
                    $ref: '#/components/responses/BadRequest'
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: Moderator role required
                "404":
                    $ref: '#/components/responses/NotFound'
                "409":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: Dispute is already resolved
            security:
                - bearerAuth: []
            summary: Rule on the open round of a dispute (moderator)
            tags:
                - admin
    /admin/identity-documents:
        get:
            parameters:
                - description: Defaults to pending.
                  in: query
                  name: status
                  schema:
                    $ref: '#/components/schemas/IdentityStatus'
                - $ref: '#/components/parameters/Page'
                - $ref: '#/components/parameters/Limit'
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/IdentityDocumentPage'
                    description: OK
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: Moderator role required
            security:
                - bearerAuth: []
            summary: The identity review queue
            tags:
                - admin
    /admin/identity-documents/{id}/verdict:
        post:
            description: |
                `verified` requires `expires_at` when the document type carries one, because the payout gate reads the expiry and not only the status. `rejected` requires a reason.
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    $ref: '#/components/schemas/IdentityDocumentID'
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/IdentityVerdictRequest'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/IdentityDocument'
                    description: Recorded
                "400":
                    $ref: '#/components/responses/BadRequest'
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: Moderator role required
                "404":
                    $ref: '#/components/responses/NotFound'
                "409":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: Already decided or the account already has a verified document
            security:
                - bearerAuth: []
            summary: Record an identity verdict
            tags:
                - admin
    /admin/listings:
        get:
            description: |
                Defaults to the pending ones — those the automatic scan flagged or that enough reports pushed into review — oldest first, which is the order they should be worked.
            parameters:
                - description: Defaults to pending.
                  in: query
                  name: status
                  schema:
                    $ref: '#/components/schemas/ListingStatus'
                - in: query
                  name: seller_id
                  schema:
                    $ref: '#/components/schemas/AccountID'
                - $ref: '#/components/parameters/Page'
                - $ref: '#/components/parameters/Limit'
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ListingPage'
                    description: OK
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: Moderator role required
            security:
                - bearerAuth: []
            summary: The listing moderation queue
            tags:
                - admin
    /admin/listings/{id}/approval:
        post:
            description: Applies any held pending edit and makes it live.
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    $ref: '#/components/schemas/ProductSPUID'
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/ModerationNoteRequest'
                required: false
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ListingDetail'
                    description: Live
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: Moderator role required
                "404":
                    $ref: '#/components/responses/NotFound'
                "409":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: Not awaiting moderation
            security:
                - bearerAuth: []
            summary: Clear a listing for publication
            tags:
                - admin
    /admin/listings/{id}/takedown:
        post:
            description: |
                The moderator's verdict against a listing that breaks policy. Removes it from the marketplace and records the reason. Suspending the seller as well is a separate decision and a separate call.
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    $ref: '#/components/schemas/ProductSPUID'
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/TakedownRequest'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ListingDetail'
                    description: Taken down
                "400":
                    $ref: '#/components/responses/BadRequest'
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: Moderator role required
                "404":
                    $ref: '#/components/responses/NotFound'
            security:
                - bearerAuth: []
            summary: Take a listing down
            tags:
                - admin
    /admin/moderators:
        post:
            description: |
                Only an admin may do this and there is no self-service path — a moderator decides disputes and takes listings down, so the role is granted, never claimed.
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/CreateModeratorRequest'
                required: true
            responses:
                "201":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/AdminAccount'
                    description: Created
                "400":
                    $ref: '#/components/responses/BadRequest'
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: Admin role required
                "409":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: Email or phone or username already taken
            security:
                - bearerAuth: []
            summary: Provision a moderator account
            tags:
                - admin
    /admin/moderators/{id}:
        delete:
            description: Demotes to a plain user and drops the account's sessions. The account itself survives, since it may have traded.
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    $ref: '#/components/schemas/AccountID'
            responses:
                "204":
                    description: Revoked
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: Admin role required
                "404":
                    $ref: '#/components/responses/NotFound'
            security:
                - bearerAuth: []
            summary: Revoke the moderator role
            tags:
                - admin
    /admin/options:
        get:
            description: The operator's view. `GET /options` only ever shows enabled rows, so this is the only way to see one that was switched off.
            parameters:
                - in: query
                  name: type
                  schema:
                    $ref: '#/components/schemas/OptionType'
                - in: query
                  name: is_enabled
                  schema:
                    type: boolean
                - in: query
                  name: owner_id
                  schema:
                    $ref: '#/components/schemas/AccountID'
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/OptionList'
                    description: OK
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: Admin role required
            security:
                - bearerAuth: []
            summary: List every integration, disabled ones included
            tags:
                - admin
    /admin/payment-sessions:
        get:
            description: Filter by kind, status and a settlement window. Intended for tying platform totals to what the rails report.
            parameters:
                - in: query
                  name: kind
                  schema:
                    $ref: '#/components/schemas/PaymentSessionKind'
                - in: query
                  name: status
                  schema:
                    $ref: '#/components/schemas/PaymentSessionStatus'
                - in: query
                  name: account_id
                  schema:
                    $ref: '#/components/schemas/AccountID'
                - description: Inclusive lower bound on creation time
                  in: query
                  name: from
                  schema:
                    format: date-time
                    type: string
                - description: Exclusive upper bound on creation time
                  in: query
                  name: to
                  schema:
                    format: date-time
                    type: string
                - $ref: '#/components/parameters/Cursor'
                - $ref: '#/components/parameters/Limit'
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/PaymentSessionPage'
                    description: OK
                "400":
                    $ref: '#/components/responses/BadRequest'
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: Admin role required
            security:
                - bearerAuth: []
            summary: Reconciliation view over all payment sessions
            tags:
                - admin
    /admin/reports:
        get:
            description: |
                Defaults to the open and under-review ones, oldest first — that is the small hot slice the queue is worked from, and the index behind it covers exactly that predicate.
            parameters:
                - description: Defaults to open and reviewing.
                  in: query
                  name: status
                  schema:
                    $ref: '#/components/schemas/ReportStatus'
                - in: query
                  name: ref_type
                  schema:
                    $ref: '#/components/schemas/ReportRefType'
                - in: query
                  name: reason
                  schema:
                    $ref: '#/components/schemas/ReportReason'
                - $ref: '#/components/parameters/Cursor'
                - $ref: '#/components/parameters/Limit'
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/AdminReportPage'
                    description: OK
                "400":
                    $ref: '#/components/responses/BadRequest'
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: Moderator role required
            security:
                - bearerAuth: []
            summary: The report queue
            tags:
                - admin
    /admin/reports/{id}:
        get:
            description: |
                Includes the reported content itself and how many other open reports name the same target, since a moderator decides on the pattern and not one complaint.
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    $ref: '#/components/schemas/ReportID'
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/AdminReport'
                    description: OK
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: Moderator role required
                "404":
                    $ref: '#/components/responses/NotFound'
            security:
                - bearerAuth: []
            summary: Read a report with its target
            tags:
                - admin
    /admin/reports/{id}/claim:
        post:
            description: Moves it out of the open queue so two moderators do not work the same case.
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    $ref: '#/components/schemas/ReportID'
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Report'
                    description: Claimed
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: Moderator role required
                "404":
                    $ref: '#/components/responses/NotFound'
                "409":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: Already claimed or resolved
            security:
                - bearerAuth: []
            summary: Take a report for review
            tags:
                - admin
    /admin/reports/{id}/resolution:
        post:
            description: |
                Records the verdict and what was done about it. `dismissed` takes the action `none`; upholding it names the action instead — the listing was removed, the message was removed, the account was suspended, a warning was issued.

                Recording the action here does not carry it out. Taking a listing down and suspending a seller are separate calls to the modules that own them, so the decision and its effects each stay where they can be audited.
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    $ref: '#/components/schemas/ReportID'
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/ResolveReportRequest'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Report'
                    description: Resolved
                "400":
                    $ref: '#/components/responses/BadRequest'
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: Moderator role required
                "404":
                    $ref: '#/components/responses/NotFound'
                "409":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: Already resolved
            security:
                - bearerAuth: []
            summary: Resolve a report
            tags:
                - admin
    /admin/tags/{slug}:
        delete:
            description: Removing it also detaches it from every listing that carried it.
            responses:
                "204":
                    description: Deleted
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: Admin role required
                "404":
                    $ref: '#/components/responses/NotFound'
            security:
                - bearerAuth: []
            summary: Delete a tag
            tags:
                - admin
        parameters:
            - in: path
              name: slug
              required: true
              schema:
                $ref: '#/components/schemas/TagSlug'
        put:
            description: |
                Upsert, not create: the slug is the whole identity of a tag and the only other column is its description, so a separate create and update would be the same statement twice and would need a 409 to tell them apart.
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/PutTagRequest'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Tag'
                    description: Created or updated
                "400":
                    $ref: '#/components/responses/BadRequest'
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: Admin role required
            security:
                - bearerAuth: []
            summary: Create or update a tag
            tags:
                - admin
    /admin/tax-info/{accountID}/verification:
