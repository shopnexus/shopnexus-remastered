                "400":
                    $ref: '#/components/responses/BadRequest'
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "403":
                    $ref: '#/components/responses/Forbidden'
                "404":
                    $ref: '#/components/responses/NotFound'
                "409":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: Already confirmed into an order, or already cancelled
            security:
                - bearerAuth: []
            summary: Cancel an unconfirmed item
            tags:
                - order
    /listings:
        get:
            description: |
                With no parameters, the newest live active listings. The parameters narrow that one query rather than selecting between separate endpoints.

                `q` makes it a search and moves the default sort to `relevance`. `lexical` matches the name by trigram and tolerates missing diacritics, `semantic` runs an approximate nearest-neighbour search over the dense embedding, and `hybrid` combines the dense vector with the sparse lexical one, which is what the embedding model is built for. Each hit then carries `score`, always so that higher is better. A listing whose embedding has not been computed yet can only be found lexically.

                `sort=recommended` is the personalised feed: nearest-neighbour search over listing embeddings from the caller's interest slots. It needs a token, and falls back to newest for an account with no interests computed yet.

                `mine=true` restricts the result to the caller's own listings, and is the only case in which `status` is honoured — a seller has to see what is not public, and nobody else may.

                `favorited=true` is the wishlist page. It is a filter here rather than its own endpoint because a wishlist wants exactly what a feed wants — cards, with prices and stock and every filter available — and a separate endpoint returning saved ids left the client resolving them one by one.

                `ids` resolves a known set, which is how a cart or an order list renders the listings behind its rows. It ignores every other filter and answers for hidden and soft-deleted listings too, because an order that references one still has to display it; `deleted_at` says which. Listings that were never public (`draft`, `pending`) stay out unless they are the caller's own.

                `price-asc`, `price-desc` and `best-selling` are answered through the SKU indexes rather than a value cached on the listing, so `price` is the cheapest matching variant's and `sold` the total across variants.
            parameters:
                - description: Resolve exactly these listings, ignoring the other filters.
                  explode: false
                  in: query
                  name: ids
                  schema:
                    items:
                        $ref: '#/components/schemas/ProductSPUID'
                    maxItems: 100
                    type: array
                  style: form
                - description: Free-text query. Turns the request into a search.
                  in: query
                  name: q
                  schema:
                    maxLength: 200
                    minLength: 1
                    type: string
                - description: Search mode. Ignored without a query.
                  in: query
                  name: mode
                  schema:
                    default: hybrid
                    enum:
                        - lexical
                        - semantic
                        - hybrid
                    type: string
                - description: The caller's own listings, in every state.
                  in: query
                  name: mine
                  schema:
                    default: false
                    type: boolean
                - description: The caller's wishlist. This is the wishlist page.
                  in: query
                  name: favorited
                  schema:
                    default: false
                    type: boolean
                - description: Only honoured together with mine=true.
                  in: query
                  name: status
                  schema:
                    $ref: '#/components/schemas/ListingStatus'
                - in: query
                  name: category_id
                  schema:
                    $ref: '#/components/schemas/CategoryID'
                - in: query
                  name: tag
                  schema:
                    $ref: '#/components/schemas/TagSlug'
                - in: query
                  name: seller_id
                  schema:
                    $ref: '#/components/schemas/AccountID'
                - in: query
                  name: condition
                  schema:
                    $ref: '#/components/schemas/ListingCondition'
                - in: query
                  name: min_price
                  schema:
                    format: int64
                    minimum: 0
                    type: integer
                - in: query
                  name: max_price
                  schema:
                    format: int64
                    minimum: 0
                    type: integer
                - description: Defaults to `relevance` when a query is given and `newest` otherwise.
                  in: query
                  name: sort
                  schema:
                    enum:
                        - newest
                        - rating
                        - price-asc
                        - price-desc
                        - best-selling
                        - relevance
                        - recommended
                    type: string
                - $ref: '#/components/parameters/Page'
                - $ref: '#/components/parameters/Limit'
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ListingPage'
                    description: OK
                "400":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: '`sort=relevance` without a query, or `status` without `mine`'
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: '`mine=true`, `favorited=true` or `sort=recommended` without a token'
            security:
                - {}
                - bearerAuth: []
            summary: Browse, search and resolve listings
            tags:
                - catalog
        post:
            description: |
                Creates the listing and its variants together. At least one variant is required because price and shipping weight live there.

                Starts as a draft and is not public until published. The seller also chooses here whether the buyer or the seller carries the shipping fee.
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/CreateListingRequest'
                required: true
            responses:
                "201":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ListingDetail'
                    description: Created
                "400":
                    $ref: '#/components/responses/BadRequest'
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "404":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: Category or tag or image not found
                "409":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: Slug already taken
                "422":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: Identity verification is required before selling
            security:
                - bearerAuth: []
            summary: Create a listing
            tags:
                - catalog
    /listings/{id}:
        delete:
            description: |
                Soft delete, and distinct from hiding it. Order history holds the listing and variant ids without a foreign key, so a past order has to stay resolvable after the seller removes the listing.
            responses:
                "204":
                    description: Deleted
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "403":
                    $ref: '#/components/responses/Forbidden'
                "404":
                    $ref: '#/components/responses/NotFound'
                "409":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: An open order still covers this listing
            security:
                - bearerAuth: []
            summary: Delete a listing
            tags:
                - catalog
        get:
            description: |
                Carries the variants with their prices and stock and the seller summary.

                A listing that was never public — `draft` or `pending` — is readable only by its owner and by staff. One that is `hidden` or soft-deleted is readable by anyone, because a cart or an order that references it still has to render; `status` and `deleted_at` say that it cannot be bought.
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ListingDetail'
                    description: OK
                "404":
                    $ref: '#/components/responses/NotFound'
            security:
                - {}
                - bearerAuth: []
            summary: Read a listing
            tags:
                - catalog
        parameters:
            - description: |
                The listing's opaque id or its slug. A slug is lowercase, hyphen-separated and never contains an underscore, so it cannot be mistaken for an id and the product page needs no second endpoint to resolve one.
              in: path
              name: id
              required: true
              schema:
                $ref: '#/components/schemas/ListingRef'
        patch:
            description: |
                An edit to a draft applies immediately. An edit to a live listing that trips the prohibited-goods filter is held as a pending edit and applied only when a moderator approves it, so the version buyers see never changes into unreviewed content.

                The slug is fixed at creation. Renaming a listing leaves it alone: there is no redirect table, so a new slug would only turn every link already shared into a 404, and `GET /listings/{id}` takes the id as well.
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/UpdateListingRequest'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ListingDetail'
                    description: Applied
                "202":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ListingDetail'
                    description: Held as a pending edit awaiting moderation
                "400":
                    $ref: '#/components/responses/BadRequest'
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "403":
                    $ref: '#/components/responses/Forbidden'
                "404":
                    $ref: '#/components/responses/NotFound'
            security:
                - bearerAuth: []
            summary: Edit a listing
            tags:
                - catalog
    /listings/{id}/publication:
        delete:
            description: |
                Takes it out of every feed while leaving it alive — the seller is away, or the item is temporarily out of stock. Not the same as deleting it.
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ListingDetail'
                    description: Hidden
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "403":
                    $ref: '#/components/responses/Forbidden'
                "404":
                    $ref: '#/components/responses/NotFound'
            security:
                - bearerAuth: []
            summary: Hide a live listing
            tags:
                - catalog
        parameters:
            - in: path
              name: id
              required: true
              schema:
                $ref: '#/components/schemas/ProductSPUID'
        post:
            description: |
                Every new listing is scanned automatically for prohibited-goods signals first. A clean one goes live; a suspicious one goes to the moderation queue and stays invisible until a moderator clears it. The response says which happened.
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ListingDetail'
                    description: Live
                "202":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ListingDetail'
                    description: Queued for moderation and not yet public
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "403":
                    $ref: '#/components/responses/Forbidden'
                "404":
                    $ref: '#/components/responses/NotFound'
                "409":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: Already live or under moderation
                "422":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: A listing needs at least one variant with a price
            security:
                - bearerAuth: []
            summary: Publish a listing
            tags:
                - catalog
    /listings/{id}/skus:
        post:
            description: |
                Answers with the listing. The new variant is the one in `skus` that was not there before — there is no separate id in the response, because a variant is not addressable on its own.
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    $ref: '#/components/schemas/ProductSPUID'
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/CreateSkuRequest'
                required: true
            responses:
                "201":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ListingDetail'
                    description: Created
                "400":
                    $ref: '#/components/responses/BadRequest'
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "403":
                    $ref: '#/components/responses/Forbidden'
                "404":
                    $ref: '#/components/responses/NotFound'
            security:
                - bearerAuth: []
            summary: Add a variant to a listing
            tags:
                - catalog
    /listings/{spuID}/reviews:
        get:
            description: Public, with the seller's reply and the vote tally on each one.
            parameters:
                - description: Restrict to one star rating.
                  in: query
                  name: rating
                  schema:
                    maximum: 5
                    minimum: 1
                    type: integer
                - in: query
                  name: sort
                  schema:
                    default: newest
                    enum:
                        - newest
                        - helpful
                    type: string
                - $ref: '#/components/parameters/Cursor'
                - $ref: '#/components/parameters/Limit'
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ReviewPage'
                    description: OK
                "400":
                    $ref: '#/components/responses/BadRequest'
                "404":
                    $ref: '#/components/responses/NotFound'
            summary: Reviews of a listing
            tags:
                - trust
        parameters:
            - in: path
              name: spuID
              required: true
              schema:
                $ref: '#/components/schemas/ProductSPUID'
        post:
            description: |
                An order is required — no purchase, no review — and one review per listing per order, so buying twice earns a second review but one purchase does not earn two.
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/SubmitReviewRequest'
                required: true
            responses:
                "201":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Review'
                    description: Created
                "400":
                    $ref: '#/components/responses/BadRequest'
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: The order does not belong to the caller
                "404":
                    $ref: '#/components/responses/NotFound'
                "409":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: Already reviewed for this order
                "422":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: The order did not include this listing or is not finished
            security:
                - bearerAuth: []
            summary: Review a listing you bought
            tags:
                - trust
    /login:
        post:
            description: The identifier is an email or a phone or a username. Which one it is does not change the answer and is not reported back.
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/LoginRequest'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/AuthResult'
                    description: OK
                "400":
                    $ref: '#/components/responses/BadRequest'
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: Wrong credentials
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: Account suspended
            summary: Sign in with a password
            tags:
                - account
    /login/oauth:
        post:
            description: |
                Links to an existing account when the provider's subject id is already known, and otherwise creates one. A provider that returns no email — Apple with "hide my email" — gets a generated username, because the account still has to carry an identifier.
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/OAuthLoginRequest'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/AuthResult'
                    description: Signed in to an existing account
                "201":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/AuthResult'
                    description: A new account was created
                "400":
                    $ref: '#/components/responses/BadRequest'
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: Provider rejected the credential
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: Account suspended
            summary: Sign in through a federated provider
            tags:
                - account
    /logout:
        post:
            description: Also unregisters the caller's push device when one is supplied so the phone stops receiving notifications for an account nobody is signed in to.
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/LogoutRequest'
                required: false
            responses:
                "204":
                    description: Session revoked
                "401":
                    $ref: '#/components/responses/Unauthorized'
            security:
                - bearerAuth: []
            summary: Revoke the current session
            tags:
                - account
    /me:
        get:
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Me'
                    description: OK
                "401":
                    $ref: '#/components/responses/Unauthorized'
            security:
                - bearerAuth: []
            summary: Read the caller's own account and profile
            tags:
                - account
        patch:
            description: |
                Changing the email clears `email_verified` and sends a fresh verification. The last remaining identifier cannot be removed.

                The phone here is an identifier — something to sign in and be reached by — and carries no verified flag. Verification belongs to a phone a carrier will actually call, which is the one on a `contact`: that is where `phone_verified` lives, and editing this one does not touch it.
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/UpdateAccountRequest'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Me'
                    description: OK
                "400":
                    $ref: '#/components/responses/BadRequest'
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "409":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: Email or phone or username already taken
                "422":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: That would leave the account with no identifier
            security:
                - bearerAuth: []
            summary: Change the caller's identifiers
            tags:
                - account
    /me/devices:
        get:
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/DeviceList'
                    description: OK
                "401":
                    $ref: '#/components/responses/Unauthorized'
            security:
                - bearerAuth: []
            summary: List the caller's push devices
            tags:
                - account
    /me/following:
        get:
            parameters:
                - $ref: '#/components/parameters/Page'
                - $ref: '#/components/parameters/Limit'
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/AccountSummaryPage'
                    description: OK
                "401":
                    $ref: '#/components/responses/Unauthorized'
            security:
                - bearerAuth: []
            summary: Sellers the caller follows
            tags:
                - account
    /me/identity-documents:
        get:
            description: Includes `expires_at` — a passport runs out and a payout gate has to look at more than the status.
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/IdentityDocumentList'
                    description: OK
                "401":
                    $ref: '#/components/responses/Unauthorized'
            security:
                - bearerAuth: []
            summary: The caller's verification history
            tags:
                - account
    /me/oauth-identities:
        get:
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/OAuthIdentityList'
                    description: OK
                "401":
                    $ref: '#/components/responses/Unauthorized'
            security:
                - bearerAuth: []
            summary: List the caller's linked providers
            tags:
                - account
    /me/oauth-identities/{provider}:
        delete:
            description: Refused when it would leave the account with no way to sign in — no password and no other linked provider.
            parameters:
                - in: path
                  name: provider
                  required: true
                  schema:
                    $ref: '#/components/schemas/OAuthProvider'
            responses:
                "204":
                    description: Unlinked
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "404":
                    $ref: '#/components/responses/NotFound'
                "422":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: This is the only way left to sign in
            security:
                - bearerAuth: []
            summary: Unlink a provider
            tags:
                - account
    /me/profile:
        patch:
            description: This is the shop front. `locale` and `timezone` also decide how notifications are written and when they are sent.
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/UpdateProfileRequest'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Profile'
                    description: OK
                "400":
                    $ref: '#/components/responses/BadRequest'
                "401":
                    $ref: '#/components/responses/Unauthorized'
            security:
                - bearerAuth: []
            summary: Update the caller's public profile
            tags:
                - account
    /messages/{id}:
        delete:
            description: |
                The sender unsending, or a moderator acting on an upheld report. The row survives with its body **and its attachments** cleared: a thread is evidence in a refund dispute, so removal is recorded rather than erased, but a redaction that leaves the picture up has not removed anything.
            responses:
                "204":
                    description: Redacted
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: Only the sender or a moderator may redact a message
                "404":
                    $ref: '#/components/responses/NotFound'
            security:
                - bearerAuth: []
            summary: Redact a message
            tags:
                - chat
        parameters:
            - in: path
              name: id
              required: true
              schema:
                $ref: '#/components/schemas/MessageID'
            - description: |
                The message's own `created_at`. Required, and not redundant: `message` is partitioned on it and its primary key is `(id, created_at)`, so without it the row has to be hunted through every chunk of the table. A client always has the message before editing or redacting it, so it always has this.
              in: query
              name: sent_at
              required: true
              schema:
                format: date-time
                type: string
        patch:
            description: |
                Sender only, and it records that the message was edited — the counterparty has to be able to see that what they read has changed. A system message cannot be edited because it has no author.
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/UpdateMessageRequest'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Message'
                    description: OK
                "400":
                    $ref: '#/components/responses/BadRequest'
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: Only the sender may edit a message
                "404":
                    $ref: '#/components/responses/NotFound'
                "409":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: A system message cannot be edited
            security:
                - bearerAuth: []
            summary: Edit a message
            tags:
                - chat
    /notification-preferences:
        get:
            description: |
                Returns every category and channel pair with the value in force. Stored rows are sparse — one exists only where the account differs from the default — and the defaults live in the domain, so resolving them here keeps the client from having to know them.
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/NotificationPreferenceList'
                    description: OK
                "401":
                    $ref: '#/components/responses/Unauthorized'
            security:
                - bearerAuth: []
            summary: Read the effective notification settings
            tags:
                - account
        put:
            description: |
                Setting a pair back to its default deletes the row rather than storing the default again.
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/UpdateNotificationPreferencesRequest'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/NotificationPreferenceList'
                    description: OK
                "400":
                    $ref: '#/components/responses/BadRequest'
                "401":
                    $ref: '#/components/responses/Unauthorized'
            security:
                - bearerAuth: []
            summary: Change notification settings
            tags:
                - account
    /notifications:
        get:
            description: |
                Newest first, cursor only. The table is chunked by time, so a cursor is what lets the reader stop at a chunk boundary instead of touching every chunk.
            parameters:
                - in: query
                  name: category
                  schema:
                    $ref: '#/components/schemas/NotificationCategory'
                - description: Restrict to unread ones.
                  in: query
                  name: unread
                  schema:
                    type: boolean
                - $ref: '#/components/parameters/Cursor'
                - $ref: '#/components/parameters/Limit'
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/NotificationPage'
                    description: OK
                "400":
                    $ref: '#/components/responses/BadRequest'
                "401":
                    $ref: '#/components/responses/Unauthorized'
            security:
                - bearerAuth: []
            summary: The caller's notification feed
            tags:
                - account
    /notifications/read:
        post:
            description: |
                Takes a time bound rather than a list of ids. Marking individual rows by id would have to search every chunk of a time-partitioned table; a bound reads one range. Omit `before` to mark everything read.
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/MarkNotificationsReadRequest'
                required: false
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/UnreadCount'
                    description: OK
                "400":
                    $ref: '#/components/responses/BadRequest'
                "401":
                    $ref: '#/components/responses/Unauthorized'
            security:
                - bearerAuth: []
            summary: Mark notifications read up to a point in time
            tags:
                - account
    /notifications/unread-count:
        get:
            description: A separate endpoint because it is read far more often than the feed and answers from one partial index.
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/UnreadCount'
                    description: OK
                "401":
                    $ref: '#/components/responses/Unauthorized'
            security:
                - bearerAuth: []
            summary: The unread badge
            tags:
                - account
    /offers:
        get:
            parameters:
                - in: query
                  name: role
                  required: true
                  schema:
                    enum:
                        - buyer
                        - seller
                    type: string
                - in: query
                  name: status
                  schema:
                    $ref: '#/components/schemas/OfferStatus'
                - $ref: '#/components/parameters/Cursor'
                - $ref: '#/components/parameters/Limit'
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/OfferPage'
                    description: OK
                "400":
                    $ref: '#/components/responses/BadRequest'
                "401":
                    $ref: '#/components/responses/Unauthorized'
            security:
                - bearerAuth: []
            summary: List negotiations, as buyer or as seller
            tags:
                - order
        post:
            description: Either side may open it. One active negotiation per (buyer, SKU); the terms are then revised in place rather than by stacking rows.
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/CreateOfferRequest'
                required: true
            responses:
                "201":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Offer'
                    description: Created
                "400":
                    $ref: '#/components/responses/BadRequest'
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "404":
                    $ref: '#/components/responses/NotFound'
                "409":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: An active negotiation already exists for this (buyer, SKU)
            security:
                - bearerAuth: []
            summary: Open a price negotiation on a SKU
            tags:
                - order
    /offers/{id}:
        delete:
            responses:
                "204":
                    description: Cancelled
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "403":
                    $ref: '#/components/responses/Forbidden'
                "404":
                    $ref: '#/components/responses/NotFound'
                "409":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: Negotiation is no longer active
            security:
                - bearerAuth: []
            summary: Cancel a negotiation
            tags:
                - order
        get:
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Offer'
                    description: OK
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "403":
                    $ref: '#/components/responses/Forbidden'
                "404":
                    $ref: '#/components/responses/NotFound'
            security:
                - bearerAuth: []
            summary: Read a negotiation
            tags:
                - order
        parameters:
            - in: path
              name: id
              required: true
              schema:
                $ref: '#/components/schemas/OfferID'
        patch:
            description: Revises the current terms in place and moves authorship to the caller. Only the party that does not own the standing proposal may counter.
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/UpdateOfferRequest'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Offer'
                    description: OK
                "400":
                    $ref: '#/components/responses/BadRequest'
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: Caller already owns the standing proposal, or is not a party
                "404":
                    $ref: '#/components/responses/NotFound'
                "409":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: Negotiation is no longer active
            security:
                - bearerAuth: []
            summary: Counter-offer
            tags:
                - order
    /offers/{id}/acceptance:
        post:
            description: |
                Only the buyer closes a negotiation, whichever side proposed the standing terms — an order may not appear without the buyer's explicit acceptance. Opens the checkout payment session at the agreed total and creates the item, returning both.
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    $ref: '#/components/schemas/OfferID'
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/AcceptOfferRequest'
                required: true
            responses:
                "201":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/CheckoutResult'
                    description: Accepted; item created and a payment session opened
                "400":
                    $ref: '#/components/responses/BadRequest'
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: Caller is not the buyer of this negotiation
                "404":
                    $ref: '#/components/responses/NotFound'
                "409":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: Negotiation is expired, cancelled, or already accepted
            security:
                - bearerAuth: []
            summary: Accept the negotiated terms (buyer)
            tags:
                - order
    /options:
        get:
            description: |
                The checkout list: payment rails, carriers, notification channels. Enabled options only, ordered by `priority` then `id` — priority ties are possible, so the id is the tiebreaker that keeps the order stable between calls.

                Public: which rails a marketplace accepts is not a secret, and a buyer sees them before signing in.
            parameters:
                - in: query
                  name: type
                  required: true
                  schema:
                    $ref: '#/components/schemas/OptionType'
                - description: Restrict to one seller's own options.
                  in: query
                  name: owner_id
                  schema:
                    $ref: '#/components/schemas/AccountID'
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/OptionList'
                    description: OK
                "400":
                    $ref: '#/components/responses/BadRequest'
            summary: List enabled integrations of one type
            tags:
                - common
        post:
            description: |
                A seller configuring their own carriers or payment rails. `id` is a marketplace-wide slug shared with the system-provided options, so it is supplied by the caller and collides loudly rather than being silently renamed.
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/CreateOptionRequest'
                required: true
            responses:
                "201":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Option'
                    description: Created
                "400":
                    $ref: '#/components/responses/BadRequest'
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "409":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: This slug is taken
            security:
                - bearerAuth: []
            summary: Register an integration the caller owns
            tags:
                - common
    /options/{id}:
        delete:
            responses:
                "204":
                    description: Removed
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "403":
                    $ref: '#/components/responses/Forbidden'
                "404":
                    $ref: '#/components/responses/NotFound'
                "409":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: Still named by an unsettled payment or an in-flight shipment
            security:
                - bearerAuth: []
            summary: Remove an integration
            tags:
                - common
        get:
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Option'
                    description: OK
                "404":
                    $ref: '#/components/responses/NotFound'
            summary: Read one integration
            tags:
                - common
        parameters:
            - in: path
              name: id
              required: true
              schema:
                $ref: '#/components/schemas/OptionSlug'
        patch:
            description: |
                The owner, or an admin for a system-provided one. The slug is not editable: other modules store it as a plain string with no foreign key (`item.transport_option`, `transaction.payment_option`), so renaming it would orphan every row that named it.
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/UpdateOptionRequest'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
