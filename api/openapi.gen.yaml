            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/WithdrawalRejectionRequest'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Withdrawal'
                    description: Rejected and the debit reversed
                "400":
                    $ref: '#/components/responses/BadRequest'
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: Admin role required
                "404":
                    $ref: '#/components/responses/NotFound'
                "409":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: Already resolved
            security:
                - bearerAuth: []
