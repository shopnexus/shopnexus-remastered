                "401":
                    $ref: '#/components/responses/Unauthorized'
                "404":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: Listing not found, deleted, or not active
            security:
                - bearerAuth: []
            summary: Open a purchase session for one listing
            tags:
                - order
    /drafts/{id}:
        delete:
            description: Sets `cancelled_at`. A session that already produced paid items cannot be cancelled.
            responses:
                "204":
                    description: Cancelled
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "403":
