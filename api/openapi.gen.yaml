                "401":
                    $ref: '#/components/responses/Unauthorized'
                "403":
                    $ref: '#/components/responses/Forbidden'
                "404":
                    $ref: '#/components/responses/NotFound'
                "409":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: Shipment already moved, or the order is closed
            security:
                - bearerAuth: []
            summary: Cancel an order
            tags:
                - order
    /orders/{id}/receipt:
        post:
            description: |
                The buyer confirms delivery and attaches unboxing evidence — at least one photo or video is mandatory, because this evidence is what a later refund or dispute is judged on. Sets `received_at` and starts the 72-hour payout countdown in `payout_deadline_at`.

                Confirming twice is a conflict rather than a no-op: a retried upload must not be able to restart the clock and move the payout date.
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    $ref: '#/components/schemas/OrderID'
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/ConfirmReceiptRequest'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Order'
                    description: Receipt recorded
                "400":
                    $ref: '#/components/responses/BadRequest'
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: Caller is not the buyer of this order
                "404":
                    $ref: '#/components/responses/NotFound'
                "409":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: Already confirmed, or the order is cancelled
            security:
                - bearerAuth: []
            summary: Confirm receipt of the goods (buyer)
            tags:
                - order
    /orders/{id}/refunds:
        post:
            description: |
                Covers the whole order; there is no way to refund part of one. Evidence is mandatory, and one live refund per order.

                Nothing ships yet — the buyer keeps the goods until the refund is granted. The seller has until `deadline_at` to accept or reject, and letting that pass hands the next move to the buyer rather than settling anything.
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    $ref: '#/components/schemas/OrderID'
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/CreateRefundRequest'
