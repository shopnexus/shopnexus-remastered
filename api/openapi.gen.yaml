                    type: string
                seller_id:
                    $ref: '#/components/schemas/AccountID'
                shipping_paid_by:
                    $ref: '#/components/schemas/OrderShippingPaidBy'
                skus:
                    items:
                        $ref: '#/components/schemas/DraftSKUSnapshot'
                    type: array
            required:
                - id
                - name
                - seller_id
                - currency
                - price_mode
                - skus
            type: object
        EmailVerificationRequest:
            properties:
                token:
                    type: string
            required:
                - token
            type: object
        Error:
            properties:
                error:
                    properties:
                        code:
                            type: string
                        message:
                            type: string
                    required:
                        - code
                        - message
                    type: object
            required:
                - error
            type: object
        Feedback:
            properties:
                comment:
                    type: string
                created_at:
                    format: date-time
                    type: string
                direction:
                    $ref: '#/components/schemas/FeedbackDirection'
                id:
                    $ref: '#/components/schemas/FeedbackID'
                order_id:
                    $ref: '#/components/schemas/OrderID'
                published_at:
                    description: |
                        Null while the rating is still blind. Only published feedback is visible to anyone but its author and counted towards reputation.
                    format: date-time
                    nullable: true
                    type: string
                ratee_id:
                    $ref: '#/components/schemas/AccountID'
                rater:
                    $ref: '#/components/schemas/AccountSummary'
                rating:
                    maximum: 5
                    minimum: 1
                    type: integer
            required:
                - id
                - order_id
                - rater
                - ratee_id
                - direction
                - rating
                - comment
                - created_at
            type: object
        FeedbackDirection:
            enum:
                - buyer-to-seller
                - seller-to-buyer
            type: string
        FeedbackID:
            example: fbk_2h9qk4mfx7bd3
            pattern: ^fbk_[0-9a-hjkmnp-tv-z]{13}$
            type: string
        FeedbackPage:
            properties:
                items:
                    items:
                        $ref: '#/components/schemas/Feedback'
                    type: array
                next_cursor:
                    nullable: true
                    type: string
            required:
                - items
            type: object
        IdentityDocument:
            description: |
                A verification outcome. No document number and no scan: the vendor performs the check and only its verdict is kept.
            properties:
                created_at:
                    format: date-time
                    type: string
                doc_type:
                    $ref: '#/components/schemas/IdentityDocumentType'
                expires_at:
                    description: |
                        When the document itself runs out. A payout gate reads this as well as the status.
                    format: date-time
                    nullable: true
                    type: string
                id:
                    $ref: '#/components/schemas/IdentityDocumentID'
                provider:
                    description: KYC vendor, kebab-case.
                    type: string
                rejection_reason:
                    nullable: true
                    type: string
                status:
                    $ref: '#/components/schemas/IdentityStatus'
                verified_at:
                    format: date-time
                    nullable: true
                    type: string
            required:
                - id
                - doc_type
                - provider
                - status
                - created_at
            type: object
        IdentityDocumentID:
            example: idd_57b62mxefynht
            pattern: ^idd_[0-9a-hjkmnp-tv-z]{13}$
            type: string
        IdentityDocumentList:
            properties:
                items:
                    items:
                        $ref: '#/components/schemas/IdentityDocument'
                    type: array
            required:
                - items
            type: object
        IdentityDocumentPage:
            properties:
                items:
                    items:
                        $ref: '#/components/schemas/AdminIdentityDocument'
                    type: array
                total:
                    $ref: '#/components/schemas/TotalCount'
            required:
                - items
            type: object
        IdentityDocumentType:
            enum:
                - national-id
                - passport
                - driver-license
            type: string
        IdentityStatus:
            enum:
                - pending
                - verified
                - rejected
            type: string
        IdentityVerdictRequest:
            properties:
                expires_at:
                    description: When the document runs out.
                    format: date-time
                    type: string
                rejection_reason:
                    description: Required when rejecting.
                    maxLength: 2000
                    type: string
                status:
                    description: A verdict so pending is not a choice.
                    enum:
                        - verified
                        - rejected
                    type: string
            required:
                - status
            type: object
        IdentityVerificationTicket:
            properties:
                document:
                    $ref: '#/components/schemas/IdentityDocument'
                vendor_session_expires_at:
                    format: date-time
                    nullable: true
                    type: string
                vendor_session_url:
                    description: Where the caller finishes the check with the vendor.
                    nullable: true
                    type: string
            required:
                - document
            type: object
        Listing:
            description: The card shown in a feed. `GET /listings/{id}` returns the full form.
            properties:
                category_id:
                    $ref: '#/components/schemas/CategoryID'
                condition:
                    $ref: '#/components/schemas/ListingCondition'
                cover:
                    allOf:
                        - $ref: '#/components/schemas/Resource'
                    nullable: true
                created_at:
                    format: date-time
                    type: string
                currency:
                    $ref: '#/components/schemas/CurrencyCode'
                deleted_at:
                    description: |
                        Set on a listing the seller removed. Only an `ids` lookup returns one, so that an order or a cart referencing it can still be rendered.
                    format: date-time
                    nullable: true
                    type: string
                favorited:
                    description: |
                        Whether the caller has this on their wishlist. False for an anonymous request. A plain join, because the wishlist is a catalog table — the client never has to fetch its own saves to know which hearts to fill in.
                    type: boolean
                id:
                    $ref: '#/components/schemas/ProductSPUID'
                name:
                    type: string
                price:
                    description: |
                        The featured variant's price, or the cheapest one when a price sort is in force. Not stored on the listing.
                    format: int64
                    type: integer
                price_mode:
                    $ref: '#/components/schemas/PriceMode'
                rating:
                    description: |
                        Average review rating from 1 to 5, or 0 when there are none yet. Maintained from review events because reviews live in another schema and cannot be joined.
                    format: double
                    type: number
                score:
                    $ref: '#/components/schemas/SimilarityScore'
                seller:
                    $ref: '#/components/schemas/AccountSummary'
                slug:
                    description: URL-friendly, globally unique and fixed at creation.
                    type: string
                sold:
                    description: |
                        Units taken across the variants — sold plus whatever is reserved right now, since a reservation that is later cancelled comes back out. Summed from the variants, not cached on the listing.
                    format: int64
                    type: integer
                status:
                    $ref: '#/components/schemas/ListingStatus'
            required:
                - id
                - slug
                - name
                - status
                - condition
                - price_mode
                - currency
                - price
                - sold
                - rating
                - category_id
                - seller
                - favorited
                - created_at
            type: object
        ListingCondition:
            description: Item condition. This is a marketplace for used goods so it is listing-level and not optional.
            enum:
                - new
                - used
                - damaged
            type: string
        ListingDetail:
            properties:
                category:
                    $ref: '#/components/schemas/Category'
                condition:
                    $ref: '#/components/schemas/ListingCondition'
                created_at:
                    format: date-time
                    type: string
                currency:
                    $ref: '#/components/schemas/CurrencyCode'
                deleted_at:
                    description: Set on a listing the seller removed.
                    format: date-time
                    nullable: true
                    type: string
                description:
                    type: string
                favorite_count:
                    description: |
                        How many accounts saved it — social proof on the product page. Only here and not on the card: it is a count per listing, cheap for one row and N counts for a page of them.
                    format: int64
                    type: integer
                favorited:
                    description: Whether the caller has this saved. False for an anonymous request.
                    type: boolean
                featured_sku_id:
                    allOf:
                        - $ref: '#/components/schemas/ProductSKUID'
                    nullable: true
                id:
                    $ref: '#/components/schemas/ProductSPUID'
                images:
                    description: Ordered. The first is the cover.
                    items:
                        $ref: '#/components/schemas/Resource'
                    type: array
                name:
                    type: string
                pending_edit:
                    additionalProperties: true
                    description: |
                        An edit waiting on moderation. Visible to the owner and to staff only; buyers see the published version until it is approved.
                    nullable: true
                    type: object
                price_mode:
                    $ref: '#/components/schemas/PriceMode'
                rating:
                    format: double
                    type: number
                seller:
                    $ref: '#/components/schemas/AccountSummary'
                shipping_paid_by:
                    $ref: '#/components/schemas/ShippingPaidBy'
                skus:
                    items:
                        $ref: '#/components/schemas/Sku'
                    type: array
                slug:
                    type: string
                sold:
                    description: Units taken across the variants — see Listing.sold.
                    format: int64
                    type: integer
                specifications:
                    additionalProperties: true
                    description: Structured attributes specific to the product type.
                    type: object
                status:
                    $ref: '#/components/schemas/ListingStatus'
                tags:
                    items:
                        $ref: '#/components/schemas/TagSlug'
                    type: array
            required:
                - id
                - slug
                - name
                - description
                - status
                - condition
                - price_mode
                - shipping_paid_by
                - currency
                - specifications
                - images
                - category
                - tags
                - skus
                - sold
                - rating
                - seller
                - favorited
                - favorite_count
                - created_at
            type: object
        ListingPage:
            description: |
                One page shape for every listing query, ranked or not. Page-paginated, because a catalog is browsed with a pager and a relevance order has no stored column to seek into; `total` is null for a ranked query, where the top-K is all the search ever visited.
            properties:
                items:
                    items:
                        $ref: '#/components/schemas/Listing'
                    type: array
                total:
                    $ref: '#/components/schemas/TotalCount'
            required:
                - items
            type: object
        ListingRef:
            description: |
                A listing addressed either way. The id form is the opaque one; the slug form is what a shareable product URL carries. They cannot collide because an opaque id always has an underscore after its prefix and a slug never has one.
            oneOf:
                - $ref: '#/components/schemas/ProductSPUID'
                - example: ao-thun-uniqlo-xanh
                  maxLength: 100
                  pattern: ^[a-z0-9]+(-[a-z0-9]+)*$
                  type: string
        ListingStatus:
            description: |
                Lifecycle and moderation in one column. `hidden` is a live listing the seller took down for now; deletion is a separate flag entirely.
            enum:
                - draft
                - pending
                - active
                - hidden
            type: string
        LoginRequest:
            properties:
                identifier:
                    description: An email or a phone or a username.
                    type: string
                password:
                    type: string
            required:
                - identifier
                - password
            type: object
        LogoutRequest:
            properties:
                device_id:
                    $ref: '#/components/schemas/DeviceID'
            type: object
        MarkConversationReadRequest:
            properties:
                before:
