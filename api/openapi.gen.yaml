                    type: boolean
                phone:
                    nullable: true
                    type: string
                profile:
                    $ref: '#/components/schemas/Profile'
                role:
                    $ref: '#/components/schemas/AccountRole'
                status:
                    $ref: '#/components/schemas/AccountStatus'
                username:
                    nullable: true
