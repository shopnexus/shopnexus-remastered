        DraftOrderPage:
            properties:
                items:
                    items:
                        $ref: '#/components/schemas/DraftOrder'
                    type: array
                total:
                    $ref: '#/components/schemas/TotalCount'
            required:
                - items
            type: object
        DraftSKUSnapshot:
