        PaymentSessionID:
            example: pay_7bq2xn4tw9yef
            pattern: ^pay_[0-9a-hjkmnp-tv-z]{13}$
            type: string
        PaymentSessionKind:
            description: |
                What the money is for; it is what routes the flow. A client cannot pick this — the module that owes the money does.
            enum:
                - buyer-checkout
                - seller-payout
                - withdrawal
            type: string
        PaymentSessionPage:
            properties:
                data:
                    items:
                        $ref: '#/components/schemas/PaymentSession'
                    type: array
                meta:
                    $ref: '#/components/schemas/PageMeta'
            required:
                - data
                - meta
            type: object
        PaymentSessionStatus:
            enum:
                - pending
                - processing
                - success
                - cancelled
                - failed
            type: string
        PendingEdit:
            description: |
                The editable subset of a listing, held until moderation applies it. Same fields as UpdateListingRequest and only those: an edit that could carry anything would be a blob nobody can diff or review.
            properties:
                attachments:
                    items:
                        $ref: '#/components/schemas/ResourceID'
                    type: array
                category_id:
                    allOf:
                        - $ref: '#/components/schemas/CategoryID'
                    nullable: true
                condition:
                    allOf:
                        - $ref: '#/components/schemas/ListingCondition'
                    nullable: true
                description:
                    maxLength: 20000
                    nullable: true
                    type: string
                name:
                    example: Áo thun Uniqlo cổ tròn xanh navy
                    maxLength: 200
                    minLength: 1
                    nullable: true
                    type: string
                price_mode:
                    allOf:
                        - $ref: '#/components/schemas/PriceMode'
                    nullable: true
                specifications:
                    additionalProperties: true
                    type: object
                tags:
                    items:
                        $ref: '#/components/schemas/TagSlug'
                    type: array
            required:
                - name
                - description
                - category_id
                - condition
                - price_mode
                - specifications
                - attachments
                - tags
            type: object
        PriceMode:
            description: |
                How a sale on this listing starts, and it is the only thing that differs between the two.

                `fixed` is bought straight from the listing page: the buyer checks out, pays the item plus the shipping quote, and the order and its shipment exist as soon as the money lands. The seller confirms nothing.

                `negotiable` adds a second way to buy without removing the first: the asking price is still a price a buyer can take outright, and the listing page asks which they want. If they haggle, the negotiation is a thread in chat where either side revises the terms, and agreeing freezes them for the same checkout. Either way the seller never approves an order — the only thing they can refuse is a price.
            enum:
                - fixed
                - negotiable
            type: string
        Profile:
            properties:
                avatar:
                    allOf:
                        - $ref: '#/components/schemas/Resource'
                    nullable: true
                country:
                    maxLength: 2
                    minLength: 2
                    type: string
                created_at:
                    format: date-time
                    type: string
                date_of_birth:
                    format: date
                    nullable: true
                    type: string
                description:
                    nullable: true
                    type: string
                gender:
                    allOf:
                        - $ref: '#/components/schemas/ProfileGender'
                    nullable: true
                locale:
                    example: vi-VN
                    type: string
                name:
                    example: Nguyễn Văn An
                    type: string
                timezone:
                    example: Asia/Ho_Chi_Minh
                    type: string
            required:
                - name
                - description
                - gender
                - date_of_birth
                - avatar
                - country
                - locale
                - timezone
                - created_at
            type: object
        ProfileGender:
            enum:
                - male
                - female
                - other
            type: string
        PublicAccount:
            description: |
                What anyone may see about an account. The seller page: no email, no phone, no birth date, no addresses.
            properties:
                avatar:
                    allOf:
                        - $ref: '#/components/schemas/Resource'
                    nullable: true
                created_at:
                    description: Member since.
                    format: date-time
                    type: string
                description:
                    nullable: true
                    type: string
                follower_count:
                    example: 1240
                    format: int64
                    minimum: 0
                    type: integer
                id:
                    $ref: '#/components/schemas/AccountID'
                identity_verified:
                    description: Shown as a trust signal.
                    type: boolean
                name:
                    example: Nguyễn Văn An
                    type: string
            required:
                - id
                - name
                - description
                - avatar
                - identity_verified
                - follower_count
                - created_at
            type: object
        PublishListingRequest:
            description: |
                Optional. Names the address a carrier collects this listing's goods from — one of the seller's own — which is also the location buyers filter and measure by. Omitted means their default pickup address.
            properties:
                pickup_contact_id:
                    $ref: '#/components/schemas/ContactID'
            type: object
        PutTagRequest:
            description: The slug is in the path, so this carries only what can change.
            properties:
                description:
                    example: Made by hand, one at a time.
                    maxLength: 255
                    type: string
            type: object
        RefreshRequest:
            properties:
                refresh_token:
                    type: string
            required:
                - refresh_token
            type: object
        Refund:
            description: |
                The case. Always for one entire order, so it carries no amount of its own — what is owed is the order's checkout total.
            properties:
                attachments:
                    description: The buyer's evidence, topped up until the case closes.
                    items:
                        $ref: '#/components/schemas/Resource'
                    type: array
                buyer_id:
                    $ref: '#/components/schemas/AccountID'
                created_at:
                    format: date-time
                    type: string
                deadline_at:
                    description: |
                        When the party named by `status` runs out of time, and missing it is itself a move. Null while the case waits on staff or a carrier, and in the terminal states.
                    format: date-time
                    nullable: true
                    type: string
                id:
                    $ref: '#/components/schemas/RefundID'
                order_id:
                    $ref: '#/components/schemas/OrderID'
                reason:
                    example: Not as described
                    type: string
                returned_at:
                    description: |
                        When the return leg was reported delivered. Set by either party's report, since it answers "is there anything left to ship" for a later verdict — whose report it was is what `status` says.
                    format: date-time
                    nullable: true
                    type: string
                seller_decided_at:
                    description: |
                        When the seller answered — by granting the refund, or by handing it to staff. There is no rejection reason beside it: they cannot refuse one.
                    format: date-time
                    nullable: true
                    type: string
                status:
                    $ref: '#/components/schemas/RefundStatus'
            required:
                - id
                - order_id
                - buyer_id
                - status
                - reason
                - attachments
                - deadline_at
                - seller_decided_at
                - returned_at
                - created_at
            type: object
        RefundID:
            example: rfd_z3n8kvq1wd6pt
            pattern: ^rfd_[0-9a-hjkmnp-tv-z]{13}$
            type: string
        RefundPage:
            properties:
                data:
                    items:
                        $ref: '#/components/schemas/Refund'
                    type: array
                meta:
                    $ref: '#/components/schemas/CursorMeta'
            required:
                - data
                - meta
            type: object
        RefundStatus:
            description: |
                Every live value names the party whose move the refund is waiting on, and each of those carries a `deadline_at` that the party can miss:

                `awaiting-seller-review` — the seller grants it or hands it to staff; they cannot refuse it. Missing the window hands it to staff too. `disputed` — staff are looking at it. `returning` — the goods are on their way back; only a granted refund ever reaches here. `returned` — the seller has acknowledged the return and now inspects what arrived, and may escalate until the window closes, which is where a broken or substituted return is caught. A return the buyer reports and the seller has not goes to `disputed` rather than here.

                Then three terminals: `accepted` is money back to the buyer and the order closed with it, `rejected` is no refund and the payout stands, `cancelled` is the buyer withdrawing before the seller decided. Only the last two give the escrow up — `accepted` keeps its claim, because that money has already gone to the buyer.
            enum:
                - awaiting-seller-review
                - disputed
                - returning
                - returned
                - accepted
                - rejected
                - cancelled
            type: string
        RefundVerdictRequest:
            description: A decision, so there is no "still deciding" choice — which is why the verdict is a boolean rather than a status enum.
            properties:
                buyer_wins:
                    description: What it does to the money depends on whether the goods have come back; see the endpoint.
                    example: true
                    type: boolean
                note:
                    description: The reasoning, carried to the ticket this closes
                    example: Evidence is clear
                    maxLength: 2000
                    type: string
            required:
                - buyer_wins
            type: object
        RegisterDeviceRequest:
            properties:
                platform:
                    $ref: '#/components/schemas/DevicePlatform'
                push_token:
                    maxLength: 4096
                    minLength: 1
                    type: string
            required:
                - platform
                - push_token
            type: object
        RegisterRequest:
            description: |
                At least one of email, phone or username is required. The profile fields are part of the same request because the account and its profile are created together.
            properties:
                country:
                    maxLength: 2
                    minLength: 2
                    pattern: ^[A-Z]{2}$
                    type: string
                email:
                    format: email
                    maxLength: 255
                    type: string
                locale:
                    example: vi-VN
                    pattern: ^[a-z]{2}(-[A-Z]{2})?$
                    type: string
                name:
                    description: Display name.
                    maxLength: 100
                    minLength: 1
                    type: string
                password:
                    maxLength: 72
                    minLength: 8
                    type: string
                phone:
                    description: E.164.
                    pattern: ^\+[1-9][0-9]{7,14}$
                    type: string
                timezone:
                    example: Asia/Ho_Chi_Minh
                    maxLength: 64
                    type: string
                username:
                    maxLength: 100
                    minLength: 3
                    pattern: ^[a-z0-9._-]+$
                    type: string
            required:
                - password
                - name
                - country
                - locale
                - timezone
            type: object
        Reputation:
            description: |
                Recomputed, never written directly. Transaction ratings and product-review ratings stay apart: one order can produce both and summing them would count it twice.
            properties:
                account_id:
                    $ref: '#/components/schemas/AccountID'
                cancelled_orders:
                    example: 3
                    format: int64
                    minimum: 0
                    type: integer
                completed_orders:
                    example: 152
                    format: int64
                    minimum: 0
                    type: integer
                rating_average:
                    description: Average transaction feedback from 1 to 5. Zero when there is none.
                    example: 4.6
                    format: double
                    maximum: 5
                    minimum: 0
                    type: number
                rating_count:
                    example: 87
                    format: int64
                    minimum: 0
                    type: integer
                review_rating_average:
                    description: Average product-review rating. Always zero for the buyer role.
                    example: 4.6
                    format: double
                    maximum: 5
                    minimum: 0
                    type: number
                review_rating_count:
                    example: 64
                    format: int64
                    minimum: 0
                    type: integer
                role:
                    $ref: '#/components/schemas/ReputationRole'
                updated_at:
                    description: When it was last recomputed.
                    format: date-time
                    type: string
            required:
                - account_id
                - role
                - rating_average
                - rating_count
                - review_rating_average
                - review_rating_count
                - completed_orders
                - cancelled_orders
                - updated_at
            type: object
        ReputationRole:
            enum:
                - seller
                - buyer
            type: string
        ResolveTicketRequest:
            properties:
                action_taken:
                    allOf:
                        - $ref: '#/components/schemas/TicketResolutionAction'
                    description: Required. `none` is the turn-down; anything else names what was done.
                note:
                    example: đã xác nhận hàng giả
                    maxLength: 2000
                    type: string
            required:
                - action_taken
            type: object
        Resource:
            properties:
                checksum:
                    description: Content hash, read back from storage at completion.
                    example: 9f86d081884c7d659a2feaa0c55ad015a3bf4f1b2b0b822cd15d6c15b0f00a08
                    type: string
                id:
                    $ref: '#/components/schemas/ResourceID'
                mime:
                    example: image/jpeg
                    type: string
                object_key:
                    description: Provider-specific path to the bytes.
                    example: listings/2026/07/9f86d081.jpg
                    type: string
                provider:
                    description: Storage backend, kebab-case — `s3`, `minio`, `local`.
                    example: minio
                    type: string
                size:
                    description: Bytes, as read back from storage rather than as declared.
                    example: 248132
                    format: int64
                    minimum: 0
                    type: integer
                url:
                    description: |
                        Short-lived URL to fetch the bytes. Empty until a module can presign one, so a consumer that needs the bytes has to treat an empty string as "not available yet". Not a stable address: store the id, not this.
                    example: https://cdn.shopnexus.test/o/9f86d081?expires=1785000000
                    format: uri
                    type: string
                url_expires_at:
                    format: date-time
                    nullable: true
                    type: string
            required:
                - id
                - provider
                - object_key
                - mime
                - size
                - checksum
                - url
                - url_expires_at
            type: object
        ResourceID:
            example: res_4mx8jd2qr5wtc
            pattern: ^res_[0-9a-hjkmnp-tv-z]{13}$
            type: string
        Review:
            properties:
                attachments:
                    items:
                        $ref: '#/components/schemas/Resource'
                    type: array
                author:
                    $ref: '#/components/schemas/AccountSummary'
                body:
                    type: string
                created_at:
                    format: date-time
                    type: string
                id:
                    $ref: '#/components/schemas/ReviewID'
                listing_id:
                    $ref: '#/components/schemas/ListingID'
                rating:
                    maximum: 5
                    minimum: 1
                    type: integer
                replies:
                    description: |
                        The first few, oldest first. Replies are unlimited, so a page of reviews cannot carry all of them — `reply_count` says how many there are and `GET /reviews/{id}` returns the rest.
                    items:
                        $ref: '#/components/schemas/ReviewReply'
                    maxItems: 3
                    type: array
                reply_count:
                    example: 2
                    format: int64
                    minimum: 0
                    type: integer
                updated_at:
                    description: |
                        Null until the author edits it. A review rewritten after the seller answered it should say so, and the reply thread cannot say it on its own.
                    format: date-time
                    nullable: true
                    type: string
                votes:
                    $ref: '#/components/schemas/ReviewVoteTally'
            required:
                - id
                - listing_id
                - author
                - rating
                - body
                - attachments
                - replies
                - reply_count
                - votes
                - created_at
                - updated_at
            type: object
        ReviewID:
            example: rvw_qk4mfx7bd32h9
            pattern: ^rvw_[0-9a-hjkmnp-tv-z]{13}$
            type: string
        ReviewPage:
            properties:
                data:
                    items:
                        $ref: '#/components/schemas/Review'
                    type: array
                meta:
                    $ref: '#/components/schemas/CursorMeta'
            required:
                - data
                - meta
            type: object
        ReviewReply:
            properties:
                author:
                    $ref: '#/components/schemas/AccountSummary'
                body:
                    type: string
                created_at:
                    format: date-time
                    type: string
                id:
                    $ref: '#/components/schemas/ReviewReplyID'
                is_seller:
                    description: Whether the author owns the listing.
                    type: boolean
            required:
                - id
                - author
                - is_seller
                - body
                - created_at
            type: object
        ReviewReplyID:
            example: rpl_mfx7bd32h9qk4
            pattern: ^rpl_[0-9a-hjkmnp-tv-z]{13}$
            type: string
        ReviewVoteTally:
            description: |
                Counters on the review, not a count of `review_vote` rows per request — that is what lets `sort=helpful` be an index scan. Flipping a vote moves one unit between the two totals, so both sides have to change in the same transaction as the vote row itself; a tally that has drifted from the rows it summarises is recomputable, but a half-applied flip is visible.
            properties:
                helpful:
                    example: 12
                    format: int64
                    minimum: 0
                    type: integer
                my_vote:
                    description: The caller's own vote. Null when they have not voted.
                    enum:
                        - -1
                        - 1
                    nullable: true
                    type: integer
                not_helpful:
                    example: 1
                    format: int64
                    minimum: 0
                    type: integer
            required:
                - helpful
                - not_helpful
                - my_vote
            type: object
        SaveOptionRequest:
            description: The operator's edit. Every field is optional; absent leaves it alone.
            properties:
                description:
                    example: Door to door, 2 to 3 days.
                    maxLength: 1000
                    type: string
                is_enabled:
                    description: Take it out of the chooser's list without deleting the row.
                    example: false
                    type: boolean
                name:
                    example: GHN Express
                    maxLength: 200
                    type: string
                priority:
                    example: 100
                    maximum: 1000
                    minimum: 0
                    type: integer
                provider:
                    description: One of `providers` from `/admin/options`. Unknown here is 422.
                    example: mock
                    maxLength: 100
                    type: string
            type: object
        SemanticSeed:
            description: |
                A tag slug or a category id, told apart the same way a listing ref is: an opaque id always carries an underscore after its prefix and a slug never does.

                Both are legal seeds for the same query because every embedding column in this schema is `vector(1024)` indexed with `vector_cosine_ops` — one BGE-M3 space — so the distance between a category and a tag means the same thing as the distance between two tags. A seed whose vector the cron has not computed yet is rejected rather than silently ignored, since dropping it would answer a different question than the one asked.
            oneOf:
                - $ref: '#/components/schemas/TagSlug'
                - $ref: '#/components/schemas/CategoryID'
        SendMessageRequest:
            description: A body or at least one attachment is required.
            properties:
                attachments:
                    items:
                        $ref: '#/components/schemas/ResourceID'
                    maxItems: 10
                    type: array
                body:
                    maxLength: 4000
                    type: string
                refs:
                    additionalProperties: true
                    description: |
                        References to point at, each checked against the caller's access to it. There is no way to set `card` from here: a system payload is the backend's to write.
                    type: object
            type: object
        ShippingQuote:
            properties:
                fee:
                    description: What the buyer would pay this carrier. Re-quoted at checkout, so it is an estimate a client renders rather than a price it can hold.
                    example: 15000
                    format: int64
                    minimum: 0
                    type: integer
                name:
                    example: GHN Express
                    type: string
                option:
                    example: ghn-express
                    type: string
            required:
                - option
                - name
                - fee
            type: object
        ShippingQuotes:
            properties:
                contact_id:
                    allOf:
                        - $ref: '#/components/schemas/ContactID'
                    description: |
                        The address these fees are for, echoed because the request may not have named one — a fee with no address beside it is not one a client can render or offer to change.
                currency:
                    $ref: '#/components/schemas/CurrencyCode'
                options:
                    items:
                        $ref: '#/components/schemas/ShippingQuote'
                    type: array
            required:
                - options
                - currency
                - contact_id
            type: object
        ShippingQuotesRequest:
            description: |
                Exactly one of `variant_id`, `draft_id` or `offer_id`. A variant is an estimate for a listing page, before anything is frozen; a draft and an accepted offer are the two things that freeze a price, and the parcel is whichever of them is about to be checked out.
            properties:
                contact_id:
                    allOf:
                        - $ref: '#/components/schemas/ContactID'
                    description: |
                        Where the parcel goes. Omit it and the caller's default delivery address is used, which is what lets a listing page quote with no form; 422 when they have none on file.
                draft_id:
                    $ref: '#/components/schemas/DraftOrderID'
                lines:
                    description: |
                        The draft's variants and quantities, as a checkout would send them. Ignored for an offer, whose quantity was negotiated.
                    items:
                        $ref: '#/components/schemas/CheckoutLine'
                    maxItems: 50
                    type: array
                offer_id:
                    $ref: '#/components/schemas/OfferID'
                quantity:
                    description: |
                        How many of `variant_id`. Omitted means one, since a listing page quotes the single unit in front of the buyer. Ignored by the other two sources, which carry their own.
                    example: 1
                    format: int64
                    minimum: 1
                    type: integer
                variant_id:
                    allOf:
                        - $ref: '#/components/schemas/VariantID'
                    description: |
                        The variant being looked at. Delivery is priced from the *variant's* package details, not the listing's: one listing can hold an 80 g charger and a 2 kg one.
            type: object
        SimilarityScore:
            description: |
                Relevance, always oriented so that higher is closer — for a vector ranking that is `1 - (a <=> b)`, the cosine similarity, because the operator itself returns a distance. Null unless the request asked for a ranking.
            example: 0.87
            format: double
            maximum: 1
            minimum: -1
            nullable: true
            type: number
        StartConversationRequest:
            properties:
                account_id:
                    $ref: '#/components/schemas/AccountID'
            required:
                - account_id
            type: object
        StartIdentityVerificationRequest:
            description: |
                The scans are uploaded first through `POST /resources` and named here by id: a photo of a government ID does not belong in a JSON body, and the upload has its own retry story.
            properties:
                back_resource_id:
                    allOf:
                        - $ref: '#/components/schemas/ResourceID'
                    description: The reverse, for a document that has one. Omit for a passport.
                doc_type:
                    $ref: '#/components/schemas/IdentityDocumentType'
                front_resource_id:
                    allOf:
                        - $ref: '#/components/schemas/ResourceID'
                    description: The data page, or the front of the card.
                selfie_resource_id:
                    allOf:
                        - $ref: '#/components/schemas/ResourceID'
                    description: |
                        A live photo, matched against the portrait on the document. Required: without it the document is verified but nothing ties it to the person holding the account.
            required:
                - doc_type
                - front_resource_id
                - selfie_resource_id
            type: object
        StartPaymentRequest:
            properties:
                amount:
                    description: Omit to tender the whole outstanding balance. Pass it to split the session across rails.
                    example: 299000
                    format: int64
                    minimum: 1
                    type: integer
                payment_option:
                    description: A slug from `GET /options?category=payment`; one nobody enabled is refused with 422.
                    example: platform-checkout
                    maxLength: 100
                    pattern: ^[a-z0-9]+(-[a-z0-9]+)*$
                    type: string
                return_url:
                    description: |
                        Where the gateway sends the payer back. Checked against the platform's own allowlist of hosts and rejected otherwise — a URL that reaches a redirect unvalidated is an open redirect wearing a payment flow.
                    maxLength: 2048
                    type: string
            required:
                - payment_option
            type: object
        Stock:
            description: |
                Always read inside its own variant, so it does not repeat the variant id.
            properties:
                available:
                    description: quantity − reserved − sold.
                    example: 39
                    format: int64
                    minimum: 0
                    type: integer
                quantity:
                    description: Total on hand.
                    example: 42
                    format: int64
                    minimum: 0
                    type: integer
                reserved:
                    description: |
                        Held by a checkout that has not completed. Moved by checkout and by cancellation, never set directly, and it comes back when a session expires.
                    example: 3
                    format: int64
                    minimum: 0
                    type: integer
                sold:
                    description: |
                        Completed sales. Only ever goes up, which is what makes it usable as social proof — a reservation counts here only once the purchase completes.
                    example: 128
                    format: int64
                    minimum: 0
                    type: integer
            required:
                - quantity
                - reserved
                - sold
                - available
            type: object
        SubmitFeedbackRequest:
            description: |
                The direction and the ratee both follow from the order, so neither is sent.
            properties:
                comment:
                    maxLength: 2000
                    type: string
                rating:
                    maximum: 5
                    minimum: 1
                    type: integer
            required:
                - rating
            type: object
        SubmitReviewReplyRequest:
            properties:
                body:
                    maxLength: 2000
                    minLength: 1
                    type: string
            required:
                - body
            type: object
        SubmitReviewRequest:
            properties:
                attachments:
                    items:
                        $ref: '#/components/schemas/ResourceID'
                    maxItems: 10
                    type: array
                body:
                    maxLength: 2000
                    type: string
                order_id:
                    $ref: '#/components/schemas/OrderID'
                rating:
                    maximum: 5
                    minimum: 1
                    type: integer
            required:
                - order_id
                - rating
            type: object
        SuggestListingRequest:
            description: At least one of `attachments`, `note` or `voice_note`.
            properties:
                attachments:
                    description: Confirmed uploads. The first three are what the model reads.
                    items:
                        $ref: '#/components/schemas/ResourceID'
                    maxItems: 10
                    type: array
                language:
                    description: ISO-639-1 hint for the transcription. Omit to let the model detect.
                    example: vi
                    maxLength: 2
                    minLength: 2
                    type: string
                note:
                    description: What the seller typed. A phone's own dictation key fills this in just as well.
                    example: bán iphone 12 64gb pin 89%, còn bảo hành, 5 triệu
                    maxLength: 2000
                    type: string
                voice_note:
                    description: |
                        The recording, base64. Inline rather than an upload because it is input and not content: nothing keeps it, so nothing has to reap it. Around a megabyte at most — a seller describes an item in a sentence or two.
                    format: byte
                    type: string
                voice_note_mime:
                    example: audio/ogg
                    maxLength: 100
                    type: string
            type: object
        SuspendAccountRequest:
            properties:
                reason:
                    maxLength: 2000
                    minLength: 1
                    type: string
                until:
                    description: Omit for a permanent suspension.
                    format: date-time
                    type: string
            required:
                - reason
            type: object
        Tag:
            properties:
                description:
                    example: Made by hand, one at a time.
                    nullable: true
                    type: string
                score:
                    allOf:
                        - $ref: '#/components/schemas/SimilarityScore'
                    nullable: true
                slug:
                    $ref: '#/components/schemas/TagSlug'
            required:
                - slug
                - description
                - score
            type: object
        TagPage:
            properties:
                data:
                    items:
                        $ref: '#/components/schemas/Tag'
                    type: array
                meta:
                    $ref: '#/components/schemas/PageMeta'
            required:
                - data
                - meta
            type: object
        TagSlug:
            description: A tag's id is its slug. A natural key, so it is never encoded.
            example: handmade
            maxLength: 100
            pattern: ^[a-z0-9]+(-[a-z0-9]+)*$
            type: string
        TakedownRequest:
            properties:
                notify_seller:
                    default: true
                    type: boolean
                reason:
                    maxLength: 2000
                    minLength: 1
                    type: string
            required:
                - reason
            type: object
        TaxCodeType:
            enum:
                - individual
                - business
                - household
            type: string
        TaxInfo:
            properties:
                legal_name:
                    type: string
                tax_code:
                    example: "0123456789"
                    type: string
                tax_code_type:
                    $ref: '#/components/schemas/TaxCodeType'
                updated_at:
                    description: When the registration was last replaced, which also resets the verdict.
                    format: date-time
                    type: string
                verification_status:
                    $ref: '#/components/schemas/TaxVerificationStatus'
                verified_at:
                    format: date-time
                    nullable: true
                    type: string
            required:
                - tax_code
                - tax_code_type
                - legal_name
                - verification_status
                - verified_at
                - updated_at
            type: object
        TaxVerificationRequest:
            properties:
                note:
                    maxLength: 2000
                    type: string
                source:
                    description: What the verdict was based on
                    maxLength: 200
                    type: string
                status:
                    description: A verdict, so `pending` is not a choice
                    enum:
                        - verified
                        - rejected
                    type: string
            required:
                - status
                - source
            type: object
        TaxVerificationStatus:
            enum:
                - pending
                - verified
                - rejected
            type: string
        Ticket:
            properties:
                action_taken:
                    allOf:
                        - $ref: '#/components/schemas/TicketAction'
                    description: Null until the ticket is resolved.
                    nullable: true
                conversation_id:
                    allOf:
                        - $ref: '#/components/schemas/ConversationID'
                    description: |
                        The thread this ticket is discussed in — where the requester's own words went and where support answers. Null only between the row being written and the thread being opened; reading the ticket repairs it.
                    nullable: true
                created_at:
                    format: date-time
                    type: string
                id:
                    $ref: '#/components/schemas/TicketID'
                kind:
                    $ref: '#/components/schemas/TicketKind'
                reason:
                    allOf:
                        - $ref: '#/components/schemas/TicketReason'
                    nullable: true
                ref_id:
                    description: |
                        Opaque id of what the ticket is about, kinded by `ref_type`. Null on a ticket about nothing in particular.
                    example: lst_1ryaj8117v2p4
                    nullable: true
                    pattern: ^[a-z]{3}_[0-9a-hjkmnp-tv-z]{13}$
                    type: string
                ref_type:
                    allOf:
                        - $ref: '#/components/schemas/TicketRefType'
                    nullable: true
                resolution_note:
                    example: đã xác nhận hàng giả
                    nullable: true
                    type: string
                resolved_at:
                    format: date-time
                    nullable: true
                    type: string
                status:
                    $ref: '#/components/schemas/TicketStatus'
                subject:
                    example: Hàng không đúng mô tả
                    type: string
            required:
                - id
                - kind
                - subject
                - ref_type
                - ref_id
                - reason
                - status
                - conversation_id
                - action_taken
                - resolved_at
                - resolution_note
                - created_at
            type: object
        TicketAction:
            description: |
                What was done about it. `none` is a ticket read and answered with nothing done — the turn-down, which is why it is a value here and not a second status. The two `refund-*` ones are written by order's verdict route and are not in the set `POST /admin/tickets/{id}/resolution` accepts — see `TicketResolutionAction`.
            enum:
                - none
                - listing-removed
                - message-removed
                - account-suspended
                - warning
                - refund-granted
                - refund-refused
            type: string
        TicketID:
            example: tkt_9c4vt6bkn1pzs
            pattern: ^tkt_[0-9a-hjkmnp-tv-z]{13}$
            type: string
        TicketKind:
            description: |
                What was raised. The five `report-*` kinds and `refund-dispute`/`order-issue` are about something and carry a `ref_id`; the rest are about nothing in particular.
            enum:
                - report-listing
                - report-account
                - report-message
                - report-review
                - report-review-reply
                - refund-dispute
                - order-issue
                - payment
                - account
                - feature-request
                - other
            type: string
        TicketPage:
            properties:
                data:
                    items:
                        $ref: '#/components/schemas/Ticket'
                    type: array
                meta:
                    $ref: '#/components/schemas/CursorMeta'
            required:
                - data
                - meta
            type: object
        TicketReason:
            description: A report's grounds. Null on every other kind.
            enum:
                - scam
                - counterfeit
                - prohibited
                - harassment
                - spam
                - inappropriate
                - other
            type: string
        TicketRefType:
            description: What kind of thing `ref_id` names. Follows from `kind`, never sent by a client.
            enum:
                - listing
                - account
                - message
                - review
                - review-reply
                - order
                - refund
            type: string
        TicketResolutionAction:
            description: |
                What a moderator may record by hand. Narrower than the ticket's own `action_taken`, which also has the two `refund-*` values: those are written by order's verdict route, because that is where the money moves. Sending one here is a 400 on the field.
            enum:
                - none
                - listing-removed
                - message-removed
                - account-suspended
                - warning
            type: string
        TicketStatus:
            description: |
                `reviewing` is claimed by a moderator; `resolved` carries `action_taken`, which is where a turn-down lives as the value `none`.
            enum:
                - open
                - reviewing
                - resolved
            type: string
        Transaction:
            description: One movement on an external rail. Append-only.
            properties:
                amount:
                    description: Signed — positive is a charge, negative is a reversal.
                    example: 299000
                    format: int64
                    type: integer
                checkout_url:
                    description: Where to send the payer for this leg. Empty once the rail no longer needs it, or for rails that have none.
                    type: string
                created_at:
                    format: date-time
                    type: string
                currency:
                    allOf:
                        - $ref: '#/components/schemas/CurrencyCode'
                    description: What the rail actually debits, which split tender may make differ from the session's currency.
                error:
                    description: Empty unless the rail reported a failure on this leg.
                    type: string
                expired_at:
                    description: Gateway URL expiry
                    format: date-time
                    nullable: true
                    type: string
                id:
                    $ref: '#/components/schemas/TransactionID'
                note:
                    type: string
                payment_option:
                    description: A payment option slug owned by the common module
                    type: string
                reverses_id:
                    allOf:
                        - $ref: '#/components/schemas/TransactionID'
                    description: The leg this one reverses. Set on reversals, null on originals.
                    nullable: true
                session_id:
                    $ref: '#/components/schemas/PaymentSessionID'
                settled_at:
                    format: date-time
                    nullable: true
                    type: string
                status:
                    $ref: '#/components/schemas/TransactionStatus'
            required:
                - id
                - session_id
                - status
                - payment_option
                - amount
                - currency
                - reverses_id
                - checkout_url
                - error
                - note
                - created_at
                - settled_at
                - expired_at
            type: object
        TransactionID:
            example: txn_5wtc4mx8jd2qr
            pattern: ^txn_[0-9a-hjkmnp-tv-z]{13}$
            type: string
        TransactionList:
            description: Unpaginated — a session has as many legs as rails it was split across, which is a handful.
            properties:
                data:
                    items:
                        $ref: '#/components/schemas/Transaction'
                    type: array
            required:
                - data
            type: object
        TransactionStatus:
            description: A leg goes pending → success or failed, and success is terminal. Deliberately narrower than a session's status.
            enum:
                - pending
                - success
                - failed
            type: string
        Transport:
            description: |
                One shipment as the platform knows it. The carrier's own view — tracking number, label, raw webhook payloads — is held in the row but not published: it is provider-shaped, and nothing a client renders depends on it.
            properties:
                created_at:
                    format: date-time
                    type: string
                fee:
                    description: |
                        What the buyer paid for delivery, quoted from this carrier when the checkout opened. The buyer bears carriage on both a fixed-price and a negotiated sale, so a seller is never charged for it.
                    example: 15000
                    format: int64
                    minimum: 0
                    type: integer
                id:
                    $ref: '#/components/schemas/TransportID'
                option:
                    description: An enabled transport option's slug
                    example: ghn-express
                    type: string
                status:
                    $ref: '#/components/schemas/TransportStatus'
            required:
                - id
                - option
                - status
                - fee
                - created_at
            type: object
        TransportCheckpoint:
            description: |
                A position a checkpoint may report, so `pending` is not one of them — that is where a shipment starts, not somewhere it can be moved to. The last three are outcomes and are reachable from anywhere: a parcel can fail before it is ever collected.
            enum:
                - picked-up
                - in-transit
                - delivered
                - returned
                - failed
            type: string
        TransportCheckpointRequest:
            description: One carrier-reported position. The same shape for the outbound leg and for the leg carrying a refund's goods back.
            properties:
                status:
                    $ref: '#/components/schemas/TransportCheckpoint'
            required:
                - status
            type: object
        TransportID:
            example: trp_d6ptz3n8kvq1w
            pattern: ^trp_[0-9a-hjkmnp-tv-z]{13}$
            type: string
        TransportStatus:
            description: Where the shipment is. `pending` is created but not yet handed over.
            enum:
                - pending
                - picked-up
                - in-transit
                - delivered
                - returned
                - failed
                - cancelled
            type: string
        UnreadCount:
            properties:
                unread:
                    example: 3
                    format: int64
                    minimum: 0
                    type: integer
            required:
                - unread
            type: object
        UpdateAccountRequest:
            description: Every field optional. Omit one to leave it alone, send a value to replace it, send its `clear_*` flag to remove it — which is refused when it is the last identifier (422 `no_identifier`).
            properties:
                clear_email:
                    example: false
                    type: boolean
                clear_phone:
                    example: false
                    type: boolean
                clear_username:
                    example: false
                    type: boolean
                email:
                    example: alice@example.com
                    format: email
                    maxLength: 255
                    type: string
                phone:
                    example: "+84901234567"
                    pattern: ^\+[1-9][0-9]{7,14}$
                    type: string
                username:
                    example: alice
                    maxLength: 100
                    minLength: 3
                    pattern: ^[a-z0-9._-]+$
                    type: string
            type: object
        UpdateBankAccountRequest:
            properties:
                is_default:
                    description: The only mutable field
                    enum:
                        - true
                    type: boolean
            required:
                - is_default
            type: object
        UpdateCartItemRequest:
            properties:
                quantity:
                    example: 2
                    format: int64
                    minimum: 1
                    type: integer
            required:
                - quantity
            type: object
        UpdateCategoryRequest:
            description: |
                Every field optional. Omit a field to leave it, send a value to replace it, send `clear_parent_id` to make the category a root.
            properties:
                clear_parent_id:
                    description: Promotes the category to a root.
                    example: false
                    type: boolean
                description:
                    example: Hand-thrown and slipcast pottery.
                    maxLength: 2000
                    type: string
                name:
                    example: Ceramics
                    maxLength: 100
                    minLength: 1
                    type: string
                parent_id:
                    $ref: '#/components/schemas/CategoryID'
            type: object
        UpdateContactRequest:
            description: Every field optional. Changing `phone` clears `phone_verified`. The `clear_*` flags remove a nullable field; the district pair and the coordinate travel together, so they clear together.
            properties:
                address:
                    example: 1 Lê Lợi
                    maxLength: 255
                    type: string
                address_detail:
                    example: Tầng 3
                    maxLength: 255
                    type: string
                address_type:
                    $ref: '#/components/schemas/ContactAddressType'
                clear_address_detail:
                    example: false
                    type: boolean
                clear_district:
                    example: false
                    type: boolean
                clear_location:
                    example: false
                    type: boolean
                clear_postal_code:
                    example: false
                    type: boolean
                country:
                    example: VN
                    maxLength: 2
                    minLength: 2
                    pattern: ^[A-Z]{2}$
                    type: string
                district_code:
                    example: "760"
                    maxLength: 20
                    type: string
                district_name:
                    example: Quận 1
                    maxLength: 100
                    type: string
                full_name:
                    example: Nguyễn An
                    maxLength: 100
                    minLength: 1
                    type: string
                is_default_delivery:
                    example: true
                    type: boolean
                is_default_pickup:
                    example: false
                    type: boolean
                latitude:
                    example: 10.7769
                    format: double
                    maximum: 90
                    minimum: -90
                    type: number
                longitude:
                    example: 106.7009
                    format: double
                    maximum: 180
                    minimum: -180
                    type: number
                phone:
                    example: "+84901234567"
                    pattern: ^\+[1-9][0-9]{7,14}$
                    type: string
                postal_code:
                    example: "700000"
                    maxLength: 20
                    type: string
                province_code:
                    example: "79"
                    maxLength: 20
                    type: string
                province_name:
                    example: TP Hồ Chí Minh
                    maxLength: 100
                    type: string
                ward_code:
                    example: "26734"
                    maxLength: 20
                    type: string
                ward_name:
                    example: Bến Nghé
                    maxLength: 100
                    type: string
            type: object
        UpdateListingRequest:
            description: Every field optional. Variants are edited through their own endpoints.
            properties:
                attachments:
                    items:
                        $ref: '#/components/schemas/ResourceID'
                    type: array
                category_id:
                    $ref: '#/components/schemas/CategoryID'
                clear_featured_variant_id:
                    description: Leaves the listing with no featured variant; the card then shows the cheapest one.
                    example: false
                    type: boolean
                condition:
                    $ref: '#/components/schemas/ListingCondition'
                description:
                    maxLength: 20000
                    type: string
                featured_variant_id:
                    $ref: '#/components/schemas/VariantID'
                name:
                    maxLength: 200
                    minLength: 1
                    type: string
                price_mode:
                    $ref: '#/components/schemas/PriceMode'
                specifications:
                    additionalProperties: true
                    type: object
                tags:
                    items:
                        $ref: '#/components/schemas/TagSlug'
                    type: array
            type: object
        UpdateMessageRequest:
            properties:
                body:
                    maxLength: 4000
                    minLength: 1
                    type: string
            required:
                - body
            type: object
        UpdateNotificationPreferencesRequest:
            properties:
                items:
                    items:
                        properties:
                            category:
                                $ref: '#/components/schemas/NotificationCategory'
                            channel:
                                $ref: '#/components/schemas/NotificationChannel'
                            is_enabled:
                                type: boolean
                        required:
                            - category
                            - channel
                            - is_enabled
                        type: object
                    minItems: 1
                    type: array
            required:
                - items
            type: object
        UpdateOfferRequest:
            properties:
                quantity:
                    example: 2
                    format: int64
                    minimum: 1
                    type: integer
                reason:
                    maxLength: 500
                    type: string
                total:
                    example: 598000
                    format: int64
                    minimum: 1
                    type: integer
            required:
                - quantity
                - total
            type: object
        UpdateProfileRequest:
            description: Every field optional. `name`, `country`, `locale` and `timezone` are required columns, so they can be replaced but not cleared.
            properties:
                avatar_resource_id:
                    $ref: '#/components/schemas/ResourceID'
                clear_avatar_resource_id:
                    example: false
                    type: boolean
                clear_date_of_birth:
                    example: false
                    type: boolean
                clear_description:
                    example: false
                    type: boolean
                clear_gender:
                    example: false
                    type: boolean
                country:
                    example: VN
                    maxLength: 2
                    minLength: 2
                    pattern: ^[A-Z]{2}$
                    type: string
                date_of_birth:
                    example: "2001-02-03"
                    format: date
                    type: string
                description:
                    example: Bán đồ cũ
                    maxLength: 2000
                    type: string
                gender:
                    $ref: '#/components/schemas/ProfileGender'
                locale:
                    example: vi-VN
                    pattern: ^[a-z]{2}(-[A-Z]{2})?$
                    type: string
                name:
                    example: Alice
                    maxLength: 100
                    minLength: 1
                    type: string
                timezone:
                    example: Asia/Ho_Chi_Minh
                    maxLength: 64
                    type: string
            type: object
        UpdateReviewRequest:
            description: |
                Every field optional. `attachments` replaces the whole set and is capped at the same ten the submission is: an edit is not a way around a limit.
            properties:
                attachments:
                    items:
                        $ref: '#/components/schemas/ResourceID'
                    maxItems: 10
                    type: array
                body:
                    maxLength: 2000
                    type: string
                rating:
                    maximum: 5
                    minimum: 1
                    type: integer
            type: object
        UpdateVariantRequest:
            description: Every field optional.
            properties:
                attachments:
                    items:
                        $ref: '#/components/schemas/ResourceID'
                    type: array
                attributes:
                    additionalProperties: true
                    type: object
                is_featured:
                    description: |
                        True moves the card's variant to this one. False is ignored: which variant is featured is cleared through `clear_featured_variant_id` on the listing, so there is one way to spell it.
                    example: true
                    type: boolean
                package_details:
                    additionalProperties: true
                    type: object
                price:
                    example: 299000
                    format: int64
                    minimum: 1
                    type: integer
                quantity:
                    description: The new total on hand. Refused below `reserved + sold`.
                    example: 42
                    format: int64
                    minimum: 0
                    type: integer
            type: object
        UploadSlot:
            properties:
                expires_at:
                    format: date-time
                    type: string
                headers:
                    additionalProperties:
                        type: string
                    description: Send these with the PUT verbatim, when the signature covers any.
                    type: object
                resource_id:
                    $ref: '#/components/schemas/ResourceID'
                url:
                    description: PUT the bytes here. Short-lived, and signed for this key and method only.
                    example: https://store.example/objects/catalog/listing/9f2c?signature=...
                    type: string
            required:
                - resource_id
                - url
                - headers
                - expires_at
            type: object
        UpsertTaxInfoRequest:
            properties:
                legal_name:
                    maxLength: 200
                    minLength: 1
                    type: string
                tax_code:
                    description: Vietnamese MST — ten digits, or ten plus a three-digit branch.
                    pattern: ^\d{10}(-\d{3})?$
                    type: string
                tax_code_type:
                    $ref: '#/components/schemas/TaxCodeType'
            required:
                - tax_code
                - tax_code_type
                - legal_name
            type: object
        Variant:
            description: A purchasable variant. Price and package details live here rather than on the listing.
            properties:
                attributes:
                    additionalProperties: true
                    description: Variant attributes such as size and colour.
                    type: object
                created_at:
                    format: date-time
                    type: string
                id:
                    $ref: '#/components/schemas/VariantID'
                images:
                    description: Empty means fall back to the listing gallery.
                    items:
                        $ref: '#/components/schemas/Resource'
                    type: array
                is_featured:
                    description: The variant the card and search results show. At most one per listing.
                    example: true
                    type: boolean
                package_details:
                    additionalProperties: true
                    description: Weight and dimensions. A shipping quote is computed from these.
                    type: object
                price:
                    description: Smallest unit of the listing's currency.
                    example: 299000
                    format: int64
                    minimum: 1
                    type: integer
                stock:
                    $ref: '#/components/schemas/Stock'
            required:
                - id
                - price
                - attributes
                - package_details
                - images
                - is_featured
                - stock
                - created_at
            type: object
        VariantID:
            example: vrn_vq1wd6ptz3n8k
            pattern: ^vrn_[0-9a-hjkmnp-tv-z]{13}$
            type: string
        VerifyContactPhoneRequest:
            properties:
                code:
                    maxLength: 10
                    minLength: 4
                    type: string
            required:
                - code
            type: object
        VoteReviewRequest:
            properties:
                vote:
                    description: |
                        Helpful or not. There is no neutral value — withdrawing a vote is a delete.
                    enum:
                        - -1
                        - 1
                    type: integer
            required:
                - vote
            type: object
        Wallet:
            properties:
                account_id:
                    $ref: '#/components/schemas/AccountID'
                available_balance:
                    description: Spendable and withdrawable
                    example: 1250000
                    format: int64
                    minimum: 0
                    type: integer
                created_at:
                    format: date-time
                    type: string
                currency:
                    $ref: '#/components/schemas/CurrencyCode'
                held_balance:
                    description: Locked in escrow; not the owner's to draw yet
                    example: 299000
                    format: int64
                    minimum: 0
                    type: integer
            required:
                - account_id
                - currency
                - available_balance
                - held_balance
                - created_at
            type: object
        WalletAdjustmentRequest:
            description: |
                At least one delta must be non-zero. A movement that moves nothing is refused rather than recorded: the ledger rejects it at the database, and a row that says nothing is worse than an error.
            properties:
                available_delta:
                    default: 0
                    example: 250000
                    format: int64
                    type: integer
                currency:
                    $ref: '#/components/schemas/CurrencyCode'
                held_delta:
                    default: 0
                    example: -250000
                    format: int64
                    type: integer
                idempotency_key:
                    description: Required. A retried correction that posts twice is money invented.
                    maxLength: 200
                    minLength: 1
                    type: string
                reason:
                    maxLength: 2000
                    minLength: 1
                    type: string
            required:
                - currency
                - reason
                - idempotency_key
            type: object
        WalletList:
            properties:
                data:
                    items:
                        $ref: '#/components/schemas/Wallet'
                    type: array
            required:
                - data
            type: object
        WalletTransaction:
            description: One balance change with its before/after snapshot. Append-only, and the only record of a movement that stays inside a wallet.
            properties:
                available_after:
                    example: 1250000
                    format: int64
                    minimum: 0
                    type: integer
                available_delta:
                    description: Signed change to the available balance
                    example: 250000
                    format: int64
                    type: integer
                created_at:
                    format: date-time
                    type: string
                currency:
                    $ref: '#/components/schemas/CurrencyCode'
                group_id:
                    description: |
                        Shared by every leg of one logical movement — a checkout is a debit plus an escrow hold plus a fee. An opaque token for grouping rows in a response, not an address: nothing accepts it as input and no endpoint resolves it.
                    nullable: true
                    type: string
                held_after:
                    example: 299000
                    format: int64
                    minimum: 0
                    type: integer
                held_delta:
                    description: Signed change to the held balance
                    example: -250000
                    format: int64
                    type: integer
                kind:
                    $ref: '#/components/schemas/WalletTransactionKind'
                note:
                    type: string
                ref_id:
                    description: Opaque id of the referenced entity, its prefix given by `ref_type`. Empty when `ref_type` is.
                    type: string
                ref_type:
                    description: What this movement was for. Empty on an adjustment, which references nothing.
                    enum:
                        - ""
                        - order
                        - payment-session
                    type: string
                seq:
                    description: |
                        Position in this wallet's ledger, from 1. Identifies the row and orders it; a gap means a missing movement. Per wallet, so each currency counts from 1 again.
                    example: 42
                    format: int64
                    minimum: 1
                    type: integer
            required:
                - seq
                - currency
                - kind
                - available_delta
                - held_delta
                - available_after
                - held_after
                - ref_type
                - ref_id
                - note
                - created_at
            type: object
        WalletTransactionKind:
            enum:
                - topup
                - escrow-hold
                - escrow-release
                - payout
                - refund
                - withdrawal
                - fee
                - adjustment
            type: string
        WalletTransactionPage:
            properties:
                data:
                    items:
                        $ref: '#/components/schemas/WalletTransaction'
                    type: array
                meta:
                    $ref: '#/components/schemas/PageMeta'
            required:
                - data
                - meta
            type: object
        WebSocketTicket:
            properties:
                expires_in:
                    description: Seconds until the ticket expires.
                    example: 30
                    maximum: 300
                    minimum: 1
                    type: integer
                ticket:
                    description: Pass as the `ticket` query parameter when opening the socket.
                    example: wst_9f3c1d7b4a2e8065f1a9c3d5e7b20418
                    type: string
            required:
                - ticket
                - expires_in
            type: object
        Withdrawal:
            description: A payment session of kind `withdrawal`, projected with its destination and the admin's resolution.
            properties:
                amount:
                    example: 500000
                    format: int64
                    minimum: 1
                    type: integer
                bank_account:
                    $ref: '#/components/schemas/BankAccount'
                created_at:
                    format: date-time
                    type: string
                currency:
                    $ref: '#/components/schemas/CurrencyCode'
                id:
                    $ref: '#/components/schemas/PaymentSessionID'
                outcome:
                    $ref: '#/components/schemas/WithdrawalOutcome'
                resolution_note:
                    nullable: true
                    type: string
                resolved_at:
                    format: date-time
                    nullable: true
                    type: string
                resolved_by_id:
                    allOf:
                        - $ref: '#/components/schemas/AccountID'
                    description: The admin who decided. Null on one the owner cancelled themselves.
                    nullable: true
                status:
                    allOf:
                        - $ref: '#/components/schemas/PaymentSessionStatus'
                    description: |
                        The underlying session status. `outcome` is what a client should render; this is here because a withdrawal is a payment session and hiding that would make its id unexplainable.
            required:
                - id
                - outcome
                - status
                - currency
                - amount
                - bank_account
                - resolved_by_id
                - resolved_at
                - resolution_note
                - created_at
            type: object
        WithdrawalApprovalRequest:
            properties:
                provider_ref:
                    description: The bank's or gateway's reference for the outbound transfer
                    maxLength: 200
                    type: string
                reason:
                    description: A note for the payee, recorded on the request.
                    maxLength: 500
                    type: string
            type: object
        WithdrawalOutcome:
            description: |
                How a withdrawal ended, stated rather than inferred. The underlying session status can be translated into it — `cancelled` and `failed` are different rows, so a cash-out the payee called off is distinguishable from one an admin refused — but that translation is the platform's to make: five statuses onto four outcomes is a mapping every client would otherwise re-derive, and be one release behind on the day a status is added. `awaiting-review` covers both `pending` and `processing`.
            enum:
                - awaiting-review
                - approved
                - rejected
                - cancelled
            type: string
        WithdrawalPage:
            properties:
                data:
                    items:
                        $ref: '#/components/schemas/Withdrawal'
                    type: array
                meta:
                    $ref: '#/components/schemas/PageMeta'
            required:
                - data
                - meta
            type: object
        WithdrawalRejectionRequest:
            properties:
                reason:
                    maxLength: 500
                    minLength: 1
                    type: string
            required:
                - reason
            type: object
    securitySchemes:
        bearerAuth:
            bearerFormat: JWT
            scheme: bearer
            type: http
info:
    description: |
        Public REST surface of the ShopNexus C2C marketplace gateway. This file is the base document (info, servers, security, shared parameters and responses). Paths and schemas live in one fragment per aggregate, internal/module/<module>/api/openapi/<aggregate>.yaml, and are merged into api/openapi.gen.yaml by `go generate ./...` (cmd/specgen). Edit the fragments, not the generated file.
        Only `paths` and `components.schemas` are merged from a fragment, so everything reusable across modules — parameters, responses, security schemes — has to be defined here.
    title: ShopNexus Gateway API
    version: 0.1.0
openapi: 3.0.3
paths:
    /accounts/{accountID}/feedback:
        get:
            description: Published rows only. A blind submission is not visible to anyone but its author until the window closes.
            parameters:
                - in: path
                  name: accountID
                  required: true
                  schema:
                    $ref: '#/components/schemas/AccountID'
                - description: Which side the account was on.
                  in: query
                  name: role
                  schema:
                    $ref: '#/components/schemas/ReputationRole'
                - $ref: '#/components/parameters/Cursor'
                - $ref: '#/components/parameters/Limit'
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/FeedbackPage'
                    description: OK
                "400":
                    $ref: '#/components/responses/BadRequest'
                "404":
                    $ref: '#/components/responses/NotFound'
            summary: Published feedback received by an account
            tags:
                - trust
    /accounts/{accountID}/reputation:
        get:
            description: |
                Transaction ratings and product-review ratings are reported separately rather than merged. Only a seller can have review ratings.
            parameters:
                - in: path
                  name: accountID
                  required: true
                  schema:
                    $ref: '#/components/schemas/AccountID'
                - description: Defaults to seller.
                  in: query
                  name: role
                  schema:
                    $ref: '#/components/schemas/ReputationRole'
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                properties:
                                    data:
                                        $ref: '#/components/schemas/Reputation'
                                required:
                                    - data
                                type: object
                    description: OK
                "400":
                    $ref: '#/components/responses/BadRequest'
                "404":
                    $ref: '#/components/responses/NotFound'
            summary: Read an account's reputation for one role
            tags:
                - trust
    /accounts/{id}:
        get:
            description: |
                The seller page. Deliberately narrow: a display name, an avatar, a blurb and a join date. Email, phone, birth date and saved addresses are never part of it.
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    $ref: '#/components/schemas/AccountID'
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                properties:
                                    data:
                                        $ref: '#/components/schemas/PublicAccount'
                                required:
                                    - data
                                type: object
                    description: OK
                "404":
                    $ref: '#/components/responses/NotFound'
            summary: Read another account's public profile
            tags:
                - account
    /accounts/{id}/followers:
        get:
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    $ref: '#/components/schemas/AccountID'
                - $ref: '#/components/parameters/Page'
                - $ref: '#/components/parameters/Limit'
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/AccountSummaryPage'
                    description: OK
                "404":
                    $ref: '#/components/responses/NotFound'
            summary: Who follows this seller
            tags:
                - account
    /admin/accounts:
        get:
            description: |
                `q` is an **exact** match on email, phone or username — each is unique, so that is a key lookup and is how a moderator arrives here from a report — or a **fragment** match on the display name, which is answered by a trigram index. Whichever it is, it is one query; the caller does not choose.
            parameters:
                - description: An exact identifier, or part of a display name.
                  in: query
                  name: q
                  schema:
                    maxLength: 255
                    type: string
                - in: query
                  name: status
                  schema:
                    $ref: '#/components/schemas/AccountStatus'
                - in: query
                  name: role
                  schema:
                    $ref: '#/components/schemas/AccountRole'
                - $ref: '#/components/parameters/Page'
                - $ref: '#/components/parameters/Limit'
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/AdminAccountPage'
                    description: OK
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: Moderator role required
            security:
                - bearerAuth: []
            summary: Search accounts
            tags:
                - admin
    /admin/accounts/{id}/suspension:
        delete:
            description: Clears the reason and the deadline with it. Past suspensions stay in the audit log rather than on the row.
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                properties:
                                    data:
                                        $ref: '#/components/schemas/AdminAccount'
                                required:
                                    - data
                                type: object
                    description: Reinstated
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: Moderator role required
                "404":
                    $ref: '#/components/responses/NotFound'
            security:
                - bearerAuth: []
            summary: Lift a suspension
            tags:
                - admin
        parameters:
            - in: path
              name: id
              required: true
              schema:
                $ref: '#/components/schemas/AccountID'
        post:
            description: |
                The outcome of upholding a report against a seller. Omit `until` for a permanent suspension.

                Suspending also drops the account's sessions. A suspended row does not stop an access token that is already in circulation, so the two have to happen together.
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/SuspendAccountRequest'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                properties:
                                    data:
                                        $ref: '#/components/schemas/AdminAccount'
                                required:
                                    - data
                                type: object
                    description: Suspended
                "400":
                    $ref: '#/components/responses/BadRequest'
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: Moderator role required
                "404":
                    $ref: '#/components/responses/NotFound'
            security:
                - bearerAuth: []
            summary: Suspend an account
            tags:
                - admin
    /admin/categories:
        post:
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/CreateCategoryRequest'
                required: true
            responses:
                "201":
                    content:
                        application/json:
                            schema:
                                properties:
                                    data:
                                        $ref: '#/components/schemas/Category'
                                required:
                                    - data
                                type: object
                    description: Created
                "400":
                    $ref: '#/components/responses/BadRequest'
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: Admin role required
                "404":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: The named parent does not exist
                "409":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: Name already taken
            security:
                - bearerAuth: []
            summary: Create a category
            tags:
                - admin
    /admin/categories/{id}:
        delete:
            description: |
                Children are promoted to roots rather than deleted with it, so a branch is never lost by accident. A category still holding listings cannot be deleted at all — move them first.
            responses:
                "204":
                    description: Deleted
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: Admin role required
                "404":
                    $ref: '#/components/responses/NotFound'
                "409":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: Listings still reference this category
            security:
                - bearerAuth: []
            summary: Delete a category
            tags:
                - admin
        parameters:
            - in: path
              name: id
              required: true
              schema:
                $ref: '#/components/schemas/CategoryID'
        patch:
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/UpdateCategoryRequest'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                properties:
                                    data:
                                        $ref: '#/components/schemas/Category'
                                required:
                                    - data
                                type: object
                    description: OK
                "400":
                    $ref: '#/components/responses/BadRequest'
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: Admin role required
                "404":
                    $ref: '#/components/responses/NotFound'
                "409":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: Name already taken
                "422":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: A category cannot be its own descendant
            security:
                - bearerAuth: []
            summary: Update a category
            tags:
                - admin
    /admin/identity-documents:
        get:
            parameters:
                - description: Defaults to pending.
                  in: query
                  name: status
                  schema:
                    $ref: '#/components/schemas/IdentityStatus'
                - $ref: '#/components/parameters/Page'
                - $ref: '#/components/parameters/Limit'
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/IdentityDocumentPage'
                    description: OK
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: Moderator role required
            security:
                - bearerAuth: []
            summary: The identity review queue
            tags:
                - admin
    /admin/identity-documents/{id}/verdict:
        post:
            description: |
                `verified` requires `expires_at` when the document type carries one, because the payout gate reads the expiry and not only the status. `rejected` requires a reason.
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    $ref: '#/components/schemas/IdentityDocumentID'
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/IdentityVerdictRequest'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                properties:
                                    data:
                                        $ref: '#/components/schemas/IdentityDocument'
                                required:
                                    - data
                                type: object
                    description: Recorded
                "400":
                    $ref: '#/components/responses/BadRequest'
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: Moderator role required
                "404":
                    $ref: '#/components/responses/NotFound'
                "409":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: Already decided or the account already has a verified document
            security:
                - bearerAuth: []
            summary: Record an identity verdict
            tags:
                - admin
    /admin/listings:
        get:
            description: |
                Every listing awaiting a decision, oldest first, which is the order they should be worked: one waiting for its first publication, and one that is live while holding an edit its seller submitted. Defaults to both.
            parameters:
                - description: Defaults to everything awaiting a decision.
                  in: query
                  name: status
                  schema:
                    $ref: '#/components/schemas/ListingStatus'
                - in: query
                  name: seller_id
                  schema:
                    $ref: '#/components/schemas/AccountID'
                - $ref: '#/components/parameters/Page'
                - $ref: '#/components/parameters/Limit'
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ListingPage'
                    description: OK
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: Moderator role required
            security:
                - bearerAuth: []
            summary: The listing moderation queue
            tags:
                - admin
    /admin/listings/{id}/approval:
        post:
            description: Applies any held pending edit and makes it live.
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    $ref: '#/components/schemas/ListingID'
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/ModerationNoteRequest'
                required: false
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                properties:
                                    data:
                                        $ref: '#/components/schemas/ListingDetail'
                                required:
                                    - data
                                type: object
                    description: Live
                "400":
                    $ref: '#/components/responses/BadRequest'
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: Moderator role required
                "404":
                    $ref: '#/components/responses/NotFound'
                "409":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: Not awaiting moderation
                "422":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: The approved edit names an image that no longer exists
            security:
                - bearerAuth: []
            summary: Clear a listing for publication
            tags:
                - admin
    /admin/listings/{id}/takedown:
        post:
            description: |
                The moderator's verdict against a listing that breaks policy. Removes it from the marketplace and records the reason. Suspending the seller as well is a separate decision and a separate call.
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    $ref: '#/components/schemas/ListingID'
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/TakedownRequest'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                properties:
                                    data:
                                        $ref: '#/components/schemas/ListingDetail'
                                required:
                                    - data
                                type: object
                    description: Taken down
                "400":
                    $ref: '#/components/responses/BadRequest'
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: Moderator role required
                "404":
                    $ref: '#/components/responses/NotFound'
                "409":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: Already hidden or still a draft, so there is nothing to take down
            security:
                - bearerAuth: []
            summary: Take a listing down
            tags:
                - admin
    /admin/moderators:
        post:
            description: |
                Only an admin may do this and there is no self-service path — a moderator decides disputes and takes listings down, so the role is granted, never claimed.
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/CreateModeratorRequest'
                required: true
            responses:
                "201":
                    content:
                        application/json:
                            schema:
                                properties:
                                    data:
                                        $ref: '#/components/schemas/AdminAccount'
                                required:
                                    - data
                                type: object
                    description: Created
                "400":
                    $ref: '#/components/responses/BadRequest'
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: Admin role required
                "409":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: Email or phone or username already taken
            security:
                - bearerAuth: []
            summary: Provision a moderator account
            tags:
                - admin
    /admin/moderators/{id}:
        delete:
            description: Demotes to a plain user and drops the account's sessions. The account itself survives, since it may have traded.
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    $ref: '#/components/schemas/AccountID'
            responses:
                "204":
                    description: Revoked
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: Admin role required
                "404":
                    $ref: '#/components/responses/NotFound'
            security:
                - bearerAuth: []
            summary: Revoke the moderator role
            tags:
                - admin
    /admin/options:
        get:
            description: |
                Every row including the ones switched off — "why is this carrier missing from checkout" being the question this answers — each with the `provider` serving it, plus the set of providers this deployment has to move a row to. Admin only.
            parameters:
                - $ref: '#/components/parameters/OptionCategory'
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                properties:
                                    data:
                                        $ref: '#/components/schemas/OptionList'
                                required:
                                    - data
                                type: object
                    description: OK
                "400":
