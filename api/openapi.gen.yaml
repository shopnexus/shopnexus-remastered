                "404":
                    $ref: '#/components/responses/NotFound'
                "422":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: The adjustment would drive a balance negative
            security:
                - bearerAuth: []
            summary: Correct a balance by hand
            tags:
                - admin
