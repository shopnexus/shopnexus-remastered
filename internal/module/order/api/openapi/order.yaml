# The order module's root aggregate — the purchase — plus the module's own boundary
# notes. Merged by cmd/specgen with every other file in this directory.
#
# The module covers the whole purchase lifecycle across cart_item, draft_order, item,
# order, transport, offer and refund — one file each, next to this one.
#
# Two shapes recur:
#   - Checkout is PAY-FIRST, and the money is what creates the order. A draft freezes the
#     seller's asking price, which every listing has however it is priced; a negotiation
#     freezes agreed terms in the offer instead — either party may agree, which charges
#     nothing and starts a short window for the buyer's "create order now". Either way
#     checkout writes the items plus one buyer-checkout payment session, and the order
#     appears when that session completes. It has no endpoint of its own and no seller
#     confirmation anywhere: a seller can refuse a price, never an order.
#   - Delivery is the buyer's on both paths, and it is quoted from the carrier at
#     checkout rather than sent — the session asks for goods plus that fee, and only the
#     goods are ever held for or released to the seller. `POST /shipping-quotes` prices
#     every carrier beforehand, for a draft or for agreed terms.
#   - A state transition is a POST to a noun sub-resource, never a PATCH of a
#     status field. "order" has no status column on purpose: the lifecycle lives
#     in the service and only outcome facts (completed_at, cancelled_at) persist.
#
# Work done by a clock has no endpoint. The payout 72h after receipt confirmation, the three
# refund timeouts (refund.yaml), an unpaid checkout releasing its stock, and draft/offer expiry
# are all driven by a durable run per entity with a periodic sweep behind it; the contract
# exposes the deadlines so a client can count down.

paths:
  /orders:
    get:
      tags: [order]
      summary: List orders, as buyer or as seller
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: role, in: query, required: true, schema: { type: string, enum: [buyer, seller] } }
        - { name: state, in: query, schema: { $ref: '#/components/schemas/OrderState' } }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200': { description: 'OK', content: { application/json: { schema: { $ref: '#/components/schemas/OrderPage' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /orders/{id}:
    get:
      tags: [order]
      summary: Read an order
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { $ref: '#/components/schemas/OrderID' } }
      responses:
        '200':
          description: 'OK'
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Order' }
                required: [data]
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /orders/{id}/receipt:
    post:
      tags: [order]
      summary: Confirm receipt of the goods (buyer)
      description: >
        The buyer confirms delivery and attaches unboxing evidence — at least one
        photo or video is mandatory, because this evidence is what a later refund
        is judged on. Sets `received_at` and starts the 72-hour payout countdown in
        `payout_deadline_at`.


        Confirming twice is a conflict rather than a no-op: a retried upload must
        not be able to restart the clock and move the payout date.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { $ref: '#/components/schemas/OrderID' } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConfirmReceiptRequest' }
      responses:
        '200':
          description: 'Receipt recorded'
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Order' }
                required: [data]
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: 'Caller is not the buyer of this order', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: 'Already confirmed, or the order is cancelled', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /orders/{id}/cancellation:
    post:
      tags: [order]
      summary: Cancel an order
      description: >
        Either party may cancel while the shipment has not left `pending`. The escrow goes back
        to the buyer and the sale is reversed in the catalog. No body: there is nowhere to
        record a reason, and a field a client fills in that reaches nobody is worse than none.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { $ref: '#/components/schemas/OrderID' } }
      responses:
        '200':
          description: 'Cancelled'
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Order' }
                required: [data]
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: 'Shipment already moved, or the order is closed', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /orders/uploads:
    post:
      tags: [order]
      summary: Reserve a slot to upload evidence into
      description: >
        The bytes never pass through this API. The answer is a short-lived signed URL to PUT to,
        and `POST /orders/uploads/{id}/confirmation` makes the row real once the object is
        there — so a receipt confirmation or a refund can never be judged on a photo whose bytes
        never arrived.


        `mime` and `size` are checked before a byte moves: a slot signed for anything is a slot
        for anything.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateUploadRequest' }
      responses:
        '201':
          description: 'Reserved'
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/UploadSlot' }
                required: [data]
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '413': { description: 'Larger than this platform accepts', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '422': { description: 'That file type is not accepted', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /orders/uploads/{id}/confirmation:
    post:
      tags: [order]
      summary: Confirm the bytes are at the store
      description: >
        Until this lands the resource resolves to nothing, so a half-finished upload cannot be
        named as evidence on a receipt confirmation or a refund. The recorded size is the
        store's, not the one declared when the slot was reserved.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { $ref: '#/components/schemas/ResourceID' } }
      responses:
        '200':
          description: 'Confirmed'
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Resource' }
                required: [data]
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { description: 'No such reserved slot of the caller''s', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '409': { description: 'Nothing was uploaded to that slot', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

components:
  schemas:
    OrderRef:
      type: object
      description: >
        An order's id alone, as carried by a realtime event: the two sides of a sale see
        different projections of an order, so pushing the entity would mean choosing whose
        view to send — each client re-reads its own over REST.
      properties:
        id: { $ref: '#/components/schemas/OrderID' }
      required: [id]

    OrderState:
      type: string
      description: >
        Derived from the two outcome timestamps: `open` means neither is set,
        which is also the predicate of the partial indexes behind this filter.
      enum: [open, completed, cancelled]

    OrderAddressSnapshot:
      type: object
      description: >
        A contact copied into the row, not a pointer to one. The administrative
        codes are what a carrier is called with, and the saved contact may have
        changed since the order was placed.
      properties:
        full_name: { type: string, example: Nguyen Van A }
        phone: { type: string, example: '+84900000001', description: E.164 }
        country: { type: string, minLength: 2, maxLength: 2, example: VN, description: ISO 3166-1 alpha-2 }
        province_code: { type: string, example: '79' }
        district_code: { type: string, nullable: true, example: '760', description: Null where the country has no district tier }
        ward_code: { type: string, example: '26743' }
        address_detail: { type: string, nullable: true, example: 'Apt 4B, 12 Nguyen Hue', description: 'The street line and anything below it' }
      required: [full_name, phone, country]

    Order:
      type: object
      properties:
        id: { $ref: '#/components/schemas/OrderID' }
        draft_id:
          allOf: [{ $ref: '#/components/schemas/DraftOrderID' }]
          nullable: true
          description: >
            The checkout this came from. Exactly one of `draft_id` and `offer_id` is set: a
            fixed-price sale is checked out from a draft, a negotiated one from the offer both
            sides accepted.
        offer_id:
          allOf: [{ $ref: '#/components/schemas/OfferID' }]
          nullable: true
          description: The accepted negotiation this came from. Null on a fixed-price sale.
        buyer: { $ref: '#/components/schemas/AccountSummary' }
        seller: { $ref: '#/components/schemas/AccountSummary' }
        address: { $ref: '#/components/schemas/OrderAddressSnapshot' }
        pickup_address: { $ref: '#/components/schemas/OrderAddressSnapshot' }
        items: { type: array, items: { $ref: '#/components/schemas/OrderItem' } }
        state: { $ref: '#/components/schemas/OrderState' }
        total:
          type: integer
          format: int64
          minimum: 0
          example: 598000
          description: >
            Summed from the live lines rather than stored: the lines are the record of what was
            paid, and a column would be a second answer to the same question.
        currency: { $ref: '#/components/schemas/CurrencyCode' }
        transport:
          allOf: [{ $ref: '#/components/schemas/Transport' }]
          description: >
            The shipment, carried in full rather than as an id: it has no read of its own
            outside the order it belongs to.
        received_at:
          type: string
          format: date-time
          nullable: true
          description: When the buyer confirmed receipt. Null means the payout clock has not started.
        receipt_attachments:
          type: array
          items: { $ref: '#/components/schemas/Resource' }
          description: >
            Unboxing evidence, captured with the receipt confirmation and never added to
            afterwards — a refund is judged on what the buyer showed at the moment of
            unboxing.
        payout_deadline_at:
          type: string
          format: date-time
          nullable: true
          description: >
            `received_at` + 72h, computed rather than stored. The seller is paid out at this
            point unless a refund still has a claim on the escrow.
        payout_released_at:
          type: string
          format: date-time
          nullable: true
          description: >
            When the escrow reached the seller. Null on a completed order means the release has
            not landed yet — the platform owes the seller and knows it, and a retry pass keeps
            trying until it does.
        created_at: { type: string, format: date-time }
        completed_at: { type: string, format: date-time, nullable: true, description: Set when the payout is claimed }
        cancelled_at: { type: string, format: date-time, nullable: true }
      required: [id, buyer, seller, address, pickup_address, state, total, currency, receipt_attachments, created_at]

    OrderPage:
      type: object
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/Order' } }
        meta: { $ref: '#/components/schemas/CursorMeta' }
      required: [data, meta]

    ConfirmReceiptRequest:
      type: object
      properties:
        attachments:
          type: array
          minItems: 1
          maxItems: 10
          description: >
            Unboxing photos or video. At least one is mandatory — a later refund is
            judged on this evidence.
          items: { $ref: '#/components/schemas/ResourceID' }
      required: [attachments]
