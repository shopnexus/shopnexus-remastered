# order fragment: offer — the negotiation a `negotiable` listing has to go through.
#
# It is conducted in the chat thread the two accounts already share (chat has one thread per
# pair, so there is nothing to create and nothing to address it by): every route here also
# posts a message carrying the offer's id in its metadata, and the client renders the card from
# this row. The terms, the status and the expiry stay here because they decide money, and
# one-active-per-pair is a constraint a hypertable cannot hold.
#
# Nobody approves an order at the end of it. Acceptance opens the checkout at the agreed total,
# and the order appears when that payment session completes — the same ending a fixed-price
# purchase has. The only thing a seller can refuse is a price, and this is where they refuse it.

paths:
  /offers:
    post:
      tags: [order]
      summary: Open a price negotiation on a variant
      description: >
        Either side may open it — the buyer from the listing page, the seller from a thread.
        One active negotiation per (buyer, variant); the terms are then revised in place rather
        than by stacking rows, and each revision posts a card into the pair's chat thread.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateOfferRequest' }
      responses:
        '201':
          description: 'Created'
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Offer' }
                required: [data]
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: 'An active negotiation already exists for this (buyer, SKU)', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    get:
      tags: [order]
      summary: List negotiations, as buyer or as seller
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: role, in: query, required: true, schema: { type: string, enum: [buyer, seller] } }
        - { name: status, in: query, schema: { $ref: '#/components/schemas/OfferStatus' } }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200': { description: 'OK', content: { application/json: { schema: { $ref: '#/components/schemas/OfferPage' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /offers/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { $ref: '#/components/schemas/OfferID' } }
    get:
      tags: [order]
      summary: Read a negotiation
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: 'OK'
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Offer' }
                required: [data]
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [order]
      summary: Counter-offer
      description: >
        Revises the current terms in place, moves authorship to the caller and posts the new
        card into the thread. Only the party that does not own the standing proposal may
        counter, so the two sides alternate.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateOfferRequest' }
      responses:
        '200':
          description: 'OK'
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Offer' }
                required: [data]
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: 'Caller already owns the standing proposal, or is not a party', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: 'Negotiation is no longer active', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    delete:
      tags: [order]
      summary: Cancel a negotiation
      security: [{ bearerAuth: [] }]
      responses:
        '204': { description: Cancelled }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: 'Negotiation is no longer active', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /offers/{id}/acceptance:
    post:
      tags: [order]
      summary: Accept the negotiated terms (buyer)
      description: >
        Only the buyer closes a negotiation, whichever side proposed the standing terms — an
        order may not appear without the buyer's explicit acceptance. Opens the checkout
        payment session at the agreed total and creates the item, returning both; the order
        follows when the session completes, with `offer_id` set to this negotiation and no
        draft.


        The seller is not asked again. Accepting is the last decision either party makes about
        whether the sale happens.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { $ref: '#/components/schemas/OfferID' } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AcceptOfferRequest' }
      responses:
        '201':
          description: 'Accepted; item created and a payment session opened'
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/CheckoutResult' }
                required: [data]
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: 'Caller is not the buyer of this negotiation', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: 'Negotiation is expired, cancelled, or already accepted', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

components:
  schemas:
    OfferStatus:
      type: string
      enum: [active, accepted, cancelled]

    Offer:
      type: object
      properties:
        id: { $ref: '#/components/schemas/OfferID' }
        listing_id:
          allOf: [{ $ref: '#/components/schemas/ListingID' }]
          description: The listing whose card the offer is shown on.
        variant_id: { $ref: '#/components/schemas/VariantID' }
        buyer_id: { $ref: '#/components/schemas/AccountID' }
        seller_id: { $ref: '#/components/schemas/AccountID' }
        author_id: { $ref: '#/components/schemas/AccountID' }
        status: { $ref: '#/components/schemas/OfferStatus' }
        quantity: { type: integer, format: int64, minimum: 1, example: 2 }
        total: { type: integer, format: int64, minimum: 1, example: 598000, description: 'Currently proposed total, smallest currency unit' }
        currency: { $ref: '#/components/schemas/CurrencyCode' }
        reason: { type: string, description: Shown on the offer card beside the proposed price }
        created_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
      required: [id, listing_id, variant_id, buyer_id, seller_id, author_id, status, quantity, total, currency, created_at, expires_at]

    OfferPage:
      type: object
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/Offer' } }
        meta: { $ref: '#/components/schemas/CursorMeta' }
      required: [data, meta]

    CreateOfferRequest:
      type: object
      properties:
        variant_id: { $ref: '#/components/schemas/VariantID' }
        quantity: { type: integer, format: int64, minimum: 1, example: 2 }
        total: { type: integer, format: int64, minimum: 1, example: 598000 }
        reason: { type: string, maxLength: 500 }
      required: [variant_id, quantity, total]

    UpdateOfferRequest:
      type: object
      properties:
        quantity: { type: integer, format: int64, minimum: 1, example: 2 }
        total: { type: integer, format: int64, minimum: 1, example: 598000 }
        reason: { type: string, maxLength: 500 }
      required: [quantity, total]

    AcceptOfferRequest:
      type: object
      description: >
        Acceptance still needs a delivery address and a carrier — the negotiation only settled
        price and quantity, and the buyer pays the delivery fee either way, so the carrier is
        their trade-off to make.
      properties:
        contact_id: { $ref: '#/components/schemas/ContactID' }
        transport_option: { type: string, maxLength: 100, pattern: '^[a-z0-9]+(-[a-z0-9]+)*$' }
        note: { type: string, maxLength: 500 }
      required: [contact_id, transport_option]
