# order fragment: offer — the negotiation a `negotiable` listing offers instead of its asking price.
#
# It is conducted in the chat thread the two accounts already share (chat has one thread per
# pair, so there is nothing to create and nothing to address it by): every route here also
# posts a message carrying the offer's id in its metadata, and the client renders the card from
# this row. The terms, the status and the expiry stay here because they decide money, and
# one-active-per-pair is a constraint a hypertable cannot hold.
#
# Nobody approves an order at the end of it, and agreeing is not the sale. Either party may accept
# the terms on the table, which charges nothing and freezes the price for a short window; the buyer
# then presses "create order now" and checks out with a carrier of their choosing, and the order
# appears when that payment session completes — the same ending a fixed-price purchase has. The
# only thing a seller can refuse is a price, and this is where they refuse it.

paths:
  /offers:
    post:
      tags: [order]
      summary: Open a price negotiation on a variant
      description: >
        The buyer opens it, from the listing page: a seller has nobody to propose to on their own
        listing, so they answer rather than start. One active negotiation per (buyer, variant); the
        terms are then revised in place rather than by stacking rows, and each revision posts a card
        into the pair's chat thread.


        `total` may not exceed the variant's listed price for that `quantity`. Negotiation only
        moves the price down: the asking price is already an offer to sell at it, so terms above
        it are a proposal with no reason to exist — the buyer would simply buy.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateOfferRequest' }
      responses:
        '201':
          description: 'Created'
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Offer' }
                required: [data]
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: 'A seller cannot open a negotiation on their own listing', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: 'An active negotiation already exists for this (buyer, SKU)', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '422': { description: '`total` is above the listed price for that `quantity`, or the listing is not negotiable', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    get:
      tags: [order]
      summary: List the caller's negotiations, both sides at once
      description: >
        Both sides in one list, and there is no `role` to pick: an account haggles as a buyer on
        one listing and as a seller on another, and "which of these is waiting on me" spans the
        two — `author_id` answers that per row, since whoever owns the standing proposal is whose
        turn it is *not*. A required `role` was documented here for a while and never read by the
        service, so both values answered the same list.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: status, in: query, schema: { $ref: '#/components/schemas/OfferStatus' } }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200': { description: 'OK', content: { application/json: { schema: { $ref: '#/components/schemas/OfferPage' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /offers/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { $ref: '#/components/schemas/OfferID' } }
    get:
      tags: [order]
      summary: Read a negotiation
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: 'OK'
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Offer' }
                required: [data]
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [order]
      summary: Counter-offer
      description: >
        Revises the current terms in place, moves authorship to the caller and posts the new
        card into the thread. Only the party that does not own the standing proposal may
        counter, so the two sides alternate.


        A counter may go *up* — that is a seller holding out — but not above the variant's
        listed price for that `quantity`, the same ceiling opening one has. The price is read
        when the counter lands, so a seller who lowered their asking price mid-thread has
        lowered it here too.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateOfferRequest' }
      responses:
        '200':
          description: 'OK'
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Offer' }
                required: [data]
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: 'Caller already owns the standing proposal, or is not a party', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: 'Negotiation is no longer active', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '422': { description: '`total` is above the listed price for that `quantity`', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    delete:
      tags: [order]
      summary: Cancel a negotiation
      security: [{ bearerAuth: [] }]
      responses:
        '204': { description: Cancelled }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: 'Negotiation is no longer active', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /offers/{id}/acceptance:
    post:
      tags: [order]
      summary: Agree to the terms on the table
      description: >
        Whoever does *not* own the standing proposal — the two sides alternate, so the price in
        front of you is always the other party's, and either of them may be the one who says yes.


        Agreeing is not the sale, and nothing is charged. It freezes the price and starts a short
        window for the buyer to press "create order now"
        (`POST /offers/{id}/checkout`), where they choose delivery and pay — exactly as they would
        from a fixed-price listing. That separation is what makes a seller accepting a buyer's
        price safe: no order exists and no money moves until the buyer checks out.


        The window is short on purpose. An agreed price is a frozen price, and a buyer who lets it
        lapse negotiates again rather than holding yesterday's number open.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { $ref: '#/components/schemas/OfferID' } }
      responses:
        '200':
          description: 'Agreed; the price is frozen for a short window'
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Offer' }
                required: [data]
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: 'These are your own terms — the other party answers them', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: 'Negotiation is expired, cancelled, already agreed, or being paid for', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /offers/{id}/checkout:
    post:
      tags: [order]
      summary: Create the order now, on agreed terms (buyer)
      description: >
        The buyer turning an agreed price into an order: they pick a carrier and an address here
        and pay, in exactly the checkout a fixed-price listing uses. Only the buyer, because only
        the buyer pays — and only once, so a double-clicked button opens one payment session.


        The negotiated total covers the goods. Delivery is quoted from the carrier on top of it and
        is also the buyer's, the same as on a fixed-price sale; `POST /shipping-quotes` is how the
        options and their fees are listed before choosing.


        The order follows when the session completes, with `offer_id` set to this negotiation and
        no draft.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { $ref: '#/components/schemas/OfferID' } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CheckoutOfferRequest' }
      responses:
        '201':
          description: 'Item created and a payment session opened'
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/CheckoutResult' }
                required: [data]
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: 'Only the buyer checks out agreed terms', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: 'Terms are not agreed, have lapsed, or are already checked out', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '422': { description: 'A carrier nobody enabled, or a variant that is no longer sellable', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '502': { description: 'No carrier could price the delivery', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /shipping-quotes:
    post:
      tags: [order]
      summary: What delivery would cost, per carrier
      description: >
        One entry per enabled carrier that could price the parcel, so the buyer sees delivery before
        they pay for it. A carrier that declined is simply absent.


        Name exactly one source. `variant_id` is the listing page's question — what would this cost
        to send — answered before any draft exists, with `quantity` defaulting to one and the
        caller's default address used when `contact_id` is omitted. `draft_id` and `offer_id` are
        the two things that freeze a price, and the parcel is whichever of them is about to be
        checked out. The same list serves all three, because the buyer pays carriage on a
        fixed-price sale and a negotiated one alike.


        An estimate a client renders, not a price it can hold: the fee is quoted again at checkout,
        so a quote kept past the point it was true does not become the charge. Show it as its own
        line beside the price rather than folded into it — the total a buyer is charged is the
        checkout's, itemised.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ShippingQuotesRequest' }
      responses:
        '200':
          description: 'OK'
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/ShippingQuotes' }
                required: [data]
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: 'Only the buyer prices delivery on agreed terms', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: 'The draft or the agreed terms are no longer checkout-able', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '422': { description: 'A variant that is not on this purchase, or a caller with no default delivery address', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

components:
  schemas:
    OfferStatus:
      type: string
      enum: [active, accepted, checked-out, cancelled]
      example: accepted
      description: >
        `active` — a proposal waiting for the other side. `accepted` — agreed, the price frozen for
        a short window while the buyer creates the order. `checked-out` — the buyer's payment
        session is open, so these terms are off the table. `cancelled` — withdrawn or lapsed.

    Offer:
      type: object
      properties:
        id: { $ref: '#/components/schemas/OfferID' }
        listing_id:
          allOf: [{ $ref: '#/components/schemas/ListingID' }]
          description: The listing whose card the offer is shown on.
        variant_id: { $ref: '#/components/schemas/VariantID' }
        buyer_id: { $ref: '#/components/schemas/AccountID' }
        seller_id: { $ref: '#/components/schemas/AccountID' }
        author_id: { $ref: '#/components/schemas/AccountID' }
        listing: { $ref: '#/components/schemas/OfferListing' }
        counterparty:
          allOf: [{ $ref: '#/components/schemas/AccountSummary' }]
          description: >
            The other side of the negotiation, whichever that is for the caller. This route
            only ever answers a party to the row, so the viewer is one of `buyer_id`/`seller_id`
            and this is the one they need named.
        status: { $ref: '#/components/schemas/OfferStatus' }
        quantity: { type: integer, format: int64, minimum: 1, example: 2 }
        total: { type: integer, format: int64, minimum: 1, example: 598000, description: 'Currently proposed total, smallest currency unit' }
        currency: { $ref: '#/components/schemas/CurrencyCode' }
        reason: { type: string, description: Shown on the offer card beside the proposed price }
        created_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
      required: [id, listing_id, variant_id, buyer_id, seller_id, author_id, listing, counterparty, status, quantity, total, currency, reason, created_at, expires_at]

    OfferListing:
      type: object
      description: >
        The little of a listing an offer row has to show, resolved rather than left as an id —
        a list of offers carrying only ids renders as a column of prices with nothing to tell
        them apart. Read live: a renamed listing reads as its current name, while the terms,
        which are the part that must not drift, are on the offer itself.
      properties:
        name: { type: string, example: 'Áo khoác denim size M' }
        cover:
          allOf: [{ $ref: '#/components/schemas/Resource' }]
          nullable: true
          description: Null on a listing with no photo.
      required: [name, cover]

    OfferPage:
      type: object
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/Offer' } }
        meta: { $ref: '#/components/schemas/CursorMeta' }
      required: [data, meta]

    CreateOfferRequest:
      type: object
      properties:
        variant_id: { $ref: '#/components/schemas/VariantID' }
        quantity: { type: integer, format: int64, minimum: 1, example: 2 }
        total: { type: integer, format: int64, minimum: 1, example: 598000 }
        reason: { type: string, maxLength: 500 }
      required: [variant_id, quantity, total]

    UpdateOfferRequest:
      type: object
      properties:
        quantity: { type: integer, format: int64, minimum: 1, example: 2 }
        total: { type: integer, format: int64, minimum: 1, example: 598000 }
        reason: { type: string, maxLength: 500 }
      required: [quantity, total]

    CheckoutOfferRequest:
      type: object
      description: >
        The address and the carrier, exactly as a fixed-price checkout takes them. The negotiation
        settled price and quantity; only delivery is decided here, and the buyer pays it either way,
        so the carrier is their trade-off to make.
      properties:
        contact_id: { $ref: '#/components/schemas/ContactID' }
        transport_option:
          type: string
          maxLength: 100
          example: standard-delivery
          description: A carrier slug from `POST /shipping-quotes`; one nobody enabled is refused with 422.
        note: { type: string, maxLength: 500 }
      required: [contact_id, transport_option]

