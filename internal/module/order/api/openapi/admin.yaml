# order fragment: the staff verdict on a refund. Only the verdict — the ticket that asked
# for one is trust's, and so is the queue it is worked from.

paths:
  /admin/refunds/{id}/verdict:
    post:
      tags: [admin]
      summary: Decide a refund staff were asked about (moderator)
      description: >
        The refund has to be `disputed`, which is what a party escalating through trust set it
        to. There are no rounds: whether the goods have already come back is what a verdict
        reads to know which of the two situations it is in.


        `buyer_wins: true` with the goods still at the buyer's grants the refund and books the
        return shipment, so the money is not released yet. `buyer_wins: true` once the return
        has been delivered sends the escrow back to the buyer and closes the order with it.
        `buyer_wins: false` ends the refund either way, and the payout to the seller stands.


        The money moves before the refund goes terminal, and the refund and the order it closes
        are written together: a settled refund over an order the payout can still see is money
        paid twice.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { $ref: '#/components/schemas/RefundID' } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefundVerdictRequest' }
      responses:
        '200':
          description: 'Decided'
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Refund' }
                required: [data]
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: 'Moderator role required', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: 'This refund is not with staff for a decision, or its order has already settled', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

components:
  schemas:
    RefundVerdictRequest:
      type: object
      description: A decision, so there is no "still deciding" choice — which is why the verdict
        is a boolean rather than a status enum.
      properties:
        buyer_wins: { type: boolean, example: true, description: 'What it does to the money depends on whether the goods have come back; see the endpoint.' }
        note: { type: string, maxLength: 2000, example: Evidence is clear, description: 'The reasoning, carried to the ticket this closes' }
      required: [buyer_wins]
