# order fragment: transport — the carrier leg of an order, and the leg carrying a refund back.

paths:
  /orders/{id}/transport:
    get:
      tags: [order]
      summary: Read the shipment
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { $ref: '#/components/schemas/OrderID' } }
      responses:
        '200':
          description: 'OK'
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Transport' }
                required: [data]
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /orders/{id}/transport/checkpoints:
    post:
      tags: [order]
      summary: Correct a checkpoint on the outbound leg (moderator)
      description: >
        Staff only. The carrier reports this leg on its own webhook, and this route is for a
        courier that got it wrong or never reported at all — neither party to the order writes
        it. Whether the parcel has left is what decides whether the order can still be cancelled
        and the escrow taken back, so a seller saying so was one request against days of the
        buyer's: a seller who sees the status wrong raises an `order-issue` ticket instead.


        Forward-only. Carrier reports arrive out of order, and whether the parcel has left is
        what decides whether the order can still be cancelled and the escrow taken back, so it
        is not a fact a later report may undo: a checkpoint at or behind where the shipment
        already is, or one on a leg that has ended, is 409.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { $ref: '#/components/schemas/OrderID' } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TransportCheckpointRequest' }
      responses:
        '200':
          description: 'Recorded'
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Transport' }
                required: [data]
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: 'Caller is not staff — a shipment''s position comes from the carrier, so neither the seller nor the buyer may write it', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: 'The shipment is already at or past that point', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }

  /refunds/{id}/return-transport/checkpoints:
    post:
      tags: [order]
      summary: Report a checkpoint on the leg carrying the goods back
      description: >
        The return leg exists only from the moment a refund is granted, and this is the only exit
        from `returning`. Either party to the order may report it, unlike the outbound leg: this
        one is never booked with a carrier, so no webhook can report it and requiring the seller
        alone would let one who simply never confirms strand the escrow with nobody on a clock.


        Who reports `delivered` is what decides where the case goes. From the **seller** it is an
        acknowledgement that the goods arrived, so the refund moves to `returned` and their
        inspection window opens — and letting that window pass settles for the buyer, which is
        their own silence costing them. From the **buyer** it is a claim about somebody else's
        warehouse, so the refund moves to `disputed` and staff decide: on the inspection window a
        buyer who posted nothing at all had only to report `delivered` and wait out an inattentive
        seller to keep both the money and the goods.


        Reporting a position short of `delivered` moves the leg and leaves the case in
        `returning` whoever sent it.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { $ref: '#/components/schemas/RefundID' } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TransportCheckpointRequest' }
      responses:
        '200':
          description: 'Recorded; a delivery moves the refund to `returned` when the seller reported it and to `disputed` when the buyer did'
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Refund' }
                required: [data]
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: 'No return leg yet, the leg is already past that point, or the order is closed', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }

components:
  schemas:
    TransportStatus:
      type: string
      description: Where the shipment is. `pending` is created but not yet handed over.
      enum: [pending, picked-up, in-transit, delivered, returned, failed, cancelled]

    TransportCheckpoint:
      type: string
      description: >
        A position a checkpoint may report, so `pending` is not one of them — that is where a
        shipment starts, not somewhere it can be moved to. The last three are outcomes and are
        reachable from anywhere: a parcel can fail before it is ever collected.
      enum: [picked-up, in-transit, delivered, returned, failed]

    TransportCheckpointRequest:
      type: object
      description: One carrier-reported position. The same shape for the outbound leg and for
        the leg carrying a refund's goods back.
      properties:
        status: { $ref: '#/components/schemas/TransportCheckpoint' }
      required: [status]

    Transport:
      type: object
      description: >
        One shipment as the platform knows it. The carrier's own view — tracking number, label,
        raw webhook payloads — is held in the row but not published: it is provider-shaped, and
        nothing a client renders depends on it.
      properties:
        id: { $ref: '#/components/schemas/TransportID' }
        option: { type: string, example: ghn-express, description: An enabled transport option's slug }
        status: { $ref: '#/components/schemas/TransportStatus' }
        fee:
          type: integer
          format: int64
          minimum: 0
          example: 15000
          description: >
            What the buyer paid for delivery, quoted from this carrier when the checkout opened.
            The buyer bears carriage on both a fixed-price and a negotiated sale, so a seller is
            never charged for it.
        created_at: { type: string, format: date-time }
      required: [id, option, status, fee, created_at]
