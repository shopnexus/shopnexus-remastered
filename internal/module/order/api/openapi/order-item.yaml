# order fragment: order item — the per-variant line a checkout writes.

paths:
  /items:
    get:
      tags: [order]
      summary: List checkout lines, as buyer or as seller
      description: >
        `role=seller&pending=true` is the seller's retry list: lines the money has paid for
        that no order covers yet. Not an inbox — nobody confirms them. The order is written by
        the payment webhook, so a line sitting here for long is a settlement that has not
        succeeded yet rather than one waiting on a person.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: role, in: query, schema: { type: string, enum: [buyer, seller], default: buyer } }
        - { name: pending, in: query, schema: { type: boolean, default: false }, description: 'Only lines no order covers and nobody cancelled.' }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200': { description: 'OK', content: { application/json: { schema: { $ref: '#/components/schemas/OrderItemPage' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /items/{id}/cancellation:
    post:
      tags: [order]
      summary: Cancel a line the money has not reached
      description: >
        Either party may drop a line while it is unpaid — the buyer changed their mind, or the
        seller cannot fulfil it — and the reserved units go back. The cancelling account is
        recorded.


        A paid line is 409, and that is checked against the payment session rather than against
        `order_id`: the order is written by the webhook, so a line that has been charged for has
        a null `order_id` for as long as that write keeps failing. From there the way back is a
        refund, which the seller gets to see.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { $ref: '#/components/schemas/OrderItemID' } }
      responses:
        '200':
          description: 'Cancelled'
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/OrderItem' }
                required: [data]
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: 'The session is paid, or the line is already cancelled', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

components:
  schemas:
    OrderItem:
      type: object
      description: >
        One purchased line. It exists from checkout, before the money lands: that window is the
        whole of what a null `order_id` means.
      properties:
        id: { $ref: '#/components/schemas/OrderItemID' }
        order_id:
          allOf: [{ $ref: '#/components/schemas/OrderID' }]
          nullable: true
          description: >
            Null until the payment session completes and the webhook writes the order. Nobody
            confirms it — a seller can refuse a price, never a sale.
        listing_id:
          allOf: [{ $ref: '#/components/schemas/ListingID' }]
          description: >
            The listing the variant belongs to, denormalized the same way `seller_id`
            is, so order history can resolve it through `GET /listings?ids=` — which
            answers for a listing the seller has since hidden or deleted.
        variant_id: { $ref: '#/components/schemas/VariantID' }
        seller_id: { $ref: '#/components/schemas/AccountID' }
        quantity: { type: integer, format: int64, minimum: 1, example: 2 }
        currency: { $ref: '#/components/schemas/CurrencyCode' }
        total_amount: { type: integer, format: int64, minimum: 0, example: 598000, description: 'Paid amount in the smallest unit of `currency`' }
        transport_option: { type: string, example: ghn-express, description: An enabled transport option's slug }
        payment_session_id:
          allOf: [{ $ref: '#/components/schemas/PaymentSessionID' }]
          description: The single session covering every line of this checkout.
        note: { type: string, example: Please leave at reception, description: 'Buyer note, per checkout' }
        cancelled_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
      required: [id, listing_id, variant_id, seller_id, quantity, currency, total_amount, transport_option, payment_session_id, created_at]

    OrderItemPage:
      type: object
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/OrderItem' } }
        meta: { $ref: '#/components/schemas/CursorMeta' }
      required: [data, meta]
