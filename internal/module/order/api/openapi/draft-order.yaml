# order fragment: draft order — frozen listing terms, and the checkout that spends them.

paths:
  /drafts:
    post:
      tags: [order]
      summary: Open a purchase session for one listing
      description: >
        Freezes the listing terms so a price the seller edits afterwards cannot be
        charged. The server snapshots the listing together with every variant —
        price and package details live on the variant, and those are exactly what must
        not move under the buyer — and sets `valid_until`.


        Only a `fixed` listing has one: a `negotiable` price is agreed in an offer, and the
        accepted offer is what freezes its terms instead. Asking for one is 422.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateDraftRequest' }
      responses:
        '201':
          description: 'Created'
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/DraftOrder' }
                required: [data]
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { description: 'Listing not found, deleted, or not active', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '422': { description: 'The listing is priced negotiable; open an offer instead', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    get:
      tags: [order]
      summary: List the caller's purchase sessions
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200': { description: 'OK', content: { application/json: { schema: { $ref: '#/components/schemas/DraftOrderPage' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /drafts/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { $ref: '#/components/schemas/DraftOrderID' } }
    get:
      tags: [order]
      summary: Read a purchase session and its frozen terms
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: 'OK'
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/DraftOrder' }
                required: [data]
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [order]
      summary: Cancel a purchase session
      description: Sets `cancelled_at`. A session that already produced paid items
        cannot be cancelled.
      security: [{ bearerAuth: [] }]
      responses:
        '204': { description: Cancelled }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /drafts/{id}/checkout:
    post:
      tags: [order]
      summary: Check out a purchase session (pay-first)
      description: >
        Creates one `item` per line plus a single buyer-checkout payment session,
        and returns both. Line prices come from the session's frozen snapshot,
        never from the live catalog. `contact_id` is snapshotted into every line's
        delivery address: one session covers one SPU and therefore one seller, so
        a single address is correct.


        The session is spent before the money is asked for: the claim is what makes two
        concurrent checkouts of one draft impossible, and the loser is answered 409 rather
        than handed a second payment session for the same frozen price.


        A `negotiable` listing has no draft at all, so there is nothing to check out here — its
        terms are frozen by the offer both sides agreed on, and `POST /offers/{id}/checkout` is the
        same checkout from there. The buyer pays delivery either way.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { $ref: '#/components/schemas/DraftOrderID' } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CheckoutRequest' }
      responses:
        '201':
          description: 'Items created and a payment session opened'
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/CheckoutResult' }
                required: [data]
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: 'Session expired, cancelled, or already checked out', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }

components:
  schemas:
    DraftVariantSnapshot:
      type: object
      description: >
        One purchasable variant at the price this session froze. Package details are held in
        the row but not published: they are what the shipping quote is computed from, not
        something a buyer picks.
      properties:
        variant_id: { $ref: '#/components/schemas/VariantID' }
        price: { type: integer, format: int64, minimum: 1, example: 299000, description: Smallest currency unit }
        attributes: { type: object, additionalProperties: true }
      required: [variant_id, price]

    DraftOrder:
      type: object
      description: >
        The frozen terms, flat rather than nested under a `snapshot`: what a buyer needs is
        the price they were shown, and the listing's own read answers everything else.
      properties:
        id: { $ref: '#/components/schemas/DraftOrderID' }
        listing_id: { $ref: '#/components/schemas/ListingID' }
        seller_id: { $ref: '#/components/schemas/AccountID' }
        name: { type: string, example: Ao thun cotton }
        currency: { $ref: '#/components/schemas/CurrencyCode' }
        price_mode: { type: string, enum: [fixed, negotiable], example: fixed }
        variants: { type: array, items: { $ref: '#/components/schemas/DraftVariantSnapshot' } }
        created_at: { type: string, format: date-time }
        valid_until: { type: string, format: date-time }
        cancelled_at:
          type: string
          format: date-time
          nullable: true
          description: >
            Set when the buyer closed it, the expiry did, or a checkout spent it — a session
            is claimed as it is checked out, so exactly one checkout can succeed.
      required: [id, listing_id, seller_id, name, currency, price_mode, variants, created_at, valid_until]

    DraftOrderPage:
      type: object
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/DraftOrder' } }
        meta: { $ref: '#/components/schemas/CursorMeta' }
      required: [data, meta]

    CreateDraftRequest:
      type: object
      properties:
        listing_id: { $ref: '#/components/schemas/ListingID' }
      required: [listing_id]

    CheckoutLine:
      type: object
      description: One variant and how many of it.
      properties:
        variant_id: { $ref: '#/components/schemas/VariantID' }
        quantity: { type: integer, format: int64, minimum: 1, example: 2 }
      required: [variant_id, quantity]

    CheckoutRequest:
      type: object
      description: >
        The carrier and the note are per checkout, not per line: one session covers one
        listing and therefore one seller and one parcel.
      properties:
        lines:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/CheckoutLine' }
        contact_id: { $ref: '#/components/schemas/ContactID' }
        transport_option:
          type: string
          maxLength: 100
          example: ghn-express
          description: >
            An enabled transport option's slug. The buyer pays delivery, so the trade-off
            between price and speed is theirs.
        currency:
          allOf: [{ $ref: '#/components/schemas/CurrencyCode' }]
          description: Must match the listing's currency.
        note: { type: string, maxLength: 500, example: Please leave at reception }
      required: [lines, contact_id, transport_option, currency]

    CheckoutResult:
      type: object
      description: >
        The lines and the single session that pays for them. Nothing is settled yet: the
        order appears when that session completes, and no seller confirms anything.
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/OrderItem' } }
        payment_session_id: { $ref: '#/components/schemas/PaymentSessionID' }
        goods_total:
          type: integer
          format: int64
          minimum: 0
          example: 598000
          description: The items alone, smallest currency unit.
        shipping_fee:
          type: integer
          format: int64
          minimum: 0
          example: 15000
          description: >
            What the chosen carrier quoted for this parcel to this address. The buyer pays it on a
            fixed-price sale and a negotiated one alike, and it is quoted here rather than sent, so
            a client cannot decide what delivery costs.
        total: { type: integer, format: int64, minimum: 0, example: 613000, description: 'What the session asks for: goods plus delivery' }
        currency: { $ref: '#/components/schemas/CurrencyCode' }
      required: [items, payment_session_id, goods_total, shipping_fee, total, currency]

    ShippingQuotesRequest:
      type: object
      description: >
        Exactly one of `variant_id`, `draft_id` or `offer_id`. A variant is an estimate for a
        listing page, before anything is frozen; a draft and an accepted offer are the two things
        that freeze a price, and the parcel is whichever of them is about to be checked out.
      properties:
        variant_id:
          allOf: [{ $ref: '#/components/schemas/VariantID' }]
          description: >
            The variant being looked at. Delivery is priced from the *variant's* package details,
            not the listing's: one listing can hold an 80 g charger and a 2 kg one.
        draft_id: { $ref: '#/components/schemas/DraftOrderID' }
        offer_id: { $ref: '#/components/schemas/OfferID' }
        quantity:
          type: integer
          format: int64
          minimum: 1
          example: 1
          description: >
            How many of `variant_id`. Omitted means one, since a listing page quotes the single
            unit in front of the buyer. Ignored by the other two sources, which carry their own.
        contact_id:
          allOf: [{ $ref: '#/components/schemas/ContactID' }]
          description: >
            Where the parcel goes. Omit it and the caller's default delivery address is used, which
            is what lets a listing page quote with no form; 422 when they have none on file.
        lines:
          type: array
          maxItems: 50
          items: { $ref: '#/components/schemas/CheckoutLine' }
          description: >
            The draft's variants and quantities, as a checkout would send them. Ignored for an
            offer, whose quantity was negotiated.

    ShippingQuotes:
      type: object
      properties:
        options: { type: array, items: { $ref: '#/components/schemas/ShippingQuote' } }
        currency: { $ref: '#/components/schemas/CurrencyCode' }
        contact_id:
          allOf: [{ $ref: '#/components/schemas/ContactID' }]
          description: >
            The address these fees are for, echoed because the request may not have named one — a
            fee with no address beside it is not one a client can render or offer to change.
      required: [options, currency, contact_id]

    ShippingQuote:
      type: object
      properties:
        option: { type: string, example: ghn-express }
        name: { type: string, example: GHN Express }
        fee:
          type: integer
          format: int64
          minimum: 0
          example: 15000
          description: What the buyer would pay this carrier. Re-quoted at checkout, so it is an estimate a client renders rather than a price it can hold.
      required: [option, name, fee]
