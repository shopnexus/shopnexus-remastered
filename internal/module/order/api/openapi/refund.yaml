# order fragment: refund — the whole-order return. The staff verdict on one is in
# admin.yaml; escalating it is trust's, because that is where the ticket lives.
#
# A refund covers the whole order — there is no per-item refund — and it moves in one
# direction through parties, never back:
#
#   buyer opens it                       → awaiting-seller-review
#   seller accepts                       → returning, and the goods go back
#   seller raises a ticket, or ignores it → disputed
#   staff decide for the seller          → rejected, and the payout stands
#   staff decide for the buyer           → returning, and the goods go back
#   seller reports the return delivered  → returned
#   buyer reports the return delivered   → disputed, for staff to verify
#   seller escalates what arrived        → disputed, the same case
#   staff decide for the seller          → rejected, and the seller is paid out
#   staff decide for the buyer           → accepted
#
# Nothing ships until the refund is actually granted, because most requests end before
# a parcel would have moved. The seller's turn once the goods are back is what makes that
# safe: whoever receives a counterfeit or the wrong item back can still escalate. There are
# no rounds — whether the goods have come back is what a verdict reads to know whether it
# is granting the refund or paying it.
#
# Only the seller's own report of the return arriving starts that turn. Nothing books the return
# leg with a carrier, so the report is a party's word rather than a courier's, and the buyer's
# word goes to staff instead of onto a clock that would pay them out on the seller's silence.
#
# A seller cannot refuse a refund. Their two moves are granting it and handing it to staff,
# because refusing only ever moved the burden onto the buyer to escalate — and a buyer who did
# not know they had to, or who simply did not open the app for three days, lost a case nobody
# had judged. Silence is not a verdict, so letting the window pass raises the ticket for them.
#
# Every state named for a waiting party carries `deadline_at`, and letting it pass is itself a
# move — an unanswered review goes to staff, an uncontested return settles for the buyer.
# `returning` and `disputed` carry none: a carrier and staff decide those.
#
# A buyer may also withdraw while the seller has not decided, which is `cancelled` — its own
# terminal value, so a withdrawal is never filed as a seller win.

paths:
  /orders/{id}/refunds:
    post:
      tags: [order]
      summary: Open a refund request (buyer)
      description: >
        Covers the whole order; there is no way to refund part of one, and one live refund
        per order. Evidence is optional here and can be added until the case closes.


        Nothing ships yet — the buyer keeps the goods until the refund is granted. The
        seller has until `deadline_at` to accept or reject, and letting that pass hands
        the next move to the buyer rather than settling anything.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { $ref: '#/components/schemas/OrderID' } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateRefundRequest' }
      responses:
        '201':
          description: 'Created'
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Refund' }
                required: [data]
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: 'Caller is not the buyer of this order', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: 'A refund is already open on this order, or its escrow has already been paid out or returned', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /refunds:
    get:
      tags: [order]
      summary: List the caller's refunds, both sides by default
      description: >
        Omit `role` for both sides, which is what "what is waiting on me" needs: a buyer's own
        claims and the ones raised against their sales are the same queue of things to answer.
        `role=seller` resolves through the order's seller, because a refund row itself only
        records the buyer.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: role
          in: query
          schema: { type: string, enum: [buyer, seller] }
        - { name: status, in: query, schema: { $ref: '#/components/schemas/RefundStatus' } }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200': { description: 'OK', content: { application/json: { schema: { $ref: '#/components/schemas/RefundPage' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /refunds/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { $ref: '#/components/schemas/RefundID' } }
    get:
      tags: [order]
      summary: Read a refund and its case
      description: >
        The case: `deadline_at` for whoever is on the clock, and the facts each stage recorded.
        A party sees a staff verdict in the status the case ended up in.
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: 'OK'
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Refund' }
                required: [data]
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [order]
      summary: Withdraw a refund request (buyer)
      description: >
        Only while the seller has not decided. Once anything has moved — a decision, an
        escalation, a parcel — the case is closed by a verdict, not by walking away from it.


        The case ends as `cancelled`, which gives the escrow back up: the payout becomes the
        seller's again.
      security: [{ bearerAuth: [] }]
      responses:
        '204': { description: Withdrawn }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: 'The seller has already decided, or the case has moved on', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /refunds/{id}/attachments:
    parameters:
      - { name: id, in: path, required: true, schema: { $ref: '#/components/schemas/RefundID' } }
    post:
      tags: [order]
      summary: Add evidence to a refund case
      description: >
        The buyer, while the case is open. A closed one is the record a verdict was
        reached on, so nothing is added to it afterwards. The seller does not write here —
        they answer by opening a `refund-dispute` ticket, and that thread carries their
        evidence.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AddAttachmentsRequest' }
      responses:
        '200':
          description: 'OK'
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Refund' }
                required: [data]
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: 'The case is closed', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /refunds/{id}/acceptance:
    parameters:
      - { name: id, in: path, required: true, schema: { $ref: '#/components/schemas/RefundID' } }
    post:
      tags: [order]
      summary: Accept a refund (seller)
      description: >
        Grants it without staff. The goods have to come back first, so this books the
        return shipment on the same carrier as the outbound leg and moves the refund to
        `returning`; the money goes back once the seller has reported that leg delivered and has
        not escalated what arrived. No body — there is nothing left to choose.
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: 'Accepted; the return shipment is booked'
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Refund' }
                required: [data]
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: 'Caller is not the seller of this order', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: 'Refund is not awaiting seller review', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

components:
  schemas:
    RefundStatus:
      type: string
      description: >
        Every live value names the party whose move the refund is waiting on, and each
        of those carries a `deadline_at` that the party can miss:


        `awaiting-seller-review` — the seller grants it or hands it to staff; they cannot
        refuse it. Missing the window hands it to staff too. `disputed` — staff are looking
        at it. `returning` — the goods are on their way back; only a granted refund ever
        reaches here. `returned` — the seller has acknowledged the return and now inspects what
        arrived, and may escalate until the window closes, which is where a broken or substituted
        return is caught. A return the buyer reports and the seller has not goes to `disputed`
        rather than here.


        Then three terminals: `accepted` is money back to the buyer and the order closed with
        it, `rejected` is no refund and the payout stands, `cancelled` is the buyer withdrawing
        before the seller decided. Only the last two give the escrow up — `accepted` keeps its
        claim, because that money has already gone to the buyer.
      enum: [awaiting-seller-review, disputed, returning, returned, accepted, rejected, cancelled]

    Refund:
      type: object
      description: >
        The case. Always for one entire order, so it carries no amount of its own — what is owed
        is the order's checkout total.
      properties:
        id: { $ref: '#/components/schemas/RefundID' }
        order_id: { $ref: '#/components/schemas/OrderID' }
        buyer_id: { $ref: '#/components/schemas/AccountID' }
        status: { $ref: '#/components/schemas/RefundStatus' }
        reason: { type: string, example: Not as described }
        attachments:
          type: array
          items: { $ref: '#/components/schemas/Resource' }
          description: >
            The buyer's evidence, topped up until the case closes. Theirs alone: this is
            the claim being made, not a shared file — the seller's answer lives on the
            `refund-dispute` ticket they open, so the two sides stay legible apart.
        deadline_at:
          type: string
          format: date-time
          nullable: true
          description: >
            When the party named by `status` runs out of time, and missing it is itself
            a move. Null while the case waits on staff or a carrier, and in the terminal
            states.
        seller_decided_at:
          type: string
          format: date-time
          nullable: true
          description: >
            When the seller answered — by granting the refund, or by handing it to staff.
            There is no rejection reason beside it: they cannot refuse one.
        returned_at:
          type: string
          format: date-time
          nullable: true
          description: >
            When the return leg was reported delivered. Set by either party's report, since it
            answers "is there anything left to ship" for a later verdict — whose report it was is
            what `status` says.
        created_at: { type: string, format: date-time }
      required: [id, order_id, buyer_id, status, reason, attachments, deadline_at, seller_decided_at, returned_at, created_at]

    RefundSummary:
      type: object
      description: >
        A case as an order carries it: that it exists, where it stands, and where to read it.
        The reason and the evidence stay on the case's own page — an order list that embedded
        them would resolve an upload URL per row to render nothing.
      properties:
        id: { $ref: '#/components/schemas/RefundID' }
        status: { $ref: '#/components/schemas/RefundStatus' }
        settled:
          type: boolean
          example: false
          description: >
            Whether the case has ended. False is what stops another being raised, so this is
            the question a "request a refund" control has to ask — the blocking statuses are
            an index's, not a list for each client to re-derive.
        created_at: { type: string, format: date-time }
      required: [id, status, settled, created_at]

    RefundPage:
      type: object
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/Refund' } }
        meta: { $ref: '#/components/schemas/CursorMeta' }
      required: [data, meta]

    CreateRefundRequest:
      type: object
      description: >
        No item selection and no amount: a refund is for the whole order. Nothing about
        shipping either — the goods stay with the buyer until the refund is granted, and a granted
        refund returns the goods' money, not the carriage: that parcel was carried. Delivery comes
        back only where it never happened, which is a cancellation before pickup rather than a
        refund. Who bears the return leg is the verdict's business.
      properties:
        reason: { type: string, minLength: 1, maxLength: 2000, example: Not as described }
        attachments:
          type: array
          maxItems: 10
          description: Evidence, and it can be topped up until the case closes.
          items: { $ref: '#/components/schemas/ResourceID' }
      required: [reason]

    AddAttachmentsRequest:
      type: object
      properties:
        attachments:
          type: array
          minItems: 1
          maxItems: 10
          items: { $ref: '#/components/schemas/ResourceID' }
      required: [attachments]
