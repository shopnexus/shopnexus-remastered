# common fragment: option — the registry of pluggable integrations (payment rails,
# carriers, notification channels).
#
# An option is soft-deleted, and for the opposite reason to a resource's: order and
# finance hold its slug as a plain string with no foreign key, so a row that vanishes
# leaves every past order and settled payment naming a carrier or a rail nothing can
# resolve. Retiring one is `is_enabled` = false; removing it keeps it readable by id.
#
# An option's visibility is scoped by owner. `GET /options` without `owner_id` returns
# system options only, because a seller may register their own carriers and anything a
# seller enabled must not turn up at every buyer's checkout. Which types a seller may
# register at all is a role question, and `payment` is not one of them.
#
# "option"."vault_secret_path" is write-only and admin-only. It names where an
# integration's credentials live — exactly what an attacker wants to know — and the
# runtime authenticates as whatever it points at, so being able to set it is being able
# to borrow someone else's credentials.

paths:
  /options:
    get:
      tags: [common]
      summary: List the live integrations of one type
      description: >
        The checkout list. Enabled, not deleted, ordered by `priority` then `id` —
        priority ties are possible, so the id is the tiebreaker that keeps the order
        stable between calls.


        Without `owner_id` this returns **system options only**. That is the important
        part: a seller can register their own carriers, and if their rows appeared in the
        unscoped list then anything a seller enabled would show up at every buyer's
        checkout — including, before this was scoped, a payment rail of their own naming.
        With `owner_id` the result is that seller's options plus the system ones, which
        is exactly what checking out with that seller needs.


        Public either way: which rails a marketplace accepts is not a secret, and a buyer
        sees them before signing in.
      parameters:
        - { name: type, in: query, required: true, schema: { $ref: '#/components/schemas/OptionType' } }
        - name: owner_id
          in: query
          schema: { $ref: '#/components/schemas/AccountID' }
          description: >
            Add this seller's own options to the system ones. Omit for system options
            alone.
      responses:
        '200': { description: 'OK', content: { application/json: { schema: { $ref: '#/components/schemas/OptionList' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
    post:
      tags: [common]
      summary: Register an integration the caller owns
      description: >
        A seller configuring their own carriers. `owner_id` is the caller and is never
        taken from the body. `id` is a marketplace-wide slug shared with the
        system-provided options, so it is supplied by the caller and collides loudly
        rather than being silently renamed.


        Which types a caller may register is a role question, not a free choice: an admin
        may register any, a seller only the ones where owning an integration means owning
        a relationship with a carrier. `payment` is not among them — how money is routed
        is the platform's to decide, and a rail nobody vetted must not be reachable from a
        buyer's checkout.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateOptionRequest' }
      responses:
        '201':
          description: 'Created'
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Option' }
                required: [data]
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: 'This role may not register an integration of this type, or may not set a credential path', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '409': { description: 'This slug is taken', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /options/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { $ref: '#/components/schemas/OptionSlug' } }
    get:
      tags: [common]
      summary: Read one integration
      description: >
        Answers for a removed one too, with `deleted_at` set. A year-old order still names
        its carrier by slug and has to be able to render the name.
      responses:
        '200':
          description: 'OK'
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Option' }
                required: [data]
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [common]
      summary: Update an integration
      description: >
        The owner, or an admin for a system-provided one. The slug, type and provider are
        not editable: other modules store the slug as a plain string with no foreign key
        (`item.transport_option`, `transaction.payment_option`), so renaming it would
        orphan every row that named it, and changing what kind of integration a row is
        would silently move it into another checkout list.


        `vault_secret_path` is admin-only here as well.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateOptionRequest' }
      responses:
        '200':
          description: 'OK'
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Option' }
                required: [data]
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: 'Not the owner, or not allowed to set a credential path', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [common]
      summary: Remove an integration
      description: >
        Soft delete, for the same reason the slug is immutable: past orders and settled
        payments hold it as a plain string, so a row that disappears leaves them naming
        something unresolvable. It stops appearing in `GET /options` and stays readable by
        id.


        No conflict check, because there is nothing to conflict with. Guarding a hard
        delete would have meant this module asking finance and order whether anything
        still points at the slug — a question in the wrong direction, since every module
        depends on common and not the reverse, and one neither of those tables is indexed
        to answer for exactly the in-flight rows that would matter. To stop offering an
        option without removing it, set `is_enabled` to false.
      security: [{ bearerAuth: [] }]
      responses:
        '204': { description: Removed }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

components:
  schemas:
    OptionSlug:
      type: string
      maxLength: 100
      pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
      description: >
        Stable kebab-case identifier, marketplace-wide. A natural key, not an
        encoded one: other modules store it as a plain string, so it is readable on
        the wire by design.
      example: ghn-express

    VaultSecretPath:
      type: string
      maxLength: 500
      writeOnly: true
      description: >
        Where this integration's credentials live in Vault, e.g. `payment/stripe/main`. No
        key material passes through this API and none is stored in the database — only the
        path, which the provider client resolves at runtime.


        Write-only: it never appears in a response, because it is precisely what an
        attacker wants to know. **Admin only.** The runtime reads whatever the path points
        at and authenticates as it, so a seller who could set this could aim their own
        integration at the platform's credentials and have the server use them.
      example: transport/ghn/main

    OptionType:
      type: string
      maxLength: 100
      pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
      description: >
        High-level grouping key. Open-ended rather than an enum — adding an
        integration category must not need a migration and a spec change.
      example: transport

    Option:
      type: object
      description: >
        One pluggable integration. `vault_secret_path` is deliberately absent: the
        credentials live in Vault, and the path to them is not something the API
        hands out.
      properties:
        id: { $ref: '#/components/schemas/OptionSlug' }
        owner_id:
          allOf: [{ $ref: '#/components/schemas/AccountID' }]
          nullable: true
          description: The seller who configured it. Null means system-provided.
        type: { $ref: '#/components/schemas/OptionType' }
        provider:
          type: string
          description: Sub-grouping key, kebab-case — `vnpay`, `ghn`.
        name: { type: string }
        description: { type: string }
        priority:
          type: integer
          example: 10
          description: Display order; ties are broken by `id`.
        is_enabled: { type: boolean }
        logo: { allOf: [{ $ref: '#/components/schemas/Resource' }], nullable: true }
        data:
          type: object
          additionalProperties: true
          description: >
            Non-secret configuration only — endpoints, supported currencies, feature
            flags.
        created_at: { type: string, format: date-time }
        deleted_at:
          type: string
          format: date-time
          nullable: true
          description: >
            Set on a removed integration. It no longer appears in `GET /options` but stays
            readable by id, because past orders and settled payments still name it.
      required: [id, type, provider, name, description, priority, is_enabled, data, created_at]

    OptionList:
      type: object
      description: >
        Unpaginated. A marketplace has a handful of rails and carriers, and the
        checkout screen wants all of them at once.
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/Option' } }
      required: [data]

    CreateOptionRequest:
      type: object
      properties:
        id: { $ref: '#/components/schemas/OptionSlug' }
        type: { $ref: '#/components/schemas/OptionType' }
        provider: { type: string, maxLength: 100, pattern: '^[a-z0-9]+(-[a-z0-9]+)*$' }
        name: { type: string, minLength: 1, maxLength: 200 }
        description: { type: string, maxLength: 2000 }
        priority: { type: integer, default: 0, example: 10 }
        is_enabled: { type: boolean, default: true }
        logo_resource_id: { $ref: '#/components/schemas/ResourceID' }
        data: { type: object, additionalProperties: true }
        vault_secret_path: { $ref: '#/components/schemas/VaultSecretPath' }
      required: [id, type, provider, name]

    UpdateOptionRequest:
      type: object
      description: >
        Every field optional; the slug, type and provider are fixed at creation.
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        description: { type: string, maxLength: 2000 }
        priority: { type: integer, example: 10 }
        is_enabled: { type: boolean }
        logo_resource_id: { allOf: [{ $ref: '#/components/schemas/ResourceID' }], nullable: true }
        data: { type: object, additionalProperties: true }
        vault_secret_path: { $ref: '#/components/schemas/VaultSecretPath' }
