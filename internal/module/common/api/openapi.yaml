# OpenAPI fragment owned by the common module. Merged by cmd/specgen.
#
# Covers "resource" (uploaded files) and "option" (the registry of pluggable
# integrations: payment rails, carriers, notification channels).
#
# Uploads are presigned, and the server — not the client — assigns "object_key".
# The client asks for an upload slot, PUTs the bytes straight at the storage
# backend, then confirms; the size, MIME type and checksum recorded are the ones
# read back from storage. A client that could name its own object key could claim
# or overwrite somebody else's object, and a client that could declare its own size
# could lie about it, so neither is accepted from the request.
#
# A resource is soft-deleted: "provider" + "object_key" is the only handle on the
# stored object, so the row has to outlive the delete request until a reaper has
# removed the object. Deleting the row first leaks the file permanently.
#
# So is an option, and for the opposite reason: order and finance hold its slug as a
# plain string with no foreign key, so a row that vanishes leaves every past order and
# settled payment naming a carrier or a rail nothing can resolve. Retiring one is
# `is_enabled` = false; removing it keeps it readable by id.
#
# An option's visibility is scoped by owner. `GET /options` without `owner_id` returns
# system options only, because a seller may register their own carriers and anything a
# seller enabled must not turn up at every buyer's checkout. Which types a seller may
# register at all is a role question, and `payment` is not one of them.
#
# "option"."vault_secret_path" is write-only and admin-only. It names where an
# integration's credentials live — exactly what an attacker wants to know — and the
# runtime authenticates as whatever it points at, so being able to set it is being able
# to borrow someone else's credentials.

paths:
  # ----------------------------------------------------------- resources -----
  /resources:
    post:
      tags: [common]
      summary: Reserve an upload slot
      description: >
        Returns the resource row together with a presigned URL to PUT the bytes to.
        The resource stays incomplete — and unusable as an attachment — until
        `POST /resources/{id}/completion` confirms it.


        Pass `checksum` when it is known up front: if the caller has already stored the
        same bytes, that resource comes back with no `upload_url` and there is nothing to
        upload.


        Deduplication is per uploader, not marketplace-wide. A resource has one owner and
        no reference count, so two accounts sharing an object would mean either of them
        could delete it out from under the other's listing. The declared checksum is used
        to find that row and is then discarded — the one recorded is always the one read
        back from storage at completion, because a hash the client merely asserted would
        let it claim bytes it does not have and have the next honest upload of those bytes
        deduplicated onto its object.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateUploadRequest' }
      responses:
        '201':
          description: 'Slot reserved'
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/UploadTicket' }
                required: [data]
        '200':
          description: 'The caller already has these bytes stored so nothing needs uploading'
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/UploadTicket' }
                required: [data]
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { description: 'MIME type or declared size outside what this account may upload', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /resources/{id}/completion:
    post:
      tags: [common]
      summary: Confirm an upload finished
      description: >
        The server reads the object back from storage and records the size, MIME type and
        checksum it actually has, rather than what the client said it would be, and stamps
        `completed_at`. Until that stamp exists the row is only a reservation — there may
        be no object at the reserved key at all — so an unconfirmed resource cannot be
        attached to anything, and a reservation nobody confirms is swept up by a job.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { $ref: '#/components/schemas/ResourceID' } }
      responses:
        '200':
          description: 'Confirmed'
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Resource' }
                required: [data]
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: 'Already confirmed', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '422': { description: 'No object at the reserved key or it does not match what was reserved', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /resources/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { $ref: '#/components/schemas/ResourceID' } }
    get:
      tags: [common]
      summary: Read a resource and get a URL to fetch it
      description: >
        The uploader, or staff. Not any authenticated caller holding an id: resources carry
        refund evidence, unboxing photos and whatever a KYC vendor left behind, and being
        signed in is not a reason to be shown someone else's dispute.


        Everyone else reads a resource **embedded in the thing that carries it** — a
        listing's images, a review's photos — where the module that owns that thing has
        already decided who may see it. This endpoint is for the owner managing their own
        uploads, not a general-purpose fetch by id.
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: 'OK'
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Resource' }
                required: [data]
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: 'Not the uploader and not staff', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [common]
      summary: Delete a resource
      description: Soft delete. The row is kept until a reaper has removed the object
        from the storage backend, because the row holds the only handle on it.
      security: [{ bearerAuth: [] }]
      responses:
        '204': { description: Marked for deletion }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ------------------------------------------------------------- options -----
  /options:
    get:
      tags: [common]
      summary: List the live integrations of one type
      description: >
        The checkout list. Enabled, not deleted, ordered by `priority` then `id` —
        priority ties are possible, so the id is the tiebreaker that keeps the order
        stable between calls.


        Without `owner_id` this returns **system options only**. That is the important
        part: a seller can register their own carriers, and if their rows appeared in the
        unscoped list then anything a seller enabled would show up at every buyer's
        checkout — including, before this was scoped, a payment rail of their own naming.
        With `owner_id` the result is that seller's options plus the system ones, which
        is exactly what checking out with that seller needs.


        Public either way: which rails a marketplace accepts is not a secret, and a buyer
        sees them before signing in.
      parameters:
        - { name: type, in: query, required: true, schema: { $ref: '#/components/schemas/OptionType' } }
        - name: owner_id
          in: query
          schema: { $ref: '#/components/schemas/AccountID' }
          description: >
            Add this seller's own options to the system ones. Omit for system options
            alone.
      responses:
        '200': { description: 'OK', content: { application/json: { schema: { $ref: '#/components/schemas/OptionList' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
    post:
      tags: [common]
      summary: Register an integration the caller owns
      description: >
        A seller configuring their own carriers. `owner_id` is the caller and is never
        taken from the body. `id` is a marketplace-wide slug shared with the
        system-provided options, so it is supplied by the caller and collides loudly
        rather than being silently renamed.


        Which types a caller may register is a role question, not a free choice: an admin
        may register any, a seller only the ones where owning an integration means owning
        a relationship with a carrier. `payment` is not among them — how money is routed
        is the platform's to decide, and a rail nobody vetted must not be reachable from a
        buyer's checkout.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateOptionRequest' }
      responses:
        '201':
          description: 'Created'
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Option' }
                required: [data]
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: 'This role may not register an integration of this type, or may not set a credential path', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '409': { description: 'This slug is taken', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /options/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { $ref: '#/components/schemas/OptionSlug' } }
    get:
      tags: [common]
      summary: Read one integration
      description: >
        Answers for a removed one too, with `deleted_at` set. A year-old order still names
        its carrier by slug and has to be able to render the name.
      responses:
        '200':
          description: 'OK'
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Option' }
                required: [data]
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [common]
      summary: Update an integration
      description: >
        The owner, or an admin for a system-provided one. The slug, type and provider are
        not editable: other modules store the slug as a plain string with no foreign key
        (`item.transport_option`, `transaction.payment_option`), so renaming it would
        orphan every row that named it, and changing what kind of integration a row is
        would silently move it into another checkout list.


        `vault_secret_path` is admin-only here as well.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateOptionRequest' }
      responses:
        '200':
          description: 'OK'
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Option' }
                required: [data]
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: 'Not the owner, or not allowed to set a credential path', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [common]
      summary: Remove an integration
      description: >
        Soft delete, for the same reason the slug is immutable: past orders and settled
        payments hold it as a plain string, so a row that disappears leaves them naming
        something unresolvable. It stops appearing in `GET /options` and stays readable by
        id.


        No conflict check, because there is nothing to conflict with. Guarding a hard
        delete would have meant this module asking finance and order whether anything
        still points at the slug — a question in the wrong direction, since every module
        depends on common and not the reverse, and one neither of those tables is indexed
        to answer for exactly the in-flight rows that would matter. To stop offering an
        option without removing it, set `is_enabled` to false.
      security: [{ bearerAuth: [] }]
      responses:
        '204': { description: Removed }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /admin/options:
    get:
      tags: [admin]
      summary: List every integration, disabled ones included
      description: The operator's view. `GET /options` only ever shows enabled rows,
        so this is the only way to see one that was switched off.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: type, in: query, schema: { $ref: '#/components/schemas/OptionType' } }
        - { name: is_enabled, in: query, schema: { type: boolean } }
        - { name: owner_id, in: query, schema: { $ref: '#/components/schemas/AccountID' } }
      responses:
        '200': { description: 'OK', content: { application/json: { schema: { $ref: '#/components/schemas/OptionList' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: 'Admin role required', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

components:
  schemas:
    OptionSlug:
      type: string
      maxLength: 100
      pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
      description: >
        Stable kebab-case identifier, marketplace-wide. A natural key, not an
        encoded one: other modules store it as a plain string, so it is readable on
        the wire by design.
      example: ghn-express

    VaultSecretPath:
      type: string
      maxLength: 500
      writeOnly: true
      description: >
        Where this integration's credentials live in Vault, e.g. `payment/stripe/main`. No
        key material passes through this API and none is stored in the database — only the
        path, which the provider client resolves at runtime.


        Write-only: it never appears in a response, because it is precisely what an
        attacker wants to know. **Admin only.** The runtime reads whatever the path points
        at and authenticates as it, so a seller who could set this could aim their own
        integration at the platform's credentials and have the server use them.
      example: transport/ghn/main

    OptionType:
      type: string
      maxLength: 100
      pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
      description: >
        High-level grouping key. Open-ended rather than an enum — adding an
        integration category must not need a migration and a spec change.
      example: transport

    # ----------------------------------------------------------- resources ---
    Resource:
      type: object
      properties:
        id: { $ref: '#/components/schemas/ResourceID' }
        provider:
          type: string
          description: Storage backend, kebab-case — `s3`, `minio`, `local`.
        mime: { type: string, example: image/jpeg }
        size:
          type: integer
          format: int64
          description: Bytes, as read back from storage rather than as declared.
        checksum:
          type: string
          nullable: true
          description: Content hash, used to share one stored object between identical uploads.
        metadata:
          type: object
          additionalProperties: true
          description: Backend-specific extras — dimensions, duration, CDN path.
        url:
          type: string
          nullable: true
          description: >
            Short-lived URL to fetch the bytes. Null while the upload is
            unconfirmed. Not a stable address: store the id, not this.
        url_expires_at: { type: string, format: date-time, nullable: true }
        completed_at:
          type: string
          format: date-time
          nullable: true
          description: >
            Null until the upload was confirmed. An unconfirmed resource cannot be
            attached to anything.
        created_at: { type: string, format: date-time }
      required: [id, provider, mime, size, metadata, created_at]

    CreateUploadRequest:
      type: object
      properties:
        mime: { type: string, minLength: 1, maxLength: 100 }
        size:
          type: integer
          format: int64
          minimum: 1
          description: >
            Expected byte count, used to bound the presigned PUT. The recorded size
            is what storage reports at completion, not this.
        checksum:
          type: string
          maxLength: 128
          description: >
            Content hash if known. A match returns the stored resource and skips the
            upload entirely.
      required: [mime, size]

    UploadTicket:
      type: object
      properties:
        resource: { $ref: '#/components/schemas/Resource' }
        upload_url:
          type: string
          nullable: true
          description: >
            PUT the bytes here, then confirm. Null when a checksum match meant there
            was nothing to upload.
        upload_expires_at: { type: string, format: date-time, nullable: true }
      required: [resource]

    # ------------------------------------------------------------- options ---
    Option:
      type: object
      description: >
        One pluggable integration. `vault_secret_path` is deliberately absent: the
        credentials live in Vault, and the path to them is not something the API
        hands out.
      properties:
        id: { $ref: '#/components/schemas/OptionSlug' }
        owner_id:
          allOf: [{ $ref: '#/components/schemas/AccountID' }]
          nullable: true
          description: The seller who configured it. Null means system-provided.
        type: { $ref: '#/components/schemas/OptionType' }
        provider:
          type: string
          description: Sub-grouping key, kebab-case — `vnpay`, `ghn`.
        name: { type: string }
        description: { type: string }
        priority:
          type: integer
          description: Display order; ties are broken by `id`.
        is_enabled: { type: boolean }
        logo: { allOf: [{ $ref: '#/components/schemas/Resource' }], nullable: true }
        data:
          type: object
          additionalProperties: true
          description: >
            Non-secret configuration only — endpoints, supported currencies, feature
            flags.
        created_at: { type: string, format: date-time }
        deleted_at:
          type: string
          format: date-time
          nullable: true
          description: >
            Set on a removed integration. It no longer appears in `GET /options` but stays
            readable by id, because past orders and settled payments still name it.
      required: [id, type, provider, name, description, priority, is_enabled, data, created_at]

    OptionList:
      type: object
      description: >
        Unpaginated. A marketplace has a handful of rails and carriers, and the
        checkout screen wants all of them at once.
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/Option' } }
      required: [data]
    CreateOptionRequest:
      type: object
      properties:
        id: { $ref: '#/components/schemas/OptionSlug' }
        type: { $ref: '#/components/schemas/OptionType' }
        provider: { type: string, maxLength: 100, pattern: '^[a-z0-9]+(-[a-z0-9]+)*$' }
        name: { type: string, minLength: 1, maxLength: 200 }
        description: { type: string, maxLength: 2000 }
        priority: { type: integer, default: 0 }
        is_enabled: { type: boolean, default: true }
        logo_resource_id: { $ref: '#/components/schemas/ResourceID' }
        data: { type: object, additionalProperties: true }
        vault_secret_path: { $ref: '#/components/schemas/VaultSecretPath' }
      required: [id, type, provider, name]

    UpdateOptionRequest:
      type: object
      description: >
        Every field optional; the slug, type and provider are fixed at creation.
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        description: { type: string, maxLength: 2000 }
        priority: { type: integer }
        is_enabled: { type: boolean }
        logo_resource_id: { allOf: [{ $ref: '#/components/schemas/ResourceID' }], nullable: true }
        data: { type: object, additionalProperties: true }
        vault_secret_path: { $ref: '#/components/schemas/VaultSecretPath' }
