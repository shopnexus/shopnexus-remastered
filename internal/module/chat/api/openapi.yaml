# OpenAPI fragment owned by the chat module. Merged by cmd/specgen.
#
# Covers conversation and message.
#
# One thread per pair of accounts, whoever happens to be buying. The pair is stored
# ordered, which is what makes the uniqueness impossible to sidestep by swapping
# sides and also rules out a thread with oneself. Threads are not scoped to a
# listing: a product is referenced per message instead, which is how an offer card
# appears in a conversation.
#
# Messages are a hypertable, so every read here is cursor-paginated over `created_at`
# and every single-message operation carries the message's own `sent_at`. A query
# without a time bound has to visit every chunk: the primary key is
# `(id, created_at)` — a unique index on a hypertable must contain its partitioning
# column — so an id on its own is not a key lookup at all.
#
# Read state is two marks on the conversation, not a status per message. What each side
# has read is one timestamp, so the unread badge is a bounded range scan, marking a
# thread read is one UPDATE, and a read receipt is a comparison rather than a column.
#
# Offers are not created here. A negotiation is an order-module resource; accepting
# or countering one emits a system message into the thread, which is why a message
# can have no sender.

paths:
  /conversations:
    get:
      tags: [chat]
      summary: The caller's inbox
      description: >
        Threads by latest activity. A participant sits on either side of the stored
        pair, so this is answered as two ordered index scans merged together rather
        than one scan that sorts.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200': { description: 'OK', content: { application/json: { schema: { $ref: '#/components/schemas/ConversationPage' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [chat]
      summary: Open the thread with another account
      description: >
        Idempotent by design: there is exactly one thread per pair, so this returns
        the existing one when it exists and creates it otherwise. A client does not
        have to track whether it has messaged someone before.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StartConversationRequest' }
      responses:
        '200': { description: 'The thread already existed', content: { application/json: { schema: { $ref: '#/components/schemas/Conversation' } } } }
        '201': { description: 'Created', content: { application/json: { schema: { $ref: '#/components/schemas/Conversation' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { description: 'An account cannot open a thread with itself', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /conversations/unread-count:
    get:
      tags: [chat]
      summary: The unread badge across every thread
      description: >
        One bounded range scan per thread the caller has, each starting at that thread's
        read mark, so an old unread message costs nothing extra and chunk exclusion
        applies throughout. Separate from the inbox because the badge is read far more
        often than the list.
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: 'OK', content: { application/json: { schema: { $ref: '#/components/schemas/ChatUnreadCount' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /conversations/{id}:
    get:
      tags: [chat]
      summary: Read a thread
      description: Carries the counterparty rather than both sides — the caller
        already knows who they are.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { $ref: '#/components/schemas/ConversationID' } }
      responses:
        '200': { description: 'OK', content: { application/json: { schema: { $ref: '#/components/schemas/Conversation' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /conversations/{id}/messages:
    parameters:
      - { name: id, in: path, required: true, schema: { $ref: '#/components/schemas/ConversationID' } }
    get:
      tags: [chat]
      summary: Read a thread's messages
      description: >
        Newest first, cursor only. Offset paging would defeat the chunk exclusion the
        time partitioning exists for.


        A redacted message is still returned, with its body emptied and `deleted_at`
        set: a gap in a thread that a dispute may hinge on is worse than a visible
        removal.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200': { description: 'OK', content: { application/json: { schema: { $ref: '#/components/schemas/MessagePage' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [chat]
      summary: Send a message
      description: >
        Text, attachments or both. `refs` carries pointers to a listing or a variant or
        an order, which is how a product is referred to inside a thread that is not
        itself listing-scoped.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SendMessageRequest' }
      responses:
        '201': { description: 'Sent', content: { application/json: { schema: { $ref: '#/components/schemas/Message' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { description: 'A message needs a body or an attachment', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /conversations/{id}/read:
    post:
      tags: [chat]
      summary: Mark a thread read up to a point in time
      description: >
        Moves the caller's read mark on the thread — one UPDATE of one row, whatever it
        covers. Omit `before` to mark the whole thread read. A mark never moves
        backwards: passing an earlier instant than the current one is a no-op, because
        un-reading is not a thing a client should be able to do to its own badge.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { $ref: '#/components/schemas/ConversationID' } }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MarkConversationReadRequest' }
      responses:
        '200': { description: 'OK', content: { application/json: { schema: { $ref: '#/components/schemas/ChatUnreadCount' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /messages/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { $ref: '#/components/schemas/MessageID' } }
      - name: sent_at
        in: query
        required: true
        description: >
          The message's own `created_at`. Required, and not redundant: `message` is
          partitioned on it and its primary key is `(id, created_at)`, so without it the
          row has to be hunted through every chunk of the table. A client always has the
          message before editing or redacting it, so it always has this.
        schema: { type: string, format: date-time }
    patch:
      tags: [chat]
      summary: Edit a message
      description: >
        Sender only, and it records that the message was edited — the counterparty has
        to be able to see that what they read has changed. A system message cannot be
        edited because it has no author.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateMessageRequest' }
      responses:
        '200': { description: 'OK', content: { application/json: { schema: { $ref: '#/components/schemas/Message' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: 'Only the sender may edit a message', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: 'A system message cannot be edited', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    delete:
      tags: [chat]
      summary: Redact a message
      description: >
        The sender unsending, or a moderator acting on an upheld report. The row
        survives with its body **and its attachments** cleared: a thread is evidence in
        a refund dispute, so removal is recorded rather than erased, but a redaction
        that leaves the picture up has not removed anything.
      security: [{ bearerAuth: [] }]
      responses:
        '204': { description: Redacted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: 'Only the sender or a moderator may redact a message', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '404': { $ref: '#/components/responses/NotFound' }

components:
  schemas:
    MessageType:
      type: string
      description: >
        A `system` message is produced by the backend — an offer was accepted, an
        order shipped — and belongs to no participant, which is why it has no sender.
      enum: [user, system]

    Conversation:
      type: object
      properties:
        id: { $ref: '#/components/schemas/ConversationID' }
        counterparty: { $ref: '#/components/schemas/AccountSummary' }
        last_message: { allOf: [{ $ref: '#/components/schemas/Message' }], nullable: true }
        last_message_at:
          type: string
          format: date-time
          description: >
            Starts at the creation time so an empty thread still sorts predictably in
            the inbox.
        unread: { type: integer, format: int64, description: The counterparty's messages after the caller's read mark. }
        read_at:
          type: string
          format: date-time
          nullable: true
          description: The caller's own read mark. Null while they have read nothing.
        counterparty_read_at:
          type: string
          format: date-time
          nullable: true
          description: >
            How far the other side has read. This is the read receipt: a message the
            caller sent is seen when this is at or past its `created_at`, which is why
            no message carries a delivery status of its own.
        created_at: { type: string, format: date-time }
      required: [id, counterparty, last_message_at, unread, created_at]

    ConversationPage:
      type: object
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Conversation' } }
        next_cursor: { type: string, nullable: true }
      required: [items]

    ChatUnreadCount:
      type: object
      properties:
        unread: { type: integer, format: int64 }
        conversations: { type: integer, format: int64, description: How many threads have anything unread. }
      required: [unread, conversations]

    Message:
      type: object
      properties:
        id: { $ref: '#/components/schemas/MessageID' }
        conversation_id: { $ref: '#/components/schemas/ConversationID' }
        sender_id:
          allOf: [{ $ref: '#/components/schemas/AccountID' }]
          nullable: true
          description: Null on a system message.
        type: { $ref: '#/components/schemas/MessageType' }
        body: { type: string, description: Empty on a redacted message. }
        attachments: { type: array, items: { $ref: '#/components/schemas/Resource' }, description: Empty on a redacted message. }
        refs:
          type: object
          additionalProperties: true
          description: >
            What the sender pointed at — a listing, a variant, an order. Client-supplied
            and validated against the caller's own access to each id, so it can carry a
            reference but never assert anything about it.
        card:
          type: object
          additionalProperties: true
          nullable: true
          description: >
            The rendered payload of a system message, such as the terms of an accepted
            offer. Written only by the backend and rejected on a `user` message —
            otherwise anyone could send a card that looks like an offer the seller
            accepted.
        created_at: { type: string, format: date-time }
        edited_at: { type: string, format: date-time, nullable: true }
        deleted_at:
          type: string
          format: date-time
          nullable: true
          description: Set on a redacted message. The row stays so a thread has no
            unexplained gaps.
      required: [id, conversation_id, type, body, attachments, refs, created_at]

    MessagePage:
      type: object
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Message' } }
        next_cursor: { type: string, nullable: true }
      required: [items]

    StartConversationRequest:
      type: object
      properties:
        account_id: { $ref: '#/components/schemas/AccountID' }
      required: [account_id]

    SendMessageRequest:
      type: object
      description: A body or at least one attachment is required.
      properties:
        body: { type: string, maxLength: 4000 }
        attachments: { type: array, items: { $ref: '#/components/schemas/ResourceID' } }
        refs:
          type: object
          additionalProperties: true
          description: >
            References to point at, each checked against the caller's access to it.
            There is no way to set `card` from here: a system payload is the backend's
            to write.

    UpdateMessageRequest:
      type: object
      properties:
        body: { type: string, minLength: 1, maxLength: 4000 }
      required: [body]

    MarkConversationReadRequest:
      type: object
      properties:
        before:
          type: string
          format: date-time
          description: >
            Mark everything sent at or before this instant read. Omit to mark the
            whole thread read.
