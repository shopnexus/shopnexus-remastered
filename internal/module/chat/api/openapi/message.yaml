# chat fragment: message — the hypertable behind a thread.
#
# Messages are a hypertable, so every read here is cursor-paginated over `created_at`
# and every single-message operation carries the message's own `created_at`. A query
# without a time bound has to visit every chunk: the primary key is
# `(id, created_at)` — a unique index on a hypertable must contain its partitioning
# column — so an id on its own is not a key lookup at all.
#
# Offers are not created here. A negotiation is an order-module resource; accepting
# or countering one emits a system message into the thread, which is why a message
# can have no sender.

paths:
  /conversations/{id}/messages:
    parameters:
      - { name: id, in: path, required: true, schema: { $ref: '#/components/schemas/ConversationID' } }
    get:
      tags: [chat]
      summary: Read a thread's messages
      description: >
        Newest first, cursor only. Offset paging would defeat the chunk exclusion the
        time partitioning exists for.


        A redacted message is still returned, with its body emptied and `deleted_at`
        set: a gap in a thread that a dispute may hinge on is worse than a visible
        removal.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200': { description: 'OK', content: { application/json: { schema: { $ref: '#/components/schemas/MessagePage' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [chat]
      summary: Send a message
      description: >
        Text, attachments or both. `refs` carries pointers to a listing or a variant or
        an order, which is how a product is referred to inside a thread that is not
        itself listing-scoped.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SendMessageRequest' }
      responses:
        '201':
          description: 'Sent'
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Message' }
                required: [data]
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { description: 'A message needs a body or an attachment', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /messages/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { $ref: '#/components/schemas/MessageID' } }
      - name: created_at
        in: query
        required: true
        description: >
          The message's own `created_at`, passed straight back. Required, and not
          redundant: `message` is partitioned on it and its primary key is
          `(id, created_at)`, so without it the row has to be hunted through every chunk
          of the table. A client always has the message before editing or redacting it, so
          it always has this. Named after the field it comes from — anything else would
          have the client copying `created_at` into a differently-named parameter.
        schema: { type: string, format: date-time }
    patch:
      tags: [chat]
      summary: Edit a message
      description: >
        Sender only, and it records that the message was edited — the counterparty has
        to be able to see that what they read has changed. A system message cannot be
        edited because it has no author.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateMessageRequest' }
      responses:
        '200':
          description: 'OK'
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Message' }
                required: [data]
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: 'Only the sender may edit a message', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: 'A system message cannot be edited', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    delete:
      tags: [chat]
      summary: Redact a message
      description: >
        The sender unsending, or a moderator acting on an upheld report. The row
        survives with its body **and its attachments** cleared: a thread is evidence in
        a refund dispute, so removal is recorded rather than erased, but a redaction
        that leaves the picture up has not removed anything.
      security: [{ bearerAuth: [] }]
      responses:
        '204': { description: Redacted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: 'Only the sender or a moderator may redact a message', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '404': { $ref: '#/components/responses/NotFound' }

components:
  schemas:
    MessageType:
      type: string
      description: >
        A `system` message is produced by the backend — an offer was accepted, an
        order shipped — and belongs to no participant, which is why it has no sender.
      enum: [user, system]

    Message:
      type: object
      properties:
        id: { $ref: '#/components/schemas/MessageID' }
        conversation_id: { $ref: '#/components/schemas/ConversationID' }
        sender_id:
          allOf: [{ $ref: '#/components/schemas/AccountID' }]
          nullable: true
          description: >
            Null on a system message, and null on a support reply seen by the requester — see
            `from_support`, which is how the two are told apart.
        from_support:
          type: boolean
          description: >
            True on a reply the support desk wrote, in the requester's own view of their ticket
            thread. Support answers as the platform, so the requester is told that much and no
            more; staff reading the same thread see the real sender and never this flag, because a
            colleague's name is what makes a thread reviewable.
        type: { $ref: '#/components/schemas/MessageType' }
        body: { type: string, description: Empty on a redacted message. }
        attachments: { type: array, items: { $ref: '#/components/schemas/Resource' }, description: Empty on a redacted message. }
        refs:
          type: object
          additionalProperties: true
          description: >
            What the sender pointed at — a listing, a variant, an order. Client-supplied
            and validated against the caller's own access to each id, so it can carry a
            reference but never assert anything about it.
        card:
          type: object
          additionalProperties: true
          description: >
            Empty on an ordinary message, so a client reads "no card" as an empty object rather
            than a missing key.

            What a system message renders, and for a price negotiation that is
            `{"offer_id": "ofr_…"}` and nothing else — the terms are read from the offer, so a
            counter-offer cannot leave an old price on screen. Written only by the backend and
            rejected on a `user` message, otherwise anyone could send a card that looks like an
            offer the seller accepted.
        created_at: { type: string, format: date-time }
        edited_at: { type: string, format: date-time, nullable: true }
        deleted_at:
          type: string
          format: date-time
          nullable: true
          description: Set on a redacted message. The row stays so a thread has no
            unexplained gaps.
        reply_to:
          allOf: [{ $ref: '#/components/schemas/MessageQuote' }]
          nullable: true
          description: The message this one answers, resolved. Null on an ordinary message.
      required: [id, conversation_id, sender_id, from_support, type, body, attachments, refs, card, created_at, edited_at, deleted_at, reply_to]

    MessageQuote:
      type: object
      description: >
        The little of a message a reply has to show above itself.

        Resolved when the thread is read, never copied at send time — the same rule an offer
        card follows by storing only `offer_id`. A snapshot would keep the sender's original
        words in every reply to it after an edit, and would go on showing them after a
        redaction, which is the one thing unsending is for.
      properties:
        id:
          type: string
          description: Opaque id of the quoted message.
          example: msg_2h9qk4mfx7bd3
        created_at:
          type: string
          format: date-time
          description: The quoted message's own instant — what a client needs to jump to it.
          example: '2026-08-03T11:14:51Z'
        sender_id:
          allOf: [{ $ref: '#/components/schemas/AccountID' }]
          nullable: true
          description: >
            Null on a system message and on a support reply seen by the requester — the same
            masking the quoted message itself gets, because a quote is a projection of it.
        from_support:
          type: boolean
          description: True when the quoted message is a reply the support desk wrote.
          example: false
        preview:
          type: string
          description: >
            The opening of what it said, cut to 120 characters on a rune boundary. Empty on a
            redacted one and on one that carried only files.
          example: cái áo xanh còn không?
        attachments:
          type: integer
          format: int32
          minimum: 0
          maximum: 10
          description: >
            How many files it carried, so a quote of four photos says four instead of looking
            like an empty message.
          example: 0
        redacted:
          type: boolean
          description: Set when the quoted message has since been unsent.
          example: false
      required: [id, created_at, sender_id, from_support, preview, attachments, redacted]

    MessageReplyRef:
      type: object
      description: >
        Names the message a reply answers.

        The instant travels with the id because `message` is a hypertable whose primary key is
        (id, created_at): it is what makes resolving the quote a point lookup in one chunk
        rather than a scan of every chunk. A client always has it — it is on the message being
        replied to — which is the same reason the edit and redact routes take it.
      properties:
        id:
          type: string
          description: Opaque id of the message being answered.
          example: msg_2h9qk4mfx7bd3
        created_at:
          type: string
          format: date-time
          description: That message's own instant, passed back unchanged.
          example: '2026-08-03T11:14:51Z'
      required: [id, created_at]

    MessagePage:
      type: object
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/Message' } }
        meta: { $ref: '#/components/schemas/CursorMeta' }
      required: [data, meta]

    SendMessageRequest:
      type: object
      description: A body or at least one attachment is required.
      properties:
        body: { type: string, maxLength: 4000 }
        attachments: { type: array, items: { $ref: '#/components/schemas/ResourceID' }, maxItems: 10 }
        refs:
          type: object
          additionalProperties: true
          description: >
            References to point at, each checked against the caller's access to it.
            There is no way to set `card` from here: a system payload is the backend's
            to write.
        reply_to:
          allOf: [{ $ref: '#/components/schemas/MessageReplyRef' }]
          nullable: true
          description: >
            The message being answered, and absent on an ordinary one. It has to be in this
            same conversation: the quote carries a preview of what was said, so answering a
            message from elsewhere would read another thread out through this one. `422
            reply_outside_thread` when it is not, `404` when it names nothing.

    UpdateMessageRequest:
      type: object
      properties:
        body: { type: string, minLength: 1, maxLength: 4000 }
      required: [body]

    DeletedMessageRef:
      type: object
      description: |
        Enough to find and drop a message from a rendered thread. Not the whole
        Message: a deleted row's body is gone, and sending an emptied entity would
        read as an edit.
      required: [id, conversation_id, created_at]
      properties:
        id:
          type: string
          description: Opaque message id.
          example: msg_2h9qk4mfx7bd3
        conversation_id:
          type: string
          example: cnv_7bd32h9qk4mfx
        created_at:
          type: string
          format: date-time
          description: The message's own instant — the hypertable needs it to locate the row.
          example: '2026-08-03T11:16:02Z'

    ConversationReadMark:
      type: object
      description: How far one participant has read a thread.
      required: [conversation_id, reader_id, read_at]
      properties:
        conversation_id:
          type: string
          example: cnv_7bd32h9qk4mfx
        reader_id:
          type: string
          description: Who read it — always the other participant, never the recipient.
          example: acc_4mfx7bd32h9qk
        read_at:
          type: string
          format: date-time
          example: '2026-08-03T11:17:04Z'
