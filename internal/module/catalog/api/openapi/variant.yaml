# catalog fragment: variant — the purchasable variant and its stock.
#
# The SPU is the aggregate root and a variant has no URL of its own: every write to a
# variant answers with the whole refreshed listing. Not decoration — deleting the featured
# variant leaves the listing with no featured one, and a response carrying the variant
# alone could not report that.

paths:
  # A variant is part of the listing aggregate and has no read of its own: every
  # write here answers with the refreshed listing, which is also where the variant's
  # stock is read from.
  /listings/{id}/variants:
    post:
      tags: [catalog]
      summary: Add a variant to a listing
      description: >
        Answers with the listing. The new variant is the one in `variants` that was not
        there before — there is no separate id in the response, because a variant is
        not addressable on its own.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { $ref: '#/components/schemas/ListingID' } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateVariantRequest' }
      responses:
        '201':
          description: 'Created'
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/ListingDetail' }
                required: [data]
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /variants/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { $ref: '#/components/schemas/VariantID' } }
    patch:
      tags: [catalog]
      summary: Edit a variant
      description: >
        A price change does not reach a buyer who already opened a purchase session:
        that session froze the terms it was opened with.


        `quantity` sets the total on hand. Neither `reserved` nor `sold` is settable —
        checkout and cancellation move the first, completing a purchase moves both — and
        a total below `reserved + sold` is refused, because an oversold row must not be
        representable.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateVariantRequest' }
      responses:
        '200':
          description: 'OK'
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/ListingDetail' }
                required: [data]
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: 'Another live variant of this listing already has these attributes', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '422': { description: 'Quantity below what is already reserved or sold', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    delete:
      tags: [catalog]
      summary: Delete a variant
      description: >
        Soft delete for the same reason as a listing. Refused for the last remaining
        variant of a live listing.


        Answers with the listing rather than an empty body: deleting the featured variant
        moves the flag to a surviving one, and the seller has to see which.
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: 'Deleted'
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/ListingDetail' }
                required: [data]
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: 'This is the only variant of a live listing', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

components:
  schemas:
    Stock:
      type: object
      description: >
        Always read inside its own variant, so it does not repeat the variant id.
      properties:
        quantity: { type: integer, format: int64, minimum: 0, example: 42, description: Total on hand. }
        reserved:
          type: integer
          format: int64
          minimum: 0
          example: 3
          description: >
            Held by a checkout that has not completed. Moved by checkout and by
            cancellation, never set directly, and it comes back when a session expires.
        sold:
          type: integer
          format: int64
          minimum: 0
          example: 128
          description: >
            Completed sales. Only ever goes up, which is what makes it usable as social
            proof — a reservation counts here only once the purchase completes.
        available: { type: integer, format: int64, minimum: 0, example: 39, description: 'quantity − reserved − sold.' }
      required: [quantity, reserved, sold, available]

    Variant:
      type: object
      description: A purchasable variant. Price and package details live here rather
        than on the listing.
      properties:
        id: { $ref: '#/components/schemas/VariantID' }
        price: { type: integer, format: int64, minimum: 1, example: 299000, description: Smallest unit of the listing's currency. }
        attributes:
          type: object
          additionalProperties: true
          description: Variant attributes such as size and colour.
        package_details:
          type: object
          additionalProperties: true
          description: Weight and dimensions. A shipping quote is computed from these.
        images:
          type: array
          items: { $ref: '#/components/schemas/Resource' }
          description: Empty means fall back to the listing gallery.
        is_featured: { type: boolean, example: true, description: 'The variant the card and search results show. At most one per listing.' }
        stock: { $ref: '#/components/schemas/Stock' }
        created_at: { type: string, format: date-time }
      required: [id, price, attributes, package_details, images, is_featured, stock, created_at]

    CreateVariantRequest:
      type: object
      properties:
        price: { type: integer, format: int64, minimum: 1, example: 299000 }
        attributes: { type: object, additionalProperties: true }
        package_details: { type: object, additionalProperties: true }
        attachments: { type: array, items: { $ref: '#/components/schemas/ResourceID' } }
        quantity: { type: integer, format: int64, minimum: 0, default: 0, description: Units on hand at creation. }
      required: [price, attributes, package_details]

    UpdateVariantRequest:
      type: object
      description: Every field optional.
      properties:
        price: { type: integer, format: int64, minimum: 1, example: 299000 }
        attributes: { type: object, additionalProperties: true }
        package_details: { type: object, additionalProperties: true }
        attachments: { type: array, items: { $ref: '#/components/schemas/ResourceID' } }
        is_featured:
          type: boolean
          example: true
          description: >
            True moves the card's variant to this one. False is ignored: exactly one variant is
            featured at all times, so the flag is moved rather than dropped.
        quantity:
          type: integer
          format: int64
          minimum: 0
          example: 42
          description: The new total on hand. Refused below `reserved + sold`.
