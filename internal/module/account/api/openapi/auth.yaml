# account fragment: authentication — register, login, tokens, password and email
# verification.
#
# Sessions live in Redis, not Postgres, so revoking one is a key delete rather than
# a row update. Two consequences visible here: refresh and logout are real
# endpoints rather than token arithmetic, and suspending an account has to drop its
# sessions — the database cannot invalidate a token already in circulation.

paths:
  /register:
    post:
      tags: [account]
      summary: Create an account
      description: >
        At least one of email, phone or username is required — an account nobody can
        be addressed by cannot sign in. The display profile is created in the same
        transaction, so an account without a name is never a reachable state.


        Always creates a plain user. Moderators come from `POST /admin/moderators`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterRequest' }
      responses:
        '201':
          description: 'Created'
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/AuthResult' }
                required: [data]
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { description: 'Email or phone or username already taken', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '422': { description: 'No identifier supplied', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /login:
    post:
      tags: [account]
      summary: Sign in with a password
      description: The identifier is an email or a phone or a username. Which one it
        is does not change the answer and is not reported back.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: 'OK'
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/AuthResult' }
                required: [data]
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { description: 'Wrong credentials', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '403': { description: 'Account suspended', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /login/oauth:
    post:
      tags: [account]
      summary: Sign in through a federated provider
      description: >
        Links to an existing account when the provider's subject id is already
        known, and otherwise creates one. A provider that returns no email — Apple
        with "hide my email" — gets a generated username, because the account still
        has to carry an identifier.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OAuthLoginRequest' }
      responses:
        '200':
          description: 'Signed in to an existing account'
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/AuthResult' }
                required: [data]
        '201':
          description: 'A new account was created'
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/AuthResult' }
                required: [data]
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { description: 'Provider rejected the credential', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '403': { description: 'Account suspended', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /token/refresh:
    post:
      tags: [account]
      summary: Exchange a refresh token for a new access token
      description: The refresh token is a Redis key. One that has been revoked or has
        expired is indistinguishable from one that never existed.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefreshRequest' }
      responses:
        '200':
          description: 'OK'
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/AuthResult' }
                required: [data]
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { description: 'Unknown or revoked refresh token', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /logout:
    post:
      tags: [account]
      summary: Revoke the current session
      description: Also unregisters the caller's push device when one is supplied so
        the phone stops receiving notifications for an account nobody is signed in to.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LogoutRequest' }
      responses:
        '204': { description: Session revoked }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /password:
    put:
      tags: [account]
      summary: Change the caller's password
      description: Requires the current password even though the caller is already
        authenticated — a stolen access token must not be enough to take the account.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChangePasswordRequest' }
      responses:
        '204': { description: Changed and every other session revoked }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { description: 'Current password is wrong', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '422': { description: 'This account signs in through a provider and has no password', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /password/reset-requests:
    post:
      tags: [account]
      summary: Ask for a password reset
      description: >
        Always answers 202, whether or not the identifier exists. Reporting that an
        address is unknown turns this endpoint into a way to enumerate accounts.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PasswordResetRequest' }
      responses:
        '202': { description: If the identifier exists a reset message was sent }
        '400': { $ref: '#/components/responses/BadRequest' }
        '429': { description: 'Too many requests for this identifier', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /password/resets:
    post:
      tags: [account]
      summary: Set a new password with a reset token
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PasswordResetConfirmRequest' }
      responses:
        '204': { description: Password set and every session revoked }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { description: 'Token is unknown or already used or expired', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /email/verification-requests:
    post:
      tags: [account]
      summary: Send a verification link to the caller's email
      security: [{ bearerAuth: [] }]
      responses:
        '202': { description: Verification message sent }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { description: 'Already verified', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '422': { description: 'No email on this account', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /email/verifications:
    post:
      tags: [account]
      summary: Confirm an email address
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EmailVerificationRequest' }
      responses:
        '204': { description: Verified }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { description: 'Token is unknown or already used or expired', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

components:
  schemas:
    AuthResult:
      type: object
      properties:
        access_token: { type: string }
        refresh_token: { type: string }
        expires_in: { type: integer, minimum: 0, example: 900, description: Access token lifetime in seconds. }
        account: { $ref: '#/components/schemas/Me' }
      required: [access_token, refresh_token, expires_in, account]

    RegisterRequest:
      type: object
      description: >
        At least one of email, phone or username is required. The profile fields are
        part of the same request because the account and its profile are created
        together.
      properties:
        email: { type: string, format: email, maxLength: 255 }
        phone: { type: string, pattern: '^\+[1-9][0-9]{7,14}$', description: E.164. }
        username: { type: string, minLength: 3, maxLength: 100, pattern: '^[a-z0-9._-]+$' }
        password: { type: string, minLength: 8, maxLength: 72 }
        name: { type: string, minLength: 1, maxLength: 100, description: Display name. }
        country: { type: string, minLength: 2, maxLength: 2, pattern: '^[A-Z]{2}$' }
        locale: { type: string, pattern: '^[a-z]{2}(-[A-Z]{2})?$', example: vi-VN }
        timezone: { type: string, maxLength: 64, example: Asia/Ho_Chi_Minh }
      required: [password, name, country, locale, timezone]

    LoginRequest:
      type: object
      properties:
        identifier: { type: string, description: An email or a phone or a username. }
        password: { type: string }
      required: [identifier, password]

    OAuthLoginRequest:
      type: object
      properties:
        provider: { $ref: '#/components/schemas/OAuthProvider' }
        credential: { type: string, description: The provider's authorization code or id token. }
        country: { type: string, minLength: 2, maxLength: 2, pattern: '^[A-Z]{2}$' }
        locale: { type: string, pattern: '^[a-z]{2}(-[A-Z]{2})?$' }
        timezone: { type: string, maxLength: 64 }
      required: [provider, credential]

    RefreshRequest:
      type: object
      properties:
        refresh_token: { type: string }
      required: [refresh_token]

    LogoutRequest:
      type: object
      properties:
        device_id: { $ref: '#/components/schemas/DeviceID' }

    ChangePasswordRequest:
      type: object
      properties:
        current_password: { type: string }
        new_password: { type: string, minLength: 8, maxLength: 72 }
      required: [current_password, new_password]

    PasswordResetRequest:
      type: object
      properties:
        identifier: { type: string, description: An email or a phone. }
      required: [identifier]

    PasswordResetConfirmRequest:
      type: object
      properties:
        token: { type: string }
        new_password: { type: string, minLength: 8, maxLength: 72 }
      required: [token, new_password]

    EmailVerificationRequest:
      type: object
      properties:
        token: { type: string }
      required: [token]
