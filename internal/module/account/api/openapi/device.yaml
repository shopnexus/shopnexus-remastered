# account fragment: device — push tokens per installation.

paths:
  /devices:
    put:
      tags: [account]
      summary: Register or move a push device
      description: >
        An upsert on the push token, not a create. The token identifies an install
        and the platform reissues the same one when a different user signs in on that
        phone, so the row moves to the new account. Without that, the previous owner
        keeps receiving that phone's notifications.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterDeviceRequest' }
      responses:
        '200':
          description: 'Registered or moved'
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Device' }
                required: [data]
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /me/devices:
    get:
      tags: [account]
      summary: List the caller's push devices
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: 'OK', content: { application/json: { schema: { $ref: '#/components/schemas/DeviceList' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /devices/{id}:
    delete:
      tags: [account]
      summary: Unregister a push device
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { $ref: '#/components/schemas/DeviceID' } }
      responses:
        '204': { description: Unregistered }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

components:
  schemas:
    DevicePlatform:
      type: string
      enum: [ios, android, web]

    Device:
      type: object
      properties:
        id: { $ref: '#/components/schemas/DeviceID' }
        platform: { $ref: '#/components/schemas/DevicePlatform' }
        push_token_suffix:
          type: string
          description: >
            The tail of the token, enough for a client to recognise its own install.
            The whole token is a delivery credential and is never returned.
        last_seen_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
      required: [id, platform, push_token_suffix, last_seen_at, created_at]

    DeviceList:
      type: object
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/Device' } }
      required: [data]

    RegisterDeviceRequest:
      type: object
      properties:
        platform: { $ref: '#/components/schemas/DevicePlatform' }
        push_token: { type: string, minLength: 1, maxLength: 4096 }
      required: [platform, push_token]
