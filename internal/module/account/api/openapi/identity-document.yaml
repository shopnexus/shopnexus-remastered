# account fragment: identity document — the seller KYC submission.

paths:
  /identity-documents:
    post:
      tags: [account]
      summary: Start identity verification
      description: >
        Hands the uploaded scans to the KYC vendor. Neither a document number nor a scan
        is stored here — only the vendor, its case reference and the verdict — so a leak
        of this data cannot impersonate anyone.


        The verdict may already be final in the response: a vendor that reads the images
        answers in the same call, so `status` can come back `verified` or `rejected` with
        no session URL. A vendor that runs its own web flow answers `pending` and returns
        `vendor_session_url` for the caller to finish in. A client has to read the status
        rather than assume one of the two.


        A rejected case leaves the account free to submit another one: the usual reason is
        glare on the card, and there is nothing to appeal.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StartIdentityVerificationRequest' }
      responses:
        '201':
          description: 'Case opened'
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/IdentityVerificationTicket' }
                required: [data]
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { description: 'This account already holds a live verified document', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '422': { description: 'A named scan is missing, unconfirmed, or cannot be fetched', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /me/identity-documents:
    get:
      tags: [account]
      summary: The caller's verification history
      description: Includes `expires_at` — a passport runs out and a payout gate has
        to look at more than the status.
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: 'OK', content: { application/json: { schema: { $ref: '#/components/schemas/IdentityDocumentList' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }

components:
  schemas:
    IdentityDocumentType:
      type: string
      enum: [national-id, passport, driver-license]

    IdentityStatus:
      type: string
      enum: [pending, verified, rejected]

    IdentityDocument:
      type: object
      description: >
        A verification outcome. No document number and no scan: the vendor performs
        the check and only its verdict is kept.
      properties:
        id: { $ref: '#/components/schemas/IdentityDocumentID' }
        doc_type: { $ref: '#/components/schemas/IdentityDocumentType' }
        provider: { type: string, description: 'KYC vendor, kebab-case.' }
        status: { $ref: '#/components/schemas/IdentityStatus' }
        rejection_reason: { type: string, nullable: true }
        verified_at: { type: string, format: date-time, nullable: true }
        expires_at:
          type: string
          format: date-time
          nullable: true
          description: >
            When the document itself runs out. A payout gate reads this as well as
            the status.
        created_at: { type: string, format: date-time }
      required: [id, doc_type, provider, status, created_at]

    IdentityDocumentList:
      type: object
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/IdentityDocument' } }
      required: [data]

    IdentityDocumentPage:
      type: object
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/AdminIdentityDocument' } }
        meta: { $ref: '#/components/schemas/PageMeta' }
      required: [data, meta]

    StartIdentityVerificationRequest:
      type: object
      description: >
        The scans are uploaded first through `POST /resources` and named here by id: a
        photo of a government ID does not belong in a JSON body, and the upload has its
        own retry story.
      properties:
        doc_type: { $ref: '#/components/schemas/IdentityDocumentType' }
        front_resource_id:
          allOf: [{ $ref: '#/components/schemas/ResourceID' }]
          description: The data page, or the front of the card.
        back_resource_id:
          allOf: [{ $ref: '#/components/schemas/ResourceID' }]
          description: The reverse, for a document that has one. Omit for a passport.
        selfie_resource_id:
          allOf: [{ $ref: '#/components/schemas/ResourceID' }]
          description: >
            A live photo, matched against the portrait on the document. Required: without
            it the document is verified but nothing ties it to the person holding the
            account.
      required: [doc_type, front_resource_id, selfie_resource_id]

    IdentityVerificationTicket:
      type: object
      properties:
        document: { $ref: '#/components/schemas/IdentityDocument' }
        vendor_session_url:
          type: string
          nullable: true
          description: Where the caller finishes the check with the vendor.
        vendor_session_expires_at: { type: string, format: date-time, nullable: true }
      required: [document]
