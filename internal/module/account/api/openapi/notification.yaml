# account fragment: notification — inbox and per-category channel preferences.
#
# A feed row stores the *fact* — a kind and its particulars — and the words are written when it
# is read, in the reader's own language. So this contract answers a finished sentence and the
# page it opens, and carries no payload for a client to probe: every client would otherwise
# re-implement the same copy and drift from the mail that says the same thing.
#
# Notifications are a hypertable, which decides how they are marked read rather than whether
# they can be. `POST /notifications/read` takes a time bound for the bulk act — "read all", or
# "read what I scrolled past" — because a bound reads one range of chunks. A list of ids is the
# per-row act, and has no bound: it visits every chunk in the retention window, which is what
# the unread count already does on every page load and is cheap for the same reason — the
# partial index holds only an account's unread rows.

paths:
  /notifications:
    get:
      tags: [account]
      summary: The caller's notification feed
      description: >
        Newest first, cursor only. The table is chunked by time, so a cursor is what
        lets the reader stop at a chunk boundary instead of touching every chunk.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: category, in: query, schema: { $ref: '#/components/schemas/NotificationCategory' } }
        - { name: unread, in: query, schema: { type: boolean }, description: Restrict to unread ones. }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200': { description: 'OK', content: { application/json: { schema: { $ref: '#/components/schemas/NotificationPage' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /notifications/unread-count:
    get:
      tags: [account]
      summary: The unread badge
      description: A separate endpoint because it is read far more often than the
        feed and answers from one partial index.
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: 'OK'
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/UnreadCount' }
                required: [data]
        '401': { $ref: '#/components/responses/Unauthorized' }

  /notifications/read:
    post:
      tags: [account]
      summary: Mark notifications read
      description: >
        Send `ids` to mark exactly those rows read, `before` to mark everything up to an
        instant, or an empty body to mark the whole feed. The two fields are refused
        together: "these three, and also everything from last Tuesday" is a client sending a
        stale bound beside a fresh click, not something a reader asked for.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MarkNotificationsReadRequest' }
      responses:
        '200':
          description: 'OK'
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/UnreadCount' }
                required: [data]
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /notification-preferences:
    get:
      tags: [account]
      summary: Read the effective notification settings
      description: >
        Returns every category and channel pair with the value in force. Stored rows
        are sparse — one exists only where the account differs from the default — and
        the defaults live in the domain, so resolving them here keeps the client from
        having to know them.
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: 'OK', content: { application/json: { schema: { $ref: '#/components/schemas/NotificationPreferenceList' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
    put:
      tags: [account]
      summary: Change notification settings
      description: >
        Setting a pair back to its default deletes the row rather than storing the
        default again.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateNotificationPreferencesRequest' }
      responses:
        '200': { description: 'OK', content: { application/json: { schema: { $ref: '#/components/schemas/NotificationPreferenceList' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

components:
  schemas:
    NotificationCategory:
      type: string
      description: Also the preference key, which is why it is an enum — a typo would
        read as no preference and quietly send anyway.
      enum: [order, promotion, system, chat, social]

    NotificationChannel:
      type: string
      enum: [in-app, push, email, sms]

    Notification:
      type: object
      description: >
        A feed row as it is drawn: already written, in the reader's language, with the page
        it opens resolved. There is no payload — the server renders the stored facts, so a
        client never probes a free-form object for a body that may not be there.
      properties:
        id: { $ref: '#/components/schemas/NotificationID' }
        kind:
          type: string
          description: >
            What happened, kebab-case. Not an enum: the vocabulary grows with every fact the
            platform learns to tell somebody, and a client renders by `category` — `kind` is
            for a client that wants to special-case one row, and for support reading a log.
          example: 'order-placed'
        category: { $ref: '#/components/schemas/NotificationCategory' }
        title: { type: string, example: 'Đặt hàng thành công' }
        body:
          type: string
          description: The one supporting line, empty for a fact that needs none.
          example: 'Đơn ord_2h9qk4mfx7bd3 · 250.000 ₫. Người bán đang chuẩn bị hàng.'
        href:
          type: string
          description: >
            The in-app path this notification opens, empty when it opens nothing. A row with
            nowhere to go is still worth reading and still dismissible.
          example: '/account/orders/ord_2h9qk4mfx7bd3'
        read_at: { type: string, format: date-time, nullable: true }
        created_at:
          type: string
          format: date-time
          description: >
            The feed order, and the bound `POST /notifications/read` takes to clear
            everything the reader has scrolled past.
      required: [id, kind, category, title, body, href, read_at, created_at]

    NotificationPage:
      type: object
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/Notification' } }
        meta: { $ref: '#/components/schemas/CursorMeta' }
      required: [data, meta]

    UnreadCount:
      type: object
      description: >
        The badge and the breakdown behind it, from one query — so the number on the bell and
        the number beside each filter cannot disagree.
      properties:
        unread: { type: integer, format: int64, minimum: 0, example: 3 }
        by_category:
          type: object
          description: >
            Every category, zeros included: a client renders a fixed set of filters and must
            not have to know which of them the server considers empty.
          additionalProperties: { type: integer, format: int64, minimum: 0 }
          example: { order: 2, promotion: 0, system: 1, chat: 0, social: 0 }
      required: [unread, by_category]

    MarkNotificationsReadRequest:
      type: object
      properties:
        before:
          type: string
          format: date-time
          description: >
            Mark everything created at or before this instant read. Send neither field to
            mark the whole feed read.
        ids:
          type: array
          maxItems: 100
          items: { $ref: '#/components/schemas/NotificationID' }
          description: >
            Mark exactly these rows read. Capped because the statement has no time bound and
            so visits every chunk in the retention window; a reader never opens more than a
            screenful.

    NotificationPreference:
      type: object
      properties:
        category: { $ref: '#/components/schemas/NotificationCategory' }
        channel: { $ref: '#/components/schemas/NotificationChannel' }
        is_enabled: { type: boolean }
        is_default:
          type: boolean
          description: >
            True when no stored row exists and this is the domain default. Shown so a
            client can tell an explicit choice from an inherited one.
      required: [category, channel, is_enabled, is_default]

    NotificationPreferenceList:
      type: object
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/NotificationPreference' } }
      required: [data]

    UpdateNotificationPreferencesRequest:
      type: object
      properties:
        items:
          type: array
          minItems: 1
          items:
            type: object
            properties:
              category: { $ref: '#/components/schemas/NotificationCategory' }
              channel: { $ref: '#/components/schemas/NotificationChannel' }
              is_enabled: { type: boolean }
            required: [category, channel, is_enabled]
      required: [items]
