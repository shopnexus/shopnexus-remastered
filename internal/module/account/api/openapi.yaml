# OpenAPI fragment owned by the account module. Merged by cmd/specgen.
#
# Covers account, oauth_identity, device, contact, profile, notification,
# notification_delivery, notification_preference, favorite, follow and
# identity_document.
#
# One account, both roles. There is no seller entity: the same account buys and
# sells, its profile *is* the shop page, and `role` only separates a user from the
# staff who moderate them. A moderator is provisioned by an admin and can never be
# self-registered.
#
# Sessions live in Redis, not Postgres, so revoking one is a key delete rather than
# a row update. Two consequences visible here: refresh and logout are real
# endpoints rather than token arithmetic, and suspending an account has to drop its
# sessions — the database cannot invalidate a token already in circulation.
#
# Notifications are a hypertable. Marking one read by id would fan out across every
# chunk, so `POST /notifications/read` takes a *time bound* instead of a list of
# ids: it covers both "mark all read" and "mark what I just scrolled past", stays
# chunk-bounded, and means a notification needs no opaque id on the wire at all.

paths:
  # ------------------------------------------------------------------ auth ---
  /register:
    post:
      tags: [account]
      summary: Create an account
      description: >
        At least one of email, phone or username is required — an account nobody can
        be addressed by cannot sign in. The display profile is created in the same
        transaction, so an account without a name is never a reachable state.


        Always creates a plain user. Moderators come from `POST /admin/moderators`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterRequest' }
      responses:
        '201': { description: 'Created', content: { application/json: { schema: { $ref: '#/components/schemas/AuthResult' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { description: 'Email or phone or username already taken', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '422': { description: 'No identifier supplied', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /login:
    post:
      tags: [account]
      summary: Sign in with a password
      description: The identifier is an email or a phone or a username. Which one it
        is does not change the answer and is not reported back.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200': { description: 'OK', content: { application/json: { schema: { $ref: '#/components/schemas/AuthResult' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { description: 'Wrong credentials', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '403': { description: 'Account suspended', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /login/oauth:
    post:
      tags: [account]
      summary: Sign in through a federated provider
      description: >
        Links to an existing account when the provider's subject id is already
        known, and otherwise creates one. A provider that returns no email — Apple
        with "hide my email" — gets a generated username, because the account still
        has to carry an identifier.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OAuthLoginRequest' }
      responses:
        '200': { description: 'Signed in to an existing account', content: { application/json: { schema: { $ref: '#/components/schemas/AuthResult' } } } }
        '201': { description: 'A new account was created', content: { application/json: { schema: { $ref: '#/components/schemas/AuthResult' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { description: 'Provider rejected the credential', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '403': { description: 'Account suspended', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /token/refresh:
    post:
      tags: [account]
      summary: Exchange a refresh token for a new access token
      description: The refresh token is a Redis key. One that has been revoked or has
        expired is indistinguishable from one that never existed.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefreshRequest' }
      responses:
        '200': { description: 'OK', content: { application/json: { schema: { $ref: '#/components/schemas/AuthResult' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { description: 'Unknown or revoked refresh token', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /logout:
    post:
      tags: [account]
      summary: Revoke the current session
      description: Also unregisters the caller's push device when one is supplied so
        the phone stops receiving notifications for an account nobody is signed in to.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LogoutRequest' }
      responses:
        '204': { description: Session revoked }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /password:
    put:
      tags: [account]
      summary: Change the caller's password
      description: Requires the current password even though the caller is already
        authenticated — a stolen access token must not be enough to take the account.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChangePasswordRequest' }
      responses:
        '204': { description: Changed and every other session revoked }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { description: 'Current password is wrong', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '422': { description: 'This account signs in through a provider and has no password', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /password/reset-requests:
    post:
      tags: [account]
      summary: Ask for a password reset
      description: >
        Always answers 202, whether or not the identifier exists. Reporting that an
        address is unknown turns this endpoint into a way to enumerate accounts.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PasswordResetRequest' }
      responses:
        '202': { description: If the identifier exists a reset message was sent }
        '400': { $ref: '#/components/responses/BadRequest' }
        '429': { description: 'Too many requests for this identifier', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /password/resets:
    post:
      tags: [account]
      summary: Set a new password with a reset token
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PasswordResetConfirmRequest' }
      responses:
        '204': { description: Password set and every session revoked }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { description: 'Token is unknown or already used or expired', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /email/verification-requests:
    post:
      tags: [account]
      summary: Send a verification link to the caller's email
      security: [{ bearerAuth: [] }]
      responses:
        '202': { description: Verification message sent }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { description: 'Already verified', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '422': { description: 'No email on this account', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /email/verifications:
    post:
      tags: [account]
      summary: Confirm an email address
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EmailVerificationRequest' }
      responses:
        '204': { description: Verified }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { description: 'Token is unknown or already used or expired', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  # -------------------------------------------------------------------- me ---
  /me:
    get:
      tags: [account]
      summary: Read the caller's own account and profile
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: 'OK', content: { application/json: { schema: { $ref: '#/components/schemas/Me' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
    patch:
      tags: [account]
      summary: Change the caller's identifiers
      description: >
        Changing the email clears `email_verified` and sends a fresh verification;
        changing the phone clears its verified flag the same way. The last remaining
        identifier cannot be removed.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateAccountRequest' }
      responses:
        '200': { description: 'OK', content: { application/json: { schema: { $ref: '#/components/schemas/Me' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { description: 'Email or phone or username already taken', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '422': { description: 'That would leave the account with no identifier', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /me/profile:
    patch:
      tags: [account]
      summary: Update the caller's public profile
      description: This is the shop front. `locale` and `timezone` also decide how
        notifications are written and when they are sent.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateProfileRequest' }
      responses:
        '200': { description: 'OK', content: { application/json: { schema: { $ref: '#/components/schemas/Profile' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /accounts/{id}:
    get:
      tags: [account]
      summary: Read another account's public profile
      description: >
        The seller page. Deliberately narrow: a display name, an avatar, a blurb and
        a join date. Email, phone, birth date and saved addresses are never part of
        it.
      parameters:
        - { name: id, in: path, required: true, schema: { $ref: '#/components/schemas/AccountID' } }
      responses:
        '200': { description: 'OK', content: { application/json: { schema: { $ref: '#/components/schemas/PublicAccount' } } } }
        '404': { $ref: '#/components/responses/NotFound' }

  /me/oauth-identities:
    get:
      tags: [account]
      summary: List the caller's linked providers
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: 'OK', content: { application/json: { schema: { $ref: '#/components/schemas/OAuthIdentityList' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /me/oauth-identities/{provider}:
    delete:
      tags: [account]
      summary: Unlink a provider
      description: Refused when it would leave the account with no way to sign in —
        no password and no other linked provider.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: provider, in: path, required: true, schema: { $ref: '#/components/schemas/OAuthProvider' } }
      responses:
        '204': { description: Unlinked }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { description: 'This is the only way left to sign in', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  # -------------------------------------------------------------- contacts ---
  /contacts:
    get:
      tags: [account]
      summary: List the caller's saved addresses
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: 'OK', content: { application/json: { schema: { $ref: '#/components/schemas/ContactList' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [account]
      summary: Save an address
      description: >
        The administrative codes are what a carrier is called with, so they are the
        routing source of truth and the names beside them are display snapshots. A
        coordinate is optional: geocoding may fail and the address still has to be
        saveable.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateContactRequest' }
      responses:
        '201': { description: 'Created', content: { application/json: { schema: { $ref: '#/components/schemas/Contact' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /contacts/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { $ref: '#/components/schemas/ContactID' } }
    patch:
      tags: [account]
      summary: Update a saved address
      description: >
        Setting a default clears the previous one. Delivery and pickup defaults are
        independent flags — the same address is usually both.


        An order already placed keeps its own snapshot of the address, so editing
        this row never rewrites where a shipment was going.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateContactRequest' }
      responses:
        '200': { description: 'OK', content: { application/json: { schema: { $ref: '#/components/schemas/Contact' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [account]
      summary: Remove a saved address
      security: [{ bearerAuth: [] }]
      responses:
        '204': { description: Removed }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # --------------------------------------------------------------- devices ---
  /devices:
    put:
      tags: [account]
      summary: Register or move a push device
      description: >
        An upsert on the push token, not a create. The token identifies an install
        and the platform reissues the same one when a different user signs in on that
        phone, so the row moves to the new account. Without that, the previous owner
        keeps receiving that phone's notifications.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterDeviceRequest' }
      responses:
        '200': { description: 'Registered or moved', content: { application/json: { schema: { $ref: '#/components/schemas/Device' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /me/devices:
    get:
      tags: [account]
      summary: List the caller's push devices
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: 'OK', content: { application/json: { schema: { $ref: '#/components/schemas/DeviceList' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /devices/{id}:
    delete:
      tags: [account]
      summary: Unregister a push device
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { $ref: '#/components/schemas/DeviceID' } }
      responses:
        '204': { description: Unregistered }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # --------------------------------------------------------- notifications ---
  /notifications:
    get:
      tags: [account]
      summary: The caller's notification feed
      description: >
        Newest first, cursor only. The table is chunked by time, so a cursor is what
        lets the reader stop at a chunk boundary instead of touching every chunk.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: category, in: query, schema: { $ref: '#/components/schemas/NotificationCategory' } }
        - { name: unread, in: query, schema: { type: boolean }, description: Restrict to unread ones. }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200': { description: 'OK', content: { application/json: { schema: { $ref: '#/components/schemas/NotificationPage' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /notifications/unread-count:
    get:
      tags: [account]
      summary: The unread badge
      description: A separate endpoint because it is read far more often than the
        feed and answers from one partial index.
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: 'OK', content: { application/json: { schema: { $ref: '#/components/schemas/UnreadCount' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /notifications/read:
    post:
      tags: [account]
      summary: Mark notifications read up to a point in time
      description: >
        Takes a time bound rather than a list of ids. Marking individual rows by id
        would have to search every chunk of a time-partitioned table; a bound reads
        one range. Omit `before` to mark everything read.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MarkNotificationsReadRequest' }
      responses:
        '200': { description: 'OK', content: { application/json: { schema: { $ref: '#/components/schemas/UnreadCount' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /notification-preferences:
    get:
      tags: [account]
      summary: Read the effective notification settings
      description: >
        Returns every category and channel pair with the value in force. Stored rows
        are sparse — one exists only where the account differs from the default — and
        the defaults live in the domain, so resolving them here keeps the client from
        having to know them.
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: 'OK', content: { application/json: { schema: { $ref: '#/components/schemas/NotificationPreferenceList' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
    put:
      tags: [account]
      summary: Change notification settings
      description: >
        Setting a pair back to its default deletes the row rather than storing the
        default again.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateNotificationPreferencesRequest' }
      responses:
        '200': { description: 'OK', content: { application/json: { schema: { $ref: '#/components/schemas/NotificationPreferenceList' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ------------------------------------------------------ favorites/follows --
  /favorites:
    get:
      tags: [account]
      summary: The caller's wishlist
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200': { description: 'OK', content: { application/json: { schema: { $ref: '#/components/schemas/FavoritePage' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /favorites/{spuID}:
    parameters:
      - { name: spuID, in: path, required: true, schema: { $ref: '#/components/schemas/ProductSPUID' } }
    put:
      tags: [account]
      summary: Save a listing
      description: Idempotent. The account and listing pair is the whole row so
        saving twice is the same as saving once.
      security: [{ bearerAuth: [] }]
      responses:
        '204': { description: Saved }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [account]
      summary: Unsave a listing
      security: [{ bearerAuth: [] }]
      responses:
        '204': { description: Removed }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /me/following:
    get:
      tags: [account]
      summary: Sellers the caller follows
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200': { description: 'OK', content: { application/json: { schema: { $ref: '#/components/schemas/AccountSummaryPage' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /accounts/{id}/followers:
    get:
      tags: [account]
      summary: Who follows this seller
      parameters:
        - { name: id, in: path, required: true, schema: { $ref: '#/components/schemas/AccountID' } }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200': { description: 'OK', content: { application/json: { schema: { $ref: '#/components/schemas/AccountSummaryPage' } } } }
        '404': { $ref: '#/components/responses/NotFound' }

  /follows/{accountID}:
    parameters:
      - { name: accountID, in: path, required: true, schema: { $ref: '#/components/schemas/AccountID' } }
    put:
      tags: [account]
      summary: Follow a seller
      description: Idempotent. Following yourself is refused.
      security: [{ bearerAuth: [] }]
      responses:
        '204': { description: Following }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { description: 'An account cannot follow itself', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    delete:
      tags: [account]
      summary: Unfollow a seller
      security: [{ bearerAuth: [] }]
      responses:
        '204': { description: Unfollowed }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ------------------------------------------------------------------ kyc ----
  /identity-documents:
    post:
      tags: [account]
      summary: Start identity verification
      description: >
        Opens a case with the KYC vendor and returns the vendor's session URL for the
        caller to finish in. Neither a document number nor a scan is stored here —
        only the vendor, its case reference and the verdict — so a leak of this data
        cannot impersonate anyone.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StartIdentityVerificationRequest' }
      responses:
        '201': { description: 'Case opened', content: { application/json: { schema: { $ref: '#/components/schemas/IdentityVerificationTicket' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { description: 'This account already holds a live verified document', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /me/identity-documents:
    get:
      tags: [account]
      summary: The caller's verification history
      description: Includes `expires_at` — a passport runs out and a payout gate has
        to look at more than the status.
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: 'OK', content: { application/json: { schema: { $ref: '#/components/schemas/IdentityDocumentList' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ---------------------------------------------------------------- admin ----
  /admin/accounts:
    get:
      tags: [admin]
      summary: Search accounts
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: q, in: query, schema: { type: string }, description: Matches email or phone or username or display name. }
        - { name: status, in: query, schema: { $ref: '#/components/schemas/AccountStatus' } }
        - { name: role, in: query, schema: { $ref: '#/components/schemas/AccountRole' } }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200': { description: 'OK', content: { application/json: { schema: { $ref: '#/components/schemas/AdminAccountPage' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: 'Moderator role required', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /admin/accounts/{id}/suspension:
    parameters:
      - { name: id, in: path, required: true, schema: { $ref: '#/components/schemas/AccountID' } }
    post:
      tags: [admin]
      summary: Suspend an account
      description: >
        The outcome of upholding a report against a seller. Omit `until` for a
        permanent suspension.


        Suspending also drops the account's sessions. A suspended row does not stop
        an access token that is already in circulation, so the two have to happen
        together.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SuspendAccountRequest' }
      responses:
        '200': { description: 'Suspended', content: { application/json: { schema: { $ref: '#/components/schemas/AdminAccount' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: 'Moderator role required', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [admin]
      summary: Lift a suspension
      description: Clears the reason and the deadline with it. Past suspensions stay
        in the audit log rather than on the row.
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: 'Reinstated', content: { application/json: { schema: { $ref: '#/components/schemas/AdminAccount' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: 'Moderator role required', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '404': { $ref: '#/components/responses/NotFound' }

  /admin/moderators:
    post:
      tags: [admin]
      summary: Provision a moderator account
      description: >
        Only an admin may do this and there is no self-service path — a moderator
        decides disputes and takes listings down, so the role is granted, never
        claimed.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateModeratorRequest' }
      responses:
        '201': { description: 'Created', content: { application/json: { schema: { $ref: '#/components/schemas/AdminAccount' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: 'Admin role required', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '409': { description: 'Email or phone or username already taken', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /admin/moderators/{id}:
    delete:
      tags: [admin]
      summary: Revoke the moderator role
      description: Demotes to a plain user and drops the account's sessions. The
        account itself survives, since it may have traded.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { $ref: '#/components/schemas/AccountID' } }
      responses:
        '204': { description: Revoked }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: 'Admin role required', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '404': { $ref: '#/components/responses/NotFound' }

  /admin/identity-documents:
    get:
      tags: [admin]
      summary: The identity review queue
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: status, in: query, schema: { $ref: '#/components/schemas/IdentityStatus' }, description: Defaults to pending. }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200': { description: 'OK', content: { application/json: { schema: { $ref: '#/components/schemas/IdentityDocumentPage' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: 'Moderator role required', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /admin/identity-documents/{id}/verdict:
    post:
      tags: [admin]
      summary: Record an identity verdict
      description: >
        `verified` requires `expires_at` when the document type carries one, because
        the payout gate reads the expiry and not only the status. `rejected` requires
        a reason.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { $ref: '#/components/schemas/IdentityDocumentID' } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/IdentityVerdictRequest' }
      responses:
        '200': { description: 'Recorded', content: { application/json: { schema: { $ref: '#/components/schemas/IdentityDocument' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: 'Moderator role required', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: 'Already decided or the account already has a verified document', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

components:
  schemas:
    # ------------------------------------------------------------- enums -----
    AccountStatus:
      type: string
      enum: [active, suspended]

    AccountRole:
      type: string
      description: >
        `user` self-registers and both buys and sells. `moderator` is granted by an
        admin. `admin` is configured, not created.
      enum: [user, moderator, admin]

    ProfileGender:
      type: string
      enum: [male, female, other]

    ContactAddressType:
      type: string
      enum: [home, work]

    DevicePlatform:
      type: string
      enum: [ios, android, web]

    OAuthProvider:
      type: string
      pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
      example: google

    NotificationCategory:
      type: string
      description: Also the preference key, which is why it is an enum — a typo would
        read as no preference and quietly send anyway.
      enum: [order, promotion, system, chat, social]

    NotificationChannel:
      type: string
      enum: [in-app, push, email, sms]

    IdentityDocumentType:
      type: string
      enum: [national-id, passport, driver-license]

    IdentityStatus:
      type: string
      enum: [pending, verified, rejected]

    # -------------------------------------------------------------- auth -----
    AuthResult:
      type: object
      properties:
        access_token: { type: string }
        refresh_token: { type: string }
        expires_in: { type: integer, description: Access token lifetime in seconds. }
        account: { $ref: '#/components/schemas/Me' }
      required: [access_token, refresh_token, expires_in, account]

    RegisterRequest:
      type: object
      description: >
        At least one of email, phone or username is required. The profile fields are
        part of the same request because the account and its profile are created
        together.
      properties:
        email: { type: string, format: email, maxLength: 255 }
        phone: { type: string, pattern: '^\+[1-9][0-9]{7,14}$', description: E.164. }
        username: { type: string, minLength: 3, maxLength: 100, pattern: '^[a-z0-9._-]+$' }
        password: { type: string, minLength: 8, maxLength: 72 }
        name: { type: string, minLength: 1, maxLength: 100, description: Display name. }
        country: { type: string, minLength: 2, maxLength: 2, pattern: '^[A-Z]{2}$' }
        locale: { type: string, pattern: '^[a-z]{2}(-[A-Z]{2})?$', example: vi-VN }
        timezone: { type: string, maxLength: 64, example: Asia/Ho_Chi_Minh }
      required: [password, name, country, locale, timezone]

    LoginRequest:
      type: object
      properties:
        identifier: { type: string, description: An email or a phone or a username. }
        password: { type: string }
      required: [identifier, password]

    OAuthLoginRequest:
      type: object
      properties:
        provider: { $ref: '#/components/schemas/OAuthProvider' }
        credential: { type: string, description: The provider's authorization code or id token. }
        country: { type: string, minLength: 2, maxLength: 2, pattern: '^[A-Z]{2}$' }
        locale: { type: string, pattern: '^[a-z]{2}(-[A-Z]{2})?$' }
        timezone: { type: string, maxLength: 64 }
      required: [provider, credential]

    RefreshRequest:
      type: object
      properties:
        refresh_token: { type: string }
      required: [refresh_token]

    LogoutRequest:
      type: object
      properties:
        device_id: { $ref: '#/components/schemas/DeviceID' }

    ChangePasswordRequest:
      type: object
      properties:
        current_password: { type: string }
        new_password: { type: string, minLength: 8, maxLength: 72 }
      required: [current_password, new_password]

    PasswordResetRequest:
      type: object
      properties:
        identifier: { type: string, description: An email or a phone. }
      required: [identifier]

    PasswordResetConfirmRequest:
      type: object
      properties:
        token: { type: string }
        new_password: { type: string, minLength: 8, maxLength: 72 }
      required: [token, new_password]

    EmailVerificationRequest:
      type: object
      properties:
        token: { type: string }
      required: [token]

    # ----------------------------------------------------------- account -----
    Profile:
      type: object
      properties:
        name: { type: string }
        description: { type: string, nullable: true }
        gender: { allOf: [{ $ref: '#/components/schemas/ProfileGender' }], nullable: true }
        date_of_birth: { type: string, format: date, nullable: true }
        avatar: { allOf: [{ $ref: '#/components/schemas/Resource' }], nullable: true }
        country: { type: string, minLength: 2, maxLength: 2 }
        locale: { type: string, example: vi-VN }
        timezone: { type: string, example: Asia/Ho_Chi_Minh }
        created_at: { type: string, format: date-time }
      required: [name, country, locale, timezone, created_at]

    Me:
      type: object
      description: The caller's own view. Everything here is private to them.
      properties:
        id: { $ref: '#/components/schemas/AccountID' }
        email: { type: string, format: email, nullable: true }
        email_verified: { type: boolean }
        phone: { type: string, nullable: true }
        username: { type: string, nullable: true }
        role: { $ref: '#/components/schemas/AccountRole' }
        status: { $ref: '#/components/schemas/AccountStatus' }
        has_password:
          type: boolean
          description: False on a provider-only account. Unlinking the last provider
            is refused when this is false.
        identity_verified:
          type: boolean
          description: Whether a live verified identity document exists. The payout
            gate reads this.
        profile: { $ref: '#/components/schemas/Profile' }
        created_at: { type: string, format: date-time }
      required: [id, email_verified, role, status, has_password, identity_verified, profile, created_at]

    PublicAccount:
      type: object
      description: >
        What anyone may see about an account. The seller page: no email, no phone, no
        birth date, no addresses.
      properties:
        id: { $ref: '#/components/schemas/AccountID' }
        name: { type: string }
        description: { type: string, nullable: true }
        avatar: { allOf: [{ $ref: '#/components/schemas/Resource' }], nullable: true }
        identity_verified: { type: boolean, description: Shown as a trust signal. }
        follower_count: { type: integer, format: int64 }
        created_at: { type: string, format: date-time, description: Member since. }
      required: [id, name, identity_verified, follower_count, created_at]

    AccountSummary:
      type: object
      description: The compact form used in follower and following lists.
      properties:
        id: { $ref: '#/components/schemas/AccountID' }
        name: { type: string }
        avatar: { allOf: [{ $ref: '#/components/schemas/Resource' }], nullable: true }
      required: [id, name]

    AccountSummaryPage:
      type: object
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/AccountSummary' } }
        next_cursor: { type: string, nullable: true }
      required: [items]

    UpdateAccountRequest:
      type: object
      description: Every field optional. Setting one to null removes it, which is
        refused when it is the last identifier.
      properties:
        email: { type: string, format: email, maxLength: 255, nullable: true }
        phone: { type: string, pattern: '^\+[1-9][0-9]{7,14}$', nullable: true }
        username: { type: string, minLength: 3, maxLength: 100, pattern: '^[a-z0-9._-]+$', nullable: true }

    UpdateProfileRequest:
      type: object
      description: Every field optional.
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        description: { type: string, maxLength: 2000, nullable: true }
        gender: { allOf: [{ $ref: '#/components/schemas/ProfileGender' }], nullable: true }
        date_of_birth: { type: string, format: date, nullable: true }
        avatar_resource_id: { allOf: [{ $ref: '#/components/schemas/ResourceID' }], nullable: true }
        country: { type: string, minLength: 2, maxLength: 2, pattern: '^[A-Z]{2}$' }
        locale: { type: string, pattern: '^[a-z]{2}(-[A-Z]{2})?$' }
        timezone: { type: string, maxLength: 64 }

    OAuthIdentity:
      type: object
      properties:
        provider: { $ref: '#/components/schemas/OAuthProvider' }
        email:
          type: string
          nullable: true
          description: >
            As the provider reported it. May differ from the account's email and is
            not authoritative.
        created_at: { type: string, format: date-time }
      required: [provider, created_at]

    OAuthIdentityList:
      type: object
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/OAuthIdentity' } }
      required: [items]

    # ---------------------------------------------------------- contacts -----
    Contact:
      type: object
      properties:
        id: { $ref: '#/components/schemas/ContactID' }
        full_name: { type: string }
        phone: { type: string, description: E.164. }
        phone_verified: { type: boolean }
        address_type: { $ref: '#/components/schemas/ContactAddressType' }
        is_default_delivery: { type: boolean }
        is_default_pickup: { type: boolean }
        country: { type: string, minLength: 2, maxLength: 2 }
        province_code: { type: string }
        province_name: { type: string }
        district_code:
          type: string
          nullable: true
          description: >
            Null where the country has no district tier. Vietnam dropped it in 2025
            and now goes province to ward.
        district_name: { type: string, nullable: true }
        ward_code: { type: string }
        ward_name: { type: string }
        postal_code: { type: string, nullable: true }
        address: { type: string, description: Street or house-number line below ward level. }
        address_detail: { type: string, nullable: true, description: Unit or floor or notes. }
        latitude: { type: number, format: double, nullable: true }
        longitude: { type: number, format: double, nullable: true }
        provider_codes:
          type: object
          additionalProperties: true
          description: >
            Per-carrier territory ids. Carriers number territories their own way and
            some still require a district.
        created_at: { type: string, format: date-time }
      required: [id, full_name, phone, phone_verified, address_type, is_default_delivery, is_default_pickup, country, province_code, province_name, ward_code, ward_name, address, created_at]

    ContactList:
      type: object
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Contact' } }
      required: [items]

    CreateContactRequest:
      type: object
      properties:
        full_name: { type: string, minLength: 1, maxLength: 100 }
        phone: { type: string, pattern: '^\+[1-9][0-9]{7,14}$' }
        address_type: { $ref: '#/components/schemas/ContactAddressType' }
        is_default_delivery: { type: boolean, default: false }
        is_default_pickup: { type: boolean, default: false }
        country: { type: string, minLength: 2, maxLength: 2, pattern: '^[A-Z]{2}$' }
        province_code: { type: string, minLength: 1, maxLength: 20 }
        province_name: { type: string, minLength: 1, maxLength: 100 }
        district_code: { type: string, maxLength: 20, description: Send both district fields or neither. }
        district_name: { type: string, maxLength: 100 }
        ward_code: { type: string, minLength: 1, maxLength: 20 }
        ward_name: { type: string, minLength: 1, maxLength: 100 }
        postal_code: { type: string, maxLength: 20 }
        address: { type: string, minLength: 1, maxLength: 255 }
        address_detail: { type: string, maxLength: 255 }
        latitude: { type: number, format: double }
        longitude: { type: number, format: double }
      required: [full_name, phone, address_type, country, province_code, province_name, ward_code, ward_name, address]

    UpdateContactRequest:
      type: object
      description: Every field optional.
      properties:
        full_name: { type: string, minLength: 1, maxLength: 100 }
        phone: { type: string, pattern: '^\+[1-9][0-9]{7,14}$' }
        address_type: { $ref: '#/components/schemas/ContactAddressType' }
        is_default_delivery: { type: boolean }
        is_default_pickup: { type: boolean }
        province_code: { type: string, maxLength: 20 }
        province_name: { type: string, maxLength: 100 }
        district_code: { type: string, maxLength: 20, nullable: true }
        district_name: { type: string, maxLength: 100, nullable: true }
        ward_code: { type: string, maxLength: 20 }
        ward_name: { type: string, maxLength: 100 }
        postal_code: { type: string, maxLength: 20, nullable: true }
        address: { type: string, maxLength: 255 }
        address_detail: { type: string, maxLength: 255, nullable: true }
        latitude: { type: number, format: double, nullable: true }
        longitude: { type: number, format: double, nullable: true }

    # ----------------------------------------------------------- devices -----
    Device:
      type: object
      properties:
        id: { $ref: '#/components/schemas/DeviceID' }
        platform: { $ref: '#/components/schemas/DevicePlatform' }
        push_token_suffix:
          type: string
          description: >
            The tail of the token, enough for a client to recognise its own install.
            The whole token is a delivery credential and is never returned.
        last_seen_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
      required: [id, platform, push_token_suffix, last_seen_at, created_at]

    DeviceList:
      type: object
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Device' } }
      required: [items]

    RegisterDeviceRequest:
      type: object
      properties:
        platform: { $ref: '#/components/schemas/DevicePlatform' }
        push_token: { type: string, minLength: 1, maxLength: 4096 }
      required: [platform, push_token]

    # ----------------------------------------------------- notifications -----
    Notification:
      type: object
      properties:
        category: { $ref: '#/components/schemas/NotificationCategory' }
        title: { type: string }
        payload:
          type: object
          additionalProperties: true
          description: Structured content such as deep links and images.
        read_at: { type: string, format: date-time, nullable: true }
        created_at:
          type: string
          format: date-time
          description: >
            Identifies the row together with the feed order, and it is what
            `POST /notifications/read` is given a bound against.
      required: [category, title, payload, created_at]

    NotificationPage:
      type: object
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Notification' } }
        next_cursor: { type: string, nullable: true }
      required: [items]

    UnreadCount:
      type: object
      properties:
        unread: { type: integer, format: int64 }
      required: [unread]

    MarkNotificationsReadRequest:
      type: object
      properties:
        before:
          type: string
          format: date-time
          description: >
            Mark everything created at or before this instant read. Omit to mark the
            whole feed read.

    NotificationPreference:
      type: object
      properties:
        category: { $ref: '#/components/schemas/NotificationCategory' }
        channel: { $ref: '#/components/schemas/NotificationChannel' }
        is_enabled: { type: boolean }
        is_default:
          type: boolean
          description: >
            True when no stored row exists and this is the domain default. Shown so a
            client can tell an explicit choice from an inherited one.
      required: [category, channel, is_enabled, is_default]

    NotificationPreferenceList:
      type: object
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/NotificationPreference' } }
      required: [items]

    UpdateNotificationPreferencesRequest:
      type: object
      properties:
        items:
          type: array
          minItems: 1
          items:
            type: object
            properties:
              category: { $ref: '#/components/schemas/NotificationCategory' }
              channel: { $ref: '#/components/schemas/NotificationChannel' }
              is_enabled: { type: boolean }
            required: [category, channel, is_enabled]
      required: [items]

    # ------------------------------------------------ favorites and follows --
    Favorite:
      type: object
      properties:
        spu_id: { $ref: '#/components/schemas/ProductSPUID' }
        created_at: { type: string, format: date-time }
      required: [spu_id, created_at]

    FavoritePage:
      type: object
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Favorite' } }
        next_cursor: { type: string, nullable: true }
      required: [items]

    # ------------------------------------------------------------- kyc -------
    IdentityDocument:
      type: object
      description: >
        A verification outcome. No document number and no scan: the vendor performs
        the check and only its verdict is kept.
      properties:
        id: { $ref: '#/components/schemas/IdentityDocumentID' }
        doc_type: { $ref: '#/components/schemas/IdentityDocumentType' }
        provider: { type: string, description: 'KYC vendor, kebab-case.' }
        status: { $ref: '#/components/schemas/IdentityStatus' }
        rejection_reason: { type: string, nullable: true }
        verified_at: { type: string, format: date-time, nullable: true }
        expires_at:
          type: string
          format: date-time
          nullable: true
          description: >
            When the document itself runs out. A payout gate reads this as well as
            the status.
        created_at: { type: string, format: date-time }
      required: [id, doc_type, provider, status, created_at]

    IdentityDocumentList:
      type: object
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/IdentityDocument' } }
      required: [items]

    IdentityDocumentPage:
      type: object
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/AdminIdentityDocument' } }
        next_cursor: { type: string, nullable: true }
      required: [items]

    AdminIdentityDocument:
      type: object
      description: A queue entry, which needs the subject alongside the document.
      properties:
        document: { $ref: '#/components/schemas/IdentityDocument' }
        account: { $ref: '#/components/schemas/AccountSummary' }
      required: [document, account]

    StartIdentityVerificationRequest:
      type: object
      properties:
        doc_type: { $ref: '#/components/schemas/IdentityDocumentType' }
      required: [doc_type]

    IdentityVerificationTicket:
      type: object
      properties:
        document: { $ref: '#/components/schemas/IdentityDocument' }
        vendor_session_url:
          type: string
          nullable: true
          description: Where the caller finishes the check with the vendor.
        vendor_session_expires_at: { type: string, format: date-time, nullable: true }
      required: [document]

    IdentityVerdictRequest:
      type: object
      properties:
        status: { type: string, enum: [verified, rejected], description: A verdict so pending is not a choice. }
        rejection_reason: { type: string, maxLength: 2000, description: Required when rejecting. }
        expires_at: { type: string, format: date-time, description: When the document runs out. }
      required: [status]

    # ----------------------------------------------------------- admin -------
    AdminAccount:
      type: object
      description: >
        The staff view of an account. Carries the identifiers and the suspension
        state that `PublicAccount` withholds.
      properties:
        id: { $ref: '#/components/schemas/AccountID' }
        email: { type: string, nullable: true }
        email_verified: { type: boolean }
        phone: { type: string, nullable: true }
        username: { type: string, nullable: true }
        name: { type: string }
        role: { $ref: '#/components/schemas/AccountRole' }
        status: { $ref: '#/components/schemas/AccountStatus' }
        suspended_until:
          type: string
          format: date-time
          nullable: true
          description: Null while suspended means the suspension is permanent.
        suspension_reason: { type: string, nullable: true }
        identity_verified: { type: boolean }
        created_at: { type: string, format: date-time }
      required: [id, email_verified, name, role, status, identity_verified, created_at]

    AdminAccountPage:
      type: object
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/AdminAccount' } }
        next_cursor: { type: string, nullable: true }
      required: [items]

    SuspendAccountRequest:
      type: object
      properties:
        reason: { type: string, minLength: 1, maxLength: 2000 }
        until: { type: string, format: date-time, description: Omit for a permanent suspension. }
      required: [reason]

    CreateModeratorRequest:
      type: object
      properties:
        email: { type: string, format: email, maxLength: 255 }
        password: { type: string, minLength: 8, maxLength: 72 }
        name: { type: string, minLength: 1, maxLength: 100 }
        country: { type: string, minLength: 2, maxLength: 2, pattern: '^[A-Z]{2}$' }
        locale: { type: string, pattern: '^[a-z]{2}(-[A-Z]{2})?$' }
        timezone: { type: string, maxLength: 64 }
      required: [email, password, name, country, locale, timezone]
