# OpenAPI fragment owned by the trust module. Merged by cmd/specgen.
#
# Covers feedback, review, review_reply, review_vote, reputation and report.
#
# Two ratings that are deliberately not the same thing. Feedback rates the *other
# party of one order* and runs in both directions; a review rates the *product* and
# only a buyer writes it. They are counted separately, because one order can produce
# both and adding them together would count that order twice — and "arrived on time"
# is not the same claim as "matches the description".
#
# Feedback is blind until published. Neither side sees the other's rating until both
# have submitted or the window runs out, so nobody can retaliate for a rating they
# have already read.
#
# Reputation is never written through this API. It is recomputed from feedback,
# reviews and order outcomes, and read-only here.

paths:
  # ------------------------------------------------------------- feedback ----
  /orders/{orderID}/feedback:
    parameters:
      - { name: orderID, in: path, required: true, schema: { $ref: '#/components/schemas/OrderID' } }
    get:
      tags: [trust]
      summary: Read the feedback on one order
      description: >
        Returns the caller's own submission always. The counterparty's arrives as
        `theirs` only once it is published; while it is still blind `theirs` is null and
        `theirs_submitted` says whether there is anything waiting, which is as much as
        can be told without breaking blindness.
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: 'OK', content: { application/json: { schema: { $ref: '#/components/schemas/OrderFeedback' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [trust]
      summary: Rate the counterparty of a completed order
      description: >
        One submission per direction per order, so this cannot be revised — a rating
        that could be edited after seeing the other side is not blind.


        The direction is derived from which side of the order the caller is on rather
        than sent, so nobody can file feedback as the other party.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SubmitFeedbackRequest' }
      responses:
        '201': { description: 'Submitted', content: { application/json: { schema: { $ref: '#/components/schemas/Feedback' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: 'Caller is not a party to this order', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: 'Already submitted for this direction', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '422': { description: 'The order is not finished yet', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /accounts/{accountID}/feedback:
    get:
      tags: [trust]
      summary: Published feedback received by an account
      description: Published rows only. A blind submission is not visible to anyone
        but its author until the window closes.
      parameters:
        - { name: accountID, in: path, required: true, schema: { $ref: '#/components/schemas/AccountID' } }
        - { name: role, in: query, schema: { $ref: '#/components/schemas/ReputationRole' }, description: Which side the account was on. }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200': { description: 'OK', content: { application/json: { schema: { $ref: '#/components/schemas/FeedbackPage' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }

  /accounts/{accountID}/reputation:
    get:
      tags: [trust]
      summary: Read an account's reputation for one role
      description: >
        Transaction ratings and product-review ratings are reported separately rather
        than merged. Only a seller can have review ratings.
      parameters:
        - { name: accountID, in: path, required: true, schema: { $ref: '#/components/schemas/AccountID' } }
        - { name: role, in: query, schema: { $ref: '#/components/schemas/ReputationRole' }, description: Defaults to seller. }
      responses:
        '200': { description: 'OK', content: { application/json: { schema: { $ref: '#/components/schemas/Reputation' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }

  # -------------------------------------------------------------- reviews ----
  /listings/{spuID}/reviews:
    parameters:
      - { name: spuID, in: path, required: true, schema: { $ref: '#/components/schemas/ProductSPUID' } }
    get:
      tags: [trust]
      summary: Reviews of a listing
      description: Public, with the seller's reply and the vote tally on each one.
      parameters:
        - { name: rating, in: query, schema: { type: integer, minimum: 1, maximum: 5 }, description: Restrict to one star rating. }
        - { name: sort, in: query, schema: { type: string, enum: [newest, helpful], default: newest } }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200': { description: 'OK', content: { application/json: { schema: { $ref: '#/components/schemas/ReviewPage' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [trust]
      summary: Review a listing you bought
      description: >
        An order is required — no purchase, no review — and one review per listing per
        order, so buying twice earns a second review but one purchase does not earn
        two.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SubmitReviewRequest' }
      responses:
        '201': { description: 'Created', content: { application/json: { schema: { $ref: '#/components/schemas/Review' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: 'The order does not belong to the caller', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: 'Already reviewed for this order', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '422': { description: 'The order did not include this listing or is not finished', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /reviews/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { $ref: '#/components/schemas/ReviewID' } }
    get:
      tags: [trust]
      summary: Read a review
      description: Carries the whole reply thread, unlike the listing page, which caps it.
      responses:
        '200': { description: 'OK', content: { application/json: { schema: { $ref: '#/components/schemas/Review' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [trust]
      summary: Edit your own review
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateReviewRequest' }
      responses:
        '200': { description: 'OK', content: { application/json: { schema: { $ref: '#/components/schemas/Review' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [trust]
      summary: Delete a review
      description: >
        The author, or a moderator acting on an upheld report. Removal drops it from
        the seller's rating too, so the recomputed reputation follows.
      security: [{ bearerAuth: [] }]
      responses:
        '204': { description: Deleted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /reviews/{id}/replies:
    post:
      tags: [trust]
      summary: Reply to a review
      description: >
        Mainly the seller answering, though anyone may add to the thread. There is no
        per-thread limit — a conversation that stops after one reply each is not a
        conversation.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { $ref: '#/components/schemas/ReviewID' } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SubmitReviewReplyRequest' }
      responses:
        '201': { description: 'Created', content: { application/json: { schema: { $ref: '#/components/schemas/ReviewReply' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /review-replies/{id}:
    delete:
      tags: [trust]
      summary: Delete a reply
      description: The author, or a moderator acting on an upheld report.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { $ref: '#/components/schemas/ReviewReplyID' } }
      responses:
        '204': { description: Deleted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /reviews/{id}/vote:
    parameters:
      - { name: id, in: path, required: true, schema: { $ref: '#/components/schemas/ReviewID' } }
    put:
      tags: [trust]
      summary: Vote a review helpful or not
      description: One vote per account per review, replaced in place. Voting on your
        own review is refused.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VoteReviewRequest' }
      responses:
        '200': { description: 'OK', content: { application/json: { schema: { $ref: '#/components/schemas/ReviewVoteTally' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { description: 'An account cannot vote on its own review', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    delete:
      tags: [trust]
      summary: Withdraw your vote
      description: >
        Removes the row rather than storing a neutral one. A stored zero is a row that
        says nothing.
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: 'OK', content: { application/json: { schema: { $ref: '#/components/schemas/ReviewVoteTally' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  # -------------------------------------------------------------- reports ----
  /reports:
    post:
      tags: [trust]
      summary: Report something
      description: >
        A listing, an account, a message, a review or a reply. `ref_id` is the opaque
        id of that thing and its prefix has to agree with `ref_type`.


        One open report per target per reporter, so re-reporting while the first is
        still being looked at is a conflict rather than a second row. Enough distinct
        reports against one listing move it into the moderation queue on their own.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SubmitReportRequest' }
      responses:
        '201': { description: 'Filed', content: { application/json: { schema: { $ref: '#/components/schemas/Report' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { description: 'The reported thing does not exist', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '409': { description: 'You already have an open report against this target', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '422': { description: 'The id does not match the declared target type', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    get:
      tags: [trust]
      summary: Reports the caller filed
      description: A reporter sees the status of their own reports but not who else
        reported the same target.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: status, in: query, schema: { $ref: '#/components/schemas/ReportStatus' } }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200': { description: 'OK', content: { application/json: { schema: { $ref: '#/components/schemas/ReportPage' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /admin/reports:
    get:
      tags: [admin]
      summary: The report queue
      description: >
        Defaults to the open and under-review ones, oldest first — that is the small
        hot slice the queue is worked from, and the index behind it covers exactly
        that predicate.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: status, in: query, schema: { $ref: '#/components/schemas/ReportStatus' }, description: Defaults to open and reviewing. }
        - { name: ref_type, in: query, schema: { $ref: '#/components/schemas/ReportRefType' } }
        - { name: reason, in: query, schema: { $ref: '#/components/schemas/ReportReason' } }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200': { description: 'OK', content: { application/json: { schema: { $ref: '#/components/schemas/AdminReportPage' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: 'Moderator role required', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /admin/reports/{id}:
    get:
      tags: [admin]
      summary: Read a report with its target
      description: >
        Includes the reported content itself and how many other open reports name the
        same target, since a moderator decides on the pattern and not one complaint.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { $ref: '#/components/schemas/ReportID' } }
      responses:
        '200': { description: 'OK', content: { application/json: { schema: { $ref: '#/components/schemas/AdminReport' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: 'Moderator role required', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '404': { $ref: '#/components/responses/NotFound' }

  /admin/reports/{id}/claim:
    post:
      tags: [admin]
      summary: Take a report for review
      description: Moves it out of the open queue so two moderators do not work the
        same case.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { $ref: '#/components/schemas/ReportID' } }
      responses:
        '200': { description: 'Claimed', content: { application/json: { schema: { $ref: '#/components/schemas/Report' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: 'Moderator role required', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: 'Already claimed or resolved', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /admin/reports/{id}/resolution:
    post:
      tags: [admin]
      summary: Resolve a report
      description: >
        Records the verdict and what was done about it. `dismissed` takes the action
        `none`; upholding it names the action instead — the listing was removed, the
        message was removed, the account was suspended, a warning was issued.


        Recording the action here does not carry it out. Taking a listing down and
        suspending a seller are separate calls to the modules that own them, so the
        decision and its effects each stay where they can be audited.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { $ref: '#/components/schemas/ReportID' } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ResolveReportRequest' }
      responses:
        '200': { description: 'Resolved', content: { application/json: { schema: { $ref: '#/components/schemas/Report' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: 'Moderator role required', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: 'Already resolved', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

components:
  schemas:
    # ------------------------------------------------------------- enums -----
    FeedbackDirection:
      type: string
      enum: [buyer-to-seller, seller-to-buyer]

    ReputationRole:
      type: string
      enum: [seller, buyer]

    ReportRefType:
      type: string
      enum: [listing, account, message, review, review-reply]

    ReportReason:
      type: string
      enum: [scam, counterfeit, prohibited, harassment, spam, inappropriate, other]

    ReportStatus:
      type: string
      enum: [open, reviewing, actioned, dismissed]

    ReportAction:
      type: string
      description: What a moderator did about an upheld report. `none` goes with a
        dismissal.
      enum: [none, listing-removed, message-removed, account-suspended, warning]

    # ---------------------------------------------------------- feedback -----
    Feedback:
      type: object
      properties:
        id: { $ref: '#/components/schemas/FeedbackID' }
        order_id: { $ref: '#/components/schemas/OrderID' }
        rater: { $ref: '#/components/schemas/AccountSummary' }
        ratee_id: { $ref: '#/components/schemas/AccountID' }
        direction: { $ref: '#/components/schemas/FeedbackDirection' }
        rating: { type: integer, minimum: 1, maximum: 5 }
        comment: { type: string }
        published_at:
          type: string
          format: date-time
          nullable: true
          description: >
            Null while the rating is still blind. Only published feedback is visible
            to anyone but its author and counted towards reputation.
        created_at: { type: string, format: date-time }
      required: [id, order_id, rater, ratee_id, direction, rating, comment, created_at]

    FeedbackPage:
      type: object
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Feedback' } }
        next_cursor: { type: string, nullable: true }
      required: [items]

    OrderFeedback:
      type: object
      description: >
        Both directions on one order, as far as the caller is allowed to see them.
      properties:
        mine: { allOf: [{ $ref: '#/components/schemas/Feedback' }], nullable: true }
        theirs:
          allOf: [{ $ref: '#/components/schemas/Feedback' }]
          nullable: true
          description: Present only once published.
        theirs_submitted:
          type: boolean
          description: >
            Whether the counterparty has rated at all. Shown while their rating is
            still blind so the caller knows a reveal is coming.
        reveal_at:
          type: string
          format: date-time
          nullable: true
          description: >
            When the blind window closes and whatever has been submitted becomes
            visible, whether or not both sides rated. Null once both are published.
            Exposed for the same reason the order module exposes its deadlines: a
            client that cannot count down has to guess.
      required: [theirs_submitted]

    SubmitFeedbackRequest:
      type: object
      description: >
        The direction and the ratee both follow from the order, so neither is sent.
      properties:
        rating: { type: integer, minimum: 1, maximum: 5 }
        comment: { type: string, maxLength: 2000 }
      required: [rating]

    # -------------------------------------------------------- reputation -----
    Reputation:
      type: object
      description: >
        Recomputed, never written directly. Transaction ratings and product-review
        ratings stay apart: one order can produce both and summing them would count it
        twice.
      properties:
        account_id: { $ref: '#/components/schemas/AccountID' }
        role: { $ref: '#/components/schemas/ReputationRole' }
        rating_average:
          type: number
          format: double
          description: Average transaction feedback from 1 to 5. Zero when there is none.
        rating_count: { type: integer, format: int64 }
        review_rating_average:
          type: number
          format: double
          description: Average product-review rating. Always zero for the buyer role.
        review_rating_count: { type: integer, format: int64 }
        completed_orders: { type: integer, format: int64 }
        cancelled_orders: { type: integer, format: int64 }
        updated_at: { type: string, format: date-time, description: When it was last recomputed. }
      required: [account_id, role, rating_average, rating_count, review_rating_average, review_rating_count, completed_orders, cancelled_orders, updated_at]

    # ----------------------------------------------------------- reviews -----
    ReviewVoteTally:
      type: object
      properties:
        helpful: { type: integer, format: int64 }
        not_helpful: { type: integer, format: int64 }
        my_vote:
          type: integer
          enum: [-1, 1]
          nullable: true
          description: The caller's own vote. Null when they have not voted.
      required: [helpful, not_helpful]

    ReviewReply:
      type: object
      properties:
        id: { $ref: '#/components/schemas/ReviewReplyID' }
        author: { $ref: '#/components/schemas/AccountSummary' }
        is_seller: { type: boolean, description: Whether the author owns the listing. }
        body: { type: string }
        created_at: { type: string, format: date-time }
      required: [id, author, is_seller, body, created_at]

    Review:
      type: object
      properties:
        id: { $ref: '#/components/schemas/ReviewID' }
        spu_id: { $ref: '#/components/schemas/ProductSPUID' }
        author: { $ref: '#/components/schemas/AccountSummary' }
        rating: { type: integer, minimum: 1, maximum: 5 }
        body: { type: string }
        attachments: { type: array, items: { $ref: '#/components/schemas/Resource' } }
        replies:
          type: array
          maxItems: 3
          items: { $ref: '#/components/schemas/ReviewReply' }
          description: >
            The first few, oldest first. Replies are unlimited, so a page of reviews
            cannot carry all of them — `reply_count` says how many there are and
            `GET /reviews/{id}` returns the rest.
        reply_count: { type: integer, format: int64 }
        votes: { $ref: '#/components/schemas/ReviewVoteTally' }
        created_at: { type: string, format: date-time }
      required: [id, spu_id, author, rating, body, attachments, replies, reply_count, votes, created_at]

    ReviewPage:
      type: object
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Review' } }
        next_cursor: { type: string, nullable: true }
      required: [items]

    SubmitReviewRequest:
      type: object
      properties:
        order_id: { $ref: '#/components/schemas/OrderID' }
        rating: { type: integer, minimum: 1, maximum: 5 }
        body: { type: string, maxLength: 2000 }
        attachments: { type: array, items: { $ref: '#/components/schemas/ResourceID' } }
      required: [order_id, rating]

    UpdateReviewRequest:
      type: object
      description: Every field optional.
      properties:
        rating: { type: integer, minimum: 1, maximum: 5 }
        body: { type: string, maxLength: 2000 }
        attachments: { type: array, items: { $ref: '#/components/schemas/ResourceID' } }

    SubmitReviewReplyRequest:
      type: object
      properties:
        body: { type: string, minLength: 1, maxLength: 2000 }
      required: [body]

    VoteReviewRequest:
      type: object
      properties:
        vote:
          type: integer
          enum: [-1, 1]
          description: >
            Helpful or not. There is no neutral value — withdrawing a vote is a delete.
      required: [vote]

    # ----------------------------------------------------------- reports -----
    Report:
      type: object
      properties:
        id: { $ref: '#/components/schemas/ReportID' }
        ref_type: { $ref: '#/components/schemas/ReportRefType' }
        ref_id:
          type: string
          pattern: '^[a-z]{3}_[0-9a-hjkmnp-tv-z]{13}$'
          description: >
            Opaque id of the reported thing. Which prefix is valid follows from
            `ref_type`, which is why the two are validated together.
          example: spu_1ryaj8117v2p4
        reason: { $ref: '#/components/schemas/ReportReason' }
        detail: { type: string }
        status: { $ref: '#/components/schemas/ReportStatus' }
        action_taken:
          allOf: [{ $ref: '#/components/schemas/ReportAction' }]
          nullable: true
          description: Null until the report is resolved.
        resolved_at: { type: string, format: date-time, nullable: true }
        resolution_note: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
      required: [id, ref_type, ref_id, reason, detail, status, created_at]

    ReportPage:
      type: object
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Report' } }
        next_cursor: { type: string, nullable: true }
      required: [items]

    AdminReport:
      type: object
      description: A queue entry. A moderator needs the reporter and the target beside
        the report itself.
      properties:
        report: { $ref: '#/components/schemas/Report' }
        reporter: { $ref: '#/components/schemas/AccountSummary' }
        resolved_by: { allOf: [{ $ref: '#/components/schemas/AccountSummary' }], nullable: true }
        open_reports_against_target:
          type: integer
          format: int64
          description: >
            How many other unresolved reports name the same target. A pattern is
            what a decision rests on rather than a single complaint.
        target:
          type: object
          additionalProperties: true
          description: >
            The reported content, shaped by `ref_type`. Fetched from the module that
            owns it.
      required: [report, reporter, open_reports_against_target]

    AdminReportPage:
      type: object
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/AdminReport' } }
        next_cursor: { type: string, nullable: true }
      required: [items]

    SubmitReportRequest:
      type: object
      properties:
        ref_type: { $ref: '#/components/schemas/ReportRefType' }
        ref_id: { type: string, pattern: '^[a-z]{3}_[0-9a-hjkmnp-tv-z]{13}$' }
        reason: { $ref: '#/components/schemas/ReportReason' }
        detail: { type: string, maxLength: 2000 }
      required: [ref_type, ref_id, reason]

    ResolveReportRequest:
      type: object
      properties:
        status: { type: string, enum: [actioned, dismissed], description: A verdict so open and reviewing are not choices. }
        action_taken:
          allOf: [{ $ref: '#/components/schemas/ReportAction' }]
          description: >
            Required. `none` goes with a dismissal; upholding the report names what
            was done.
        note: { type: string, maxLength: 2000 }
      required: [status, action_taken]
