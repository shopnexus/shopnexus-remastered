# trust fragment: the moderator surface over tickets.

paths:
  /admin/tickets:
    get:
      tags: [admin]
      summary: The ticket queue
      description: >
        Defaults to the open and under-review ones, oldest first — that is the small
        hot slice the queue is worked from, and the index behind it covers exactly
        that predicate.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: status, in: query, schema: { $ref: '#/components/schemas/TicketStatus' }, description: Defaults to open and reviewing. }
        - { name: kind, in: query, schema: { $ref: '#/components/schemas/TicketKind' } }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200': { description: 'OK', content: { application/json: { schema: { $ref: '#/components/schemas/AdminTicketPage' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: 'Moderator role required', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /admin/tickets/{id}:
    get:
      tags: [admin]
      summary: Read a ticket with what it is about
      description: >
        Includes the thing itself and how many other open tickets name the same
        target, since a moderator decides on the pattern and not one complaint.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { $ref: '#/components/schemas/TicketID' } }
      responses:
        '200':
          description: 'OK'
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/AdminTicket' }
                required: [data]
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: 'Moderator role required', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '404': { $ref: '#/components/responses/NotFound' }

  /admin/tickets/{id}/claim:
    post:
      tags: [admin]
      summary: Take a ticket for review
      description: >
        Moves it out of the open queue so two moderators do not work the same case. The requester
        is never told who claimed it: support answers as the desk, so a decision is the platform's
        and not a named person's to be argued with afterwards.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { $ref: '#/components/schemas/TicketID' } }
      responses:
        '200':
          description: 'Claimed'
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Ticket' }
                required: [data]
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: 'Moderator role required', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: 'Already claimed or resolved', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /admin/tickets/{id}/resolution:
    post:
      tags: [admin]
      summary: Resolve a ticket
      description: >
        Records the verdict and what was done about it. `none` is the turn-down — read, answered,
        nothing done — which is why it is an action rather than a second status.


        Recording the action here does not carry it out. Taking a listing down and
        suspending a seller are separate calls to the modules that own them, so the
        decision and its effects each stay where they can be audited. A
        `refund-dispute` is the case where that separation is absolute: its verdict moves money,
        so it is made by `POST /admin/refunds/{id}/verdict` and this route answers 409 for one —
        closing it by hand would mark a case settled with the escrow untouched.


        Whatever staff want the requester to read goes in the ticket's thread as an ordinary
        message. `note` is the record kept beside the verdict.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { $ref: '#/components/schemas/TicketID' } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ResolveTicketRequest' }
      responses:
        '200':
          description: 'Resolved'
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Ticket' }
                required: [data]
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: 'Moderator role required', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: 'Already resolved, or a refund dispute whose verdict belongs to the order module', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

components:
  schemas:
    AdminTicket:
      type: object
      description: A queue entry. A moderator needs the requester and the target beside
        the ticket itself.
      properties:
        ticket: { $ref: '#/components/schemas/Ticket' }
        requester: { $ref: '#/components/schemas/AccountSummary' }
        assignee:
          allOf: [{ $ref: '#/components/schemas/AccountSummary' }]
          nullable: true
          description: The moderator working it. Staff-only, and null until it is claimed.
        resolved_by: { allOf: [{ $ref: '#/components/schemas/AccountSummary' }], nullable: true }
        open_tickets_against_target:
          type: integer
          format: int64
          minimum: 0
          description: >
            How many other unresolved tickets name the same target. A pattern is
            what a decision rests on rather than a single complaint.
        target:
          type: object
          additionalProperties: true
          description: >
            What the ticket is about, shaped by `ref_type`. Fetched from the module that
            owns it, and absent once that module no longer has it — a listing already
            taken down.
      required: [ticket, requester, open_tickets_against_target]

    AdminTicketPage:
      type: object
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/AdminTicket' } }
        meta: { $ref: '#/components/schemas/CursorMeta' }
      required: [data, meta]

    ResolveTicketRequest:
      type: object
      properties:
        action_taken:
          allOf: [{ $ref: '#/components/schemas/TicketAction' }]
          description: >
            Required. `none` is the turn-down; anything else names what was done. The two
            `refund-*` values are what order's verdict records on the ticket it closes.
        note: { type: string, maxLength: 2000, example: đã xác nhận hàng giả }
      required: [action_taken]
