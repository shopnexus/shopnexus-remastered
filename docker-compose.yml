# Default `docker compose up -d` runs the infra (db, redis, grafana, loki, alloy);
# run the app on the host with `go run ./cmd/gateway`.
# `docker compose --profile app up -d --build` also builds+runs the gateway and
# migrations as containers, so their JSON logs flow through Alloy into Loki.
#
# Only the gateway publishes a host port. Everything else talks over the compose
# network by service name, which needs no `ports`/`expose` at all. To reach
# db/redis/nats/grafana from the host (host-run gateway, psql, Grafana UI):
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d

# Env for the containerized app (profile `app`): DSNs/hosts use compose service
# names. Each module still gets its own DSN (all point at the shared db here).
x-app-env: &app-env
  GATEWAY_ADDR: "0.0.0.0:8080"
  # Tags every telemetry row with its producer. One replica here; in Kubernetes
  # take it from the downward API (metadata.name).
  INSTANCE_ID: "gateway-1"
  JWT_SECRET: "0123456789012345678901234567890123"
  # Keys the opaque-id permutation. Permanent: rotating it invalidates every
  # id ever handed out. 16, 24 or 32 bytes.
  ID_CIPHER_KEY: "0123456789abcdef0123456789abcdef"
  LOG_LEVEL: "info"
  ACCOUNT_DB_DSN: "postgres://app:app@db:5432/shopnexus?sslmode=disable"
  CATALOG_DB_DSN: "postgres://app:app@db:5432/shopnexus?sslmode=disable"
  ORDER_DB_DSN: "postgres://app:app@db:5432/shopnexus?sslmode=disable"
  CHAT_DB_DSN: "postgres://app:app@db:5432/shopnexus?sslmode=disable"
  TRUST_DB_DSN: "postgres://app:app@db:5432/shopnexus?sslmode=disable"
  FINANCE_DB_DSN: "postgres://app:app@db:5432/shopnexus?sslmode=disable"
  OBSERVABILITY_DB_DSN: "postgres://app:app@db:5432/shopnexus?sslmode=disable"
  NATS_URL: "nats://nats:4222"
  REDIS_ADDR: "redis:6379"
  REDIS_PASSWORD: "app"

  # Outbound providers. Mocks by default, because a local stack must not need an SMTP
  # account, an SMS contract or a KYC subscription: the mock notifier logs the token it
  # would have sent, the mock verifier trusts the credential, and the mock KYC vendor
  # leaves every case pending for a moderator.
  #
  # Switch a seam by changing its selector and filling in that vendor's vars — they are
  # required only for the vendor selected, so an unused block can stay empty:
  #
  #   EMAIL_PROVIDER: "smtp"   -> SMTP_HOST/PORT/USERNAME/PASSWORD/FROM, SMTP_TIMEOUT,
  #                               VERIFY_EMAIL_URL, RESET_PASSWORD_URL
  #   SMS_PROVIDER: "esms"     -> ESMS_BASE_URL/API_KEY/SECRET_KEY/BRANDNAME/SMS_TYPE,
  #                               ESMS_CONTENT_TEMPLATE, ESMS_TIMEOUT
  #   OAUTH_VERIFIER: "oidc"   -> OIDC_GOOGLE_AUDIENCES and/or OIDC_APPLE_AUDIENCES,
  #                               OIDC_TIMEOUT
  #   KYC_PROVIDER: "fpt-ai"   -> FPT_AI_BASE_URL/API_KEY, FPT_AI_REQUEST_TIMEOUT,
  #                               FPT_AI_DOWNLOAD_TIMEOUT
  EMAIL_PROVIDER: "mock"
  SMS_PROVIDER: "mock"
  OAUTH_VERIFIER: "mock"
  KYC_PROVIDER: "mock"
  PAYMENT_PROVIDER: "mock"
  # The courier a shipping fee is quoted from. The buyer pays delivery on every sale, so an
  # unquoted fee is one the platform silently absorbs. `mock` prices a flat fee.
  TRANSPORT_PROVIDER: "mock"
  # Where a payment gateway may send a payer back. An allowlist, because a redirect target
  # nobody checked is an open redirect that borrows this platform's credibility.
  PAYMENT_RETURN_URL_HOSTS: "shopnexus.hopto.org"

  # Storage. This selects where a *new* upload goes, not what can be read: every resource row
  # names the store holding it and all of them stay reachable, so switching this does not
  # strand the objects that predate the switch. `local` keeps uploaded objects on the
  # container's disk and signs URLs back to the gateway's own upload route, which is what
  # makes a photo uploaded in dev actually render. A real store signs the bucket directly and
  # the bytes never touch this process — that is a new implementation behind
  # internal/provider/storage plus a selector value.
  STORAGE_PROVIDER: "local"
  STORAGE_ROOT: "/data/objects"
  STORAGE_BASE_URL: "https://shopnexus.hopto.org/api/v1"
  STORAGE_SECRET: "0123456789abcdef0123456789abcdef"
  STORAGE_UPLOAD_TTL: "15m"
  STORAGE_DOWNLOAD_TTL: "1h"
  STORAGE_MAX_UPLOAD_BYTES: "10485760"
  STORAGE_ALLOWED_MIMES: "image/jpeg,image/png,image/webp,application/pdf"

  # Embedding (cmd/embedder). `mock` hashes the words instead of running the model, which
  # exercises the queue and both vector columns without a multi-gigabyte download — semantic
  # search then returns nonsense, which is the trade a laptop makes. Point it at the real
  # service to get real vectors:
  #
  #   EMBEDDING_PROVIDER: "bge-m3"  -> EMBEDDING_BASE_URL, EMBEDDING_TIMEOUT
  #
  # EMBEDDING_DIMENSIONS must equal the width `catalog.listing_embedding.dense` was declared
  # with. The model service lives in another repository, so nothing but that check couples the
  # two — and changing the model means a migration, not just this number.
  EMBEDDING_PROVIDER: "mock"
  EMBEDDING_BASE_URL: "http://embedding:5007"
  EMBEDDING_TIMEOUT: "2m"
  EMBEDDING_DIMENSIONS: "1024"
  EMBEDDING_INTERVAL: "1m"
  EMBEDDING_BATCH_SIZE: "32"
  EMBEDDING_MAX_TEXT_CHARS: "2000"

  # Durable execution. `off` leaves every timed transition — an unpaid checkout
  # expiring, an escrow window closing, a refund deadline passing, a blind rating
  # revealing — to the sweep below, which is the same code on a slower clock. Switch to
  # `restate` and start the `restate` profile to get a run per entity, signalled the
  # moment the state moves:
  #
  #   WORKFLOW_RUNTIME: "restate"  -> RESTATE_SERVE_ADDR/RESTATE_INGRESS_URL,
  #                                   RESTATE_SEND_TIMEOUT, and `--profile restate`
  WORKFLOW_RUNTIME: "off"
  RESTATE_SERVE_ADDR: "0.0.0.0:9080"
  RESTATE_INGRESS_URL: "http://restate:8080"
  RESTATE_SEND_TIMEOUT: "5s"
  # The sweep runs whether or not there is a runtime: it is the net under a lost run, and
  # with one in place it finds nothing. A minute in dev so a window is visible while you
  # watch it; longer in production, where the runtime is the prompt path.
  SWEEP_INTERVAL: "1m"

services:
  db:
    image: timescale/timescaledb-ha:pg18
    environment:
      POSTGRES_DB: shopnexus
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    volumes:
      - db-data:/home/postgres/pgdata/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d shopnexus"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - 5002:5432
  redis:
    image: redis:7
    command: ["redis-server", "--requirepass", "app"]
  nats:
    # JetStream buffers observability telemetry between the Sink (publisher) and
    # the writer (batching consumer), so a slow/down database never blocks a
    # request and queued samples survive a restart. -m serves monitoring on 8222.
    image: nats:2.10-alpine
    command: ["-js", "-sd", "/data", "-m", "8222"]
    volumes:
      - nats-data:/data

  # --- Observability: metrics (Postgres/Timescale) + logs (Loki), one Grafana ---
  grafana:
    # Datasources (TimescaleDB + Loki) and dashboards are provisioned from files
    # (dev/grafana), so no manual setup.
    image: grafana/grafana:11.3.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./dev/grafana/provisioning:/etc/grafana/provisioning
      - ./dev/grafana/dashboards:/var/lib/grafana/dashboards
      - grafana-data:/var/lib/grafana
    depends_on:
      - db
      - loki
  loki:
    # Single-binary Loki (filesystem storage) using the image's default config.
    image: grafana/loki:3.3.0
    command: ["-config.file=/etc/loki/local-config.yaml"]
    volumes:
      - loki-data:/loki
  alloy:
    # Tails every container's stdout (Docker API) and ships JSON logs to Loki,
    # labeling each line with its compose `service`.
    image: grafana/alloy:v1.5.1
    command:
      - "run"
      - "--server.http.listen-addr=0.0.0.0:12345"
      - "--storage.path=/var/lib/alloy/data"
      - "/etc/alloy/config.alloy"
    volumes:
      - ./dev/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy-data:/var/lib/alloy/data
    depends_on:
      - loki

  # --- App (opt-in: `--profile app`), so its logs reach Loki via Alloy ---
  # Also runs under `--profile dev` and `--profile embed`, since both need a migrated database.
  migrate:
    profiles: ["app", "dev", "embed"]
    build: .
    # entrypoint, not command: the image's ENTRYPOINT is /gateway, so a command
    # would be passed to the gateway as arguments instead of replacing it.
    entrypoint: ["/migrate"]
    environment: *app-env
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
  gateway:
    profiles: ["app"]
    build: .
    environment: *app-env
    volumes:
      # STORAGE_PROVIDER=local keeps objects here, so they outlive the container. With a real
      # store this volume goes away and the bytes never reach the process at all.
      - object-data:/data/objects
    ports:
      - "5000:8080"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      nats:
        condition: service_started
      migrate:
        condition: service_completed_successfully

  # --- Embedding worker (opt-in: `--profile embed`) ---
  # Drains catalog's three stale queues into their vector tables. Its own service and not a
  # goroutine in the gateway: a pass is a batch of model inferences, and the process serving
  # requests should not be holding that. Skipping it entirely is a supported deployment —
  # search falls back to trigram, which is what an unembedded row already gets.
  #
  # With EMBEDDING_PROVIDER=mock (the default here) it needs nothing else running. Point it at
  # the real BGE-M3 service and set the provider to get vectors that mean something.
  embedder:
    profiles: ["embed"]
    build: .
    entrypoint: ["/embedder"]
    environment: *app-env
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  # --- Hot reload (opt-in: `--profile dev`) ---
  # air rebuilds on save inside the container, so logs still reach Loki via Alloy —
  # the one thing running `go run ./cmd/gateway` on the host does not give you.
  # Shares host port 5000 with `gateway`: the two profiles are alternatives, not
  # meant to run together.
  gateway-dev:
    profiles: ["dev"]
    build:
      context: .
      target: dev
    environment: *app-env
    ports:
      - "5000:8080"
    volumes:
      - .:/src
      # Caches outside the bind mount, so a rebuild does not start from scratch.
      - go-mod-cache:/go/pkg/mod
      - go-build-cache:/root/.cache/go-build
      - object-data:/data/objects
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      nats:
        condition: service_started
      migrate:
        condition: service_completed_successfully

  # --- Durable execution (opt-in: `--profile restate`) ---
  # The runtime that holds the timers. It invokes the handlers the gateway serves on
  # :9080, so it has to be told where they are once:
  #
  #   docker compose --profile restate exec restate restate deployments register http://gateway:9080
  #
  # Only useful with WORKFLOW_RUNTIME=restate in the env above; with `off` the gateway
  # serves no handlers and this container would have nothing to invoke.
  restate:
    profiles: ["restate"]
    # Pinned at 1.7: sdk-go 1.0 refuses to talk to a server older than 1.3, so a "latest
    # stable-looking" tag below that fails at discovery rather than at startup.
    image: restatedev/restate:1.7
    volumes:
      - restate-data:/restate-data

  # --- Mock API (opt-in: `docker compose --profile mock up -d --build mock`) ---
  # Naming the service keeps it to these two containers; a bare `--profile mock up`
  # would also start the infra, which the mock has no use for.
  # Prism answers the whole contract from api/openapi.gen.yaml on :4010, so a client
  # can be built against a route before the handler behind it exists. It validates
  # the request and the security requirement, so a bad body still gets the real
  # error envelope. Needs no database, no Redis and no migrations.
  mockspec:
    profiles: ["mock"]
    build: .
    # Prism mounts `paths` as written and ignores the relative servers[0].url, so
    # the spec is rewritten with the /api/v1 prefix before it is served. Runs as
    # root because the named volume starts root-owned and the image is nonroot.
    user: "0:0"
    entrypoint: ["/mockspec"]
    command: ["/spec/openapi.mock.yaml"]
    volumes:
      - mock-spec:/spec
    restart: "no"
  mock:
    profiles: ["mock"]
    image: stoplight/prism:5
    # Serves the spec's `example`s, so a body is realistic and the same every time —
    # what a client being written against it wants. For variety instead, add
    # `-d --json-schema-faker-fillProperties false`: json-schema-faker then builds each
    # body from the schema, which respects bounds and patterns but invents lorem text
    # and 1904 timestamps. `-m false` is not optional: the image crashes on startup
    # with multiprocess left on.
    command: ["mock", "-h", "0.0.0.0", "-p", "4010", "-m", "false", "/spec/openapi.mock.yaml"]
    ports:
      - "5003:4010"
    volumes:
      - mock-spec:/spec
    depends_on:
      mockspec:
        condition: service_completed_successfully

volumes:
  object-data:
  restate-data:
  db-data:
  nats-data:
  mock-spec:
  grafana-data:
  loki-data:
  alloy-data:
  go-mod-cache:
  go-build-cache:
