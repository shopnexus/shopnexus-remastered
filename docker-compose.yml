# Local dev backend: server + its direct dependencies.
#   docker compose up --build
# The full multi-repo stack lives in the umbrella repo; this is server-only.
name: shopnexus-server

networks:
  default:
    name: shopnexus-dev

volumes:
  postgres-data:
  redis-data:
  restate-data:
  minio-data:

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: shopnexus
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-peakshopnexuspassword}
      POSTGRES_DB: shopnexus
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shopnexus -d shopnexus"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped

  minio:
    image: quay.io/minio/minio
    entrypoint: "/bin/sh"
    command: "-c 'mkdir -p /data/restate && /usr/bin/minio server --quiet /data'"
    volumes:
      - minio-data:/data
    ports:
      - "9400:9000"
    restart: unless-stopped

  restate:
    image: docker.restate.dev/restatedev/restate:latest
    ports:
      - "8080:8080"  # ingress
      - "9470:9070"  # admin
      - "5122:5122"  # node
    volumes:
      - restate-data:/restate-data
    environment:
      RESTATE_CLUSTER_NAME: restate-cluster
      RESTATE_NODE_NAME: restate-1
      RESTATE_FORCE_NODE_ID: 1
      RESTATE_ADVERTISED_ADDRESS: http://restate:5122
      RESTATE_AUTO_PROVISION: "true"
      RESTATE_DEFAULT_REPLICATION: 1
    restart: unless-stopped

  server:
    build: .
    ports:
      - "5005:5005"  # HTTP/API
      - "8082:8082"  # restate service endpoint
      - "8083:8083"  # best-effort
    environment:
      APP_ENV: development
      APP_POSTGRES_HOST: postgres
      APP_REDIS_HOST: redis
      APP_RESTATE_INGRESSADDRESS: http://restate:8080
      APP_RESTATE_ADMINADDRESS: http://restate:9070
      APP_RESTATE_SERVICEHOST: http://server
      APP_RESTATE_SERVICEPORT: "8082"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      restate:
        condition: service_started
    restart: unless-stopped
