name: OpenAPI spec check

# Regenerate api/openapi.gen.yaml from the base doc + module fragments and fail if
# it differs from the committed copy, so the served spec can never drift.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  openapi-check:
    name: Verify generated spec is up to date
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Regenerate
        run: go generate ./...

      - name: Diff against the committed spec
        run: |
          if ! git diff --exit-code -- api/openapi.gen.yaml; then
            echo "::error::api/openapi.gen.yaml is stale. Run 'go generate ./...' and commit the result."
            exit 1
          fi
