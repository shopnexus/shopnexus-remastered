name: shopnexus

networks:
  default:
    name: shopnexus-network-dev
    external: false

volumes:
  postgres-data:
    name: shopnexus-postgres-data-dev
  redis-data:
    name: shopnexus-redis-data-dev
  server-data:
    name: shopnexus-server-data-dev
  restate-data:
    name: shopnexus-restate-data-dev
  prometheus-data:
    name: shopnexus-prometheus-data-dev
  grafana-data:
    name: shopnexus-grafana-data-dev

x-restate-environment: &restate-common-env
  RESTATE_CLUSTER_NAME: "restate-cluster"
  RESTATE_LOG_FILTER: "restate=info"
  RESTATE_DEFAULT_REPLICATION: 1
  RESTATE_METADATA_CLIENT__ADDRESSES: '["http://restate-1:5122"]'
  RESTATE_WORKER__SNAPSHOTS__DESTINATION: "s3://restate/snapshots"
  RESTATE_WORKER__SNAPSHOTS__SNAPSHOT_INTERVAL_NUM_RECORDS: "1000"
  RESTATE_WORKER__SNAPSHOTS__AWS_REGION: "local"
  RESTATE_WORKER__SNAPSHOTS__AWS_ENDPOINT_URL: "http://minio:9000"
  RESTATE_WORKER__SNAPSHOTS__AWS_ALLOW_HTTP: true
  RESTATE_WORKER__SNAPSHOTS__AWS_ACCESS_KEY_ID: "minioadmin"
  RESTATE_WORKER__SNAPSHOTS__AWS_SECRET_ACCESS_KEY: "minioadmin"

x-restate-defaults: &restate-defaults
  image: docker.restate.dev/restatedev/restate:latest
  extra_hosts:
    - "host.docker.internal:host-gateway"
  volumes:
    - restate-data:/restate-data
  restart: unless-stopped
  depends_on:
    minio:
      condition: service_started

services:
  postgres:
    container_name: shopnexus-postgres-dev
    image: pgvector/pgvector:pg18
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: shopnexus
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-peakshopnexuspassword}
      POSTGRES_DB: shopnexus
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shopnexus -d shopnexus"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  redis:
    container_name: shopnexus-redis-dev
    image: redis:8
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  restate-1:
    <<: *restate-defaults
    container_name: shopnexus-restate-1-dev
    ports:
      - "8080:8080" # Ingress
      - "9470:9070" # Admin
      - "5122:5122" # Node-to-node communication
    environment:
      <<: *restate-common-env
      RESTATE_NODE_NAME: restate-1
      RESTATE_FORCE_NODE_ID: 1
      RESTATE_ADVERTISED_ADDRESS: "http://restate-1:5122"
      RESTATE_AUTO_PROVISION: "true"

  minio:
    container_name: shopnexus-minio-dev
    image: quay.io/minio/minio
    entrypoint: "/bin/sh"
    command: "-c 'mkdir -p /data/restate && /usr/bin/minio server --quiet /data'"
    ports:
      - "9400:9000"
    restart: unless-stopped

  # Prometheus: scrapes /metrics from the Go server and stores time series.
  # UI: http://localhost:9090 (query) or use Grafana below for dashboards.
  # To scrape the Go server running on the host, the scrape target uses
  # host.docker.internal which resolves to the host from inside the container.
  prometheus:
    container_name: shopnexus-prometheus
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  # Grafana: preconfigured with Prometheus datasource. Default login admin/admin.
  # UI: http://localhost:3001 (3000 is used by other tools; remap to 3001).
  grafana:
    container_name: shopnexus-grafana
    image: grafana/grafana:latest
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
    restart: unless-stopped

