# The single server config. Process-level + shared infra + every module section.
# APP_* env vars override any key (viper AutomaticEnv, "." -> "_"), e.g.
# APP_POSTGRES_HOST -> postgres.host. Secrets are left empty here and supplied by
# config.dev.yml (local) or APP_* env (prod); a real run always overlays this.

port: "5005"

log:
  level: debug
  format: json
  addSource: true
  timeFormat: "2006-01-02 15:04:05"

restate:
  ingressAddress: "http://localhost:8080"
  adminAddress: "http://localhost:9470"
  serviceHost: "http://host.docker.internal"
  servicePort: "8082"
  bestEffortAddress: "http://localhost:8083"

bestEffort:
  port: "8083"

postgres:
  host: localhost
  port: 5432
  username: shopnexus
  password: peakshopnexuspassword
  database: shopnexus
  maxConnections: 50
  maxIdleConnections: 10
  maxConnIdleTime: 300
  logQuery: true
  allowNestedTransactions: true

redis:
  host: localhost
  port: "6379"
  password: "peaksehopnexuspassword"
  db: 0

bus:
  transport: redis

rankedset:
  transport: redis # memory = in-process (dev / single instance), redis = sorted set

public:
  siteUrl: "http://localhost:3000"

# --- account ---
jwt:
  secret: supersecretkey123
  accessTokenDuration: 3600
  refreshTokenDuration: 1209600
  refreshSecret: superrefreshsecret456

# --- common ---
exchange:
  base: USD
  supported:
    [USD, VND, JPY, KRW, EUR, GBP, CNY, SGD, THB, AUD, IDR, MXN, COP, CLP]
  refreshInterval: 6h
  httpTimeout: 5s
  upstreamURL: https://api.currencyapi.com/v3
  apiKey: ""

filestore:
  type: s3
  presignedDefaultTTL: 1800
  placeholder404Url: ""
  s3:
    accessKeyID: ""
    secretAccessKey: ""
    region: ""
    bucket: ""
    cloudfrontUrl: ""

# --- catalog ---
search:
  # Reciprocal Rank Fusion weights (scale-free, applied to 1/(k+rank) per signal).
  denseWeight: 0.6 # semantic recall; degrades gracefully on accentless queries
  sparseWeight: 0.3 # exact-term lexical match; noisy/blind on accentless queries
  lexicalWeight: 1.0 # unaccent+trigram name match; authoritative, weighted highest
  interactionBatchSize: 100
  interactionLinger: 200ms
  embeddingSyncInterval: 1s

llm:
  provider: python
  embedCacheTTL: 24h
  python:
    url: "http://localhost:5007"
  openai:
    apiKey: ""
    baseURL: ""
    embedModel: "text-embedding-3-small"
    chatModel: "gpt-4o"
  bedrock:
    region: "us-east-1"
    embedModelId: "amazon.titan-embed-text-v2:0"
    chatModelId: "anthropic.claude-3-haiku-20240307-v1:0"
  openrouter:
    apiKey: ""
    baseURL: ""
    embedModel: "baai/bge-m3"
    chatModel: "openai/gpt-4o"

# --- analytic ---
popularityWeights:
  purchase: 0.8
  add_to_cart: 0.5
  view: 0.3
  add_to_favorites: 0.6
  write_review: 0.5
  rating_high: 0.4
  rating_medium: 0.1
  ask_question: 0.25
  click_from_search: 0.2
  click_from_recommendation: 0.15
  click_from_category: 0.12
  view_similar_products: 0.15
  product_impression: 0.1
  checkout_started: 0.6
  remove_from_cart: -0.3
  return_product: -0.6
  refund_requested: -0.7
  cancel_order: -0.6
  rating_low: -0.5
  report_product: -1.2
  dislike: -0.5
  hide_item: -0.35
  not_interested: -0.3
  view_bounce: -0.1

# --- order ---
order:
  paymentExpiryDays: 30

vnpay:
  tmnCode: ""
  hashSecret: ""

sepay:
  merchantId: ""
  secretKey: ""
  ipnSecretKey: ""
  sandbox: true

cardPayment:
  provider: ""
  secretKey: ""
  publicKey: ""

ghtk:
  baseURL: "https://services.ghtklab.com"
  apiKey: ""
  clientID: ""
  secret: ""

mock:
  enabled: false # dev-only transport provider; auto-delivers shipments
  delaySeconds: 30
